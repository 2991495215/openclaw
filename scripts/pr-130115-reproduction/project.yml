name: CatalogModeProof
options:
  deploymentTarget:
    macOS: "26.2"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_APP_SANDBOX: NO
targets:
  CatalogModeProofUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - CatalogModeUITests.swift
      - NativeProofLaunchSupport.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.openclaw.proof.catalog-mode
schemes:
  CatalogModeProof:
    shared: true
    build:
      targets:
        CatalogModeProofUITests: all
    test:
      captureScreenshotsAutomatically: true
      deleteScreenshotsWhenEachTestSucceeds: false
      targets:
        - name: CatalogModeProofUITests
          parallelizable: false
