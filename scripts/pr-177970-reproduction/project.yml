name: SavedGatewayProof
options:
  deploymentTarget:
    macOS: "26.2"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_APP_SANDBOX: NO
targets:
  SavedGatewayProofUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - SavedGatewayOpeningUITests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.openclaw.proof.saved-gateway
schemes:
  SavedGatewayProof:
    shared: true
    build:
      targets:
        SavedGatewayProofUITests: all
    test:
      captureScreenshotsAutomatically: true
      deleteScreenshotsWhenEachTestSucceeds: false
      targets:
        - name: SavedGatewayProofUITests
          parallelizable: false
