name: Qualify Windows installer

on:
  workflow_call:
    inputs:
      artifact_id:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      manifest_sha256:
        required: true
        type: string
    outputs:
      artifact_id:
        value: ${{ inputs.artifact_id }}
      sha256:
        value: ${{ jobs.qualify.outputs.sha256 }}

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-2022
    timeout-minutes: 25
    outputs:
      sha256: ${{ steps.install.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: apps/linux/tests/windows_installer_smoke.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          path: ${{ runner.temp }}/candidate
          merge-multiple: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install exact candidate and verify packaged runtime
        id: install
        shell: pwsh
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/candidate
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: node apps/linux/tests/windows_installer_smoke.mjs
