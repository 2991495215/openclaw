name: Android Gateway Startup Diagnostic

run-name: Android Gateway startup diagnostic (${{ inputs.target_sha }})

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact reviewed Android qualification source to diagnose
        required: true
        default: 5519409614b71bb3a1eb94424aa351e663782f4e
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TARGET_SHA: 5519409614b71bb3a1eb94424aa351e663782f4e

jobs:
  gateway_startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require the pinned diagnostic source
        env:
          REQUESTED_SHA: ${{ inputs.target_sha }}
        run: test "$REQUESTED_SHA" = "$TARGET_SHA"

      - name: Checkout the reviewed Android qualification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5519409614b71bb3a1eb94424aa351e663782f4e
          persist-credentials: false

      - name: Verify source before applying the disposable probe
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test -f scripts/android-release-e2e.ts

      - name: Setup the qualification Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          install-bun: "false"
          cache-mode: "off"

      - name: Prepare the published stable Gateway selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --import ./scripts/tsx.mjs scripts/ios-release-gateway.ts \
            --target-sha "$TARGET_SHA" \
            --selection-dir "$RUNNER_TEMP/android-gateway-diagnostic-selection"

      - name: Patch only this runner's startup diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PATCH'
          from pathlib import Path

          owner = Path("scripts/android-release-e2e.ts")
          source = owner.read_text()
          original = source

          def replace_once(before, after):
              global source
              assert source.count(before) == 1, "Pinned diagnostic patch input differs"
              source = source.replace(before, after, 1)

          def remove_between(before, after):
              global source
              assert source.count(before) == 1 and source.count(after) == 1, "Pinned diagnostic cut input differs"
              start = source.index(before)
              end = source.index(after, start)
              source = source[:start] + source[end:]

          remove_between('    if (\n      !evidence.source.clean &&\n', '    phase("build");\n')
          remove_between('    phase("build");\n', '    phase("gateway-install");\n')
          remove_between('    const rpc = <T>', '    evidence.status = "passed";\n')
          replace_once(
              '      "Native phone and Wear application behavior through a controlled Google Data Layer boundary, real protocol, phone bridge/controller, published Gateway and local provider.",',
              '      "Disposable hosted Linux Gateway startup diagnostic; no native application qualification.",',
          )
          diagnostic = r"""
          function diagnostic(error: unknown, relation = "caught", seen = new Set<unknown>()): void {
            if (seen.has(error)) return;
            seen.add(error);
            if (!(error instanceof Error)) {
              console.log(JSON.stringify({ diagnostic: relation, class: typeof error }));
              return;
            }
            const rawCode: unknown = Object.getOwnPropertyDescriptor(error, "code")?.value;
            const code = typeof rawCode === "string" && /^[A-Za-z0-9_-]{1,120}$/u.test(rawCode)
              ? rawCode : typeof rawCode === "number" && Number.isFinite(rawCode) ? rawCode : undefined;
            const name = /^[A-Za-z0-9_$]{1,80}$/u.test(error.name) ? error.name : "Error";
            const classification = error.message === "Linux child ownership requires the built process owner, without a source loader"
              ? "linux-built-process-owner-required" : undefined;
            const frames = (error.stack ?? "").split(/\r?\n/u).filter((line) => /^\s*at /u.test(line));
            console.log(JSON.stringify({ diagnostic: relation, class: name, code, classification, frames }));
            if (error.cause !== undefined) diagnostic(error.cause, `${relation}.cause`, seen);
            if (error instanceof AggregateError) {
              const errors: readonly unknown[] = error.errors;
              for (const [index, nested] of errors.entries()) diagnostic(nested, `${relation}.errors[${index}]`, seen);
            }
          }
          """
          replace_once('export async function main', diagnostic + '\nexport async function main')
          replace_once('  } catch (error) {\n    evidence.failure = stage;', '  } catch (error) {\n    diagnostic(error, "startup");\n    evidence.failure = stage;')
          replace_once('    const cleanupFailed =\n', '    for (const [index, result] of gatewayCleanup.entries()) {\n      if (result.status === "rejected") diagnostic(result.reason, `gateway-cleanup[${index}]`);\n    }\n    for (const [index, result] of cleanup.entries()) {\n      if (result.status === "rejected") diagnostic(result.reason, `service-cleanup[${index}]`);\n    }\n    const cleanupFailed =\n')
          replace_once('  void main().catch(() => {', '  void main().catch((error: unknown) => {\n    diagnostic(error, "preparation");')
          replace_once('    service(\n      process.execPath,', '    console.log("Diagnostic: starting original provider");\n    service(\n      process.execPath,')
          replace_once('    applyMockOpenAiModelConfig(config, {', '    console.log("Diagnostic: waiting for provider port");\n    applyMockOpenAiModelConfig(config, {')
          replace_once('    const fixtureOwnedKeys = new Set([', '    console.log("Diagnostic: provider port ready");\n    const fixtureOwnedKeys = new Set([')
          replace_once('    instance = await createOpenClawTestInstance({', '    console.log("Diagnostic: creating original test instance");\n    instance = await createOpenClawTestInstance({')
          replace_once('    await instance.startGateway();', '    console.log("Diagnostic: instance created; starting original Gateway");\n    await instance.startGateway();\n    console.log("Diagnostic: original Gateway startup passed");')
          assert source != original
          owner.write_text(source)
          print("Disposable diagnostic patch applied to the verified source; Android builds, APK checks, and native work removed.")
          PATCH

      - name: Exercise the original Linux Gateway startup and cleanup
        run: |
          set -euo pipefail
          node --import ./scripts/tsx.mjs scripts/android-release-e2e.ts \
            --target-sha "$TARGET_SHA" \
            --selection-dir "$RUNNER_TEMP/android-gateway-diagnostic-selection" \
            --output "$RUNNER_TEMP/android-gateway-diagnostic-proof.json" \
            --artifacts-dir "$RUNNER_TEMP/android-gateway-diagnostic-artifacts"

      - name: Report bounded diagnostic status
        if: always()
        run: |
          python3 - <<'REPORT'
          import json, os
          from pathlib import Path
          proof = Path(os.environ["RUNNER_TEMP"]) / "android-gateway-diagnostic-proof.json"
          if proof.exists():
              data = json.loads(proof.read_text())
              print(json.dumps({key: data.get(key) for key in ("targetSha", "status", "failure", "cleanupConfirmed", "coverage")}))
          else:
              print(json.dumps({"diagnostic": "preparation did not produce proof"}))
          REPORT
