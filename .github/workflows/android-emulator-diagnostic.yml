name: SDK cold comparison (task 171476)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-cold-comparison-171476-332
  cancel-in-progress: false
jobs:
  compare:
    if: github.repository == 'openclaw/openclaw' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout the reviewed control commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Guard the single workflow delta and immutable sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/sdk-cold-controller"
          cat > "$RUNNER_TEMP/sdk-cold-controller/control.py" <<'SDK_COLD_PY'
          #!/usr/bin/env python3
          """Temporary SDK comparison controller. Only its structured report is publishable."""
          import argparse
          import hashlib
          import json
          import math
          import os
          from pathlib import Path
          import subprocess
          import re
          import sys
          import tarfile
          import tempfile
          import time
          import traceback

          BASE = 'e3604e876c8f5ca5a8e450cb6de3ebbd08b84db6'
          HEAD = '332a9f60e0c6d8b7976cec2474b45f995009d255'
          MERGE = '3d447d20680a6f649bcf28400cd67809d933b023'
          MERGE_TREE = '6bf158a8acc30717f20e4012cb30a9a0209396b7'
          WORKFLOW = '.github/workflows/android-emulator-diagnostic.yml'
          TOOLCHAIN = '52acb3d59a8b15e336ec3df64fc9b14b5fb77c7c98fbab4ed58be62aeff0817d'
          SOURCES = [('actual-base', BASE), ('tested-merge', MERGE)]
          MANIFESTS = ['package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml']
          PROBE_KEYS = {'version', 'phase', 'success', 'toolchainDigest', 'resources', 'constrainedCi',
                        'observedDefaultPolicy', 'nodeVersion', 'emittedSdkFiles', 'category',
                        'diagnosticCodes', 'elapsedMs', 'sdkReceiptPresent'}
          CATEGORIES = {'success', 'sdk_child_timeout_300000ms', 'preparer_parent_timeout_420000ms',
                        'compiler_diagnostic', 'cleanup_failure', 'preparation_failure',
                        'probe_admission_failure'}
          MAX_BYTES = 2 ** 50
          MAX_WALL_MS = 30 * 60 * 1000


          def digest(data):
              return hashlib.sha256(data).hexdigest()


          def git(root, *args):
              return subprocess.check_output(['git', '-C', str(root), *args], stderr=subprocess.PIPE)


          def write_json(file, value):
              file.write_text(json.dumps(value, indent=2) + '\n')


          def raw_parents(control, sha):
              # Shallow traversal hides parents; immutable commit headers retain their true identity.
              header = git(control, 'cat-file', '-p', sha).split(b'\n\n', 1)[0]
              return [line[7:].decode('ascii') for line in header.splitlines() if line.startswith(b'parent ')]


          def guard(control):
              if os.environ.get('GITHUB_REPOSITORY') != 'openclaw/openclaw':
                  raise RuntimeError('repository_guard')
              if os.environ.get('GITHUB_EVENT_NAME') != 'workflow_dispatch' or os.environ.get('GITHUB_RUN_ATTEMPT') != '1':
                  raise RuntimeError('dispatch_guard')
              current = git(control, 'rev-parse', 'HEAD').decode().strip()
              if current != os.environ.get('GITHUB_SHA'):
                  raise RuntimeError('control_sha_guard')
              git(control, 'fetch', '--no-tags', '--depth=2', 'origin', MERGE)
              for sha in (BASE, HEAD, MERGE):
                  if git(control, 'rev-parse', f'{sha}^{{commit}}').decode().strip() != sha:
                      raise RuntimeError('source_sha_guard')
              if raw_parents(control, MERGE) != [BASE, HEAD]:
                  raise RuntimeError('merge_parent_guard')
              if git(control, 'rev-parse', f'{MERGE}^{{tree}}').decode().strip() != MERGE_TREE:
                  raise RuntimeError('merge_tree_guard')
              if raw_parents(control, current) != [MERGE]:
                  raise RuntimeError('control_parent_guard')
              if git(control, 'diff', '--name-status', MERGE, current).decode().splitlines() != [f'M\t{WORKFLOW}']:
                  raise RuntimeError('single_workflow_delta_guard')
              if git(control, 'status', '--porcelain', '--untracked-files=all').strip():
                  raise RuntimeError('control_clean_guard')
              return current


          def materialize(control, task, label, sha):
              root = task / label
              root.mkdir()
              archive = task / f'{label}.source.private.tar'
              with archive.open('wb') as output:
                  subprocess.run(['git', '-C', str(control), 'archive', '--format=tar', sha],
                                 stdout=output, stderr=subprocess.PIPE, check=True)
              with tarfile.open(archive) as source:
                  source.extractall(root, filter='data')
              archive.unlink()
              verify_manifests(control, root, sha)
              for file in ['node_modules', '.artifacts', 'packages/plugin-sdk/dist']:
                  if (root / file).exists():
                      raise RuntimeError('fresh_source_guard')
              return root


          def verify_manifests(control, root, sha):
              hashes = {}
              for file in MANIFESTS:
                  expected = digest(git(control, 'show', f'{sha}:{file}'))
                  actual = digest((root / file).read_bytes())
                  if actual != expected:
                      raise RuntimeError('manifest_source_guard')
                  hashes[file] = actual
              return hashes


          def source_env(root):
              env = os.environ.copy()
              env.update({
                  'GITHUB_WORKSPACE': str(root),
                  'PNPM_CONFIG_STORE_DIR': str(root / '.cache/openclaw-pnpm-store'),
                  'PNPM_CONFIG_CACHE_DIR': str(root / '.cache/openclaw-pnpm-store/cache'),
                  'NODE_BIN': str(Path(subprocess.check_output(['which', 'node'], text=True).strip()).parent),
                  'FROZEN_LOCKFILE': 'true', 'DEPENDENCY_CACHE': 'false', 'DEPENDENCY_CACHE_HIT': 'false',
                  'OPENCLAW_CI_SHARED_SDK': '1',
              })
              return env


          def dependency_links(root):
              count = 0
              for directory, directories, files in os.walk(root, followlinks=False):
                  relative = Path(directory).relative_to(root)
                  if relative.parts and relative.parts[0] in {'.git', '.artifacts', '.cache'}:
                      directories[:] = []
                      continue
                  for name in directories + files:
                      file = Path(directory) / name
                      if 'node_modules' in file.relative_to(root).parts and file.is_symlink():
                          count += 1
                          if not file.resolve().is_relative_to(root):
                              raise RuntimeError('dependency_link_scope_guard')
              return count


          def process_snapshot():
              entries = {}
              for file in Path('/proc').glob('[0-9]*/stat'):
                  try:
                      raw = file.read_text()
                      fields = raw[raw.rfind(')') + 2:].split()
                      entries[int(file.parent.name)] = (int(fields[1]), int(fields[19]),
                          int(fields[11]) + int(fields[12]), int(fields[21]) * os.sysconf('SC_PAGE_SIZE'))
                  except (OSError, ValueError, IndexError):
                      pass
              return entries


          def bounded_policy(pid):
              try:
                  env = dict(entry.split(b'=', 1) for entry in (Path('/proc') / str(pid) / 'environ').read_bytes().split(b'\0') if b'=' in entry)
              except OSError:
                  return None
              facts = {}
              for key, field in [(b'GOMAXPROCS', 'processors'), (b'GOGC', 'gcPercent')]:
                  value = env.get(key, b'')
                  facts[field] = int(value) if value.isdigit() and len(value) <= 5 else None
              value = env.get(b'GOMEMLIMIT', b'')
              facts['softMemoryBytes'] = None
              for suffix, multiplier in [(b'KiB', 1024), (b'MiB', 1024 ** 2), (b'GiB', 1024 ** 3)]:
                  number = value[:-len(suffix)]
                  if value.endswith(suffix) and number.isdigit() and len(number) <= 5:
                      facts['softMemoryBytes'] = int(number) * multiplier
              return facts


          def observe(process):
              peak_rss = peak_processes = samples = 0
              cpu = {}
              policies = set()
              roles = {}
              per_role = {role: {'peakRssBytes': 0, 'peakProcesses': 0, 'sampledCpuLowerBoundSeconds': 0}
                          for role in ['node', 'native-compiler', 'other']}
              while True:
                  entries = process_snapshot()
                  descendants = {process.pid}
                  while True:
                      expanded = descendants | {pid for pid, (parent, _, _, _) in entries.items() if parent in descendants}
                      if expanded == descendants:
                          break
                      descendants = expanded
                  resident = 0
                  present = 0
                  role_rss = {role: 0 for role in per_role}
                  role_count = {role: 0 for role in per_role}
                  for pid in descendants:
                      if pid not in entries:
                          continue
                      _, start, ticks, rss = entries[pid]
                      cpu[(pid, start)] = ticks
                      try:
                          name = (Path('/proc') / str(pid) / 'exe').resolve(strict=True).name
                      except OSError:
                          name = ''
                      role = 'node' if name == 'node' else 'native-compiler' if name in {'tsgo', 'tsserver', 'tsc'} else 'other'
                      roles[(pid, start)] = role
                      role_rss[role] += rss
                      role_count[role] += 1
                      resident += rss
                      present += 1
                      facts = bounded_policy(pid)
                      if facts and any(value is not None for value in facts.values()):
                          policies.add(json.dumps(facts, sort_keys=True))
                  peak_rss = max(peak_rss, resident)
                  peak_processes = max(peak_processes, present)
                  samples += 1
                  for role, values in per_role.items():
                      values['peakRssBytes'] = max(values['peakRssBytes'], role_rss[role])
                      values['peakProcesses'] = max(values['peakProcesses'], role_count[role])
                  if process.poll() is not None:
                      break
                  time.sleep(1)
              for role, values in per_role.items():
                  values['sampledCpuLowerBoundSeconds'] = sum(ticks for key, ticks in cpu.items() if roles[key] == role) / os.sysconf('SC_CLK_TCK')
              return {'peakTreeRssBytes': peak_rss, 'peakProcesses': peak_processes,
                      'sampleCount': samples, 'sampleIntervalSeconds': 1,
                      'observedCpuSeconds': sum(cpu.values()) / os.sysconf('SC_CLK_TCK'),
                      'observedGoPolicies': [json.loads(value) for value in sorted(policies)],
                      'perRole': per_role}


          def require(condition):
              if not condition:
                  raise RuntimeError('public_projection_guard')


          def keys(value, allowed, required=None):
              require(type(value) is dict and not set(value) - set(allowed))
              require(set(required if required is not None else allowed) <= set(value))


          def integer(value, maximum, nullable=False):
              require((nullable and value is None) or (type(value) is int and 0 <= value <= maximum))


          def hexdigest(value, width):
              require(type(value) is str and re.fullmatch(r'[0-9a-f]{' + str(width) + '}', value) is not None)


          def policy(value):
              keys(value, ['processors', 'gcPercent', 'softMemoryBytes'])
              integer(value['processors'], 4096, True)
              integer(value['gcPercent'], 100000, True)
              integer(value['softMemoryBytes'], MAX_BYTES, True)


          def validate_probe(value):
              keys(value, PROBE_KEYS, ['version', 'phase', 'success', 'category'])
              require(value['version'] == 1 and type(value['version']) is int)
              require(type(value['success']) is bool and value['category'] in CATEGORIES)
              require(value['phase'] in {'admission', 'preparation', 'complete'})
              if 'toolchainDigest' in value:
                  hexdigest(value['toolchainDigest'], 64)
              if 'resources' in value:
                  resource = value['resources']
                  keys(resource, ['logicalCpuCount', 'totalMemoryBytes', 'memoryCapacityBytes'])
                  integer(resource['logicalCpuCount'], 4096)
                  integer(resource['totalMemoryBytes'], MAX_BYTES)
                  integer(resource['memoryCapacityBytes'], MAX_BYTES, True)
              if 'observedDefaultPolicy' in value:
                  policy(value['observedDefaultPolicy'])
              for name in ['constrainedCi', 'sdkReceiptPresent']:
                  if name in value:
                      require(type(value[name]) is bool)
              for name, maximum in [('emittedSdkFiles', 1000000), ('elapsedMs', MAX_WALL_MS)]:
                  if name in value:
                      integer(value[name], maximum, name == 'emittedSdkFiles')
              if 'nodeVersion' in value:
                  require(type(value['nodeVersion']) is str and re.fullmatch(r'\d{1,3}\.\d{1,3}\.\d{1,3}', value['nodeVersion']) is not None)
              if 'diagnosticCodes' in value:
                  codes = value['diagnosticCodes']
                  require(type(codes) is list and len(codes) <= 16)
                  require(all(type(code) is str and re.fullmatch(r'TS\d{3,6}', code) for code in codes))
              if value['success']:
                  require(value.get('toolchainDigest') == TOOLCHAIN and value.get('nodeVersion') == '24.19.0')
                  require(value['category'] == 'success' and value['phase'] == 'complete')
                  require(value.get('sdkReceiptPresent') is True)
              return value


          def cpu_seconds(value):
              require(type(value) in {int, float} and math.isfinite(value) and 0 <= value <= 4096 * 1800)


          def validate_observations(value):
              keys(value, ['peakTreeRssBytes', 'peakProcesses', 'sampleCount', 'sampleIntervalSeconds',
                           'observedCpuSeconds', 'observedGoPolicies', 'perRole'])
              integer(value['peakTreeRssBytes'], MAX_BYTES)
              integer(value['peakProcesses'], 4096)
              integer(value['sampleCount'], 1801)
              require(type(value['sampleIntervalSeconds']) is int and value['sampleIntervalSeconds'] == 1)
              cpu_seconds(value['observedCpuSeconds'])
              policies = value['observedGoPolicies']
              require(type(policies) is list and len(policies) <= 16)
              for item in policies:
                  policy(item)
              keys(value['perRole'], ['node', 'native-compiler', 'other'])
              for item in value['perRole'].values():
                  keys(item, ['peakRssBytes', 'peakProcesses', 'sampledCpuLowerBoundSeconds'])
                  integer(item['peakRssBytes'], MAX_BYTES)
                  integer(item['peakProcesses'], 4096)
                  cpu_seconds(item['sampledCpuLowerBoundSeconds'])


          def validate_public_legs(legs):
              require(type(legs) is list and len(legs) == 2)
              for leg, (label, sha) in zip(legs, SOURCES):
                  keys(leg, ['label', 'sha', 'success', 'phase', 'exitCode', 'manifestDigests',
                             'dependencyInstallExitCode', 'dependencySymlinksInsideSource',
                             'freshSdkBeforeRequest', 'observations', 'probe', 'category', 'totalLegElapsedMs'],
                            ['label', 'sha', 'success', 'phase', 'exitCode', 'totalLegElapsedMs'])
                  require(leg['label'] == label and leg['sha'] == sha and type(leg['success']) is bool)
                  require(leg['phase'] in {'source', 'dependencies', 'preparation', 'complete'})
                  exit_code = leg['exitCode']
                  require(exit_code is None or (type(exit_code) is int and -128 <= exit_code <= 255))
                  integer(leg['totalLegElapsedMs'], MAX_WALL_MS)
                  if 'category' in leg:
                      require(leg['category'] == 'controller_failure')
                  if 'manifestDigests' in leg:
                      keys(leg['manifestDigests'], MANIFESTS)
                      for item in leg['manifestDigests'].values():
                          hexdigest(item, 64)
                  for name in ['dependencyInstallExitCode', 'dependencySymlinksInsideSource']:
                      if name in leg:
                          integer(leg[name], 255 if name == 'dependencyInstallExitCode' else 1000000)
                  if 'freshSdkBeforeRequest' in leg:
                      require(leg['freshSdkBeforeRequest'] is True)
                  if 'observations' in leg:
                      validate_observations(leg['observations'])
                  if 'probe' in leg:
                      validate_probe(leg['probe'])
                  if leg['success']:
                      require(leg.get('freshSdkBeforeRequest') is True and leg.get('dependencyInstallExitCode') == 0)
                      require(leg.get('probe', {}).get('success') is True and exit_code == 0)


          def run_leg(control, task, probe, label, sha):
              result = {'label': label, 'sha': sha, 'success': False, 'phase': 'source', 'exitCode': None}
              started = time.monotonic()
              try:
                  root = materialize(control, task, label, sha)
                  env = source_env(root)
                  result['manifestDigests'] = verify_manifests(control, root, sha)
                  result['phase'] = 'dependencies'
                  with (task / f'{label}.install.private.log').open('wb') as log:
                      install = subprocess.run(['bash', str(root / '.github/actions/setup-node-env/install-dependencies.sh')],
                                               cwd=root, env=env, stdout=log, stderr=subprocess.STDOUT)
                  result['dependencyInstallExitCode'] = install.returncode
                  if install.returncode != 0:
                      raise RuntimeError('dependency_install_failure')
                  verify_manifests(control, root, sha)
                  result['dependencySymlinksInsideSource'] = dependency_links(root)
                  for file in ['packages/plugin-sdk/dist', '.artifacts/extension-package-boundary/plugin-sdk.json',
                               '.artifacts/extension-package-boundary/plugins']:
                      if (root / file).exists():
                          raise RuntimeError('post_install_cold_sdk_guard')
                  result['freshSdkBeforeRequest'] = True
                  result['phase'] = 'preparation'
                  probe_result = task / f'{label}.probe.private.json'
                  with (task / f'{label}.process.private.log').open('wb') as log:
                      process = subprocess.Popen(['node', '--import', str(root / 'scripts/tsx.mjs'), str(probe), str(probe_result)],
                                                 cwd=root, env=env, stdout=log, stderr=subprocess.STDOUT)
                      result['observations'] = observe(process)
                      result['exitCode'] = process.wait()
                  result['probe'] = json.loads(probe_result.read_text())
                  result['success'] = result['exitCode'] == 0 and result['probe'].get('success') is True
                  result['phase'] = 'complete'
              except Exception:
                  # Never publish exception text, package-manager output, arguments or environment.
                  (task / f'{label}.controller.private.log').write_text(traceback.format_exc())
                  result['category'] = 'controller_failure'
              result['totalLegElapsedMs'] = round((time.monotonic() - started) * 1000)
              return result


          def prepare(control, output):
              current = guard(control)
              task = Path(tempfile.mkdtemp(prefix='sdk-cold-proof-', dir=os.environ['RUNNER_TEMP']))
              os.chmod(task, 0o700)
              state = {'controlSha': current, 'task': str(task), 'control': str(control)}
              write_json(output, state)


          def run(state_file, probe, summary):
              state = json.loads(state_file.read_text())
              task, control = Path(state['task']), Path(state['control'])
              report = {'version': 1, 'controlSha': state['controlSha'], 'actualBaseSha': BASE,
                        'testedMergeSha': MERGE, 'testedMergeTree': MERGE_TREE,
                        'runnerLabel': 'blacksmith-16vcpu-ubuntu-2404', 'nodePin': '24.19.0',
                        'sdkChildDeadlineMs': 300000, 'preparerParentDeadlineMs': 420000,
                        'sharedSdk': True, 'sourceRootsSeparate': True, 'dependencyInstallsSeparate': True,
                        'cacheTransport': 'off', 'samplingLimit': 'one-second samples can miss short peaks',
                        'ownerOutputLimit': 'existing boundary owner retains at most 256 KiB per output stream',
                        'interpretation': 'comparison evidence only; a passing replay is not a repair', 'legs': []}
              for label, sha in SOURCES:
                  report['legs'].append(run_leg(control, task, probe, label, sha))
              validate_public_legs(report['legs'])
              report['success'] = len(report['legs']) == 2 and all(leg['success'] for leg in report['legs'])
              write_json(summary, report)
              return 0 if report['success'] else 1


          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument('mode', choices=['prepare', 'run'])
              parser.add_argument('--state', type=Path, required=True)
              parser.add_argument('--probe', type=Path)
              parser.add_argument('--summary', type=Path)
              args = parser.parse_args()
              try:
                  if args.mode == 'prepare':
                      prepare(Path(os.environ['GITHUB_WORKSPACE']), args.state)
                      return 0
                  if not args.probe or not args.summary:
                      return 2
                  return run(args.state, args.probe, args.summary)
              except Exception:
                  # Admission failures are represented without echoing Git or host diagnostics.
                  print('SDK comparison admission failed.', file=sys.stderr)
                  return 2


          if __name__ == '__main__':
              sys.exit(main())
          SDK_COLD_PY
          cat > "$RUNNER_TEMP/sdk-cold-controller/probe.mjs" <<'SDK_COLD_MJS'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { createRequire } from 'node:module';
          import { pathToFileURL } from 'node:url';
          import { createHash } from 'node:crypto';

          // Temporary observer only; compiler, deadlines, requests and receipts remain source-owned.
          const root = fs.realpathSync.native(process.cwd());
          const destination = process.argv[2];
          const report = { version: 1, phase: 'admission', success: false };
          const sha256 = bytes => createHash('sha256').update(bytes).digest('hex');
          const ownedImport = file => import(pathToFileURL(path.join(root, file)).href);
          const within = file => {
            const real = fs.realpathSync.native(file);
            if (!real.startsWith(root + path.sep)) throw new Error('dependency_scope');
            return real;
          };
          const publish = () => fs.writeFileSync(destination, JSON.stringify(report) + '\n');
          const privateOutput = text => fs.appendFileSync(destination + '.owner-output.private.log', text);
          const goFacts = env => {
            const memory = /^(\d{1,5})(KiB|MiB|GiB)$/.exec(env.GOMEMLIMIT ?? '');
            return {
            processors: /^\d{1,4}$/.test(env.GOMAXPROCS ?? '') ? Number(env.GOMAXPROCS) : null,
            gcPercent: /^\d{1,5}$/.test(env.GOGC ?? '') ? Number(env.GOGC) : null,
            softMemoryBytes: memory
              ? Number(memory[1]) * ({ KiB: 1024, MiB: 1024 ** 2, GiB: 1024 ** 3 })[memory[2]]
              : null,
            };
          };

          try {
            const { createDeclarationInputBoundary, applyLocalTsgoPolicy, resolveLocalCheckEnv,
              isConstrainedCiCheckHost } = await ownedImport('scripts/lib/local-check-runtime.mts');
            const { readProcessMemoryCapacity } = await ownedImport('scripts/lib/process-memory.mts');
            const { nativeTypeScriptToolchainFiles } = await ownedImport('scripts/lib/native-typescript-toolchain.mts');
            const { boundaryRuntimeVersion } = await ownedImport('scripts/lib/extension-boundary-inputs.mts');
            const require = createRequire(path.join(root, 'package.json'));
            const boundary = createDeclarationInputBoundary(root);
            const nativePackage = within(require.resolve('typescript/package.json'));
            const tools = nativeTypeScriptToolchainFiles(nativePackage, file => within(boundary.assert(file)));
            report.toolchainDigest = sha256(JSON.stringify([
              boundaryRuntimeVersion(), process.platform, process.arch,
              ...tools.map(file => sha256(fs.readFileSync(file))),
            ]));
            if (report.toolchainDigest !== '52acb3d59a8b15e336ec3df64fc9b14b5fb77c7c98fbab4ed58be62aeff0817d') {
              throw new Error('toolchain_identity');
            }
            const resources = {
              logicalCpuCount: os.availableParallelism(), totalMemoryBytes: os.totalmem(),
              memoryCapacityBytes: readProcessMemoryCapacity({}).capacityBytes,
            };
            const defaults = applyLocalTsgoPolicy([], resolveLocalCheckEnv(process.env), {
              logicalCpuCount: resources.logicalCpuCount, totalMemoryBytes: resources.totalMemoryBytes,
            });
            report.resources = resources;
            report.constrainedCi = isConstrainedCiCheckHost(resources);
            report.observedDefaultPolicy = goFacts(defaults.env);
            report.nodeVersion = process.versions.node;
            if (process.versions.node !== '24.19.0') throw new Error('node_identity');
            if (process.env.OPENCLAW_CI_SHARED_SDK !== '1') throw new Error('shared_sdk_missing');
            const { distArtifactEntryArgs, withDistArtifactOwnership } =
              await ownedImport('scripts/lib/dist-artifact-ownership.mts');
            const { runNodeStepAsync } = await ownedImport('scripts/check-extension-package-tsc-boundary.mts');
            const args = [
              ...distArtifactEntryArgs(path.join(root, 'scripts/prepare-extension-package-boundary-artifacts.mts')),
              '--extensions=["codex","slack","telegram"]',
            ];
            report.phase = 'preparation';
            const started = Date.now();
            try {
              const result = await withDistArtifactOwnership(root, () =>
                runNodeStepAsync('plugin-sdk boundary prep', args, 420_000));
              privateOutput(result.stdout + result.stderr);
              const match = /\[plugin-sdk boundary dts\] emitted (\d+) files/.exec(result.stdout);
              report.emittedSdkFiles = match ? Number(match[1]) : null;
              report.success = true;
              report.category = 'success';
            } catch (error) {
              const output = typeof error?.fullOutput === 'string' ? error.fullOutput : String(error);
              privateOutput(output);
              report.category = output.includes('plugin-sdk boundary dts timed out after 300000ms')
                ? 'sdk_child_timeout_300000ms'
                : error?.kind === 'timeout' ? 'preparer_parent_timeout_420000ms'
                : /error TS\d+/.test(output) ? 'compiler_diagnostic'
                : error?.code === 'EPROCESSGROUP_CLEANUP_FAILED' ? 'cleanup_failure'
                : 'preparation_failure';
              report.diagnosticCodes = [...new Set(output.match(/\bTS\d{3,6}\b/g) ?? [])].slice(0, 16);
            } finally {
              report.elapsedMs = Date.now() - started;
            }
            report.sdkReceiptPresent = fs.existsSync(path.join(root, '.artifacts/extension-package-boundary/plugin-sdk.json'));
            report.phase = 'complete';
          } catch (error) {
            privateOutput(String(error?.stack ?? error));
            report.category = 'probe_admission_failure';
          }
          publish();
          process.exitCode = report.success ? 0 : 1;
          SDK_COLD_MJS
          python3 "$RUNNER_TEMP/sdk-cold-controller/control.py" prepare --state "$RUNNER_TEMP/sdk-cold-controller/state.private.json"
      - name: Setup the observed Node version without caches
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          semantic-checks: "true"
          install-deps: "false"
          install-bun: "false"
          cache-mode: "off"
          dependency-cache: "false"
      - name: Run both cold requests sequentially
        shell: bash
        run: |
          python3 "$RUNNER_TEMP/sdk-cold-controller/control.py" run             --state "$RUNNER_TEMP/sdk-cold-controller/state.private.json"             --probe "$RUNNER_TEMP/sdk-cold-controller/probe.mjs"             --summary "$RUNNER_TEMP/sdk-cold-controller/summary.public.json"
      - name: Publish only bounded synthetic comparison observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdk-cold-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-cold-controller/summary.public.json
          if-no-files-found: error
          retention-days: 3
