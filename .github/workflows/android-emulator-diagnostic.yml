name: Android Gateway Startup Diagnostic

run-name: Android Gateway startup diagnostic (${{ inputs.target_sha }})

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact reviewed Android qualification source to diagnose
        required: true
        default: 5519409614b71bb3a1eb94424aa351e663782f4e
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TARGET_SHA: 5519409614b71bb3a1eb94424aa351e663782f4e

jobs:
  gateway_startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require the pinned diagnostic source
        env:
          REQUESTED_SHA: ${{ inputs.target_sha }}
        run: test "$REQUESTED_SHA" = "$TARGET_SHA"

      - name: Checkout the reviewed Android qualification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5519409614b71bb3a1eb94424aa351e663782f4e
          persist-credentials: false

      - name: Verify source before applying the disposable probe
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test -f scripts/android-release-e2e.ts

      - name: Setup the qualification Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          install-bun: "false"
          cache-mode: "off"

      - name: Prepare the published stable Gateway selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --import ./scripts/tsx.mjs scripts/ios-release-gateway.ts \
            --target-sha "$TARGET_SHA" \
            --selection-dir "$RUNNER_TEMP/android-gateway-diagnostic-selection"

      - name: Patch only this runner's startup diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PATCH'
          from pathlib import Path

          owner = Path("scripts/android-release-e2e.ts")
          source = owner.read_text()
          original = source

          def replace_once(before, after):
              global source
              assert source.count(before) == 1, "Pinned diagnostic patch input differs"
              source = source.replace(before, after, 1)

          def remove_between(before, after):
              global source
              assert source.count(before) == 1 and source.count(after) == 1, "Pinned diagnostic cut input differs"
              start = source.index(before)
              end = source.index(after, start)
              source = source[:start] + source[end:]

          remove_between('    if (\n      !evidence.source.clean &&\n', '    phase("build");\n')
          remove_between('    phase("build");\n', '    phase("gateway-install");\n')
          remove_between('    const rpc = <T>', '    evidence.status = "passed";\n')
          replace_once(
              '      "Native phone and Wear application behavior through a controlled Google Data Layer boundary, real protocol, phone bridge/controller, published Gateway and local provider.",',
              '      "Disposable hosted Linux Gateway startup diagnostic; no native application qualification.",',
          )
          diagnostic = r"""
          function diagnostic(error: unknown, relation = "caught", seen = new Set<unknown>()): void {
            if (seen.has(error)) return;
            seen.add(error);
            if (!(error instanceof Error)) {
              console.log(JSON.stringify({ diagnostic: relation, class: typeof error }));
              return;
            }
            const rawCode: unknown = Object.getOwnPropertyDescriptor(error, "code")?.value;
            const code = typeof rawCode === "string" && /^[A-Za-z0-9_-]{1,120}$/u.test(rawCode)
              ? rawCode : typeof rawCode === "number" && Number.isFinite(rawCode) ? rawCode : undefined;
            const name = /^[A-Za-z0-9_$]{1,80}$/u.test(error.name) ? error.name : "Error";
            const classification = error.message === "Linux child ownership requires the built process owner, without a source loader"
              ? "linux-built-process-owner-required" : undefined;
            const frames = (error.stack ?? "").split(/\r?\n/u).filter((line) => /^\s*at /u.test(line));
            console.log(JSON.stringify({ diagnostic: relation, class: name, code, classification, frames }));
            if (error.cause !== undefined) diagnostic(error.cause, `${relation}.cause`, seen);
            if (error instanceof AggregateError) {
              const errors: readonly unknown[] = error.errors;
              for (const [index, nested] of errors.entries()) diagnostic(nested, `${relation}.errors[${index}]`, seen);
            }
          }
          """
          replace_once('export async function main', diagnostic + '\nexport async function main')
          log_signals = r"""
              const logs = instance?.logs() ?? "";
              console.log(JSON.stringify({
                diagnostic: "startup-log-signals",
                ownerRefusal: logs.includes("Linux child ownership requires the built process owner, without a source loader"),
                moduleNotFound: logs.includes("ERR_MODULE_NOT_FOUND"),
                packagePathNotExported: logs.includes("ERR_PACKAGE_PATH_NOT_EXPORTED"),
                normalizationCore: logs.includes("@openclaw/normalization-core"),
                tsx: logs.includes("tsx"),
                procSafe: logs.includes("proc-safe"),
              }));
          """
          replace_once('  } catch (error) {\n    evidence.failure = stage;', '  } catch (error) {\n    diagnostic(error, "startup");\n' + log_signals + '\n    evidence.failure = stage;')
          replace_once('    const cleanupFailed =\n', '    for (const [index, result] of gatewayCleanup.entries()) {\n      if (result.status === "rejected") diagnostic(result.reason, `gateway-cleanup[${index}]`);\n    }\n    for (const [index, result] of cleanup.entries()) {\n      if (result.status === "rejected") diagnostic(result.reason, `service-cleanup[${index}]`);\n    }\n    const cleanupFailed =\n')
          replace_once('  void main().catch(() => {', '  void main().catch((error: unknown) => {\n    diagnostic(error, "preparation");')
          replace_once('    service(\n      process.execPath,', '    console.log("Diagnostic: starting original provider");\n    service(\n      process.execPath,')
          replace_once('    applyMockOpenAiModelConfig(config, {', '    console.log("Diagnostic: waiting for provider port");\n    applyMockOpenAiModelConfig(config, {')
          replace_once('    const fixtureOwnedKeys = new Set([', '    console.log("Diagnostic: provider port ready");\n    const fixtureOwnedKeys = new Set([')
          replace_once('    instance = await createOpenClawTestInstance({', '    console.log("Diagnostic: creating original test instance");\n    instance = await createOpenClawTestInstance({')
          replace_once('    await instance.startGateway();', '    console.log("Diagnostic: instance created; starting original Gateway");\n    await instance.startGateway();\n    console.log("Diagnostic: original Gateway startup passed");')
          assert source != original
          owner.write_text(source)
          print("Disposable diagnostic patch applied to the verified source; Android builds, APK checks, and native work removed.")
          PATCH

      - name: Exercise the original Linux Gateway startup and cleanup
        id: original
        # A strict failed-control assertion below owns this diagnostic exception.
        continue-on-error: true
        run: |
          set -euo pipefail
          node --import ./scripts/tsx.mjs scripts/android-release-e2e.ts \
            --target-sha "$TARGET_SHA" \
            --selection-dir "$RUNNER_TEMP/android-gateway-diagnostic-selection" \
            --output "$RUNNER_TEMP/android-gateway-diagnostic-proof.json" \
            --artifacts-dir "$RUNNER_TEMP/android-gateway-diagnostic-artifacts"

      - name: Require the original failing control before adding the compiled owner
        env:
          ORIGINAL_OUTCOME: ${{ steps.original.outcome }}
        run: |
          python3 - <<'CONTROL'
          import json, os
          from pathlib import Path
          proof = Path(os.environ["RUNNER_TEMP"]) / "android-gateway-diagnostic-proof.json"
          data = json.loads(proof.read_text())
          assert os.environ["ORIGINAL_OUTCOME"] == "failure"
          assert data["status"] == "failed" and data["phases"] == []
          assert data["failure"] == "gateway-start"
          assert data["targetSha"] == os.environ["TARGET_SHA"]
          print("Original pinned-source startup failed before native work; compiled-owner comparison admitted.")
          CONTROL

      - name: Add only the proposed target-owned Linux fixture bootstrap
        run: |
          set -euo pipefail
          python3 - <<'BOOTSTRAP'
          from pathlib import Path
          owner = Path("scripts/android-release-e2e.ts")
          source = owner.read_text()
          assert 'phase("gateway-process-owner")' not in source
          assert "registerSealedRuntimeProcessEntrypoint" not in source

          def replace_once(before, after):
              global source
              assert source.count(before) == 1, "Pinned bootstrap patch input differs"
              source = source.replace(before, after, 1)

          fs_import = r"""import {
            mkdir,
            mkdtemp,
            readFile,
            readdir,
            rename,
            rm,
            symlink,
            writeFile,
          } from "node:fs/promises";"""
          replace_once('import { mkdir, mkdtemp, readFile, readdir, rename, rm, writeFile } from "node:fs/promises";', fs_import)
          replace_once('import { callGateway } from "../src/gateway/call.js";', 'import { callGateway } from "../src/gateway/call.js";\nimport { registerSealedRuntimeProcessEntrypoint } from "../src/infra/runtime-process-url.js";')
          replace_once('import { resolveRepoRoot } from "./lib/repo-root.mjs";', 'import { resolveRepoRoot } from "./lib/repo-root.mjs";\nimport {\n  getStandaloneRuntimeProcessOutputOptions,\n  standaloneRuntimeProcessBuildEntries,\n} from "./lib/runtime-process-core-build-entries.mts";')
          bootstrap = r"""
              if (process.platform === "linux") {
                phase("gateway-process-owner");
                // Linux custody requires a built subreaper without loader children. Compile
                // this target's owner so its protocol matches the source-loaded fixture.
                const name = "process/supervisor/service-child-group-anchor";
                const entry = standaloneRuntimeProcessBuildEntries[name];
                if (!entry) {
                  throw new Error("gateway-process-owner-entry-missing");
                }
                const outDir = path.join(root, "process-owner", "dist");
                await symlink(path.join(repo, "node_modules"), path.join(root, "node_modules"), "dir");
                const { build } = await import("tsdown");
                await build({
                  config: false,
                  cwd: repo,
                  entry: { [name]: entry },
                  outDir,
                  format: "esm",
                  platform: "node",
                  tsconfig: path.join(repo, "tsconfig.json"),
                  dts: false,
                  envPrefix: [],
                  clean: false,
                  outExtensions: () => ({ js: ".js" }),
                  outputOptions: getStandaloneRuntimeProcessOutputOptions(name),
                  logLevel: "warn",
                });
                registerSealedRuntimeProcessEntrypoint(
                  "serviceChildGroupAnchor",
                  pathToFileURL(path.join(outDir, `${name}.js`)),
                );
              }
          """
          replace_once('    phase("gateway-start");', bootstrap + '\n    phase("gateway-start");')
          owner.write_text(source)
          print("Only this pinned target's canonical standalone process owner will be compiled and registered.")
          BOOTSTRAP

      - name: Exercise the compiled-owner Linux Gateway startup and cleanup
        run: |
          set -euo pipefail
          node --import ./scripts/tsx.mjs scripts/android-release-e2e.ts \
            --target-sha "$TARGET_SHA" \
            --selection-dir "$RUNNER_TEMP/android-gateway-diagnostic-selection" \
            --output "$RUNNER_TEMP/android-gateway-diagnostic-fixed-proof.json" \
            --artifacts-dir "$RUNNER_TEMP/android-gateway-diagnostic-fixed-artifacts"
          python3 - <<'FIXED'
          import json, os
          from pathlib import Path
          proof = Path(os.environ["RUNNER_TEMP"]) / "android-gateway-diagnostic-fixed-proof.json"
          data = json.loads(proof.read_text())
          assert data["status"] == "passed" and data["cleanupConfirmed"] is True
          assert data["phases"] == [] and data["targetSha"] == os.environ["TARGET_SHA"]
          print("Compiled-owner startup and cleanup passed; no native application qualification was executed.")
          FIXED

      - name: Report bounded diagnostic status
        if: always()
        run: |
          python3 - <<'REPORT'
          import json, os
          from pathlib import Path
          for control, filename in (("original", "android-gateway-diagnostic-proof.json"),
                                    ("compiled-owner", "android-gateway-diagnostic-fixed-proof.json")):
              proof = Path(os.environ["RUNNER_TEMP"]) / filename
              if proof.exists():
                  data = json.loads(proof.read_text())
                  print(json.dumps({"control": control, **{key: data.get(key) for key in ("targetSha", "status", "failure", "cleanupConfirmed", "coverage")}}))
              else:
                  print(json.dumps({"control": control, "diagnostic": "preparation did not produce proof"}))
          REPORT
