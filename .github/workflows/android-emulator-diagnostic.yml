name: Android Full Runner Diagnostic

run-name: Android full runner diagnostic (${{ inputs.target_sha }})

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact reviewed Android qualification source to diagnose
        required: true
        default: a5468fb15f655be2f5d619a53e0ec8897fe2e72c
        type: string

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TARGET_SHA: a5468fb15f655be2f5d619a53e0ec8897fe2e72c

jobs:
  full_runner_diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Require the pinned diagnostic source and owned probe branch
        env:
          REQUESTED_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          test "$REQUESTED_SHA" = "$TARGET_SHA"
          test "$GITHUB_REF" = refs/heads/ci/android-store-gate-probe-5519409614b7

      - name: Checkout the reviewed Android qualification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a5468fb15f655be2f5d619a53e0ec8897fe2e72c
          persist-credentials: false

      - name: Verify clean source before applying the disposable probe
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test -f scripts/android-release-e2e.ts
          test -f scripts/ios-release-gateway.ts

      - name: Setup the qualification Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          install-bun: "false"
          cache-mode: "off"

      - name: Restore the failed exact-head run's Gateway selection
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-release-gateway-selection-38495093082
          github-token: ${{ github.token }}
          run-id: 38495093082
          path: ${{ runner.temp }}/android-full-diagnostic-selection
          digest-mismatch: error

      - name: Verify the restored published stable Gateway selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --import ./scripts/tsx.mjs scripts/ios-release-gateway.ts \
            --target-sha "$TARGET_SHA" \
            --selection-dir "$RUNNER_TEMP/android-full-diagnostic-selection"

      - name: Setup the original Android toolchain and standard emulator images
        id: android-toolchain
        uses: ./.github/actions/setup-android-toolchain
        with:
          cache-mode: "off"
          install-screenshot-emulators: "true"

      - name: Add bounded diagnostics to the verified full runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PATCH'
          from pathlib import Path

          owner = Path("scripts/android-release-e2e.ts")
          source = owner.read_text()
          original = source

          def replace_once(before, after):
              global source
              assert source.count(before) == 1, "Pinned diagnostic patch input differs"
              source = source.replace(before, after, 1)

          replace_once('import { randomUUID } from "node:crypto";',
                       'import { execFileSync } from "node:child_process";\nimport { randomUUID } from "node:crypto";')
          # This disposable runner is not qualification evidence. Preserve the dirty
          # fingerprint and final source-stability check; only admit this known edit.
          replace_once(
              '    if (\n      !evidence.source.clean &&\n      (!values["allow-dirty"] || process.env.GITHUB_ACTIONS === "true")\n    ) {\n      throw new Error("dirty-source");\n    }',
              '    if (evidence.source.clean || !evidence.source.diffSha256) {\n      throw new Error("diagnostic-source-edit-missing");\n    }',
          )
          replace_once(
              '      "Native phone and Wear application behavior through a controlled Google Data Layer boundary, real protocol, phone bridge/controller, published Gateway and local provider.",',
              '      "Disposable exact-source full runner diagnostic with explicit dirty-source fingerprint; not release qualification evidence.",',
          )

          diagnostic = r"""
          function diagnosticCode(error: unknown): string | undefined {
            if (!(error instanceof Error)) return undefined;
            const value: unknown = Object.getOwnPropertyDescriptor(error, "code")?.value;
            return value === "ETIMEDOUT" || value === "ABORT_ERR" ||
              value === "EPROCESSGROUP_CLEANUP_FAILED" ? value : undefined;
          }
          function diagnosticOperation(bin: string, args: string[]): string {
            if (path.basename(bin) !== "adb") return "other";
            const command = args[0] === "-s" ? args.slice(2) : args;
            const operation = command[0];
            if (operation === "shell") {
              return command[1] === "run-as" ? "shell:run-as" :
                command[1] === "am" ? "shell:am" :
                command[1] === "getprop" ? "shell:getprop" :
                command[1] === "settings" ? "shell:settings" : "shell:other";
            }
            if (operation === "exec-out") return command[1] === "run-as" ? "exec-out:run-as" : "exec-out";
            return operation === "pull" || operation === "install" || operation === "forward" ||
              operation === "reverse" || operation === "emu" || operation === "logcat" ? operation : "other";
          }
          function sdkSignals(stderr: string) {
            return {
              permissionDenied: stderr.includes("Permission denied"),
              missingFile: stderr.includes("No such file or directory"),
              deviceOffline: stderr.includes("device offline"),
              connectionReset: stderr.toLowerCase().includes("connection reset"),
              failedToCopy: stderr.toLowerCase().includes("failed to copy"),
              timeout: /timed out|timeout/iu.test(stderr),
            };
          }
          function nativeDiagnostic(text: string, role: "phone" | "wear", releasePhase: string): void {
            const labels = {
              awaitSettled: "Actual Wear send must settle before phase completion",
              keyboardMissing: "Native Gboard keyboard did not render",
              keyboardChoiceMissing: "Wear keyboard choice was not available",
              gboardEditorMissing: "Native Gboard editor was not available",
              phoneKeyboardMissing: "Real phone keyboard did not open",
              readFullReplyMissing: "Long Wear reply did not expose its full reader",
              renderedHeadUnreachable: "The rendered head of the full Wear reply was not reachable",
              renderedTailUnreachable: "The rendered tail of the full Wear reply was not reachable",
              phoneHeadUnreachable: "The rendered head of the long phone reply was not reachable",
              phoneTailUnreachable: "The rendered tail of the long phone reply was not reachable",
            };
            const flags = Object.fromEntries(Object.entries(labels).map(([name, label]) => [name, text.includes(label)]));
            const classes = ["AssertionError", "IllegalStateException", "NullPointerException", "StaleObjectException"];
            const failureClass = classes.find((name) => text.includes("." + name + ":")) ?? "unknown";
            const frames = [...text.matchAll(/(AndroidReleaseWearTest|AndroidReleasePhoneTest|ReleaseValidationUi)\.kt:(\d+)/gu)]
              .slice(0, 8).map((match) => ({ file: match[1] + ".kt", line: Number(match[2]) }));
            console.log(JSON.stringify({ diagnostic: "native-failure", role, phase: releasePhase, class: failureClass, flags, frames }));
          }
          function diagnostic(error: unknown, relation: string, depth = 0): void {
            const names = new Set(["Error", "TypeError", "RangeError", "SyntaxError",
              "AggregateError", "AbortError", "DOMException"]);
            const name = error instanceof Error && names.has(error.name) ? error.name : "unknown";
            const frames = error instanceof Error ? (error.stack ?? "").split(/\r?\n/u)
              .flatMap((line) => {
                const match = /^\s*at .*[\/](android-release-e2e\.ts|managed-child-process\.mjs|openclaw-test-instance\.ts|qa-gateway-child\.ts):(\d+):(\d+)\)?$/u.exec(line);
                return match ? [{ file: match[1], line: Number(match[2]), column: Number(match[3]) }] : [];
              }).slice(0, 8) : [];
            console.log(JSON.stringify({ diagnostic: relation, class: name,
              code: diagnosticCode(error), frames }));
            if (depth < 2 && error instanceof Error) {
              if (error.cause !== undefined) diagnostic(error.cause, "cause", depth + 1);
              if (error instanceof AggregateError) {
                for (const nested of error.errors.slice(0, 4)) diagnostic(nested, "aggregate", depth + 1);
              }
            }
          }
          """
          replace_once('export async function main', diagnostic + '\nexport async function main')
          replace_once('  let commandIndex = 0;', '  let commandIndex = 0;\n  let observedFirstAdb = false;')
          replace_once(
              '    const index = ++commandIndex;\n    const code = await runManagedCommand({',
              r"""    const index = ++commandIndex;
              const commandStage = stage;
              const startedAt = Date.now();
              const basename = path.basename(bin);
              const operation = diagnosticOperation(bin, args);
              if (basename === "adb" && !observedFirstAdb) {
                observedFirstAdb = true;
                let present: boolean | null = null;
                try {
                  present = execFileSync("ps", ["-eo", "comm="], { encoding: "utf8", timeout: 2_000 })
                    .split(/\r?\n/u).some((line) => line.trim() === "adb");
                } catch {
                  // This observation neither starts nor stops the daemon.
                }
                console.log(JSON.stringify({ diagnostic: "adb-server-before-first-adb", present }));
              }
              let code: number;
              try {
                code = await runManagedCommand({""",
          )
          replace_once(
              '    });\n    await writeFile(path.join(root, `command-${index}.private.log`), stdout + stderr);',
              r"""    });
              } catch (error) {
                console.log(JSON.stringify({ diagnostic: "command-error", basename, operation, signals: sdkSignals(stderr),
                  phase: commandStage, code: diagnosticCode(error), elapsedMs: Date.now() - startedAt }));
                throw error;
              }
              console.log(JSON.stringify({ diagnostic: "command-complete", basename, operation, signals: sdkSignals(stderr),
                phase: commandStage, exitCode: code, elapsedMs: Date.now() - startedAt }));
              await writeFile(path.join(root, `command-${index}.private.log`), stdout + stderr);""",
          )
          replace_once('  function service(\n    bin: string,',
                       '  function service(\n    serviceName: "provider" | "phone-emulator" | "wear-emulator",\n    bin: string,')
          replace_once('    service(\n      process.execPath,',
                       '    service(\n      "provider",\n      process.execPath,')
          replace_once('      service(\n        path.join(sdk, "emulator/emulator"),',
                       '      phase(role + "-boot");\n      service(\n        role === "phone" ? "phone-emulator" : "wear-emulator",\n        path.join(sdk, "emulator/emulator"),')
          replace_once(
              '      .then((code) => {\n        if (!closing && !stop.signal.aborted) {\n          unexpectedExit = true;',
              '      .then((code) => {\n        if (!closing && !stop.signal.aborted) {\n          console.log(JSON.stringify({ diagnostic: "service-unexpected-exit", service: serviceName, exitCode: code }));\n          unexpectedExit = true;',
          )
          replace_once(
              '    void done.catch(() => {\n      if (!closing) {\n        unexpectedExit = true;',
              '    void done.catch((error: unknown) => {\n      if (!closing) {\n        console.log(JSON.stringify({ diagnostic: "service-unexpected-error", service: serviceName, code: diagnosticCode(error) }));\n        unexpectedExit = true;',
          )
          replace_once('    instance.child?.once("exit", () => {',
                       '    instance.child?.once("exit", (code) => {\n      console.log(JSON.stringify({ diagnostic: "gateway-exit", exitCode: code }));')
          replace_once('      await command(\n        path.join(sdk, "cmdline-tools/latest/bin/avdmanager"),',
                       '      phase(role + "-create");\n      await command(\n        path.join(sdk, "cmdline-tools/latest/bin/avdmanager"),')
          replace_once('      if (!(await deviceCommand(device, ["emu", "avd", "name"])).split(/\\r?\\n/u).includes(name)) {',
                       '      phase(role + "-identity");\n      if (!(await deviceCommand(device, ["emu", "avd", "name"])).split(/\\r?\\n/u).includes(name)) {')
          replace_once('      await deviceCommand(device, [\n        "shell",\n        "settings",\n        "put",\n        "global",\n        "window_animation_scale",',
                       '      phase(role + "-settings");\n      await deviceCommand(device, [\n        "shell",\n        "settings",\n        "put",\n        "global",\n        "window_animation_scale",')
          replace_once('      await deviceCommand(device, ["install", "-t", "-g", role === "phone" ? phoneApk : wearApk]);',
                       '      phase(role + "-install-app");\n      await deviceCommand(device, ["install", "-t", "-g", role === "phone" ? phoneApk : wearApk]);')
          replace_once('      await deviceCommand(device, ["install", "-t", "-g", role === "phone" ? phoneTest : wearTest]);',
                       '      phase(role + "-install-test");\n      await deviceCommand(device, ["install", "-t", "-g", role === "phone" ? phoneTest : wearTest]);')
          replace_once('      device.forward = Number(',
                       '      phase(role + "-forward");\n      device.forward = Number(')
          replace_once('  } catch (error) {\n    evidence.failure = stage;',
                       '  } catch (error) {\n    diagnostic(error, "runner-caught");\n    evidence.failure = stage;')
          replace_once('    const cleanupFailed =\n',
                       '    for (const result of gatewayCleanup) {\n      if (result.status === "rejected") diagnostic(result.reason, "gateway-cleanup");\n    }\n    for (const result of cleanup) {\n      if (result.status === "rejected") diagnostic(result.reason, "service-cleanup");\n    }\n    const cleanupFailed =\n')
          replace_once('  void main().catch(() => {',
                       '  void main().catch((error: unknown) => {\n    diagnostic(error, "preparation");')
          replace_once(
              '            throw new Error("native-test-failed");\n          }\n        })',
              '            nativeDiagnostic(text, device.role, releasePhase);\n            throw new Error("native-test-failed");\n          }\n        })',
          )
          replace_once(
              '              throw new Error("native-test-failed");\n            }\n            return text.includes',
              '              nativeDiagnostic(text, device.role, releasePhase);\n              throw new Error("native-test-failed");\n            }\n            return text.includes',
          )
          assert source != original
          owner.write_text(source)
          print("Full exact-source runner retained; bounded diagnostics added, source fingerprint remains dirty.")
          PATCH

      - name: Run full original build, APK, Gateway, emulator and native flow
        env:
          OPENCLAW_GRADLE_JAVA_HOME: ${{ steps.android-toolchain.outputs.gradle-java-home }}
        run: |
          set -euo pipefail
          umask 077
          export TMPDIR="$RUNNER_TEMP/android-full-diagnostic-private"
          mkdir -p "$TMPDIR"
          pnpm android:release:validate -- \
            --target-sha "$TARGET_SHA" \
            --selection-dir "$RUNNER_TEMP/android-full-diagnostic-selection" \
            --output "$RUNNER_TEMP/android-full-diagnostic-proof.json" \
            --artifacts-dir "$RUNNER_TEMP/android-full-diagnostic"

      - name: Report bounded diagnostic proof status
        if: always()
        run: |
          python3 - <<'REPORT'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "android-full-diagnostic-proof.json"
          if path.exists():
              data = json.loads(path.read_text())
              assert data["targetSha"] == os.environ["TARGET_SHA"]
              assert data["source"]["clean"] is False and data["source"].get("diffSha256")
              assert data["coverage"] == "Disposable exact-source full runner diagnostic with explicit dirty-source fingerprint; not release qualification evidence."
              print(json.dumps({key: data.get(key) for key in
                                ("targetSha", "status", "failure", "cleanupConfirmed", "source", "coverage")}))
          else:
              print(json.dumps({"diagnostic": "preparation-no-proof"}))
          REPORT

      - name: Sanitize eligible reader failure facts from this invocation only
        if: always()
        run: |
          python3 - <<'SANITIZE'
          import json, math, os, re, shutil
          from pathlib import Path
          parent = Path(os.environ["RUNNER_TEMP"]) / "android-full-diagnostic-private"
          proof_path = Path(os.environ["RUNNER_TEMP"]) / "android-full-diagnostic-proof.json"
          if not proof_path.exists():
              raise SystemExit(0)
          proof = json.loads(proof_path.read_text())
          if proof["status"] != "failed" or "wear:phone-restart" not in proof["phases"]:
              raise SystemExit(0)
          roots = list(parent.glob("openclaw-android-release-*")) if parent.exists() else []
          assert len(roots) <= 1, "Multiple invocation roots; refuse diagnostic collection"
          if not roots:
              raise SystemExit(0)
          private = roots[0]
          assert private.is_dir() and not private.is_symlink()
          public = Path(os.environ["RUNNER_TEMP"]) / "android-full-diagnostic" / "diagnostics"
          public.mkdir(parents=True, exist_ok=True)

          # Fixed-key projection deliberately excludes transport and every text field.
          booleans = {"stateObserved", "connected", "loading", "sending", "hasActiveStream",
                      "pendingReply", "selectedSession", "healthy", "streaming", "errorPresent"}
          counts = {"messageCount", "pendingRuns"}
          markers = {"PHONE_FIRST", "PHONE_SECOND", "WEAR_FIRST", "WEAR_SECOND",
                     "WEAR_RELAUNCH", "PHONE_RELAUNCH", "PHONE_RESTART", "LONG_REPLY"}
          packages = {"ai.openclaw.app.debug", "com.google.android.inputmethod.latin",
                      "com.google.android.wearable.sysui"}
          def number(value):
              return type(value) in (int, float) and math.isfinite(value)
          def bounds(value):
              return value if value is None or (isinstance(value, str) and
                  re.fullmatch(r"-?\d+ -?\d+ -?\d+ -?\d+", value)) else None
          def node(value, ancestor=False):
              result = {}
              for key in ("scrollable", "visible", "characterRefresh"):
                  if type(value.get(key)) is bool:
                      result[key] = value[key]
              for key in ("textLength", "sentinelIndex"):
                  if number(value.get(key)):
                      result[key] = value[key]
              result["bounds"] = bounds(value.get("bounds"))
              if value.get("package") in packages:
                  result["package"] = value["package"]
              if isinstance(value.get("class"), str) and re.fullmatch(r"[A-Za-z0-9_.]+", value["class"]):
                  result["class"] = value["class"]
              resource = value.get("resource")
              if isinstance(resource, str) and re.fullmatch(r"[A-Za-z0-9_.]+:id/[A-Za-z0-9_]+", resource):
                  result["resource"] = resource
              if not ancestor:
                  boxes = value.get("characterBoxes")
                  result["characterBoxes"] = None if boxes is None else [
                      box if isinstance(box, list) and len(box) == 4 and all(number(n) for n in box) else None
                      for box in boxes[:32]]
                  result["ancestors"] = [node(item, True) for item in value.get("ancestors", [])[:32]]
              return result
          def reader(value):
              result = {}
              if value.get("activePackage") in packages:
                  result["activePackage"] = value["activePackage"]
              for key in ("displayWidth", "displayHeight"):
                  if number(value.get(key)):
                      result[key] = value[key]
              if type(value.get("round")) is bool:
                  result["round"] = value["round"]
              for key in ("composerBounds", "imeBounds"):
                  result[key] = bounds(value.get(key))
              result["sentinels"] = {key: [node(item) for item in value.get("sentinels", {}).get(key, [])[:64]]
                                     for key in ("HEAD SENTINEL", "TRAILING SENTINEL")}
              return result
          for filename in ("wear-relaunch.private.json", "phone-reader-before.private.json", "phone-reader.private.json"):
              path = private / filename
              if not path.is_file() or path.is_symlink():
                  continue
              data = json.loads(path.read_text())
              result = {key: data[key] for key in booleans if type(data.get(key)) is bool}
              result.update({key: data[key] for key in counts if number(data.get(key))})
              result["reader"] = reader(data.get("reader", data))
              for field, keys in (("roles", {"assistant", "user", "system", "tool", "toolResult", "other"}),
                                  ("assistantMarkers", markers), ("exactAssistantMarkers", markers),
                                  ("visibleExactMarkers", markers),
                                  ("assistantSentinels", {"HEAD SENTINEL", "TRAILING SENTINEL"})):
                  if isinstance(data.get(field), dict):
                      result[field] = {key: data[field][key] for key in keys if number(data[field].get(key))}
              (public / filename.replace(".private", ".sanitized")).write_text(json.dumps(result, indent=2))
          image = private / "wear-relaunch.private.png"
          if image.is_file() and not image.is_symlink() and image.read_bytes()[:8] == b"\x89PNG\r\n\x1a\n":
              shutil.copyfile(image, public / "wear-relaunch.synthetic.png")
          print(json.dumps({"diagnostic": "reader-failure-sanitized",
                            "files": sorted(path.name for path in public.iterdir())}))
          SANITIZE

      - name: Retain only public diagnostic proof and synthetic screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-full-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/android-full-diagnostic-proof.json
            ${{ runner.temp }}/android-full-diagnostic/screenshots/*.png
            ${{ runner.temp }}/android-full-diagnostic/diagnostics/*.sanitized.json
            ${{ runner.temp }}/android-full-diagnostic/diagnostics/wear-relaunch.synthetic.png
          if-no-files-found: warn
          retention-days: 7
