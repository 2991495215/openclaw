name: Android Native Failure Diagnostic (temporary)

run-name: Android native failure diagnostic (${{ github.sha }})

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  source-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact diagnostic wrapper source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Require only this wrapper to differ from the reviewed app and harness
        shell: bash
        env:
          REVIEWED_SHA: 332a9f60e0c6d8b7976cec2474b45f995009d255
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/ci/android-native-failure-proof-332a9f60e0c6
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" != "$REVIEWED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch --no-tags --depth=1 origin "$REVIEWED_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$REVIEWED_SHA"
          test "$(git diff --no-renames --name-only "$REVIEWED_SHA" HEAD)" = .github/workflows/android-emulator-diagnostic.yml
          {
            echo "DIAGNOSTIC source: $GITHUB_SHA"
            echo "Reviewed app and harness source: $REVIEWED_SHA"
            echo "Only the temporary wrapper differs; this is not exact-reviewed-head release qualification."
            echo "Environment difference: invocation-owned TMPDIR for the bounded post-failure observer."
          } >> "$GITHUB_STEP_SUMMARY"

  qualify:
    needs: source-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Initialize failure proof and validate target
        shell: bash
        run: |
          set -euo pipefail
          export PROOF_PATH="$RUNNER_TEMP/android-release-e2e-proof.json"
          echo "PROOF_PATH=$PROOF_PATH" >> "$GITHUB_ENV"
          echo "GATEWAY_SELECTION_DIR=$RUNNER_TEMP/android-release-gateway-selection" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json, os, re
          sha = os.environ["TARGET_SHA"]
          with open(os.environ["PROOF_PATH"], "w") as out:
              json.dump({"schema": 1, "status": "failed",
                         "targetSha": sha if re.fullmatch(r"[a-f0-9]{40}", sha) else None,
                         "errors": ["workflow-setup-incomplete"]}, out)
          PY
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TARGET_SHA" == "$GITHUB_SHA" ]]

      - name: Checkout exact qualification target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify target and require target-owned harness
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          test -f scripts/android-release-e2e.ts
          test -f scripts/ios-release-gateway.ts

      - name: Find this run's stable Gateway selection
        id: gateway-selection
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const name = `android-release-gateway-selection-${context.runId}`;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo,
              run_id: context.runId,
              name,
              per_page: 100,
            });
            const matches = artifacts.filter((artifact) => artifact.name === name);
            if (matches.length > 1) {
              throw new Error('Multiple stable Gateway selections exist for this run.');
            }
            if (matches.length === 0) {
              if (Number(process.env.GITHUB_RUN_ATTEMPT) !== 1) {
                throw new Error('This rerun has no saved stable Gateway selection. Start a new workflow run.');
              }
              core.setOutput('create', 'true');
              core.setOutput('artifact-id', '');
              return;
            }
            const artifact = matches[0];
            if (artifact.expired || artifact.workflow_run?.id !== context.runId ||
                artifact.workflow_run?.head_sha !== process.env.TARGET_SHA) {
              throw new Error('The saved stable Gateway selection is expired or belongs to another source/run. Start a new workflow run.');
            }
            core.setOutput('create', 'false');
            core.setOutput('artifact-id', String(artifact.id));

      - name: Restore this run's stable Gateway selection
        if: steps.gateway-selection.outputs.artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.gateway-selection.outputs.artifact-id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ env.GATEWAY_SELECTION_DIR }}
          digest-mismatch: error

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          install-bun: "false"
          cache-mode: "off"

      - name: Prepare stable Gateway selection
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORED_SELECTION: ${{ steps.gateway-selection.outputs.artifact-id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RESTORED_SELECTION" == true ]]; then
            test -f "$GATEWAY_SELECTION_DIR/selection.json"
            test -f "$GATEWAY_SELECTION_DIR/package.json"
            test -f "$GATEWAY_SELECTION_DIR/package-lock.json"
          fi
          node --import ./scripts/tsx.mjs scripts/ios-release-gateway.ts \
            --target-sha "$TARGET_SHA" --selection-dir "$GATEWAY_SELECTION_DIR"

      - name: Save this run's stable Gateway selection
        if: steps.gateway-selection.outputs.create == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-release-gateway-selection-${{ github.run_id }}
          path: |
            ${{ env.GATEWAY_SELECTION_DIR }}/selection.json
            ${{ env.GATEWAY_SELECTION_DIR }}/package.json
            ${{ env.GATEWAY_SELECTION_DIR }}/package-lock.json
          if-no-files-found: error
          retention-days: 30

      - name: Setup Android toolchain and standard emulator images
        id: android-toolchain
        uses: ./.github/actions/setup-android-toolchain
        with:
          cache-mode: "off"
          install-screenshot-emulators: "true"

      - name: Qualify phone and controlled Wear boundary
        env:
          OPENCLAW_GRADLE_JAVA_HOME: ${{ steps.android-toolchain.outputs.gradle-java-home }}
        run: |
          set -euo pipefail
          umask 077
          export TMPDIR="$RUNNER_TEMP/android-native-diagnostic-private"
          mkdir -p "$TMPDIR"
          pnpm android:release:validate -- \
            --target-sha "$TARGET_SHA" --output "$PROOF_PATH" \
            --selection-dir "$GATEWAY_SELECTION_DIR" \
            --artifacts-dir "$RUNNER_TEMP/android-release-e2e"

      - name: Observe sanitized runtime and eligible reader failure facts
        if: always()
        run: |
          python3 - <<'SANITIZE'
          import json, math, os, re, shutil, subprocess
          from pathlib import Path
          parent = Path(os.environ["RUNNER_TEMP"]) / "android-native-diagnostic-private"
          proof_path = Path(os.environ["RUNNER_TEMP"]) / "android-release-e2e-proof.json"
          if not proof_path.exists():
              raise SystemExit(0)
          proof = json.loads(proof_path.read_text())
          if proof["status"] != "failed":
              raise SystemExit(0)
          roots = list(parent.glob("openclaw-android-release-*")) if parent.exists() else []
          assert len(roots) <= 1, "Multiple invocation roots; refuse diagnostic collection"
          if not roots:
              raise SystemExit(0)
          private = roots[0]
          assert private.is_dir() and not private.is_symlink()
          public = Path(os.environ["RUNNER_TEMP"]) / "android-release-e2e" / "diagnostics"
          public.mkdir(parents=True, exist_ok=True)

          # Log contents remain private; only fixed booleans and known source locations leave this runner.
          exception_names = {"AssertionError", "IllegalStateException", "NullPointerException",
                             "StaleObjectException", "OutOfMemoryError", "IllegalArgumentException",
                             "SecurityException", "IOException", "InterruptedException",
                             "RuntimeException", "TimeoutException", "DeadObjectException"}
          source_names = {"AndroidReleaseWearTest.kt", "AndroidReleasePhoneTest.kt", "ReleaseValidationUi.kt"}
          tracked = subprocess.run(["git", "ls-files", "apps/android"], check=True,
                                   capture_output=True, text=True).stdout.splitlines()
          source_names &= {Path(name).name for name in tracked if name.endswith(".kt")}
          def log_facts(text):
              return {"processCrashed": "Process crashed" in text,
                      "instrumentationFailed": "INSTRUMENTATION_FAILED" in text,
                      "OKsingle": bool(re.search(r"OK \(1 test\)", text)),
                      "deviceMissing": bool(re.search(r"device ['\"][^\r\n]*['\"] not found|no devices/emulators found", text, re.I)),
                      "deviceOffline": "device offline" in text.lower(),
                      "serviceFatal": bool(re.search(r"FATAL|fatal error|Aborted", text)),
                      "serviceSignal": bool(re.search(r"SIG(?:ABRT|SEGV|KILL|BUS|TERM)|signal (?:6|9|11|15)\b|Segmentation fault", text)),
                      "exceptions": sorted(name for name in exception_names
                          if re.search(r"\." + name + r"(?=[:\s]|$)", text)),
                      "frames": [{"file": match[1], "line": int(match[2])}
                          for match in list(re.finditer(r"\b([A-Za-z0-9_]+\.kt):(\d+)\b", text))
                          if match[1] in source_names][:8]}
          facts = {}
          for kind in ("instrumentation", "command", "service"):
              entries = []
              for path in sorted(private.glob(kind + "-*.private.log")):
                  match = re.fullmatch(kind + r"-(\d+)\.private\.log", path.name)
                  if not match or not path.is_file() or path.is_symlink():
                      continue
                  entries.append({"index": int(match[1]), **log_facts(path.read_text(errors="replace"))})
              facts[kind] = entries
          facts["kernel"] = {"readable": False, "oom": None}
          try:
              kernel = subprocess.run(["dmesg", "--color=never"], capture_output=True, text=True, timeout=10)
              if kernel.returncode == 0:
                  facts["kernel"] = {"readable": True,
                                     "oom": bool(re.search(r"Out of memory:|oom-kill:|Killed process \d+", kernel.stdout))}
          except (OSError, subprocess.TimeoutExpired):
              pass  # A denied or unavailable kernel observer remains an explicit evidence gap.
          (public / "runtime-failure.sanitized.json").write_text(json.dumps(facts, indent=2))
          print(json.dumps({"diagnostic": "runtime-failure-sanitized",
                            "instrumentationCount": len(facts["instrumentation"]),
                            "commandCount": len(facts["command"]), "serviceCount": len(facts["service"]),
                            "kernel": facts["kernel"]}))
          # Fixed-key UI projections exclude transport, assertions, marker text and identity fields.
          booleans = {"stateObserved", "connected", "loading", "sending", "hasActiveStream",
                      "pendingReply", "selectedSession", "healthy", "streaming", "errorPresent"}
          counts = {"messageCount", "pendingRuns"}
          markers = {"PHONE_FIRST", "PHONE_SECOND", "WEAR_FIRST", "WEAR_SECOND",
                     "WEAR_RELAUNCH", "PHONE_RELAUNCH", "PHONE_RESTART", "LONG_REPLY"}
          packages = {"ai.openclaw.app.debug", "com.google.android.inputmethod.latin",
                      "com.google.android.wearable.sysui"}
          resources = {"com.google.android.inputmethod.latin:id/remote_ime_input"}
          ui_labels = {"Type": "type", "Talk": "talk", "Ready": "ready", "Sending": "sending",
                       "Agent working": "agentWorking", "Keyboard input": "keyboardInput",
                       "Keyboard": "keyboard", "Voice input": "voiceInput", "Send": "send",
                       "Message": "message", "Close": "close", "Retry": "retry",
                       "New ↓": "newMessages", "Read full reply": "readFullReply"}
          def record(value):
              return value if isinstance(value, dict) else {}
          def entries(value, limit):
              return value[:limit] if isinstance(value, list) else []
          def count(value, minimum=0):
              return type(value) is int and minimum <= value <= 1_000_000
          def coordinate(value):
              return type(value) in (int, float) and math.isfinite(value) and abs(value) <= 1_000_000
          def bounds(value):
              if isinstance(value, str) and len(value) <= 48 and re.fullmatch(r"-?\d+ -?\d+ -?\d+ -?\d+", value):
                  return value if all(abs(int(n)) <= 1_000_000 for n in value.split()) else None
              return None
          def active_package(value):
              return {"activePackage": value} if isinstance(value, str) and value in packages else {}
          def node(value, ancestor=False):
              value = record(value)
              result = {}
              for key in ("scrollable", "visible", "characterRefresh"):
                  if type(value.get(key)) is bool:
                      result[key] = value[key]
              for key in ("textLength", "sentinelIndex"):
                  if count(value.get(key), minimum=-1 if key == "sentinelIndex" else 0):
                      result[key] = value[key]
              result["bounds"] = bounds(value.get("bounds"))
              if isinstance(value.get("package"), str) and value["package"] in packages:
                  result["package"] = value["package"]
              if not ancestor:
                  boxes = value.get("characterBoxes")
                  result["characterBoxes"] = None if boxes is None else [
                      box if isinstance(box, list) and len(box) == 4 and all(coordinate(n) for n in box) else None
                      for box in entries(boxes, 32)]
                  result["ancestors"] = [node(item, True) for item in entries(value.get("ancestors"), 32)]
              return result
          def reader(value):
              value = record(value)
              result = active_package(value.get("activePackage"))
              for key in ("displayWidth", "displayHeight"):
                  if type(value.get(key)) is int and 1 <= value[key] <= 16384:
                      result[key] = value[key]
              if type(value.get("round")) is bool:
                  result["round"] = value["round"]
              for key in ("composerBounds", "imeBounds"):
                  result[key] = bounds(value.get(key))
              sentinels = record(value.get("sentinels"))
              result["sentinels"] = {key: [node(item) for item in entries(sentinels.get(key), 64)]
                                     for key in ("HEAD SENTINEL", "TRAILING SENTINEL")}
              return result
          def type_node(value):
              value = record(value)
              package = value.get("package")
              if not isinstance(package, str) or package not in packages:
                  return None
              result = {"package": package, "bounds": bounds(value.get("bounds"))}
              for key in ("clickable", "enabled", "visible"):
                  if type(value.get(key)) is bool:
                      result[key] = value[key]
              resource = value.get("resource")
              if isinstance(resource, str) and resource in resources:
                  result["resource"] = resource
              result["uiLabels"] = {ui_labels[label]: True for key in ("text", "description")
                                    if isinstance(label := value.get(key), str) and label in ui_labels}
              return result
          def type_capture(value):
              value = record(value)
              result = {}
              if type(value.get("clickAccepted")) is bool:
                  result["clickAccepted"] = value["clickAccepted"]
              windows = []
              for item in entries(value.get("windows"), 8):
                  item = record(item)
                  original_nodes = entries(item.get("nodes"), 1000)
                  nodes = [projected for raw in original_nodes if (projected := type_node(raw)) is not None]
                  window = {"nodeCount": len(original_nodes), "retainedNodeCount": len(nodes), "nodes": nodes}
                  for key in ("active", "focused"):
                      if type(item.get(key)) is bool:
                          window[key] = item[key]
                  window["packageCounts"] = {package: sum(n["package"] == package for n in nodes)
                                             for package in sorted(packages)}
                  windows.append(window)
              result["windows"] = windows
              result["visibleLabels"] = {key: any(n.get("visible") is True and key in n["uiLabels"]
                                                  for w in windows for n in w["nodes"])
                                         for key in sorted(ui_labels.values())}
              return result
          for filename in ("wear-type-before.private.json", "wear-type-after.private.json"):
              path = private / filename
              if path.is_file() and not path.is_symlink():
                  data = json.loads(path.read_text())
                  (public / filename.replace(".private", ".sanitized")).write_text(json.dumps(type_capture(data), indent=2))
          state_files = ["wear-initial.private.json", "wear-relaunch.private.json"]
          if "wear:phone-restart" in proof.get("phases", []):
              state_files += ["phone-reader-before.private.json", "phone-reader.private.json"]
          for filename in state_files:
              path = private / filename
              if not path.is_file() or path.is_symlink():
                  continue
              data = record(json.loads(path.read_text()))
              result = {key: data[key] for key in booleans if type(data.get(key)) is bool}
              result.update({key: data[key] for key in counts if count(data.get(key))})
              result.update(active_package(data.get("activePackage")))
              result["reader"] = reader(data.get("reader", data))
              for field, keys in (("roles", {"assistant", "user", "system", "tool", "toolResult", "other"}),
                                  ("assistantMarkers", markers), ("exactAssistantMarkers", markers),
                                  ("visibleExactMarkers", markers),
                                  ("assistantSentinels", {"HEAD SENTINEL", "TRAILING SENTINEL"})):
                  if isinstance(data.get(field), dict):
                      result[field] = {key: data[field][key] for key in keys if count(data[field].get(key))}
              (public / filename.replace(".private", ".sanitized")).write_text(json.dumps(result, indent=2))
          # Only the already-approved synthetic Wear reader screenshot may leave the invocation.
          image = private / "wear-relaunch.private.png"
          if ("wear:phone-restart" in proof.get("phases", []) and image.is_file() and not image.is_symlink()
                  and image.read_bytes()[:8] == b"\x89PNG\r\n\x1a\n"):
              shutil.copyfile(image, public / "wear-relaunch.synthetic.png")
          print(json.dumps({"diagnostic": "wear-input-and-reader-failure-sanitized",
                            "files": sorted(path.name for path in public.iterdir())}))
          SANITIZE

      - name: Retain sanitized qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-release-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/android-release-e2e-proof.json
            ${{ runner.temp }}/android-release-e2e/screenshots/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Retain only sanitized failure diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-native-failure-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/android-release-e2e/diagnostics/*.sanitized.json
            ${{ runner.temp }}/android-release-e2e/diagnostics/wear-relaunch.synthetic.png
          if-no-files-found: warn
          retention-days: 7
