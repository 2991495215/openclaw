name: Android Saved Gateway Replay Proof

run-name: Android saved Gateway replay proof (${{ github.sha }})

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  source-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout the exact standalone wrapper source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require only the temporary wrapper to differ from the reviewed source
        shell: bash
        env:
          REVIEWED_SHA: 081104422b9237d2ab90544dcd9189f21ebe3992
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/ci/android-replay-proof-081104422b92
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" != "$REVIEWED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch --no-tags --depth=1 origin "$REVIEWED_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$REVIEWED_SHA"
          test "$(git diff --no-renames --name-only "$REVIEWED_SHA" HEAD)" = .github/workflows/android-emulator-diagnostic.yml
          {
            echo "Standalone qualification source: $GITHUB_SHA"
            echo "Reviewed app and harness source: $REVIEWED_SHA"
            echo "The exact source differs only in this temporary dispatch wrapper."
          } >> "$GITHUB_STEP_SUMMARY"

  qualification:
    needs: source-guard
    permissions:
      actions: read
      contents: read
    # The canonical workflow checks out the caller SHA. The guard establishes
    # unchanged app/harness inputs; this proof belongs to the wrapper source SHA.
    uses: openclaw/openclaw/.github/workflows/android-release-e2e.yml@081104422b9237d2ab90544dcd9189f21ebe3992
    with:
      target_sha: ${{ github.sha }}
