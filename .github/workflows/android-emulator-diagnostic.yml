name: Android Store Gate Failure Rehearsal

run-name: Android store gate rehearsal (${{ inputs.target_sha }})

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Reviewed canonical source SHA for the read-only policy comparison
        required: true
        type: string
      operation:
        description: Canonical manual store operation used by the inert gate fixture
        required: false
        default: release
        type: choice
        options: [release]

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  qualify:
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/android-release-e2e.yml
    with:
      # Exercise the real preparation failure before checkout, tooling, or native tests.
      target_sha: rehearsal-invalid-target

  signing_upload_sentinel:
    needs: qualify
    # Copy of the canonical gate with only the main-ref literal adapted to this
    # disposable branch. This job has no secrets, environment, signing, or upload.
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/ci/android-store-gate-probe-5519409614b7' && github.repository == 'openclaw/openclaw' &&
      ((github.event_name == 'schedule' && vars.ANDROID_INTERNAL_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.operation == 'internal' || (inputs.operation == 'release' && needs.qualify.result == 'success'))))
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Reject unexpected publication admission
        shell: bash
        run: |
          echo "::error::Failed qualification unexpectedly admitted the inert publication sentinel"
          exit 1

  verify:
    needs: [qualify, signing_upload_sentinel]
    if: always() && !cancelled()
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify canonical gate and actual scheduler outcomes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CANONICAL_SHA: ${{ inputs.target_sha }}
          OPERATION: ${{ inputs.operation }}
          QUALIFY_RESULT: ${{ needs.qualify.result }}
          SENTINEL_RESULT: ${{ needs.signing_upload_sentinel.result }}
        with:
          script: |
            const { createHash } = require('node:crypto');
            const { runInNewContext } = require('node:vm');
            const canonicalSha = '5519409614b71bb3a1eb94424aa351e663782f4e';
            const probeRef = 'refs/heads/ci/android-store-gate-probe-5519409614b7';
            const sourceHash = '05015387c9de3d3adaf9b4ae1bafbe5c18c547d86024b34b0db6c55ec3bc0dae';
            const gateHash = '3f9092e7fc5e3985263f4b6f5a856a2d716031df1b132d69e766315fa0239be9';
            const hash = (value) => createHash('sha256').update(value).digest('hex');
            if (process.env.CANONICAL_SHA !== canonicalSha || context.ref !== probeRef ||
                process.env.OPERATION !== 'release' || process.env.QUALIFY_RESULT !== 'failure' ||
                process.env.SENTINEL_RESULT !== 'skipped') {
              throw new Error('Rehearsal identity or actual scheduler outcome does not match the intended failure case.');
            }
            async function readAt(path, ref) {
              const { data } = await github.rest.repos.getContent({ ...context.repo, path, ref });
              if (Array.isArray(data) || data.type !== 'file' || data.encoding !== 'base64') {
                throw new Error('Expected one committed source file.');
              }
              return Buffer.from(data.content, 'base64');
            }
            function foldedGate(bytes, job) {
              const source = bytes.toString('utf8');
              const jobStart = source.indexOf(`\n  ${job}:\n`);
              if (jobStart === -1) throw new Error('Expected job is missing.');
              const jobBody = source.slice(jobStart + 1).split(/\n  [a-z][a-z0-9_-]*:\n/, 1)[0];
              const match = /^    if: >-\n((?:      .*\n)+)/m.exec(jobBody);
              if (!match) throw new Error('Expected canonical folded gate is missing.');
              return match[1].trimEnd().split('\n').map((line) => line.slice(6)).join(' ');
            }
            const canonical = await readAt('.github/workflows/android-store-release.yml', canonicalSha);
            const canonicalGate = foldedGate(canonical, 'release');
            if (hash(canonical) !== sourceHash || hash(canonicalGate) !== gateHash) {
              throw new Error('Pinned canonical source or gate hash differs.');
            }
            const mainLiteral = "'refs/heads/main'";
            if (canonicalGate.split(mainLiteral).length !== 2) {
              throw new Error('Expected exactly one main-ref predicate.');
            }
            const fixture = await readAt('.github/workflows/android-emulator-diagnostic.yml', context.sha);
            const fixtureGate = foldedGate(fixture, 'signing_upload_sentinel');
            if (fixtureGate !== canonicalGate.replace(mainLiteral, `'${probeRef}'`)) {
              throw new Error('Fixture changes more than the approved branch literal.');
            }
            const childPath = '.github/workflows/android-release-e2e.yml';
            const canonicalChild = await readAt(childPath, canonicalSha);
            const probeChild = await readAt(childPath, context.sha);
            if (hash(canonicalChild) !== hash(probeChild)) {
              throw new Error('Reusable qualification source differs from the reviewed source.');
            }
            const controls = ['success', process.env.QUALIFY_RESULT].map((result) => {
              const canonicalContext = {
                github: { ref: 'refs/heads/main', repository: 'openclaw/openclaw', event_name: 'workflow_dispatch' },
                inputs: { operation: 'release' },
                needs: { qualify: { result } },
                vars: {},
                cancelled: () => false,
              };
              const admitted = runInNewContext(canonicalGate, canonicalContext, { timeout: 1000 });
              if (admitted !== (result === 'success')) throw new Error('Canonical gate control failed.');
              return { qualification: result, canonicalStoreGate: admitted };
            });
            // The real scheduler is exercised on a probe ref. The unmodified main
            // predicate uses synthetic context; real store environments and publication
            // are deliberately absent and are not proven by this rehearsal.
            const evidence = {
              canonicalSha,
              probeSha: context.sha,
              workflowSha256: sourceHash,
              gateSha256: gateHash,
              childWorkflowSha256: hash(canonicalChild),
              actualQualificationResult: process.env.QUALIFY_RESULT,
              actualSentinelResult: process.env.SENTINEL_RESULT,
              controls,
              limitation: 'Scheduler proof uses the adapted probe ref; the canonical main-ref gate is evaluated with synthetic context. No signing, upload, or protected store environment is exercised.',
            };
            core.setOutput('evidence', JSON.stringify(evidence));
            core.info(JSON.stringify(evidence));
            await core.summary.addHeading('Android store qualification failure rehearsal')
              .addRaw('The real qualification failed before native preparation; the inert signing/upload sentinel was skipped.\n\n')
              .addCodeBlock(JSON.stringify(evidence, null, 2), 'json').write();
