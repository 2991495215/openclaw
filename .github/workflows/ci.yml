# Temporary hosted proof only. Never merge this workflow.
# Root owns candidate publication and dispatch; canonical source fixes are separate commits.
name: Red-main Knip cleanup proof
run-name: Knip cleanup proof ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Reviewed full candidate commit SHA; no branch names
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-knip-cleanup-proof-${{ github.ref }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  knip-cleanup-proof:
    name: Three failed Knip checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENCLAW_LOCAL_CHECK: "0"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          proof_dir="$RUNNER_TEMP/knip-cleanup-proof"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $actual_sha"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- extensions/memory-core/src/memory/manager-search-knn.ts src/config/sessions/session-accessor.sqlite-entry-cache-publication.ts ui/src/components/icons-devices.ts ui/src/pages/chat/chat-composer-solid.test.tsx ui/src/pages/chat/chat-metadata-session-facts.test.ts ui/src/pages/chat/chat-pane-permission-failure-ownership.test.ts ui/src/pages/chat/chat-pane-session-controls.test.ts ui/src/pages/chat/chat-pane-session-controls.ts ui/src/pages/chat/chat-pane-session-events.test.ts ui/src/pages/chat/components/chat-composer-controls.tsx ui/src/pages/chat/components/chat-composer-selected-mentions.tsx ui/src/pages/chat/components/chat-composer-skill-menu.tsx ui/src/pages/chat/components/chat-composer-slash-menu.tsx ui/src/pages/chat/components/chat-composer-types.ts ui/src/pages/chat/components/chat-composer-view.tsx ui/src/pages/chat/components/chat-message-text.ts ui/src/pages/chat/components/chat-permission-picker.ts ui/src/pages/chat/composer-dictation.test.ts ui/src/pages/new-session/cloud-target-view.tsx ui/src/pages/new-session/new-session-page.tsx ui/src/pages/new-session/where-chip.test.ts
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
          node-compile-cache: "true"

      - name: Replay failed dependency Knip scans
        id: knip_dependencies
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm deadcode:dependencies 2>&1 | tee "$RUNNER_TEMP/knip-cleanup-proof/knip_dependencies.log"

      - name: Replay failed unused-file Knip scans
        id: knip_files
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm deadcode:unused-files 2>&1 | tee "$RUNNER_TEMP/knip-cleanup-proof/knip_files.log"

      - name: Replay failed export Knip scans
        id: knip_exports
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm deadcode:exports 2>&1 | tee "$RUNNER_TEMP/knip-cleanup-proof/knip_exports.log"

      - name: Record check outcomes and source status
        if: ${{ always() }}
        shell: bash
        env:
          OUTCOMES: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/knip-cleanup-proof"
          printf '%s\n' "$OUTCOMES" > "$RUNNER_TEMP/knip-cleanup-proof/outcomes.json"
          python3 - <<'PYOUTCOMES'
          import json, os
          outcomes = json.loads(os.environ["OUTCOMES"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              for name, step in outcomes.items():
                  summary.write(f"{name}: {step.get('outcome', 'unknown')}\n\n")
          PYOUTCOMES
          git status --short
          git diff --exit-code -- extensions/memory-core/src/memory/manager-search-knn.ts src/config/sessions/session-accessor.sqlite-entry-cache-publication.ts ui/src/components/icons-devices.ts ui/src/pages/chat/chat-composer-solid.test.tsx ui/src/pages/chat/chat-metadata-session-facts.test.ts ui/src/pages/chat/chat-pane-permission-failure-ownership.test.ts ui/src/pages/chat/chat-pane-session-controls.test.ts ui/src/pages/chat/chat-pane-session-controls.ts ui/src/pages/chat/chat-pane-session-events.test.ts ui/src/pages/chat/components/chat-composer-controls.tsx ui/src/pages/chat/components/chat-composer-selected-mentions.tsx ui/src/pages/chat/components/chat-composer-skill-menu.tsx ui/src/pages/chat/components/chat-composer-slash-menu.tsx ui/src/pages/chat/components/chat-composer-types.ts ui/src/pages/chat/components/chat-composer-view.tsx ui/src/pages/chat/components/chat-message-text.ts ui/src/pages/chat/components/chat-permission-picker.ts ui/src/pages/chat/composer-dictation.test.ts ui/src/pages/new-session/cloud-target-view.tsx ui/src/pages/new-session/new-session-page.tsx ui/src/pages/new-session/where-chip.test.ts

      - name: Preserve focused proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-knip-cleanup-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/knip-cleanup-proof/
          if-no-files-found: warn
          retention-days: 14
