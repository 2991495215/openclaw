# Temporary exact-source regression proof. Never merge this workflow.
name: Red-main catalog roster regression proof
run-name: Catalog roster 2523afd92348 ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-catalog-roster-proof
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  catalog-roster-proof:
    name: Original catalog roster regression (exact candidate)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2523afd923481614e50a9dd9ca01354558ec8a85
          fetch-depth: 1
          persist-credentials: false

      - name: Record candidate and workflow provenance
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2523afd923481614e50a9dd9ca01354558ec8a85
          mkdir -p .artifacts/catalog-roster-proof
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- \
              package.json pnpm-lock.yaml .github/actions/setup-node-env/action.yml \
              src/gateway/session-row-selection.ts \
              src/gateway/server-methods/session-catalog-resident-entries.test.ts
          } | tee .artifacts/catalog-roster-proof/provenance.log
          cat .artifacts/catalog-roster-proof/provenance.log >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"

      - name: Run only the original catalog roster regression
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          started="$(date +%s)"
          if pnpm test src/gateway/server-methods/session-catalog-resident-entries.test.ts --maxWorkers=1 -t 'bounds roster projections while delivering adopted sessions without an implicit owner' --reporter=verbose 2>&1 | tee .artifacts/catalog-roster-proof/test.log; then
            test_exit=0
          else
            test_exit=$?
          fi
          elapsed=$(( $(date +%s) - started ))
          {
            echo "Test exit: $test_exit"
            echo "Elapsed seconds: $elapsed"
          } | tee .artifacts/catalog-roster-proof/result.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$test_exit"

      - name: Verify candidate source remained unchanged
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2523afd923481614e50a9dd9ca01354558ec8a85
          git diff --exit-code HEAD --

      - name: Preserve regression evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-catalog-roster-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/catalog-roster-proof/
          if-no-files-found: warn
          retention-days: 14
