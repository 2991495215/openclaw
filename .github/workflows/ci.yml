# Temporary proof carrier; do not merge this workflow.
name: Red-main node-loss recovery proof
run-name: Node-loss recovery proof ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact two-file fix commit
        type: string
        required: true
      workflow_sha:
        description: Exact workflow carrier commit
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-node-loss-${{ github.ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  BASE_SHA: efbe8513fc85d8f49532a9153a8bd157f70dddf1
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  PRODUCER: src/auto-reply/reply/stalled-turn-recovery.ts
  REGRESSION: src/auto-reply/reply/followup-turn-execution.test.ts
  E2E: test/e2e/qa-lab/runtime/cloud-worker-midturn-loss.e2e.test.ts
jobs:
  focused:
    name: Recovery admission and actual mid-tool node loss
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENCLAW_LOCAL_CHECK: "0"
      OPENCLAW_VITEST_RUNTIME: node
    steps:
      - name: Checkout exact candidate
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source and capture provenance
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          expected_paths="$(printf '%s\n' "$REGRESSION" "$PRODUCER")"
          test "$(git diff --name-only "$BASE_SHA" HEAD)" = "$expected_paths"
          test "$(git rev-parse HEAD:"$PRODUCER")" = e11c2a34b0e0a51476670e7ed870948ea1c5a530
          test "$(git rev-parse HEAD:"$REGRESSION")" = bb90aa40216c4760f39fb49ca6937c81dcaed507
          git diff --exit-code HEAD --
          proof_dir="$RUNNER_TEMP/node-loss-admission"
          mkdir -p "$proof_dir"
          git diff "$BASE_SHA" HEAD -- > "$proof_dir/candidate.patch"
          {
            echo "Product base: $BASE_SHA"
            echo "Candidate: $CANDIDATE_SHA"
            echo "Workflow: $WORKFLOW_SHA"
            git show -s --format='%H%n%P%n%an <%ae>%n%s' HEAD
            git ls-tree HEAD -- "$PRODUCER" "$REGRESSION" "$E2E" \
              src/auto-reply/reply/followup-turn-execution.ts \
              src/auto-reply/reply/restart-recovery-claim.ts \
              src/auto-reply/reply/goal-continuation.ts \
              package.json pnpm-lock.yaml .github/actions/setup-node-env/action.yml
          } | tee "$proof_dir/provenance.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Setup frozen Node environment matching failed schedule
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
      - name: Check changed files
        shell: bash
        run: |
          set -euo pipefail
          node_modules/.bin/oxfmt --check --threads=1 "$PRODUCER" "$REGRESSION"
          node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.json "$PRODUCER" "$REGRESSION"
          git diff --check HEAD~1 HEAD
      - name: Prove original admission failure and candidate correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.19.0
          proof_dir="$RUNNER_TEMP/node-loss-admission"
          { node --version; pnpm --version; } > "$proof_dir/versions.log"
          git show "HEAD:$PRODUCER" > "$proof_dir/candidate-producer.ts"
          trap 'cp "$proof_dir/candidate-producer.ts" "$PRODUCER"' EXIT
          for phase in inverse candidate; do
            if test "$phase" = inverse; then
              git show "$BASE_SHA:$PRODUCER" > "$PRODUCER"
            else
              cp "$proof_dir/candidate-producer.ts" "$PRODUCER"
            fi
            echo "Command: pnpm test $REGRESSION --maxWorkers=1 -t 'executes transcript-only recovery without readmitting' --reporter=verbose --reporter=json --outputFile.json <proof>/$phase.json" | tee "$proof_dir/$phase-command.log"
            started="$(date +%s)"
            if pnpm test "$REGRESSION" --maxWorkers=1 \
              -t 'executes transcript-only recovery without readmitting' \
              --reporter=verbose --reporter=json --outputFile.json "$proof_dir/$phase.json" \
              2>&1 | tee "$proof_dir/$phase.log"; then
              test_exit=0
            else
              test_exit=$?
            fi
            echo "$phase: exit=$test_exit elapsed=$(( $(date +%s) - started ))s" | tee -a "$proof_dir/result.txt" >> "$GITHUB_STEP_SUMMARY"
            python3 - "$phase" "$test_exit" <<'PY'
          import json, os, pathlib, sys
          phase, code = sys.argv[1], int(sys.argv[2])
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'node-loss-admission'
          report = json.loads((proof / (phase + '.json')).read_text())
          assert len(report['testResults']) == 1, 'Expected exactly one regression file'
          result = report['testResults'][0]
          assert pathlib.Path(result['name']).resolve() == pathlib.Path(os.environ['REGRESSION']).resolve()
          selected = [case for case in result['assertionResults'] if case['status'] in ('passed', 'failed')]
          expected = {'executeFollowupTurn executes transcript-only recovery without readmitting its ' + source for source in ('explicit source', 'Gateway message ID')}
          assert len(selected) == 2 and {case['fullName'] for case in selected} == expected
          assert report['numPassedTests'] + report['numFailedTests'] == 2
          assert report.get('numRuntimeErrorTestSuites', 0) == 0
          if phase == 'inverse':
              assert code != 0 and report['numFailedTests'] == 2
              for case in selected:
                  assert case['status'] == 'failed'
                  assert 'channel restart recovery requires source-keyed user-turn admission' in '\n'.join(case['failureMessages'])
          else:
              assert code == 0 and report['success'] and report['numPassedTests'] == 2
              assert all(case['status'] == 'passed' for case in selected)
          print(f'{phase}: exact two-case selection and expected result verified')
          PY
          done
          cp "$proof_dir/candidate-producer.ts" "$PRODUCER"
          git diff --exit-code HEAD --
      - name: Build the runtime profile used by the failed scheduled job
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/node-loss-admission"
          echo 'Command: pnpm build qaRuntime' > "$proof_dir/build-command.log"
          pnpm build qaRuntime 2>&1 | tee "$proof_dir/build.log"
      - name: Run unchanged real node-loss E2E once
        id: e2e
        shell: bash
        env:
          OPENCLAW_E2E_USE_PREBUILT_DIST: "1"
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/node-loss-admission"
          echo "Command: OPENCLAW_E2E_USE_PREBUILT_DIST=1 pnpm test $E2E --maxWorkers=1 --reporter=verbose --reporter=json --outputFile.json <proof>/e2e.json" > "$proof_dir/e2e-command.log"
          started="$(date +%s)"
          if pnpm test "$E2E" --maxWorkers=1 --reporter=verbose --reporter=json \
            --outputFile.json "$proof_dir/e2e.json" 2>&1 | tee "$proof_dir/e2e.log"; then
            test_exit=0
          else
            test_exit=$?
          fi
          echo "E2E: exit=$test_exit elapsed=$(( $(date +%s) - started ))s" | tee -a "$proof_dir/result.txt" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_exit"
      - name: Verify exact E2E selection and result
        if: ${{ always() && steps.e2e.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'node-loss-admission'
          report = json.loads((proof / 'e2e.json').read_text())
          assert len(report['testResults']) == 1, 'Expected exactly one E2E file'
          result = report['testResults'][0]
          assert pathlib.Path(result['name']).resolve() == pathlib.Path(os.environ['E2E']).resolve()
          selected = [case for case in result['assertionResults'] if case['status'] in ('passed', 'failed')]
          assert len(selected) == 1
          assert selected[0]['fullName'] == 'continues once after the node host dies mid-tool without replaying its effects'
          assert report['numPassedTests'] == 1 and report['numFailedTests'] == 0 and report['success']
          assert report.get('numRuntimeErrorTestSuites', 0) == 0
          assert selected[0]['status'] == 'passed'
          print('Exact original node-loss E2E passed with its effect-once and continuation assertions unchanged')
          PY
      - name: Verify candidate source restored and unchanged
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git hash-object "$PRODUCER")" = e11c2a34b0e0a51476670e7ed870948ea1c5a530
          test "$(git hash-object "$REGRESSION")" = bb90aa40216c4760f39fb49ca6937c81dcaed507
          git diff --exit-code HEAD --
      - name: Preserve focused evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-node-loss-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/node-loss-admission/
          if-no-files-found: warn
          retention-days: 14
