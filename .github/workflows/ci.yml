name: Red-main Advisor inventory proof
run-name: Advisor inventories ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full reviewed source repair SHA
        type: string
        required: true
      workflow_sha:
        description: Expected proof carrier SHA
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-advisor-labeler-contract
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  advisor-labeler:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      OPENCLAW_TEST_PROJECTS_PARALLEL: "1"
      OPENCLAW_VITEST_RUNTIME: node
      OPENCLAW_CI_TEST_RUNTIME_POLICY: node
    steps:
      - name: Checkout reviewed source repair
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify source and workflow provenance
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^)" = 89f8764fa2afcf4a33d8fd9885e3ef8ae2f70e93
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          printf '%s\n' .github/labeler.yml src/plugins/contracts/boundary-invariants.test.ts > "$RUNNER_TEMP/expected-source-paths.txt"
          git diff --name-only HEAD^ HEAD > "$RUNNER_TEMP/actual-source-paths.txt"
          diff -u "$RUNNER_TEMP/expected-source-paths.txt" "$RUNNER_TEMP/actual-source-paths.txt"
          git diff --exit-code HEAD --
          mkdir -p "$RUNNER_TEMP/advisor-labeler-contract"
          {
            git rev-parse HEAD HEAD^
            echo "$WORKFLOW_SHA"
            git ls-tree HEAD -- .github/labeler.yml test/scripts/labeler-extension-coverage.test.ts src/plugins/contracts/boundary-invariants.test.ts extensions/advisor/index.ts pnpm-lock.yaml
          } | tee "$RUNNER_TEMP/advisor-labeler-contract/provenance.txt"

      - name: Setup matching Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pinned pnpm
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: "off"

      - name: Install frozen dependencies
        env:
          CI: "true"
        run: pnpm install --frozen-lockfile --prefer-offline --config.ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true --config.side-effects-cache=true

      - name: Check changed contract source
        run: |
          set -euo pipefail
          pnpm exec oxfmt --check .github/labeler.yml src/plugins/contracts/boundary-invariants.test.ts
          pnpm exec oxlint --threads=1 src/plugins/contracts/boundary-invariants.test.ts
          git diff --check HEAD^

      - name: Run affected labeler coverage assertion
        id: candidate
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/advisor-labeler-contract"
          test "$(node --version)" = v24.21.0
          node --import ./scripts/tsx.mjs scripts/test-projects.mts test/scripts/labeler-extension-coverage.test.ts -t 'covers every extension directory' --maxWorkers=1 --reporter=verbose --reporter=json --outputFile.json "$proof_dir/candidate.json" 2>&1 | tee "$proof_dir/candidate.log"
          node --input-type=module <<'PROOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const dir = path.join(process.env.RUNNER_TEMP, 'advisor-labeler-contract');
          const report = JSON.parse(fs.readFileSync(path.join(dir, 'candidate.json'), 'utf8'));
          const suites = report.testResults;
          assert.equal(report.success, true);
          assert.equal(suites.length, 1);
          assert.ok(suites[0].name.endsWith('/test/scripts/labeler-extension-coverage.test.ts'));
          const cases = suites[0].assertionResults;
          assert.equal(cases.length, 2);
          const passed = cases.filter(test => test.status === 'passed');
          assert.equal(passed.length, 1);
          assert.deepEqual(passed.map(test => test.title).sort(), [
            'covers every extension directory',
          ]);
          assert.ok(cases.every(test => ['passed', 'pending', 'skipped', 'todo'].includes(test.status)));
          console.log(JSON.stringify({ passed: passed.length, skipped: cases.length - passed.length }));
          PROOF
          git diff --exit-code HEAD --

      - name: Preserve exact labeler proof
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-advisor-labeler-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/advisor-labeler-contract/
          if-no-files-found: error
          retention-days: 14
