# Temporary focused proof only. Never merge this workflow.
name: Red-main Codex auth process ownership proof
run-name: Codex auth process ownership ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Reviewed full candidate commit SHA
        type: string
        required: true
      workflow_sha:
        description: Reviewed full proof workflow commit SHA
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-codex-auth-process-owner-proof-${{ github.ref }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"
  OPENCLAW_LOCAL_CHECK: "0"
  OPENCLAW_VITEST_RUNTIME: node

jobs:
  codex-auth-process-owner:
    name: Codex auth process ownership (exact candidate)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify candidate and workflow identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          proof_dir="$RUNNER_TEMP/codex-auth-process-owner"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $EXPECTED_SHA"
            echo "Workflow: $WORKFLOW_SHA"
            git show -s --format='%H%n%P%n%s' HEAD
            git ls-tree HEAD -- package.json pnpm-lock.yaml \
              test/e2e/qa-lab/runtime/codex-auth-product-proof.e2e.test.ts \
              test/helpers/openclaw-test-instance.ts \
              src/infra/gateway-lock.ts src/infra/gateway-state-owner.ts
          } | tee "$proof_dir/provenance.log"
          cat "$proof_dir/provenance.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup frozen Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"

      - name: Build private QA runtime
        shell: bash
        env:
          OPENCLAW_BUILD_PRIVATE_QA: "1"
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -euo pipefail
          pnpm build qaRuntime 2>&1 | tee "$RUNNER_TEMP/codex-auth-process-owner/build.log"

      - name: Run original removed-profile recovery case
        shell: bash
        env:
          OPENCLAW_BUILD_PRIVATE_QA: "1"
          OPENCLAW_E2E_USE_PREBUILT_DIST: "1"
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/codex-auth-process-owner"
          started="$(date +%s)"
          if node scripts/test-projects.mts test/e2e/qa-lab/runtime/codex-auth-product-proof.e2e.test.ts \
            --maxWorkers=1 -t 'returns bounded recovery after the explicitly selected profile is removed' \
            2>&1 | tee "$proof_dir/removed-profile-recovery.log"; then
            test_exit=0
          else
            test_exit=$?
          fi
          {
            echo "Removed-profile recovery exit: $test_exit"
            echo "Removed-profile recovery seconds: $(( $(date +%s) - started ))"
          } | tee "$proof_dir/removed-profile-recovery-result.txt" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_exit"

      - name: Verify tracked source stayed unchanged
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --

      - name: Preserve focused evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-codex-auth-process-owner-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codex-auth-process-owner/
          if-no-files-found: warn
          retention-days: 14
