name: Red-main isolated npm-pack timeout proof
run-name: Isolated npm-pack timeout proof ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-isolated-npm-pack-proof
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"
  SOURCE_SHA: "2bd6ca195418c5ff269439f02dd4b0b9b7c664b0"

jobs:
  isolated-npm-pack:
    name: One npm-pack successor case with fixture tracing
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout pinned main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record and verify source identity
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$SOURCE_SHA"
          mkdir -p .artifacts/memqueue-npm-pack-proof
          printf 'Source: %s\nWorkflow: %s\n' "$actual_sha" "$WORKFLOW_SHA" \
            | tee .artifacts/memqueue-npm-pack-proof/identity.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          restore-test-caches: "true"

      - name: Apply fixture-only stage tracing
