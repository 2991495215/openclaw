# Temporary focused proof only. Never merge this workflow.
name: Red-main models projection proof
run-name: Models projection proof ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full immutable candidate commit
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-models-projection-timers-${{ github.ref }}
  cancel-in-progress: false
env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  focused:
    name: Exact models projection case
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENCLAW_LOCAL_CHECK: "0"
      OPENCLAW_VITEST_RUNTIME: node
    steps:
      - name: Validate immutable source input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Checkout exact candidate
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify and record source
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          proof_dir="$RUNNER_TEMP/models-projection-timers"
          mkdir -p "$proof_dir"
          {
            echo "Source: $SOURCE_SHA"
            echo "Workflow: $WORKFLOW_SHA"
            git show -s --format='%H%n%P%n%s' HEAD
            git ls-tree HEAD -- package.json pnpm-lock.yaml \
              src/gateway/server-methods/models.test.ts \
              src/gateway/server-methods/models.ts src/gateway/server-methods/prepared-read.ts \
              src/infra/owned-directory-observation.ts
          } | tee "$proof_dir/provenance.log"
          cat "$proof_dir/provenance.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Setup frozen Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
      - name: Run only exact failing models projection case
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.19.0
          proof_dir="$RUNNER_TEMP/models-projection-timers"
          {
            node --version
            pnpm --version
            echo 'Command: pnpm test src/gateway/server-methods/models.test.ts --maxWorkers=1 -t "keeps the published all view exact while projection settles"'
          } | tee "$proof_dir/command.log"
          started="$(date +%s)"
          if pnpm test src/gateway/server-methods/models.test.ts --maxWorkers=1 \
            -t 'keeps the published all view exact while projection settles' \
            2>&1 | tee "$proof_dir/test.log"; then
            test_exit=0
          else
            test_exit=$?
          fi
          elapsed=$(( $(date +%s) - started ))
          {
            echo "Test exit: $test_exit"
            echo "Elapsed seconds: $elapsed"
          } | tee "$proof_dir/result.txt" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_exit"
      - name: Verify tracked source stayed unchanged
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code HEAD --
      - name: Preserve focused evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-models-projection-timers-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/models-projection-timers/
          if-no-files-found: warn
          retention-days: 14
