# Temporary exact-candidate build proof. Never merge this workflow.
name: Red-main full CI artifacts build proof
run-name: Full CI artifacts build 2dda3d82 ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-build-1841-full-build
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  build-artifacts:
    name: Exact candidate pnpm build:ci-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2dda3d82d06c7a3e7c6ddfdb0cedbbd46f37407d
          fetch-depth: 1
          persist-credentials: false

      - name: Record and verify complete candidate source before setup
        shell: bash
        env:
          EXPECTED_SHA: 2dda3d82d06c7a3e7c6ddfdb0cedbbd46f37407d
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/redmain-build-1841-full"
          mkdir -p "$proof_dir"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --
          git status --porcelain=v1 --untracked-files=all > "$proof_dir/source-before.status"
          test ! -s "$proof_dir/source-before.status"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Candidate tree: $(git rev-parse 'HEAD^{tree}')"
            echo "Workflow: $WORKFLOW_SHA"
            echo 'Command: pnpm build:ci-artifacts'
            git ls-tree HEAD -- .github/workflows/ci.yml .github/actions/setup-node-env/action.yml package.json pnpm-lock.yaml scripts/build-all.mts src/state/openclaw-state-db-cache.ts
          } | tee "$proof_dir/provenance.log"
          git ls-tree -r HEAD > "$proof_dir/candidate-tree.txt"
          git show HEAD:.github/workflows/ci.yml > "$proof_dir/candidate-ci.yml"
          cat "$proof_dir/provenance.log" >> "$GITHUB_STEP_SUMMARY"

      # Same action and inputs as the candidate's scheduled build-artifacts job.
      # Hosted runners resolve dependency-cache to false and NODE_VERSION to 24.21.0.
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          install-bun: "true"
          node-compile-cache: "true"
          build-all-cache-scope: full
          dependency-cache: "false"

      # Omit the outer dist cache so this command always executes.
      - name: Build dist
        id: dist_build
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -euo pipefail
          pnpm build:ci-artifacts 2>&1 | tee "$RUNNER_TEMP/redmain-build-1841-full/build.log"

      - name: Verify complete candidate source after build
        if: ${{ always() }}
        shell: bash
        env:
          EXPECTED_SHA: 2dda3d82d06c7a3e7c6ddfdb0cedbbd46f37407d
          BUILD_OUTCOME: ${{ steps.dist_build.outcome }}
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/redmain-build-1841-full"
          mkdir -p "$proof_dir"
          {
            echo "Build outcome: $BUILD_OUTCOME"
            echo "Candidate after build: $(git rev-parse HEAD)"
            echo "Candidate tree after build: $(git rev-parse 'HEAD^{tree}')"
          } | tee "$proof_dir/outcome.log"
          cat "$proof_dir/outcome.log" >> "$GITHUB_STEP_SUMMARY"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code HEAD -- 2>&1 | tee "$proof_dir/source-after.diff"
          git status --porcelain=v1 --untracked-files=all > "$proof_dir/source-after.status"
          test ! -s "$proof_dir/source-after.status"
          echo 'Complete tracked candidate source and untracked-file status are unchanged.' | tee "$proof_dir/source-unchanged.log"

      - name: Preserve build log and source provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-build-1841-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/redmain-build-1841-full/
          if-no-files-found: warn
          retention-days: 14
