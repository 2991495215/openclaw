# Temporary exact-candidate diagnostic only. Never merge this workflow.
name: Red-main pending input SQL diagnostic
run-name: Pending input SQL 5383b6ac84c1 ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-pending-input-sql-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  pending-input-diagnostic:
    name: Pending input SQL (exact diagnostic candidate)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact diagnostic candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5383b6ac84c10b92e33babd4624f6cc6a205158c
          fetch-depth: 1
          persist-credentials: false

      - name: Record candidate source and workflow provenance
        shell: bash
        env:
          EXPECTED_SHA: 5383b6ac84c10b92e33babd4624f6cc6a205158c
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --
          mkdir -p .artifacts/pending-input-diagnostic
          {
            echo "Candidate: $actual_sha"
            echo "Workflow: $WORKFLOW_SHA"
            git show -s --format='%H%n%P%n%an <%ae>%n%s' HEAD
            git ls-tree HEAD -- \
              package.json pnpm-lock.yaml .github/actions/setup-node-env/action.yml \
              src/gateway/server-methods/chat-pending-inputs.test.ts \
              test/helpers/sqlite-statement-execution-counter.ts
          } | tee .artifacts/pending-input-diagnostic/provenance.log
          cat .artifacts/pending-input-diagnostic/provenance.log >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"

      - name: Run original pending input case with SQL diagnostics
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          started="$(date +%s)"
          if pnpm test src/gateway/server-methods/chat-pending-inputs.test.ts --maxWorkers=1 -t 'prepares automation names once per pending page' 2>&1 | tee .artifacts/pending-input-diagnostic/test.log; then
            test_exit=0
          else
            test_exit=$?
          fi
          elapsed=$(( $(date +%s) - started ))
          {
            echo "Test exit: $test_exit"
            echo "Elapsed seconds: $elapsed"
          } | tee .artifacts/pending-input-diagnostic/result.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$test_exit"

      - name: Verify diagnostic source remained unchanged
        if: ${{ always() }}
        shell: bash
        env:
          EXPECTED_SHA: 5383b6ac84c10b92e33babd4624f6cc6a205158c
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --
          mkdir -p .artifacts/pending-input-diagnostic
          echo "Tracked diagnostic source remained unchanged." | tee .artifacts/pending-input-diagnostic/source-unchanged.log

      - name: Preserve full diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-pending-input-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/pending-input-diagnostic/
          if-no-files-found: warn
          retention-days: 14
