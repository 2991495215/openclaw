name: Red-main desktop transport diagnosis
run-name: Desktop transport diagnostic ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-ui5-rfb-diagnostic
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  ui5-rfb-diagnostic:
    name: Original desktop case with diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout reviewed diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ca457e96312c254ad40299b5cc06fafad2f16531
          fetch-depth: 1
          persist-credentials: false

      - name: Record pinned diagnostic source
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ca457e96312c254ad40299b5cc06fafad2f16531
          proof_dir="$RUNNER_TEMP/ui5-rfb-diagnostic"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- ui/src/e2e/session-active-resources.e2e.test.ts
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "true"
          vitest-worker-cache: "false"
          node-compile-cache: "true"

      - name: Setup Chromium
        uses: ./.github/actions/setup-playwright-chromium
        with:
          cache-mode: restore

      - name: Run original desktop case with unchanged assertions
        id: original_cases
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
          OPENCLAW_CI_TEST_RUNTIME_POLICY: node
          OPENCLAW_UI_E2E_SKIP_REAL_GATEWAY: "1"
          OPENCLAW_VITEST_MAX_WORKERS: "1"
          OPENCLAW_UI_E2E_DIAGNOSTIC_DIR: .artifacts/control-ui-e2e-timeouts/ui5-rfb-diagnostic
        run: |
          set -euo pipefail
          node scripts/run-vitest.mjs run \
            --config test/vitest/vitest.ui-e2e.config.ts \
            --configLoader runner \
            --maxWorkers 1 \
            --reporter=verbose \
            ui/src/e2e/session-active-resources.e2e.test.ts \
            -t 'stale roster: true, reclaim: false, swap: false, close another: true, explicit target: false' \
            2>&1 | tee "$RUNNER_TEMP/ui5-rfb-diagnostic/original-case.log"

      - name: Record outcome and verify unchanged sources
        if: ${{ always() }}
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.original_cases.outcome }}
        run: |
          set -euo pipefail
          echo "Original desktop case with diagnostics: $TEST_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          git diff --exit-code -- ui/src/e2e/session-active-resources.e2e.test.ts

      - name: Preserve proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-ui5-rfb-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ui5-rfb-diagnostic/
          if-no-files-found: warn
          retention-days: 14
