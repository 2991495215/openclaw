# Temporary exact-candidate regression proof. Never merge this workflow.
name: Red-main session creation fixture proof
run-name: Session creation fixture ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed candidate commit (40 lowercase hexadecimal characters)
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-session-create-fixture-proof
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}

jobs:
  session-create-fixture-proof:
    name: Original session creation durability case (exact candidate)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify and record candidate and workflow provenance
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git diff --exit-code HEAD --
          mkdir -p .artifacts/session-create-fixture-proof
          {
            echo "Candidate: $CANDIDATE_SHA"
            echo "Workflow: $WORKFLOW_SHA"
            git show -s --format='%H%n%P%n%an <%ae>%n%s' HEAD
            git ls-tree HEAD -- \
              package.json pnpm-lock.yaml .github/workflows/ci.yml \
              .github/actions/setup-node-env/action.yml \
              src/gateway/server.sessions.create.test-support.ts \
              src/gateway/server.sessions.create.durability.test.ts \
              src/gateway/server-methods/sessions-create.ts \
              src/gateway/test/server-sessions.test-helpers.ts \
              src/gateway/test/server-sessions-resources.test-helpers.ts \
              src/gateway/test-helpers.server.ts \
              scripts/lib/vitest-build-prerequisites.mts \
              scripts/lib/vitest-runtime-selection.mts \
              scripts/test-projects-run.mts \
              test/vitest/vitest.gateway-server.config.ts
          } | tee .artifacts/session-create-fixture-proof/provenance.log
          cat .artifacts/session-create-fixture-proof/provenance.log >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"

      # Canonical pnpm test owns prerequisites. No separate build or instrumentation.
      - name: Run only the original failing session creation case
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          {
            node --version
            pnpm --version
            echo "Command: pnpm test src/gateway/server.sessions.create.durability.test.ts --maxWorkers=1 -t 'persists and dispatches concurrent Gateway inputs while participant writes queue'"
          } | tee .artifacts/session-create-fixture-proof/command.log
          started="$(date +%s)"
          if pnpm test src/gateway/server.sessions.create.durability.test.ts --maxWorkers=1 -t 'persists and dispatches concurrent Gateway inputs while participant writes queue' 2>&1 | tee .artifacts/session-create-fixture-proof/test.log; then
            test_exit=0
          else
            test_exit=$?
          fi
          elapsed=$(( $(date +%s) - started ))
          {
            echo "Test exit: $test_exit"
            echo "Elapsed seconds: $elapsed"
          } | tee .artifacts/session-create-fixture-proof/result.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$test_exit"

      - name: Verify exact candidate source remained unchanged
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git diff --exit-code HEAD --
          echo "Exact candidate source remained unchanged." | tee .artifacts/session-create-fixture-proof/source-unchanged.log

      - name: Preserve regression evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-session-create-fixture-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/session-create-fixture-proof/
          if-no-files-found: warn
          retention-days: 14
