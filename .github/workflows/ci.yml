# PROOF ONLY: exact SwiftPM plugin fixture; never merge this workflow.
name: Red-main native Node probe diagnostics
run-name: Native Node probe diagnostics ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
      workflow_sha:
        description: Exact proof workflow commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-native-node-probe-diagnostics
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"
jobs:
  native-node-probe-diagnostics:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Checkout pinned candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 429c236f59bb306e6d50ae9f08ad3cfd25b4c40b
          fetch-depth: 1
          persist-credentials: false
      - name: Record source provenance
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 429c236f59bb306e6d50ae9f08ad3cfd25b4c40b
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          mkdir -p "$RUNNER_TEMP/native-node-probe-diagnostics"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- apps/shared/OpenClawKit/Plugins/GenerateGatewayProtocol/plugin.swift test/scripts/generate-gateway-protocol-plugin.test.ts node-version.mjs
          } | tee "$RUNNER_TEMP/native-node-probe-diagnostics/provenance.txt"
      - name: Select original Xcode toolchain
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          select_xcode_toolchain
          xcodebuild -version
          swift --version
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
          node-compile-cache: "true"
      - name: Check changed fixture and plugin formatting
        shell: bash
        run: |
          set -euo pipefail
          node_modules/.bin/oxfmt --check --threads=1 test/scripts/generate-gateway-protocol-plugin.test.ts
          node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.core.json test/scripts/generate-gateway-protocol-plugin.test.ts
          ./scripts/install-swift-tools.sh "$RUNNER_TEMP/openclaw-swift-tools"
          "$RUNNER_TEMP/openclaw-swift-tools/swiftformat" --lint apps/shared/OpenClawKit/Plugins/GenerateGatewayProtocol/plugin.swift --config config/swiftformat
          git diff --check
      - name: Prove SwiftPM shim resolution and failed-probe diagnostics
        shell: bash
        env:
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.21.0
          proof_dir="$RUNNER_TEMP/native-node-probe-diagnostics"
          started="$(date +%s)"
          pnpm test test/scripts/generate-gateway-protocol-plugin.test.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile.json="$proof_dir/vitest.json" 2>&1 | tee "$proof_dir/vitest.log"
          echo "Exact SwiftPM fixture elapsed seconds: $(( $(date +%s) - started ))" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify exact fixture executed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, pathlib
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-node-probe-diagnostics'
          data = json.loads((proof / 'vitest.json').read_text())
          results = data['testResults']
          assert len(results) == 1, results
          assert results[0]['name'].endswith('/test/scripts/generate-gateway-protocol-plugin.test.ts'), results[0]['name']
          cases = results[0]['assertionResults']
          assert len(cases) == 1, cases
          assert cases[0]['fullName'] == 'GenerateGatewayProtocol SwiftPM plugin resolves supported Node shims and reports failed probe reasons', cases
          assert cases[0]['status'] == 'passed', cases
          assert data['success'] and data['numPassedTests'] == 1 and data['numFailedTests'] == 0, data
          receipt = {'executed': 1, 'passed': 1, 'failed': 0, 'duration_ms': cases[0].get('duration'), 'original_ci_cause_resolved': False}
          text = json.dumps(receipt, indent=2)
          (proof / 'case-counts.json').write_text(text + '\n')
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('```json\n' + text + '\n```\n')
          PYTHON
      - name: Verify unchanged source
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 429c236f59bb306e6d50ae9f08ad3cfd25b4c40b
          git diff --exit-code HEAD --
      - name: Preserve proof
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-native-node-probe-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-node-probe-diagnostics/
          if-no-files-found: warn
          retention-days: 14
