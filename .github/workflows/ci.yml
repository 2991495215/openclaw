# Temporary hosted proof only. Never merge this workflow.
# Root owns candidate publication and dispatch; canonical source fixes are separate commits.
name: Red-main capture reporter script export proof
run-name: Capture reporter script export proof ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Reviewed full candidate commit SHA; no branch names
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-capture-reporter-script-export-proof-${{ github.ref }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  capture-reporter-script-export-proof:
    name: Failed script export check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENCLAW_LOCAL_CHECK: "0"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$EXPECTED_SHA" = "fea9f648434ebadd8d5e05ac9e894011569320b0"
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          proof_dir="$RUNNER_TEMP/capture-reporter-script-export-proof"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $actual_sha"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- config/knip.scripts-exports.config.ts scripts/check-deadcode-exports.mts scripts/deadcode-knip-runner.mts scripts/lib/vitest-report-capture.mts scripts/lib/vitest-report-owner.mts
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
          node-compile-cache: "true"

      - name: Replay only the failed script export scan
        id: knip_exports
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          # Exact third scan and common flags from scripts/check-deadcode-exports.mts.
          # Version is pinned by scripts/deadcode-knip-runner.mts.
          pnpm dlx --package knip@6.32.2 knip \
            --config config/knip.scripts-exports.config.ts --include-entry-exports \
            --no-progress --reporter compact \
            --include exports,nsExports,types,nsTypes,enumMembers,namespaceMembers \
            --no-config-hints 2>&1 | tee "$RUNNER_TEMP/capture-reporter-script-export-proof/knip_exports.log"

      - name: Record check outcomes and source status
        if: ${{ always() }}
        shell: bash
        env:
          OUTCOMES: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/capture-reporter-script-export-proof"
          printf '%s\n' "$OUTCOMES" > "$RUNNER_TEMP/capture-reporter-script-export-proof/outcomes.json"
          python3 - <<'PYOUTCOMES'
          import json, os
          outcomes = json.loads(os.environ["OUTCOMES"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              for name, step in outcomes.items():
                  summary.write(f"{name}: {step.get('outcome', 'unknown')}\n\n")
          PYOUTCOMES
          git status --short
          git diff --exit-code -- config/knip.scripts-exports.config.ts scripts/check-deadcode-exports.mts scripts/deadcode-knip-runner.mts scripts/lib/vitest-report-capture.mts scripts/lib/vitest-report-owner.mts

      - name: Preserve focused proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-capture-reporter-script-export-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capture-reporter-script-export-proof/
          if-no-files-found: warn
          retention-days: 14
