# Temporary exact-candidate proof only. Never merge this workflow.
name: Red-main exact UI dead exports proof
run-name: UI dead exports d87fc1517566 ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-ui-dead-exports-proof-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  check-dependencies:
    name: Originally failing export checks (exact candidate)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d87fc15175663d544635b574b02c8b8008f5307e
          fetch-depth: 1
          persist-credentials: false

      - name: Record candidate source and workflow provenance
        shell: bash
        env:
          EXPECTED_SHA: d87fc15175663d544635b574b02c8b8008f5307e
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --
          mkdir -p .artifacts/ui-dead-exports
          {
            echo "Candidate: $actual_sha"
            echo "Workflow: $WORKFLOW_SHA"
            git show -s --format='%H%n%P%n%an <%ae>%n%s' HEAD
            git ls-tree HEAD -- \
              package.json pnpm-lock.yaml \
              scripts/check-deadcode-exports.mts scripts/deadcode-knip-runner.mts \
              config/knip.config.ts config/knip.all-exports.config.ts \
              config/knip.scripts-exports.config.ts \
              scripts/check-deadcode-unused-files.mts \
              ui/src/app/app-shell-view.tsx ui/src/components/app-topbar.ts \
              ui/src/components/app-topbar-solid.tsx ui/src/components/image-with-fallback.ts \
              ui/src/components/kbd.ts ui/src/lit/gateway-page-controller.ts \
              ui/src/pages/skills/library-events.ts \
              ui/src/components/shell-chrome.test.tsx ui/src/components/kbd.test.ts \
              ui/src/app/app-host-pairing-access.test.ts ui/src/app/app-shell-view.test.ts
          } | tee .artifacts/ui-dead-exports/provenance.log
          cat .artifacts/ui-dead-exports/provenance.log >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"

      - name: Run each originally failing command once
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
        run: |
          set -euo pipefail
          mkdir -p .artifacts/ui-dead-exports
          printf 'command\texit_code\n' > .artifacts/ui-dead-exports/results.tsv
          dc_scripts=(deadcode:dependencies deadcode:unused-files deadcode:exports)
          dc_failures=0
          for dc in "${dc_scripts[@]}"; do
            dc_log=".artifacts/ui-dead-exports/${dc//:/-}.log"
            dc_rc=0
            pnpm "$dc" > "$dc_log" 2>&1 || dc_rc=$?
            cat "$dc_log"
            printf '%s\t%s\n' "$dc" "$dc_rc" >> .artifacts/ui-dead-exports/results.tsv
            if [ "$dc_rc" -ne 0 ]; then
              echo "::error title=${dc} failed::${dc} exited ${dc_rc}"
              dc_failures=1
            fi
          done
          cat .artifacts/ui-dead-exports/results.tsv >> "$GITHUB_STEP_SUMMARY"
          exit "$dc_failures"

      - name: Verify candidate source remained unchanged
        if: ${{ always() }}
        shell: bash
        env:
          EXPECTED_SHA: d87fc15175663d544635b574b02c8b8008f5307e
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --
          echo "Tracked candidate source remained unchanged." | tee .artifacts/ui-dead-exports/source-unchanged.log

      - name: Preserve all command outcomes and provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-ui-dead-exports-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/ui-dead-exports/
          if-no-files-found: warn
          retention-days: 14
