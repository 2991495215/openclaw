# Temporary focused diagnosis only. Never merge this workflow.
name: Red-main scheduler retention diagnosis
run-name: Scheduler retention diagnosis ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-scheduler-retention-${{ github.ref }}
  cancel-in-progress: false
env:
  SOURCE_SHA: f122878c82ad2ff43630954d84609ddc007a7cae
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  focused:
    name: Original scheduler retention cases with failure-only heap diagnosis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENCLAW_LOCAL_CHECK: "0"
      OPENCLAW_VITEST_RUNTIME: node
    steps:
      - name: Checkout failed scheduled source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: f122878c82ad2ff43630954d84609ddc007a7cae
          persist-credentials: false
      - name: Verify and record source
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          proof_dir="$RUNNER_TEMP/scheduler-retention"
          mkdir -p "$proof_dir" "$RUNNER_TEMP/scheduler-heap"
          {
            echo "Source: $SOURCE_SHA"
            echo "Workflow: $WORKFLOW_SHA"
            git show -s --format='%H%n%P%n%s' HEAD
            git ls-tree HEAD -- package.json pnpm-lock.yaml \
              src/infra/gateway-scheduler.test.ts \
              src/infra/gateway-scheduler.ts \
              src/infra/error-graph-internal.ts
          } | tee "$proof_dir/provenance.log"
          cat "$proof_dir/provenance.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Setup frozen Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
      - name: Add failure-only diagnostic capture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          target = pathlib.Path('src/infra/gateway-scheduler.test.ts')
          text = target.read_text()
          old_import = 'import { queryObjects } from "node:v8";'
          old_assertion = '      expect(queryObjects(RetiredOwner)).toBe(0);'
          assert text.count(old_import) == 1
          assert text.count(old_assertion) == 1
          heap_dir = json.dumps(str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'scheduler-heap'))
          diagnostic = '''      const retained = queryObjects(RetiredOwner);
                if (retained !== 0) {
                  console.log("Scheduler retained owner count", kind, retained);
                  writeHeapSnapshot(HEAP_DIR + "/" + kind + ".heapsnapshot");
                }
                expect(retained).toBe(0);'''.replace('HEAP_DIR', heap_dir)
          target.write_text(text.replace(old_import, 'import { queryObjects, writeHeapSnapshot } from "node:v8";').replace(old_assertion, diagnostic))
          PY
          git diff -- src/infra/gateway-scheduler.test.ts > "$RUNNER_TEMP/scheduler-retention/diagnostic.patch"
          sha256sum src/infra/gateway-scheduler.test.ts > "$RUNNER_TEMP/scheduler-retention/instrumented.sha256"
      - name: Run only the original two retention cases
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.19.0
          proof_dir="$RUNNER_TEMP/scheduler-retention"
          {
            node --version
            pnpm --version
            echo 'Command: node scripts/run-vitest.mjs run --config test/vitest/vitest.infra.config.ts src/infra/gateway-scheduler.test.ts --maxWorkers=1 -t "releases the retiring caller"'
          } | tee "$proof_dir/command.log"
          started="$(date +%s)"
          if node scripts/run-vitest.mjs run --config test/vitest/vitest.infra.config.ts \
            src/infra/gateway-scheduler.test.ts --maxWorkers=1 -t 'releases the retiring caller' \
            2>&1 | tee "$proof_dir/test.log"; then
            test_exit=0
          else
            test_exit=$?
          fi
          elapsed=$(( $(date +%s) - started ))
          {
            echo "Test exit: $test_exit"
            echo "Elapsed seconds: $elapsed"
          } | tee "$proof_dir/result.txt" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_exit"
      - name: Extract sanitized strong retaining paths
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          result_dir = root / 'scheduler-retention'
          result_dir.mkdir(exist_ok=True)
          safe_names = {
            '', '(GC roots)', '(Stack roots)', '(Global handles)', '(Strong roots)',
            '(Handle scope)', '(Builtins)', '(Internalized strings)', '(Global handles)',
            '(Traced handles)', 'global', 'Object', 'Array', 'Error', 'DOMException',
            'AbortController', 'AbortSignal', 'RetiredOwner', 'GatewayScheduler',
            'CallSite', 'system / Context', 'system / NativeContext', 'system / Map',
            'system / WeakArrayList', 'system / DescriptorArray', 'system / CallSiteInfo',
            'system / FixedArray', 'system / PropertyArray', 'system / FeedbackVector',
            'system / WeakFixedArray', 'system / Code', 'system / BytecodeArray',
            'close', 'beginClose', 'materializeErrorStack', 'queryObjects', 'fixture',
          }
          safe_edges = {
            'receiver', 'receiver_or_instance', 'function', 'context', 'previous',
            '__proto__', 'prototype', 'stack', 'reason', 'signal', 'controller',
            'RetiredOwner', 'close', 'beginClose', 'materializeErrorStack', 'slots',
            'table', 'elements', 'native_context', 'scope_info', 'signals', 'owner',
            'scheduler', 'error', 'retained', 'pending', 'jobs', 'weak_or_value',
            'script_or_debug_info', 'shared', 'feedback_cell', 'value', 'data',
          }
          snapshots = list((root / 'scheduler-heap').glob('*.heapsnapshot'))
          if not snapshots:
            (result_dir / 'heap-summary.json').write_text(json.dumps({'captured': False}))
          for filename in snapshots:
            try:
              heap = json.loads(filename.read_text())
              meta, nodes, edges, strings = heap['snapshot']['meta'], heap['nodes'], heap['edges'], heap['strings']
              nf, ef = meta['node_fields'], meta['edge_fields']
              nw, ew = len(nf), len(ef)
              nt, nn, nc = nf.index('type'), nf.index('name'), nf.index('edge_count')
              et, en, dest = ef.index('type'), ef.index('name_or_index'), ef.index('to_node')
              node_types, edge_types = meta['node_types'][nt], meta['edge_types'][et]
              targets = {i for i in range(0, len(nodes), nw) if node_types[nodes[i + nt]] == 'object' and strings[nodes[i + nn]] == 'RetiredOwner'}
              starts = {}
              cursor = 0
              for i in range(0, len(nodes), nw):
                starts[i] = cursor
                cursor += nodes[i + nc] * ew
              parents = {0: None}
              queue = collections.deque([0])
              remaining = set(targets)
              while queue and remaining:
                current = queue.popleft()
                remaining.discard(current)
                start = starts[current]
                for e in range(start, start + nodes[current + nc] * ew, ew):
                  if edge_types[edges[e + et]] == 'weak':
                    continue
                  child = edges[e + dest]
                  if child not in parents:
                    parents[child] = (current, e)
                    queue.append(child)
              def label(node):
                name = strings[nodes[node + nn]]
                return {'node_index': node // nw, 'type': node_types[nodes[node + nt]], 'name': name if name in safe_names else '[redacted]'}
              paths = []
              for target in sorted(targets):
                chain, node = [], target
                while node in parents and len(chain) < 80:
                  entry = label(node)
                  parent = parents[node]
                  if parent is not None:
                    prior, edge = parent
                    edge_type = edge_types[edges[edge + et]]
                    raw = edges[edge + en]
                    name = str(raw) if edge_type in ('element', 'hidden') else strings[raw]
                    entry['incoming'] = {'type': edge_type, 'name': name if edge_type in ('element', 'hidden') or name in safe_edges else '[redacted]'}
                  chain.append(entry)
                  if parent is None:
                    break
                  node = parent[0]
                paths.append({'strong_root_found': target in parents, 'path': list(reversed(chain))})
              report = {'captured': True, 'case': filename.stem, 'retired_owner_count_in_snapshot': len(targets), 'paths': paths}
              (result_dir / (filename.stem + '-retaining-paths.json')).write_text(json.dumps(report, indent=2))
            finally:
              filename.unlink()
          PY
      - name: Verify instrumentation was the only source change
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          proof_dir="$RUNNER_TEMP/scheduler-retention"
          if test -f "$proof_dir/instrumented.sha256"; then
            sha256sum -c "$proof_dir/instrumented.sha256"
            git diff --exit-code HEAD -- . ':!src/infra/gateway-scheduler.test.ts'
          else
            git diff --exit-code HEAD --
          fi
      - name: Preserve sanitized focused evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-scheduler-retention-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scheduler-retention/
          if-no-files-found: warn
          retention-days: 14
