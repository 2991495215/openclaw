# Temporary focused diagnosis only. Never merge this workflow.
name: Red-main scheduler handoff retention diagnosis
run-name: Scheduler handoff diagnosis ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full source commit SHA (failed scheduled source d7e3fcb3293ba385b88f1b0638d13023d0e38fe3)
        type: string
        required: true
      workflow_sha:
        description: Expected workflow carrier commit SHA
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-scheduler-retention-${{ github.ref }}
  cancel-in-progress: false
env:
  SOURCE_SHA: ${{ inputs.candidate_sha }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  focused:
    name: Exact root retention case across one event-loop handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENCLAW_LOCAL_CHECK: "0"
      OPENCLAW_VITEST_RUNTIME: node
    steps:
      - name: Checkout failed scheduled source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify and record source
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          git diff --exit-code HEAD --
          proof_dir="$RUNNER_TEMP/scheduler-retention"
          mkdir -p "$proof_dir" "$RUNNER_TEMP/scheduler-heap"
          {
            echo "Source: $SOURCE_SHA"
            echo "Workflow: $WORKFLOW_SHA"
            git show -s --format='%H%n%P%n%s' HEAD
            git ls-tree HEAD -- package.json pnpm-lock.yaml \
              src/infra/gateway-scheduler.test.ts \
              src/infra/gateway-scheduler.ts \
              src/infra/error-graph-internal.ts
          } | tee "$proof_dir/provenance.log"
          cat "$proof_dir/provenance.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Setup frozen Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
      - name: Add exact-case handoff diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/scheduler-retention/diagnostic.patch" <<'DIAGNOSTIC_PATCH'
          diff --git a/src/infra/gateway-scheduler.test.ts b/src/infra/gateway-scheduler.test.ts
          index d8b0d93918d6..e7412fe45b39 100644
          --- a/src/infra/gateway-scheduler.test.ts
          +++ b/src/infra/gateway-scheduler.test.ts
          @@ -1,5 +1,6 @@
           import { AsyncLocalStorage, createHook } from "node:async_hooks";
          -import { queryObjects } from "node:v8";
          +import { setImmediate as nextTurn } from "node:timers/promises";
          +import { queryObjects, writeHeapSnapshot } from "node:v8";
           import { describe, expect, it, vi } from "vitest";
           import { trackAsyncWork } from "../shared/async-work-scope.js";
           import { createDeferredCore } from "../shared/deferred.js";
          @@ -127,7 +128,7 @@ describe("Gateway timed work", () => {
           
             it.each(["root", "scope"] as const)(
               "releases the retiring caller while its %s abort signal remains reachable",
          -    (kind) => {
          +    async (kind) => {
                 class RetiredOwner {
                   close() {
                     const { scheduler } = fixture();
          @@ -137,7 +138,18 @@ describe("Gateway timed work", () => {
                   }
                 }
                 const signals = Array.from({ length: 12 }, () => new RetiredOwner().close());
          -      expect(queryObjects(RetiredOwner)).toBe(0);
          +      const immediateCount = queryObjects(RetiredOwner);
          +      await nextTurn();
          +      const nextTurnCount = queryObjects(RetiredOwner);
          +      console.log(
          +        "SCHEDULER_RETENTION_COUNTS",
          +        JSON.stringify({ kind, immediateCount, nextTurnCount, reachableSignals: signals.length }),
          +      );
          +      if (nextTurnCount !== 0) {
          +        writeHeapSnapshot("scheduler-root-retained.heapsnapshot");
          +      }
          +      expect(immediateCount).toBe(0);
          +      expect(nextTurnCount).toBe(0);
                 for (const signal of signals) {
                   expect(signal.aborted).toBe(true);
                   expect(signal.reason).toMatchObject({ name: "AbortError" });
          DIAGNOSTIC_PATCH
          git apply --check "$RUNNER_TEMP/scheduler-retention/diagnostic.patch"
          git apply "$RUNNER_TEMP/scheduler-retention/diagnostic.patch"
          sha256sum src/infra/gateway-scheduler.test.ts > "$RUNNER_TEMP/scheduler-retention/instrumented.sha256"
      - name: Run only the failed root retention case
        id: focused
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.19.0
          proof_dir="$RUNNER_TEMP/scheduler-retention"
          {
            node --version
            pnpm --version
            echo 'Command: node scripts/run-vitest.mjs run --config test/vitest/vitest.infra.config.ts src/infra/gateway-scheduler.test.ts --maxWorkers=1 --reporter=verbose --reporter=json --outputFile.json "$RUNNER_TEMP/scheduler-retention/results.json" -t "^Gateway timed work > releases the retiring caller while its root abort signal remains reachable$"'
          } | tee "$proof_dir/command.log"
          started="$(date +%s)"
          if node scripts/run-vitest.mjs run --config test/vitest/vitest.infra.config.ts \
            src/infra/gateway-scheduler.test.ts --maxWorkers=1 --reporter=verbose --reporter=json \
            --outputFile.json "$proof_dir/results.json" \
            -t '^Gateway timed work > releases the retiring caller while its root abort signal remains reachable$' \
            2>&1 | tee "$proof_dir/test.log"; then
            test_exit=0
          else
            test_exit=$?
          fi
          elapsed=$(( $(date +%s) - started ))
          {
            echo "Test exit: $test_exit"
            echo "Elapsed seconds: $elapsed"
          } | tee "$proof_dir/result.txt" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_exit"
      - name: Record exact selected case and comparison
        if: ${{ always() && steps.focused.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, pathlib, re
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'scheduler-retention'
          report = json.loads((proof / 'results.json').read_text())
          assert len(report['testResults']) == 1, 'Expected exactly one selected test file'
          result = report['testResults'][0]
          assert pathlib.Path(result['name']).resolve() == pathlib.Path('src/infra/gateway-scheduler.test.ts').resolve()
          selected = [entry for entry in result['assertionResults'] if entry['status'] in ('passed', 'failed')]
          expected = 'Gateway timed work releases the retiring caller while its root abort signal remains reachable'
          assert len(selected) == 1 and selected[0]['fullName'] == expected, 'Expected only the failed root case'
          assert report['numPassedTests'] + report['numFailedTests'] == 1, 'Expected exactly one executed case'
          log = re.sub(r'\x1b\[[0-9;]*m', '', (proof / 'test.log').read_text())
          comparisons = [json.loads(line.split('SCHEDULER_RETENTION_COUNTS', 1)[1].strip()) for line in log.splitlines() if 'SCHEDULER_RETENTION_COUNTS' in line]
          assert len(comparisons) == 1, 'Expected one handoff comparison, no retries'
          counts = comparisons[0]
          assert counts['kind'] == 'root' and counts['reachableSignals'] == 12
          assert isinstance(counts['immediateCount'], int) and isinstance(counts['nextTurnCount'], int)
          outcome = {'selected': expected, 'status': selected[0]['status'], 'counts': counts, 'diagnostic_only': True}
          text = json.dumps(outcome, indent=2)
          (proof / 'comparison.json').write_text(text + '\n')
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
            summary.write('```json\n' + text + '\n```\n')
          PYTHON
      - name: Extract sanitized strong retaining paths
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          result_dir = root / 'scheduler-retention'
          result_dir.mkdir(exist_ok=True)
          safe_names = {
            '', '(GC roots)', '(Stack roots)', '(Global handles)', '(Strong roots)',
            '(Handle scope)', '(Builtins)', '(Internalized strings)', '(Global handles)',
            '(Traced handles)', 'global', 'Object', 'Array', 'Error', 'DOMException',
            'AbortController', 'AbortSignal', 'RetiredOwner', 'GatewayScheduler',
            'CallSite', 'system / Context', 'system / NativeContext', 'system / Map',
            'system / WeakArrayList', 'system / DescriptorArray', 'system / CallSiteInfo',
            'system / FixedArray', 'system / PropertyArray', 'system / FeedbackVector',
            'system / WeakFixedArray', 'system / Code', 'system / BytecodeArray',
            'close', 'beginClose', 'materializeErrorStack', 'queryObjects', 'fixture',
          }
          safe_edges = {
            'receiver', 'receiver_or_instance', 'function', 'context', 'previous',
            '__proto__', 'prototype', 'stack', 'reason', 'signal', 'controller',
            'RetiredOwner', 'close', 'beginClose', 'materializeErrorStack', 'slots',
            'table', 'elements', 'native_context', 'scope_info', 'signals', 'owner',
            'scheduler', 'error', 'retained', 'pending', 'jobs', 'weak_or_value',
            'script_or_debug_info', 'shared', 'feedback_cell', 'value', 'data',
          }
          snapshot = pathlib.Path('scheduler-root-retained.heapsnapshot')
          snapshots = [snapshot] if snapshot.is_file() else []
          if not snapshots:
            (result_dir / 'heap-summary.json').write_text(json.dumps({'captured': False}))
          for filename in snapshots:
            try:
              heap = json.loads(filename.read_text())
              meta, nodes, edges, strings = heap['snapshot']['meta'], heap['nodes'], heap['edges'], heap['strings']
              nf, ef = meta['node_fields'], meta['edge_fields']
              nw, ew = len(nf), len(ef)
              nt, nn, nc = nf.index('type'), nf.index('name'), nf.index('edge_count')
              et, en, dest = ef.index('type'), ef.index('name_or_index'), ef.index('to_node')
              node_types, edge_types = meta['node_types'][nt], meta['edge_types'][et]
              targets = {i for i in range(0, len(nodes), nw) if node_types[nodes[i + nt]] == 'object' and strings[nodes[i + nn]] == 'RetiredOwner'}
              starts = {}
              cursor = 0
              for i in range(0, len(nodes), nw):
                starts[i] = cursor
                cursor += nodes[i + nc] * ew
              parents = {0: None}
              queue = collections.deque([0])
              remaining = set(targets)
              while queue and remaining:
                current = queue.popleft()
                remaining.discard(current)
                start = starts[current]
                for e in range(start, start + nodes[current + nc] * ew, ew):
                  if edge_types[edges[e + et]] == 'weak':
                    continue
                  child = edges[e + dest]
                  if child not in parents:
                    parents[child] = (current, e)
                    queue.append(child)
              def label(node):
                name = strings[nodes[node + nn]]
                return {'node_index': node // nw, 'type': node_types[nodes[node + nt]], 'name': name if name in safe_names else '[redacted]'}
              paths = []
              for target in sorted(targets):
                chain, node = [], target
                while node in parents and len(chain) < 80:
                  entry = label(node)
                  parent = parents[node]
                  if parent is not None:
                    prior, edge = parent
                    edge_type = edge_types[edges[edge + et]]
                    raw = edges[edge + en]
                    name = str(raw) if edge_type in ('element', 'hidden') else strings[raw]
                    entry['incoming'] = {'type': edge_type, 'name': name if edge_type in ('element', 'hidden') or name in safe_edges else '[redacted]'}
                  chain.append(entry)
                  if parent is None:
                    break
                  node = parent[0]
                paths.append({'strong_root_found': target in parents, 'path': list(reversed(chain))})
              report = {'captured': True, 'case': filename.stem, 'retired_owner_count_in_snapshot': len(targets), 'paths': paths}
              (result_dir / (filename.stem + '-retaining-paths.json')).write_text(json.dumps(report, indent=2))
            finally:
              filename.unlink()
          PY
      - name: Verify instrumentation was the only source change
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          proof_dir="$RUNNER_TEMP/scheduler-retention"
          if test -f "$proof_dir/instrumented.sha256"; then
            sha256sum -c "$proof_dir/instrumented.sha256"
            git diff --exit-code HEAD -- . ':!src/infra/gateway-scheduler.test.ts'
          else
            git diff --exit-code HEAD --
          fi
      - name: Preserve sanitized focused evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-scheduler-handoff-retention-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scheduler-retention/
          if-no-files-found: warn
          retention-days: 14
