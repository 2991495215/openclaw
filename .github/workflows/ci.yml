name: Red-main update heartbeat repaired proof
run-name: Update heartbeat repaired ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full repaired candidate commit SHA
        type: string
        required: true
      workflow_sha:
        description: Expected workflow carrier commit SHA
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-update-heartbeat-diagnostics
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.19.0"

jobs:
  update-heartbeat:
    name: Exact heartbeat and pending Doctor cases
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repaired candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record candidate and workflow provenance
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          git diff --exit-code HEAD --
          proof_dir="$RUNNER_TEMP/update-heartbeat-timers"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- \
              src/infra/update-run-abandonment.test.ts \
              src/cli/update-cli/update-command-package-doctor.test.ts \
              scripts/run-vitest.mjs \
              .github/actions/setup-node-env/action.yml
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "true"
          vitest-worker-cache: "false"
          node-compile-cache: "true"

      - name: Run exact heartbeat failure=false and failure=true cases
        id: heartbeat
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
          OPENCLAW_CI_TEST_RUNTIME_POLICY: node
          OPENCLAW_VITEST_MAX_WORKERS: "1"
          OPENCLAW_VITEST_PRINT_IMPORT_BREAKDOWN: "1"
        run: |
          set -uo pipefail
          set +e
          timeout --signal=TERM --kill-after=10s 280s \
            node scripts/run-vitest.mjs \
            src/infra/update-run-abandonment.test.ts \
            --maxWorkers=1 --reporter=verbose --reporter=json \
            --outputFile.json "$RUNNER_TEMP/update-heartbeat-timers/heartbeat.json" \
            -t 'renews a slow step and stops heartbeats after failure=' \
            2>&1 | tee "$RUNNER_TEMP/update-heartbeat-timers/heartbeat.log"
          test_exit=$?
          echo "exit_code=$test_exit" >> "$GITHUB_OUTPUT"
          echo "Heartbeat command exit: $test_exit" | tee -a "$RUNNER_TEMP/update-heartbeat-timers/heartbeat.log"
          exit "$test_exit"

      - name: Run exact pending Doctor case
        id: doctor
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
          OPENCLAW_CI_TEST_RUNTIME_POLICY: node
          OPENCLAW_VITEST_MAX_WORKERS: "1"
          OPENCLAW_VITEST_PRINT_IMPORT_BREAKDOWN: "1"
        run: |
          set -uo pipefail
          set +e
          timeout --signal=TERM --kill-after=10s 280s \
            node scripts/run-vitest.mjs \
            src/cli/update-cli/update-command-package-doctor.test.ts \
            --maxWorkers=1 --reporter=verbose --reporter=json \
            --outputFile.json "$RUNNER_TEMP/update-heartbeat-timers/doctor.json" \
            -t '^leaves the run ledger unchanged while the activation Doctor child is pending$' \
            2>&1 | tee "$RUNNER_TEMP/update-heartbeat-timers/doctor.log"
          test_exit=$?
          echo "exit_code=$test_exit" >> "$GITHUB_OUTPUT"
          echo "Doctor command exit: $test_exit" | tee -a "$RUNNER_TEMP/update-heartbeat-timers/doctor.log"
          exit "$test_exit"

      - name: Record outcomes and verify unchanged tracked source
        if: ${{ always() }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          HEARTBEAT_OUTCOME: ${{ steps.heartbeat.outcome }}
          HEARTBEAT_EXIT: ${{ steps.heartbeat.outputs.exit_code }}
          DOCTOR_OUTCOME: ${{ steps.doctor.outcome }}
          DOCTOR_EXIT: ${{ steps.doctor.outputs.exit_code }}
        run: |
          set -uo pipefail
          proof_dir="$RUNNER_TEMP/update-heartbeat-timers"
          mkdir -p "$proof_dir"
          source_outcome=failure
          if test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" && git diff --quiet HEAD --; then
            source_outcome=success
          fi
          report_outcome=failure
          if node --input-type=module <<'SELECTED_TESTS' | tee "$proof_dir/selected-tests.jsonl"
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import path from "node:path";

          const cases = [
            {
              name: "heartbeat",
              file: "src/infra/update-run-abandonment.test.ts",
              expectedNames: [false, true].map((fails) =>
                `abandoned update runs renews a slow step and stops heartbeats after failure=${fails}`),
            },
            {
              name: "doctor",
              file: "src/cli/update-cli/update-command-package-doctor.test.ts",
              expectedNames: ["leaves the run ledger unchanged while the activation Doctor child is pending"],
            },
          ];
          for (const { name, file, expectedNames } of cases) {
            const report = JSON.parse(readFileSync(path.join(process.env.RUNNER_TEMP, "update-heartbeat-timers", `${name}.json`), "utf8"));
            assert.equal(report.success, true, `${name}: successful report`);
            assert.equal(report.testResults.length, 1, `${name}: one test file`);
            assert.equal(report.numPassedTests, expectedNames.length, `${name}: exact passed count`);
            assert.equal(report.numFailedTests, 0, `${name}: no failed tests`);
            assert.equal(report.numFailedTestSuites, 0, `${name}: no failed suites`);
            const result = report.testResults[0];
            assert.equal(result.name, path.resolve(file), `${name}: expected test file`);
            assert.equal(result.status, "passed", `${name}: file passed`);
            const selected = result.assertionResults.filter((entry) => expectedNames.includes(entry.fullName));
            assert.deepEqual(selected.map((entry) => entry.fullName).sort(), [...expectedNames].sort(), `${name}: exact selected names`);
            assert.deepEqual(result.assertionResults.filter((entry) => entry.status === "passed").map((entry) => entry.fullName).sort(), [...expectedNames].sort(), `${name}: exact passed names`);
            for (const entry of selected) {
              assert.equal(entry.status, "passed", entry.fullName);
            }
            console.log(JSON.stringify({ proof: name, selected: selected.length, passed: report.numPassedTests, failed: report.numFailedTests, fullNames: expectedNames }));
          }
          SELECTED_TESTS
          then
            report_outcome=success
          fi
          {
            echo "Setup: $SETUP_OUTCOME"
            echo "Heartbeat failure=false and failure=true: $HEARTBEAT_OUTCOME (command exit ${HEARTBEAT_EXIT:-not recorded})"
            echo "Pending Doctor: $DOCTOR_OUTCOME (command exit ${DOCTOR_EXIT:-not recorded})"
            echo "Exact JSON results (heartbeat 2 passed, Doctor 1 passed): $report_outcome"
            echo "Unchanged tracked source at candidate: $source_outcome"
          } | tee "$proof_dir/outcomes.txt"
          cat "$proof_dir/outcomes.txt" >> "$GITHUB_STEP_SUMMARY"
          test "$SETUP_OUTCOME" = success && \
            test "$HEARTBEAT_OUTCOME" = success && \
            test "$DOCTOR_OUTCOME" = success && \
            test "$report_outcome" = success && \
            test "$source_outcome" = success

      - name: Preserve proof logs and JSON reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-update-heartbeat-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/update-heartbeat-timers/
          if-no-files-found: warn
          retention-days: 14
