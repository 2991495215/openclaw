# Prepared only: the coordinator owns publication and dispatch.
# The exact main failure is already recorded; run only the candidate case.
name: Red-main channel reload completion proof
run-name: Channel reload completion 4db843084c74 ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-channel-reload-proof-4db843084c74
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  channel-reload-proof:
    name: Channel reload completion candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 4db843084c74761f62a5e13812c35b08f407dad1
          fetch-depth: 1
          persist-credentials: false

      - name: Record exact sources
        shell: bash
        env:
          EXPECTED_SHA: 4db843084c74761f62a5e13812c35b08f407dad1
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          proof_dir="$RUNNER_TEMP/channel-reload-proof"
          mkdir -p "$proof_dir"
          {
            echo "Source: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- src/gateway/server-reload-channel-restart.test.ts src/gateway/config-reload.ts src/gateway/server-channel-startup.ts src/infra/gateway-scheduler.ts src/test-utils/gateway-scheduler-clock.ts test/helpers/promise.ts
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "true"
          vitest-worker-cache: "false"
          node-compile-cache: "true"

      - name: Run exact channel reload case
        id: channel-reload
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          /usr/bin/time -p pnpm test src/gateway/server-reload-channel-restart.test.ts --maxWorkers=1 --reporter=verbose -t 'the config watcher restarts a channel that can save provider settings after reload closes' 2>&1 | tee "$RUNNER_TEMP/channel-reload-proof/channel-reload.log"

      - name: Record outcome and verify unchanged sources
        if: ${{ always() }}
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.channel-reload.outcome }}
        run: |
          set -euo pipefail
          echo "Channel reload case result: $TEST_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          git status --short
          git diff --exit-code -- src/gateway/server-reload-channel-restart.test.ts src/gateway/config-reload.ts src/gateway/server-channel-startup.ts src/infra/gateway-scheduler.ts src/test-utils/gateway-scheduler-clock.ts test/helpers/promise.ts

      - name: Preserve proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-channel-reload-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/channel-reload-proof/
          if-no-files-found: warn
          retention-days: 14
