name: Red-main preflight reader test proof
run-name: Preflight reader test ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Reviewed full candidate commit SHA
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-preflight-reader-test-proof-${{ github.ref }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  preflight-reader-regressions:
    name: Preflight reader regression and commands types (exact candidate)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          echo "Candidate: $actual_sha"
          echo "Workflow: $WORKFLOW_SHA"
          echo "Candidate: $actual_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow: $WORKFLOW_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"

      - name: Run complete preflight snapshot regression file
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          mkdir -p .artifacts/preflight-reader-test
          test_files=(
            src/commands/config-preflight-snapshot.test.ts
          )
          test_failures=0
          for test_file in "${test_files[@]}"; do
            log_name="${test_file##*/}"
            echo "::group::${test_file}"
            if pnpm test "$test_file" --maxWorkers=1 2>&1 | tee ".artifacts/preflight-reader-test/${log_name}.log"; then
              echo "PASS: $test_file" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error title=Focused regression failed::${test_file} failed"
              echo "FAIL: $test_file" >> "$GITHUB_STEP_SUMMARY"
              test_failures=1
            fi
            echo "::endgroup::"
          done
          exit "$test_failures"

      - name: Run exact commands TypeScript leaf
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
        run: |
          set -euo pipefail
          mkdir -p .artifacts/preflight-reader-test
          node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.core.test.commands.json --incremental 2>&1 | tee .artifacts/preflight-reader-test/core-test-commands.log
          echo "PASS: core-test-commands TypeScript leaf" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve full regression log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-preflight-reader-test-regressions-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/preflight-reader-test/*.log
          if-no-files-found: warn
          retention-days: 14

  baseline-commands-types:
    name: Baseline commands types (main fcb89a331a1f)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact main baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fcb89a331a1f59eedde59c4b3a338febdb199cb7
          fetch-depth: 1
          persist-credentials: false

      - name: Verify baseline identity
        shell: bash
        env:
          EXPECTED_SHA: fcb89a331a1f59eedde59c4b3a338febdb199cb7
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          echo "Main baseline: $actual_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow: $WORKFLOW_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Main baseline: $actual_sha"
          echo "Workflow: $WORKFLOW_SHA"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"

      - name: Run exact main commands TypeScript leaf
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
        run: |
          set -euo pipefail
          mkdir -p .artifacts/preflight-reader-baseline
          node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.core.test.commands.json --incremental 2>&1 | tee .artifacts/preflight-reader-baseline/core-test-commands.log

      - name: Preserve full baseline type log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-preflight-reader-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/preflight-reader-baseline/*.log
          if-no-files-found: warn
          retention-days: 14
