          git apply .artifacts/memqueue-npm-pack-proof/fixture-tracing.patch
          git diff --check
          test "$(git diff --name-only)" = src/plugins/install.npm-spec.e2e.test.ts
          git diff --stat | tee .artifacts/memqueue-npm-pack-proof/fixture-diff-stat.txt

      - name: Run exactly one npm-pack successor case
        id: exact_case
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
          OPENCLAW_E2E_SKIP_BUILD: "1"
          OPENCLAW_E2E_VERBOSE: "1"
        run: |
          set +e
          set -uo pipefail
          node scripts/run-vitest.mjs run \
            --config test/vitest/vitest.e2e.config.ts \
            --maxWorkers=1 \
            --reporter=verbose --reporter=json \
            --outputFile.json .artifacts/memqueue-npm-pack-proof/results.json \
            -t 'preserves a real npm-pack successor when an earlier lifecycle lease has closed$' \
            src/plugins/install.npm-spec.e2e.test.ts \
            2>&1 | tee .artifacts/memqueue-npm-pack-proof/test.log
          result_codes=("${PIPESTATUS[@]}")
          printf '%s\n' "${result_codes[0]}" > .artifacts/memqueue-npm-pack-proof/test-exit-code.txt
          if (( result_codes[0] != 0 )); then
            exit "${result_codes[0]}"
          fi
          exit "${result_codes[1]}"

      - name: Verify exact executed case selection
        if: ${{ always() && steps.exact_case.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'VERIFY_SELECTION' \
            | tee .artifacts/memqueue-npm-pack-proof/selection.txt
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          const report = JSON.parse(readFileSync(".artifacts/memqueue-npm-pack-proof/results.json", "utf8"));
          const title = "preserves a real npm-pack successor when an earlier lifecycle lease has closed";
          const cases = report.testResults.flatMap((file) =>
            file.assertionResults.map((entry) => ({ file: file.name, ...entry })),
          );
          const executed = cases.filter((entry) => ["passed", "failed"].includes(entry.status));
          assert.equal(executed.length, 1, "expected exactly one executed case");
          assert.equal(executed[0].title, title);
          assert.ok(executed[0].ancestorTitles.includes("installPluginFromNpmSpec e2e"));
          assert.ok(executed[0].file.endsWith("/src/plugins/install.npm-spec.e2e.test.ts"));
          assert.ok(cases.every((entry) =>
            ["passed", "failed", "pending", "skipped", "todo", "disabled"].includes(entry.status),
          ), "unexpected assertion status");
          console.log(JSON.stringify({
            executed: executed.map(({ title, status }) => ({ title, status })),
            skipped: cases.length - executed.length,
            reportSuccess: report.success,
          }, null, 2));
          VERIFY_SELECTION

      - name: Preserve source identity, fixture patch, stage log, and exact case report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: memqueue-npm-pack-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/memqueue-npm-pack-proof/
          if-no-files-found: warn
          retention-days: 14
