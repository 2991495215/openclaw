name: Red-main models freshness diagnostic
run-name: Models freshness diagnostic ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-models-freshness-diagnostic-${{ github.ref }}-${{ inputs.dispatch_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  models-freshness-diagnostic:
    name: Models freshness diagnostic (exact failing source)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact failing source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 76edfee2d2202e1da8ea4274a05cb98ae1e723bf
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source and apply recorded test diagnostic
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "76edfee2d2202e1da8ea4274a05cb98ae1e723bf"
          mkdir -p .artifacts/models-freshness-diagnostic
          cat > .artifacts/models-freshness-diagnostic/diagnostic.patch <<'DIAGNOSTIC_PATCH'
          diff --git a/src/gateway/server-methods/models-list.freshness.integration.test.ts b/src/gateway/server-methods/models-list.freshness.integration.test.ts
          --- a/src/gateway/server-methods/models-list.freshness.integration.test.ts
          +++ b/src/gateway/server-methods/models-list.freshness.integration.test.ts
          @@ -5,8 +5,13 @@
           import { createDeferred, withinTest } from "../../../test/helpers/promise.js";
           import { getPublishedPreparedModelCatalogOwnerSnapshot } from "../../agents/prepared-model-catalog.js";
           import { resolvePreparedModelRuntimeOwnerBySnapshot } from "../../agents/prepared-model-runtime.owner.js";
          +import {
          +  getRuntimeConfigSnapshot,
          +  resolveRuntimeModelConfigCacheKey,
          +} from "../../config/runtime-snapshot.js";
           import { createOpenClawTestState } from "../../test-utils/openclaw-test-state.js";
           import { disconnectGatewayClient, startGatewayWithClient } from "../test-helpers.e2e.js";
          +import * as chatMetadataFacts from "./chat-metadata-facts.js";
           import { waitForCatalogPublication } from "./models-auth-catalog.test-support.js";
           import * as modelsListResult from "./models-list-result.js";
           
          @@ -176,7 +181,74 @@
                   if (withSibling && !initiallyEmpty) {
                     const timings: Array<{ patchMs: number; modelsMs: number; bytes: number }> = [];
                     const projection = vi.spyOn(modelsListResult, "prepareModelsListResult");
          +          const build = vi.spyOn(modelsListResult, "buildModelsListResult");
          +          const comparison = vi.spyOn(chatMetadataFacts, "generationFactsMatch");
          +          const readModelConfigKey = () => {
          +            const config = getRuntimeConfigSnapshot();
          +            return config ? resolveRuntimeModelConfigCacheKey(config) : null;
          +          };
          +          const baselineModelConfigKey = readModelConfigKey();
          +          let previousModelConfigKey = baselineModelConfigKey;
          +          let projectionOffset = 0;
          +          let buildOffset = 0;
          +          let comparisonOffset = 0;
          +          const recordPhase = (phase: string) => {
          +            const modelConfigKey = readModelConfigKey();
          +            console.log(
          +              "Preference cache diagnostic",
          +              JSON.stringify({
          +                phase,
          +                providerRequests: requests,
          +                runtimeConfigAvailable: modelConfigKey !== null,
          +                sameModelConfigAsBaseline: modelConfigKey === baselineModelConfigKey,
          +                sameModelConfigAsPreviousPhase: modelConfigKey === previousModelConfigKey,
          +                preparations: projection.mock.calls
          +                  .slice(projectionOffset)
          +                  .map(([params]) => params.source.kind),
          +                builds: build.mock.calls.slice(buildOffset).map(([params]) => params.source.kind),
          +                comparisons: comparison.mock.calls
          +                  .slice(comparisonOffset)
          +                  .map(([left, right, scope], index) => {
          +                    const result = comparison.mock.results[comparisonOffset + index];
          +                    return {
          +                      scope: scope ?? "metadata",
          +                      matched: result?.type === "return" ? result.value : null,
          +                      sameConfigKey: left.configKey === right.configKey,
          +                      samePluginRegistryVersion:
          +                        left.pluginRegistryVersion === right.pluginRegistryVersion,
          +                      leftAgentCount: left.agents.length,
          +                      rightAgentCount: right.agents.length,
          +                      agents: left.agents.map((agent, agentIndex) => {
          +                        const candidate = right.agents[agentIndex];
          +                        return {
          +                          sameAgentId: candidate?.agentId === agent.agentId,
          +                          sameOwnerCheck: candidate?.owner.isCurrent === agent.owner.isCurrent,
          +                          sameWorkspace: candidate?.owner.workspaceDir === agent.owner.workspaceDir,
          +                          sameAuthRevision: candidate?.authStoreRevision === agent.authStoreRevision,
          +                          sameCatalog: candidate?.modelCatalog === agent.modelCatalog,
          +                          sameRefreshFailure:
          +                            candidate?.catalogRefreshFailed === agent.catalogRefreshFailed,
          +                          sameSkillsVersion: candidate?.skillsVersion === agent.skillsVersion,
          +                        };
          +                      }),
          +                    };
          +                  }),
          +              }),
          +            );
          +            projectionOffset = projection.mock.calls.length;
          +            buildOffset = build.mock.calls.length;
          +            comparisonOffset = comparison.mock.calls.length;
          +            previousModelConfigKey = modelConfigKey;
          +          };
                     try {
          +            recordPhase("before-warm-read");
          +            const warm = await list();
          +            recordPhase("after-warm-read");
          +            expect(warm.models).toEqual(initial.models);
          +            expect(requests).toBe(initialRequests);
          +            // Keep the original assertion scoped to the six preference-write/read pairs.
          +            projection.mockClear();
          +            projectionOffset = 0;
                       for (let index = 0; index < 6; index++) {
                         const start = performance.now();
                         const ack = await client.request<{ ok: boolean; config?: unknown }>("config.patch", {
          @@ -184,9 +256,11 @@
                           response: "summary",
                         });
                         const patched = performance.now();
          +              recordPhase(`after-patch-${index}`);
                         expect(ack.ok).toBe(true);
                         expect(ack).not.toHaveProperty("config");
                         const after = await list();
          +              recordPhase(`after-list-${index}`);
                         timings.push({
                           patchMs: patched - start,
                           modelsMs: performance.now() - patched,
          @@ -204,6 +278,9 @@
                       expect(noop).toMatchObject({ ok: true, noop: true, changedPaths: [] });
                       expect(noop).not.toHaveProperty("config");
                     } finally {
          +            recordPhase("finally");
          +            comparison.mockRestore();
          +            build.mockRestore();
                       projection.mockRestore();
                     }
                   }
          DIAGNOSTIC_PATCH
          echo "96bad8eb8ed6494c93a74472f359c484d757fc90b95509907c8e9c27b4f01421  .artifacts/models-freshness-diagnostic/diagnostic.patch" | sha256sum --check
          git apply --check .artifacts/models-freshness-diagnostic/diagnostic.patch
          git apply .artifacts/models-freshness-diagnostic/diagnostic.patch
          test "$(git diff --name-only)" = "src/gateway/server-methods/models-list.freshness.integration.test.ts"
          git diff --check
          git diff --stat
          {
            echo "Source: $actual_sha"
            echo "Workflow: $WORKFLOW_SHA"
            echo "Diagnostic patch SHA256: 96bad8eb8ed6494c93a74472f359c484d757fc90b95509907c8e9c27b4f01421"
          } | tee .artifacts/models-freshness-diagnostic/provenance.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"

      - name: Run original first variant with diagnostics
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          started="$(date +%s)"
          if pnpm test src/gateway/server-methods/models-list.freshness.integration.test.ts --maxWorkers=1 -t 'models\.list reuses inventory until explicit refresh \(sibling: true, getter-backed: false, empty: false\)$' 2>&1 | tee .artifacts/models-freshness-diagnostic/test.log; then
            test_exit=0
          else
            test_exit=$?
          fi
          elapsed=$(( $(date +%s) - started ))
          {
            echo "Test exit: $test_exit"
            echo "Elapsed seconds: $elapsed"
          } | tee .artifacts/models-freshness-diagnostic/result.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$test_exit"

      - name: Preserve full diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-models-freshness-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/models-freshness-diagnostic/
          if-no-files-found: warn
          retention-days: 14
