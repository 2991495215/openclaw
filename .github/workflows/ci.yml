# Temporary focused proof only. Never merge this workflow.
name: Red-main cold model auth proof
run-name: Cold model auth ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Reviewed full candidate commit SHA
        type: string
        required: true
      workflow_sha:
        description: Reviewed full proof workflow commit SHA
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-cold-model-auth-proof-${{ github.ref }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.19.0"
  OPENCLAW_LOCAL_CHECK: "0"
  OPENCLAW_VITEST_RUNTIME: node

jobs:
  cold-model-auth:
    name: Cold model auth (exact candidate)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact candidate
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify candidate and workflow identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          proof_dir="$RUNNER_TEMP/cold-model-auth"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $EXPECTED_SHA"
            echo "Workflow: $WORKFLOW_SHA"
            git show -s --format='%H%n%P%n%s' HEAD
            git ls-tree HEAD -- package.json pnpm-lock.yaml               src/plugin-sdk/model-session-runtime.ts               extensions/codex/src/conversation-control.ts               extensions/codex/src/conversation-control.test.ts               extensions/voice-call/src/response-generator.ts               extensions/voice-call/src/response-generator.test.ts
            echo "Base: $(git rev-parse HEAD^)"
          } | tee "$proof_dir/provenance.log"
          cat "$proof_dir/provenance.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup frozen Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"

      - name: Run exact model auth cases
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.19.0
          proof_dir="$RUNNER_TEMP/cold-model-auth"
          pnpm test extensions/codex/src/conversation-control.test.ts \
            --maxWorkers=1 -t 'direct-session auth' 2>&1 | tee "$proof_dir/codex.log"
          pnpm test extensions/voice-call/src/response-generator.test.ts \
            --maxWorkers=1 -t 'pins the voice session to responseModel' 2>&1 | tee "$proof_dir/voice.log"

      - name: Check public SDK surface
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/cold-model-auth"
          pnpm plugin-sdk:api:diff --base "$(git rev-parse HEAD^)" --head "$(git rev-parse HEAD)" \
            --json "$proof_dir/sdk-api-diff.json" --summary "$proof_dir/sdk-api-diff.md" \
            2>&1 | tee "$proof_dir/sdk-api.log"
          pnpm plugin-sdk:check-exports
          pnpm lint:plugins:plugin-sdk-subpaths-exported
          pnpm lint:extensions:no-src-outside-plugin-sdk

      - name: Compile exact packaged plugin boundaries
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cold-model-auth/hosted-boundary.mjs" <<'EOF'
          // Run from the hosted candidate checkout:
          // node --import ./scripts/tsx.mjs /path/to/hosted-boundary.mjs
          // Selected preparation command, invoked below through its canonical owned entry:
          // node --import ./scripts/tsx.mjs scripts/prepare-extension-package-boundary-artifacts.mts '--extensions=["codex","voice-call"]'
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          import os from "node:os";
          import path from "node:path";
          import { pathToFileURL } from "node:url";
          
          const root = process.cwd();
          const candidate = "4062018e861dd67993e50a2f820fb0585a236770";
          const expectedBlobs = {
            "docs/plugins/sdk-runtime/config-and-utilities.md": "714c74cb1da69383993027dcc424614b113b7dd5",
            "extensions/codex/src/conversation-control.test.ts": "b57700d81fa25fef927d2cf04157ccdd73cab86d",
            "extensions/codex/src/conversation-control.ts": "4aaea39ffbc75598f0c600483563ac1d6f5e59d4",
            "extensions/voice-call/src/response-generator.test.ts": "2cae11ab079eb4b21e153c990e6a8e9e2ec53fe8",
            "extensions/voice-call/src/response-generator.ts": "c7d02b9e467368da33b42953dcf1461918948ebc",
            "src/plugin-sdk/model-session-runtime.ts": "c933d0208f3c1dc60303d2a80f28938912b5d940",
          };
          const load = (relative) => import(pathToFileURL(path.join(root, relative)).href);
          const assertCandidateSources = () => {
            for (const [file, expected] of Object.entries(expectedBlobs)) {
              const actual = execFileSync("git", ["hash-object", "--", file], {
                cwd: root,
                encoding: "utf8",
              }).trim();
              if (actual !== expected) {
                throw new Error(`Candidate source mismatch: ${file}; expected ${expected}; got ${actual}`);
              }
            }
          };
          assertCandidateSources();
          console.log(`Candidate sources verified: ${candidate}`);
          console.log(`Hosted HEAD: ${execFileSync("git", ["rev-parse", "HEAD"], { cwd: root, encoding: "utf8" }).trim()}`);
          
          const { withDistArtifactOwnership, distArtifactEntryArgs } = await load(
            "scripts/lib/dist-artifact-ownership.mts",
          );
          const { runNodeStepAsync, runNodeStepsWithConcurrency, resolveCompileConcurrency } = await load(
            "scripts/check-extension-package-tsc-boundary.mts",
          );
          const { parsePositiveInt } = await load("scripts/lib/numeric-options.mjs");
          const ids = ["codex", "voice-call"];
          await withDistArtifactOwnership(root, async () => {
            const prep = await runNodeStepAsync(
              "codex/voice-call package-boundary preparation",
              distArtifactEntryArgs(path.join(root, "scripts/prepare-extension-package-boundary-artifacts.mts"), [
                `--extensions=${JSON.stringify(ids)}`,
              ]),
              420_000,
            );
            process.stdout.write(prep.stdout);
            process.stderr.write(prep.stderr);
            const sdkDeclaration = readFileSync(
              path.join(root, "packages/plugin-sdk/dist/src/plugin-sdk/model-session-runtime.d.ts"),
              "utf8",
            );
            if (!sdkDeclaration.includes("prepareAuthProfileProvider")) {
              throw new Error("Prepared model-session-runtime declaration lacks prepareAuthProfileProvider");
            }
            console.log("Prepared SDK declaration exposes prepareAuthProfileProvider.");
            const concurrency = Math.min(2, resolveCompileConcurrency());
            const cpuShare = Math.max(1, Math.floor(os.availableParallelism() / concurrency));
            const compilerThreads = process.env.GOMAXPROCS?.trim()
              ? Math.min(cpuShare, parsePositiveInt(process.env.GOMAXPROCS.trim(), "GOMAXPROCS"))
              : cpuShare;
            await runNodeStepsWithConcurrency(ids.map((id) => ({
              label: `${id} package boundary`,
              args: [
                path.join(root, "scripts/compile-extension-boundary.mts"),
                JSON.stringify({
                  configFile: `.artifacts/extension-package-boundary/compile/${id}.tsconfig.json`,
                  inputReceipt: `.artifacts/extension-package-boundary/compile/${id}.cold-model-auth.inputs.json`,
                  emit: false,
                }),
              ],
              timeoutMs: 120_000,
              env: { ...process.env, GOMAXPROCS: String(compilerThreads) },
              onStart() { console.log(`Compiling ${id} against prepared SDK declarations.`); },
              onSuccess(result) {
                process.stdout.write(result.stdout);
                process.stderr.write(result.stderr);
                console.log(`${id} package boundary passed in ${result.elapsedMs}ms.`);
              },
            })), concurrency);
            assertCandidateSources();
          });
          console.log("Selected Codex and voice-call compiled-boundary proof passed; no compile cache stamps published.");
          EOF
          node --import ./scripts/tsx.mjs "$RUNNER_TEMP/cold-model-auth/hosted-boundary.mjs" \
            2>&1 | tee "$RUNNER_TEMP/cold-model-auth/compiled-boundary.log"

      - name: Verify tracked source stayed unchanged
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --

      - name: Preserve focused evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-cold-model-auth-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cold-model-auth/
          if-no-files-found: warn
          retention-days: 14
