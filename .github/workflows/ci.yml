# Temporary diagnostic only. Do not merge this workflow or fixture instrumentation.
name: Red-main Codex physical exit diagnosis
run-name: Codex physical exit predecessor ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        type: string
        required: true
      source_sha:
        type: string
        required: true
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify reviewed diagnostic source and original parent
        env:
          DIAGNOSTIC_SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIAGNOSTIC_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_SOURCE_SHA"
          test "$(git rev-parse HEAD^)" = 9690a6d7fa9cdb0df6aaec32008a04b55e527499
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
      - name: Run persistent predecessor and exact physical-exit failure
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/codex-physical-exit
          pnpm test src/gateway/server.codex-failure-recovery.test.ts --maxWorkers=1 -t '^chat.send (cold resumes an idle persistent sibling|waits for physical exit before recovery)$' 2>&1 | tee .artifacts/codex-physical-exit/test.log
      - name: Verify unchanged diagnostic source
        if: ${{ always() }}
        run: git diff --exit-code
      - name: Preserve diagnostic log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codex-physical-exit-predecessor-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/codex-physical-exit/test.log
          retention-days: 7
