# Prepared fallback only. Publish/dispatch only if ordinary PR CI omits these cases.
# This temporary proof workflow must never be merged.
name: Red-main macOS permission fixture proof
run-name: macOS permission fixtures babd8b91f93443687fb891938d465ff78e56a0c6 ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-macos-permission-fixtures-babd8b91f93443687fb891938d465ff78e56a0c6
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"
jobs:
  macos-permission-fixtures:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: babd8b91f93443687fb891938d465ff78e56a0c6
          fetch-depth: 1
          persist-credentials: false
      - name: Record candidate
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = babd8b91f93443687fb891938d465ff78e56a0c6
          proof_dir="$RUNNER_TEMP/macos-permission-fixtures"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- apps/macos/Tests/OpenClawIPCTests/MacNodeRuntimeTests.swift apps/macos/Tests/OpenClawIPCTests/MacNodeHostWorkerTests.swift apps/macos/Tests/OpenClawIPCTests/MacDesktopAvailabilityCoordinatorTests.swift apps/macos/Sources/OpenClaw/NodeMode/MacNodeRuntime.swift
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Select Xcode
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          select_xcode_toolchain
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: restore
          install-bun: "false"
          install-deps: "false"
      - name: Install native asset dependencies
        env:
          CI: "true"
        run: >-
          pnpm install --frozen-lockfile --prefer-offline --optional
          --filter '@openclaw/mermaid-renderer...'
          --filter '@openclaw/gateway-protocol...'
          --config.ignore-scripts=false
          --config.engine-strict=false
          --config.enable-pre-post-scripts=true
          --config.side-effects-cache=true
      - name: Identify Apple Mermaid inputs
        id: apple-mermaid-inputs
        run: echo "key=$(node scripts/prepare-apple-mermaid.mjs --cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore Apple Mermaid assets
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/shared/mermaid/assets
          key: apple-mermaid-v1-${{ steps.apple-mermaid-inputs.outputs.key }}
      - name: Prepare Apple Mermaid assets
        run: node scripts/prepare-apple-mermaid.mjs
      - name: Detect Swift toolchain cache key
        id: swift-toolchain
        run: |
          set -euo pipefail
          xcode_version="$(xcodebuild -version | tr '\n' ' ' | sed 's/  */ /g; s/ $//')"
          swift_version="$(swift --version | head -n 1)"
          toolchain_key="$(printf '%s\n%s\n' "$xcode_version" "$swift_version" | shasum -a 256 | awk '{print $1}')"
          echo "key=$toolchain_key" >> "$GITHUB_OUTPUT"
      - name: Restore SwiftPM cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('apps/macos/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-
      - name: Restore Swift test build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/macos/.build
          key: ${{ runner.os }}-swift-build-v7-tests-${{ hashFiles('scripts/swift-build-cache-metadata.py') }}-graph-${{ steps.swift-toolchain.outputs.key }}-${{ hashFiles('apps/macos/Package*.swift', 'apps/macos/Package.resolved', 'apps/shared/**/Package*.swift', 'apps/shared/**/Package.resolved', 'apps/swabble/Package*.swift', 'apps/swabble/Package.resolved') }}-${{ hashFiles('apps/macos/Sources/**', 'apps/macos/Tests/**', 'apps/shared/**/Sources/**', 'apps/swabble/Sources/**') }}
          restore-keys: |
            ${{ runner.os }}-swift-build-v7-tests-${{ hashFiles('scripts/swift-build-cache-metadata.py') }}-graph-${{ steps.swift-toolchain.outputs.key }}-${{ hashFiles('apps/macos/Package*.swift', 'apps/macos/Package.resolved', 'apps/shared/**/Package*.swift', 'apps/shared/**/Package.resolved', 'apps/swabble/Package*.swift', 'apps/swabble/Package.resolved') }}-
      - name: Validate Swift build cache and restore timestamps
        run: |
          set -euo pipefail
          sparkle_info="apps/macos/.build/artifacts/sparkle/Sparkle/Sparkle.xcframework/Info.plist"
          if [[ -d apps/macos/.build && ! -f "$sparkle_info" ]]; then
            swift package --package-path apps/macos reset
          else
            python3 -I -S scripts/swift-build-cache-metadata.py restore
          fi
      - name: Build test bundle and run only the three failing cases
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          swift_test_args=(--package-path apps/macos --build-system native --enable-code-coverage --disable-index-store -Xswiftc -gline-tables-only)
          swift build "${swift_test_args[@]}" --build-tests
          test_filter='MacNodeRuntimeTests/`concurrent invokes share one main actor services initialization`|MacNodeHostWorkerTests/`worker cannot bypass native capability consent`|MacNodeHostWorkerTests/`worker cannot bypass the canvas presenter consent gate`'
          run_apple_command_logged "$RUNNER_TEMP/macos-permission-fixtures/cases.log" node scripts/test-macos-native.mts default "${swift_test_args[@]}" --skip-build --filter "$test_filter"
          python3 - <<'PY'
          import os, pathlib, re
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'macos-permission-fixtures'
          log = (proof / 'cases.log').read_text()
          labels = [
              'concurrent invokes share one main actor services initialization',
              'worker cannot bypass native capability consent',
              'worker cannot bypass the canvas presenter consent gate',
          ]
          for label in labels:
              match = re.search(r'✔ Test "' + re.escape(label) + r'"[^\n]* passed[^\n]*', log)
              if match is None:
                  raise SystemExit(f'Missing passing result for {label}')
              print(match.group(0))
          PY
      - name: Upload exact-case proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: macos-permission-fixtures-proof
          path: ${{ runner.temp }}/macos-permission-fixtures
          if-no-files-found: error
