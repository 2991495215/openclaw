# Prepared baseline only: root publishes and dispatches. Candidate proof comes from ordinary PR CI.
# Setup owner: status-usage-focused-workflow.yml. No private QA runtime is needed.
name: Red-main overflow recovery baseline proof
run-name: Overflow recovery baseline 605065ce7461 ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-overflow-recovery-baseline-605065ce7461
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  overflow-recovery-baseline:
    name: Overflow recovery fixture baseline
    env:
      SOURCE_SHA: 605065ce7461177e9b438c8d8917641a8e8380e0
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record pinned source provenance
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          proof_dir="$RUNNER_TEMP/overflow-recovery-baseline-proof"
          mkdir -p "$proof_dir"
          {
            echo "Source: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- src/agents/model-fallback.overflow-recovery.test.ts src/agents/model-fallback.run-embedded.e2e.test-support.ts src/agents/auth-profiles/credential-write-custody.ts src/agents/test-helpers/embedded-agent-runner-e2e-mocks.ts
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "true"
          vitest-worker-cache: "false"
          node-compile-cache: "true"

      - name: Run only the three-case overflow recovery failing file
        id: fallback_file
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          pnpm test src/agents/model-fallback.overflow-recovery.test.ts --maxWorkers=1 --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/overflow-recovery-baseline-proof/overflow-recovery-file.log"

      - name: Record outcome and verify unchanged sources
        if: ${{ always() }}
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.fallback_file.outcome }}
        run: |
          set -euo pipefail
          echo "Overflow-recovery exact file: $TEST_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          git status --short
          git diff --exit-code -- src/agents/model-fallback.overflow-recovery.test.ts src/agents/model-fallback.run-embedded.e2e.test-support.ts src/agents/auth-profiles/credential-write-custody.ts src/agents/test-helpers/embedded-agent-runner-e2e-mocks.ts

      - name: Preserve proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-overflow-recovery-baseline-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/overflow-recovery-baseline-proof/
          if-no-files-found: warn
          retention-days: 14
