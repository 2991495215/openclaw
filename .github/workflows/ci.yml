# Prepared diagnostic only. Runs the one CI-failed case once per immutable source.
name: Red-main hover marquee base-head proof
run-name: Hover marquee base-head ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-hover-marquee-base-head
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"
jobs:
  hover-marquee-base-head:
    name: Original hover marquee case on base and head
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout candidate and direct parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 294f20f5ba67f1aee884fc3d87877e2ed5d4cedd
          fetch-depth: 2
          persist-credentials: false
      - name: Verify source identities and shared dependency lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 294f20f5ba67f1aee884fc3d87877e2ed5d4cedd
          test "$(git rev-parse HEAD^)" = 03fb581d358422f7afd48b2a9dd61d34e38eb141
          git diff --exit-code HEAD^ HEAD -- pnpm-lock.yaml package.json ui/package.json
          mkdir -p "$RUNNER_TEMP/hover-marquee-proof"
          for source_sha in 03fb581d358422f7afd48b2a9dd61d34e38eb141 294f20f5ba67f1aee884fc3d87877e2ed5d4cedd; do
            echo "Source: $source_sha"
            git ls-tree "$source_sha" -- ui/src/lib/hover-marquee.browser.test.ts ui/src/lib/hover-marquee.ts ui/src/lib/hover-marquee-controller.ts ui/src/lib/layout-frame.ts ui/src/test-helpers/load-styles.ts ui/src/styles/components.css ui/vitest.config.ts
          done | tee "$RUNNER_TEMP/hover-marquee-proof/provenance.txt"
          cat "$RUNNER_TEMP/hover-marquee-proof/provenance.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Setup Node and Bun environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "true"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "true"
          vitest-worker-cache: "false"
          node-compile-cache: "true"
      - name: Setup Chromium
        uses: ./.github/actions/setup-playwright-chromium
        with:
          cache-mode: restore
      - name: Run exact original case once on base then head
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: bun
          OPENCLAW_CI_TEST_RUNTIME_POLICY: bun-compatible
          OPENCLAW_VITEST_MAX_WORKERS: "1"
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -euo pipefail
          any_failure=0
          for source_sha in 03fb581d358422f7afd48b2a9dd61d34e38eb141 294f20f5ba67f1aee884fc3d87877e2ed5d4cedd; do
            git -c advice.detachedHead=false checkout --detach "$source_sha"
            test "$(git rev-parse HEAD)" = "$source_sha"
            set +e
            node scripts/run-vitest.mjs run \
              --config ui/vitest.config.ts \
              --configLoader runner \
              --project chromium \
              --maxWorkers 1 \
              --reporter=verbose \
              ui/src/lib/hover-marquee.browser.test.ts \
              -t 'cancels a pending reveal on disconnection and reconnects the same title' \
              2>&1 | tee "$RUNNER_TEMP/hover-marquee-proof/$source_sha.log"
            case_result=${PIPESTATUS[0]}
            set -e
            echo "$source_sha exit=$case_result" | tee -a "$RUNNER_TEMP/hover-marquee-proof/results.txt" "$GITHUB_STEP_SUMMARY"
            if [ "$case_result" -ne 0 ]; then any_failure=1; fi
            git diff --exit-code -- ui/src/lib/hover-marquee.browser.test.ts ui/src/lib/hover-marquee.ts ui/src/lib/hover-marquee-controller.ts ui/src/lib/layout-frame.ts
          done
          exit "$any_failure"
      - name: Preserve diagnostic results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-hover-marquee-base-head-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hover-marquee-proof/
          if-no-files-found: warn
          retention-days: 14
