# PROOF ONLY: original Doctor model-reference failure; never merge this workflow.
name: Red-main Doctor model-reference
run-name: Doctor model-reference ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
      workflow_sha:
        description: Exact proof workflow commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-doctor-model-reference-proof
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.19.0"
jobs:
  doctor-model-reference-proof:
    name: Original Doctor model-reference failure
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pinned candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 80875298d3fbfcd50535b81cbf82c12b5f0b0f13
          fetch-depth: 2
          persist-credentials: false
      - name: Record source provenance
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 80875298d3fbfcd50535b81cbf82c12b5f0b0f13
          test "$(git diff --name-only HEAD^ HEAD)" = src/flows/doctor-core-checks.test.ts
          git diff --exit-code HEAD --
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          mkdir -p "$RUNNER_TEMP/doctor-model-reference-proof"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- package.json pnpm-lock.yaml src/flows/doctor-core-checks.test.ts src/flows/doctor-model-reference-check.ts src/commands/models/model-reference-validation.ts extensions/groq/openclaw.plugin.json test/vitest/vitest.unit-src.config.ts
          } | tee "$RUNNER_TEMP/doctor-model-reference-proof/provenance.txt"
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
          node-compile-cache: "true"
      - name: Check changed fixture
        shell: bash
        run: |
          set -euo pipefail
          node_modules/.bin/oxfmt --check --threads=1 src/flows/doctor-core-checks.test.ts
          node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.core.json src/flows/doctor-core-checks.test.ts
          git diff --check
      - name: Prove original failing case
        shell: bash
        env:
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.19.0
          proof_dir="$RUNNER_TEMP/doctor-model-reference-proof"
          {
            node --version
            node --input-type=module -e 'import os from "node:os"; console.log(JSON.stringify({ logicalCpuCount: os.availableParallelism(), totalMemoryBytes: os.totalmem() }));'
          } | tee "$proof_dir/runtime.txt"
          started="$(date +%s)"
          node scripts/run-vitest.mjs run --config test/vitest/vitest.unit-src.config.ts src/flows/doctor-core-checks.test.ts --maxWorkers=1 --passWithNoTests=false --testNamePattern '^CORE_HEALTH_CHECKS > distinguishes migratable model refs from unknown providers and unconfirmed models$' --reporter=default --reporter=json --outputFile.json="$proof_dir/vitest.json" 2>&1 | tee "$proof_dir/vitest.log"
          echo "Exact failed cases elapsed seconds: $(( $(date +%s) - started ))" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify exactly one passing case
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, pathlib
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'doctor-model-reference-proof'
          data = json.loads((proof / 'vitest.json').read_text())
          results = data['testResults']
          assert len(results) == 1, results
          assert results[0]['name'].endswith('/src/flows/doctor-core-checks.test.ts'), results[0]['name']
          executed = [case for result in results for case in result['assertionResults'] if case['status'] not in ('pending', 'skipped', 'todo', 'disabled')]
          assert len(executed) == 1, executed
          expected = {
              'CORE_HEALTH_CHECKS distinguishes migratable model refs from unknown providers and unconfirmed models',
          }
          assert {case['fullName'] for case in executed} == expected, executed
          assert all(case['status'] == 'passed' for case in executed), executed
          assert data['success'] and data['numPassedTests'] == 1 and data['numFailedTests'] == 0, data
          assert data.get('numRuntimeErrorTestSuites', 0) == 0, data
          receipt = {'executed': 1, 'passed': 1, 'failed': 0, 'selected': sorted(expected), 'duration_ms': sum(case.get('duration', 0) for case in executed), 'unrelated_skipped': data.get('numPendingTests', 0)}
          text = json.dumps(receipt, indent=2)
          (proof / 'case-counts.json').write_text(text + '\n')
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('```json\n' + text + '\n```\n')
          PYTHON
      - name: Verify unchanged sources
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 80875298d3fbfcd50535b81cbf82c12b5f0b0f13
          git status --short
          git diff --exit-code HEAD --
      - name: Preserve proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-doctor-model-reference-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/doctor-model-reference-proof/
          if-no-files-found: warn
          retention-days: 14
