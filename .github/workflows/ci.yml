# Temporary exact-case proof only. Never merge this workflow or the controlled fixture.
name: Red-main config runtime reuse proof
run-name: Config runtime reuse proof ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact temporary proof source commit
        type: string
        required: true
      workflow_sha:
        description: Exact workflow carrier commit
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-config-runtime-reuse-${{ github.ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  BASE_SHA: 22841b21de786b63920af7c4118be5e1058badc0
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
jobs:
  focused:
    name: Exact owner, credential-coherence, and controlled Gateway proof
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENCLAW_LOCAL_CHECK: "0"
      OPENCLAW_VITEST_RUNTIME: node
    steps:
      - name: Checkout exact proof source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify source, credential guard, and controlled fixture provenance
        id: provenance
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git rev-parse "$BASE_SHA":src/gateway/server.config-patch.test.ts)" = 73e9f07ee017a02a952181cf0dac12fd298c5eb3
          test "$(git rev-parse HEAD:src/gateway/server.config-patch.test.ts)" = 9d127872de23a8605294d1ed54f3417065f42483
          for path in src/gateway/server-reload-managed-secrets.ts src/gateway/server-reload-handlers.test.ts; do
            test "$(git rev-parse "$BASE_SHA:$path")" = "$(git rev-parse "HEAD:$path")"
          done
          python3 - <<'PY'
          import os, subprocess
          actual = subprocess.check_output(['git', 'diff', '--name-only', os.environ['BASE_SHA'], 'HEAD'], text=True).splitlines()
          expected = ['src/gateway/config-reload.test.ts', 'src/gateway/config-reload.ts', 'src/gateway/server.config-patch.test.ts']
          assert actual == expected, actual
          PY
          git diff --exit-code HEAD --
          proof_dir="$RUNNER_TEMP/config-runtime-reuse"
          mkdir -p "$proof_dir"
          git diff "$BASE_SHA" HEAD > "$proof_dir/proof-source.patch"
          {
            echo "Product base: $BASE_SHA"
            echo "Proof source: $CANDIDATE_SHA"
            echo "Workflow: $WORKFLOW_SHA"
            git show -s --format='%H%n%P%n%an <%ae>%n%s' HEAD
            git ls-tree HEAD -- package.json pnpm-lock.yaml src/gateway/config-reload.ts src/gateway/config-reload.test.ts src/gateway/server-reload-handlers.test.ts src/gateway/server-reload-managed-secrets.ts src/gateway/server.config-patch.test.ts
            sha256sum src/gateway/server-reload-managed-secrets.ts
            uname -a
            getconf _NPROCESSORS_ONLN
          } | tee "$proof_dir/provenance.log"
      - name: Setup original Node runtime and frozen dependencies
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
      - name: Run exactly one owner case
        id: owner
        if: ${{ always() && steps.provenance.outcome == 'success' && steps.setup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.19.0
          proof_dir="$RUNNER_TEMP/config-runtime-reuse/owner"
          mkdir -p "$proof_dir"
          {
            node --version
            pnpm --version
            echo 'Command: pnpm test src/gateway/config-reload.test.ts --maxWorkers=1 --reporter=verbose --reporter=json --outputFile.json results.json -t "retains resolved runtime config when a managed write follows its watcher$"'
          } | tee "$proof_dir/command.log"
          started="$(date +%s)"
          if pnpm test src/gateway/config-reload.test.ts --maxWorkers=1 \
            --reporter=verbose --reporter=json --outputFile.json "$proof_dir/results.json" \
            -t 'retains resolved runtime config when a managed write follows its watcher$' 2>&1 | tee "$proof_dir/test.log"; then
            test_exit=0
          else
            test_exit=$?
          fi
          {
            echo "Test exit: $test_exit"
            echo "Elapsed seconds: $(( $(date +%s) - started ))"
          } | tee "$proof_dir/result.txt"
          python3 - <<'PY'
          import json, os, pathlib
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'config-runtime-reuse' / 'owner'
          report = json.loads((proof / 'results.json').read_text())
          assert len(report['testResults']) == 1, report['testResults']
          result = report['testResults'][0]
          assert pathlib.Path(result['name']).resolve() == pathlib.Path('src/gateway/config-reload.test.ts').resolve()
          selected = [entry for entry in result['assertionResults'] if entry['status'] in ('passed', 'failed')]
          assert len(selected) == 1, selected
          assert selected[0]['title'] == 'retains resolved runtime config when a managed write follows its watcher', selected[0]
          assert report['numPassedTests'] + report['numFailedTests'] == 1, report
          observation = {'case': 'owner', 'file': 'src/gateway/config-reload.test.ts', 'selected': selected[0]['fullName'], 'status': selected[0]['status'], 'duration_ms': selected[0].get('duration'), 'selected_count': 1}
          (proof / 'selection.json').write_text(json.dumps(observation, indent=2) + '\n')
          print(json.dumps(observation, indent=2))
          assert selected[0]['status'] == 'passed', selected[0]
          PY
          exit "$test_exit"
      - name: Run exactly one security case
        id: security
        if: ${{ always() && steps.provenance.outcome == 'success' && steps.setup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.19.0
          proof_dir="$RUNNER_TEMP/config-runtime-reuse/security"
          mkdir -p "$proof_dir"
          {
            node --version
            pnpm --version
            echo 'Command: pnpm test src/gateway/server-reload-handlers.test.ts --maxWorkers=1 --reporter=verbose --reporter=json --outputFile.json results.json -t "refreshes owner refs when only the resolved source snapshot changes$"'
          } | tee "$proof_dir/command.log"
          started="$(date +%s)"
          if pnpm test src/gateway/server-reload-handlers.test.ts --maxWorkers=1 \
            --reporter=verbose --reporter=json --outputFile.json "$proof_dir/results.json" \
            -t 'refreshes owner refs when only the resolved source snapshot changes$' 2>&1 | tee "$proof_dir/test.log"; then
            test_exit=0
          else
            test_exit=$?
          fi
          {
            echo "Test exit: $test_exit"
            echo "Elapsed seconds: $(( $(date +%s) - started ))"
          } | tee "$proof_dir/result.txt"
          python3 - <<'PY'
          import json, os, pathlib
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'config-runtime-reuse' / 'security'
          report = json.loads((proof / 'results.json').read_text())
          assert len(report['testResults']) == 1, report['testResults']
          result = report['testResults'][0]
          assert pathlib.Path(result['name']).resolve() == pathlib.Path('src/gateway/server-reload-handlers.test.ts').resolve()
          selected = [entry for entry in result['assertionResults'] if entry['status'] in ('passed', 'failed')]
          assert len(selected) == 1, selected
          assert selected[0]['title'] == 'refreshes owner refs when only the resolved source snapshot changes', selected[0]
          assert report['numPassedTests'] + report['numFailedTests'] == 1, report
          observation = {'case': 'security', 'file': 'src/gateway/server-reload-handlers.test.ts', 'selected': selected[0]['fullName'], 'status': selected[0]['status'], 'duration_ms': selected[0].get('duration'), 'selected_count': 1}
          (proof / 'selection.json').write_text(json.dumps(observation, indent=2) + '\n')
          print(json.dumps(observation, indent=2))
          assert selected[0]['status'] == 'passed', selected[0]
          PY
          exit "$test_exit"
      - name: Run exactly one gateway case
        id: gateway
        if: ${{ always() && steps.provenance.outcome == 'success' && steps.setup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.19.0
          proof_dir="$RUNNER_TEMP/config-runtime-reuse/gateway"
          mkdir -p "$proof_dir"
          {
            node --version
            pnpm --version
            echo 'Command: pnpm test src/gateway/server.config-patch.test.ts --maxWorkers=1 --reporter=verbose --reporter=json --outputFile.json results.json -t "reloads owners independently and reports a changed unresolved owner as cold$"'
          } | tee "$proof_dir/command.log"
          started="$(date +%s)"
          if pnpm test src/gateway/server.config-patch.test.ts --maxWorkers=1 \
            --reporter=verbose --reporter=json --outputFile.json "$proof_dir/results.json" \
            -t 'reloads owners independently and reports a changed unresolved owner as cold$' 2>&1 | tee "$proof_dir/test.log"; then
            test_exit=0
          else
            test_exit=$?
          fi
          {
            echo "Test exit: $test_exit"
            echo "Elapsed seconds: $(( $(date +%s) - started ))"
          } | tee "$proof_dir/result.txt"
          python3 - <<'PY'
          import json, os, pathlib
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'config-runtime-reuse' / 'gateway'
          report = json.loads((proof / 'results.json').read_text())
          assert len(report['testResults']) == 1, report['testResults']
          result = report['testResults'][0]
          assert pathlib.Path(result['name']).resolve() == pathlib.Path('src/gateway/server.config-patch.test.ts').resolve()
          selected = [entry for entry in result['assertionResults'] if entry['status'] in ('passed', 'failed')]
          assert len(selected) == 1, selected
          assert selected[0]['title'] == 'reloads owners independently and reports a changed unresolved owner as cold', selected[0]
          assert report['numPassedTests'] + report['numFailedTests'] == 1, report
          observation = {'case': 'gateway', 'file': 'src/gateway/server.config-patch.test.ts', 'selected': selected[0]['fullName'], 'status': selected[0]['status'], 'duration_ms': selected[0].get('duration'), 'selected_count': 1}
          (proof / 'selection.json').write_text(json.dumps(observation, indent=2) + '\n')
          print(json.dumps(observation, indent=2))
          assert selected[0]['status'] == 'passed', selected[0]
          PY
          exit "$test_exit"
      - name: Qualify controlled Gateway ordering and unchanged source
        if: ${{ always() && steps.gateway.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'config-runtime-reuse'
          log = re.sub(r'\x1b\[[0-9;]*m', '', (proof / 'gateway' / 'test.log').read_text())
          events = [json.loads(raw) for raw in re.findall(r'\[config-fixture-phase\] (\{[^\n]*\})', log)]
          phases = [event['phase'] for event in events]
          markers = ['fixture:armed', 'fixture:writer-held', 'fixture:watcher-returned', 'fixture:writer-released', 'fixture:qualified']
          assert len(events) == 5, events
          assert all(set(event) == {'phase', 'atMs'} and type(event['atMs']) is int for event in events), events
          assert all(phases.count(marker) == 1 for marker in markers), phases
          arm, held, watched, released, qualified = [phases.index(marker) for marker in markers]
          assert arm < held < released < qualified and arm < watched < released, phases
          selections = [json.loads((proof / key / 'selection.json').read_text()) for key in ('owner', 'security', 'gateway')]
          observation = {'candidate': os.environ['CANDIDATE_SHA'], 'base': os.environ['BASE_SHA'], 'qualification': 'controlled_order_qualified', 'events': events, 'selections': selections, 'deadline_ms': 20000, 'guard_unchanged': True, 'original_natural_failure_attributed': False}
          text = json.dumps(observation, indent=2)
          (proof / 'observations.json').write_text(text + '\n')
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('```json\n' + text + '\n```\n')
          assert all(item['selected_count'] == 1 and item['status'] == 'passed' for item in selections)
          PY
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git diff --exit-code HEAD --
          test "$(git rev-parse "$BASE_SHA":src/gateway/server-reload-managed-secrets.ts)" = "$(git hash-object src/gateway/server-reload-managed-secrets.ts)"
      - name: Preserve exact-case evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-config-runtime-reuse-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/config-runtime-reuse/
          if-no-files-found: warn
          retention-days: 14
