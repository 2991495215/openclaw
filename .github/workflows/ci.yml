name: Red-main sidebar people diagnostic
run-name: Sidebar people diagnostic ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        type: string
        required: true
permissions:
  contents: read
jobs:
  people:
    # Match the cancelled checks-ui (3/3) runner class; only one file and worker.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 47235b57c78c0bc36b8fe37d9af286a1abf9bc36
          persist-credentials: false
      - name: Verify diagnostic source
        run: test "$(git rev-parse HEAD)" = 47235b57c78c0bc36b8fe37d9af286a1abf9bc36
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
      - name: Record one exact file with unchanged assertions and timeouts
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: pnpm test ui/src/components/app-sidebar.people.test.ts --maxWorkers=1 --reporter=verbose
      - name: Verify unchanged source
        if: ${{ always() }}
        run: git diff --exit-code
