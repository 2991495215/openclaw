# Temporary diagnostic workflow; never merge this workflow into main.
name: Red-main SSH pairing proof
run-name: SSH pairing proof ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Reviewed full candidate commit SHA
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-ssh-pairing-${{ github.ref }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"
jobs:
  ssh-pairing-file:
    name: Exact SSH pairing regression file
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p "$RUNNER_TEMP/ssh-pairing-proof"
          {
            echo "Candidate: $EXPECTED_SHA"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- src/gateway/server.node-pairing-ssh-verify.test.ts src/gateway/server/ws-connection/connect-device-pairing.ts
          } | tee "$RUNNER_TEMP/ssh-pairing-proof/provenance.txt"
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "true"
          vitest-worker-cache: "true"
          node-compile-cache: "true"
      - name: Run exact previously failing SSH pairing file
        id: ssh_pairing
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          pnpm test src/gateway/server.node-pairing-ssh-verify.test.ts --maxWorkers=1 --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/ssh-pairing-proof/ssh-pairing.log"
      - name: Record outcome and unchanged source
        if: ${{ always() }}
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.ssh_pairing.outcome }}
        run: |
          set -euo pipefail
          echo "Exact SSH pairing file: $TEST_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          git diff --exit-code -- src/gateway/server.node-pairing-ssh-verify.test.ts src/gateway/server/ws-connection/connect-device-pairing.ts
      - name: Preserve proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-ssh-pairing-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ssh-pairing-proof/
          if-no-files-found: warn
          retention-days: 14
