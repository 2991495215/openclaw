# Temporary focused proof only. Do not merge this workflow.
name: Red-main SQLite scope fixture proof
run-name: SQLite scope entry ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        type: string
        required: true
      source_sha:
        type: string
        required: true
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify reviewed fixture source and scheduled-main parent
        env:
          DIAGNOSTIC_SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIAGNOSTIC_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_SOURCE_SHA"
          test "$(git rev-parse HEAD^)" = 6cdd20ae2d0a4a3a8aef500031e55f4ee8d53095
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
      - name: Run exact slow-writer failure
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/sqlite-scope-entry
          pnpm test src/config/sessions/session-accessor.sqlite-scope.test.ts --maxWorkers=1 -t '^slow writer failure separates waiting and execution$' 2>&1 | tee .artifacts/sqlite-scope-entry/test.log
      - name: Verify unchanged fixture source
        if: ${{ always() }}
        run: git diff --exit-code
      - name: Preserve diagnostic log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sqlite-scope-entry-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/sqlite-scope-entry/test.log
          retention-days: 7
