name: Red-main exact Knip proof
run-name: Knip 6f0dbf7ed8c7 ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-knip-proof-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  check-dependencies:
    name: check-dependencies (exact candidate)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 6f0dbf7ed8c76183d097bf44c1fca74fac833c02
          fetch-depth: 1
          persist-credentials: false

      - name: Verify candidate identity
        shell: bash
        env:
          EXPECTED_SHA: 6f0dbf7ed8c76183d097bf44c1fca74fac833c02
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          echo "Candidate: $actual_sha"
          echo "Candidate: $actual_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"

      - name: Run canonical dependency scans
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
        run: |
          set -euo pipefail
          # Canonical ci.yml uses serial scans on hosted runners with fewer than eight CPUs.
          dc_scripts=(deadcode:dependencies deadcode:unused-files deadcode:exports)
          dc_failures=0
          for dc in "${dc_scripts[@]}"; do
            if ! pnpm "$dc"; then
              echo "::error title=${dc} failed::${dc} failed"
              dc_failures=1
            fi
          done
          if [ "$dc_failures" -ne 0 ]; then
            exit 1
          fi
