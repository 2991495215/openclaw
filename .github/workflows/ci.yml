# Temporary exact-candidate proof only. Never merge this workflow.
name: Red-main owner export proof
run-name: Owner export proof on integrated source ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-owner-export-proof-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  check-dependencies:
    name: Knip exports (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: history
            source: 81ad58300b90cb4d69dc18ce1fd0854cf9d50aac
            candidate: d32de902cb1f426fb30e4bde1b2d670ea56e99fc
          - lane: ingress
            source: 49bf17ede721235802f27a2ee6e54780ee1a384e
            candidate: 9dff1404c52e25aa5d66a465abf931150f376b9c
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.source }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record candidate source and workflow provenance
        shell: bash
        env:
          EXPECTED_SHA: ${{ matrix.source }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --
          mkdir -p .artifacts/ownership-static
          {
            echo "Integrated source: $actual_sha"
            echo "PR candidate: ${{ matrix.candidate }}"
            echo "Main base: c8a1db6f389b8bdf1eae4b595027a96490c5fba4"
            echo "Workflow: $WORKFLOW_SHA"
            git show -s --format='%H%n%P%n%an <%ae>%n%s' HEAD
            git ls-tree HEAD -- \
              package.json pnpm-lock.yaml \
              scripts/check-deadcode-exports.mts scripts/deadcode-knip-runner.mts \
              config/knip.config.ts config/knip.all-exports.config.ts \
              config/knip.scripts-exports.config.ts \
              scripts/check-deadcode-unused-files.mts \
              src/plugins/installed-plugin-index-row.ts \
              src/plugins/plugin-metadata-state.kernel.ts \
              test/scripts/state-read-worker-dependency.test-support.mts \
              test/scripts/state-read-worker-build.test.ts \
              scripts/bundle-a2ui.mts extensions/canvas/package.json
          } | tee .artifacts/ownership-static/provenance.log
          cat .artifacts/ownership-static/provenance.log >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"

      - name: Run required export scan once
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
        run: |
          set -euo pipefail
          mkdir -p .artifacts/ownership-static
          printf 'command\texit_code\n' > .artifacts/ownership-static/results.tsv
          dc_scripts=(deadcode:exports)
          dc_failures=0
          for dc in "${dc_scripts[@]}"; do
            dc_log=".artifacts/ownership-static/${dc//:/-}.log"
            dc_rc=0
            pnpm "$dc" > "$dc_log" 2>&1 || dc_rc=$?
            cat "$dc_log"
            printf '%s\t%s\n' "$dc" "$dc_rc" >> .artifacts/ownership-static/results.tsv
            if [ "$dc_rc" -ne 0 ]; then
              echo "::error title=${dc} failed::${dc} exited ${dc_rc}"
              dc_failures=1
            fi
          done
          cat .artifacts/ownership-static/results.tsv >> "$GITHUB_STEP_SUMMARY"
          exit "$dc_failures"

      - name: Verify candidate source remained unchanged
        if: ${{ always() }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ matrix.source }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --
          echo "Tracked candidate source remained unchanged." | tee .artifacts/ownership-static/source-unchanged.log

      - name: Preserve all command outcomes and provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-owner-exports-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/ownership-static/
          if-no-files-found: warn
          retention-days: 14
