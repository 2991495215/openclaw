# PROOF ONLY: original failing Crabbox cases; never merge this workflow.
name: Red-main Crabbox fixture homes
run-name: Crabbox fixture homes 7807f2e7f5c9 ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
      workflow_sha:
        description: Exact proof workflow commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-crabbox-fixture-homes-proof
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"
jobs:
  crabbox-fixture-homes-proof:
    name: Original 51 Crabbox fixture failures
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout pinned candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7807f2e7f5c90de406662100b59a2658d7effac0
          fetch-depth: 1
          persist-credentials: false
      - name: Record candidate sources
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7807f2e7f5c90de406662100b59a2658d7effac0
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          mkdir -p "$RUNNER_TEMP/crabbox-fixture-homes-proof"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- test/scripts/crabbox-wrapper.test.ts test/scripts/direct-run-entrypoints.test.ts extensions/crabbox/src/crabbox-process.ts extensions/crabbox/src/crabbox-managed-binary.ts
          } | tee "$RUNNER_TEMP/crabbox-fixture-homes-proof/provenance.txt"
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
          node-compile-cache: "true"
      - name: Check changed fixture files
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec oxfmt --check --threads=1 test/scripts/crabbox-wrapper.test.ts test/scripts/direct-run-entrypoints.test.ts
          node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.core.json test/scripts/crabbox-wrapper.test.ts test/scripts/direct-run-entrypoints.test.ts
          git diff --check
      - name: Prove original direct-run failure
        if: ${{ !cancelled() }}
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          pnpm test test/scripts/direct-run-entrypoints.test.ts --maxWorkers=1 -t 'runs the checked-out Crabbox wrapper through its managed child$' --reporter=verbose --reporter=json --outputFile.json "$RUNNER_TEMP/crabbox-fixture-homes-proof/direct-run-results.json" 2>&1 | tee "$RUNNER_TEMP/crabbox-fixture-homes-proof/direct-run.log"
      - name: Prove original 50 wrapper failures
        if: ${{ !cancelled() }}
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
          WRAPPER_PATTERN: '(?:handles\ source\ capsule\ mkdir\ without\ publishing\ partial\ source|handles\ source\ capsule\ symlink\ without\ publishing\ partial\ source|handles\ source\ capsule\ symlink\ blob\ without\ publishing\ partial\ source|handles\ source\ capsule\ tagged\ write\ without\ publishing\ partial\ source|handles\ source\ capsule\ readonly\ write\ without\ publishing\ partial\ source|handles\ source\ capsule\ chmod\ without\ publishing\ partial\ source|handles\ source\ capsule\ read\ after\ prefix\ without\ publishing\ partial\ source|handles\ source\ capsule\ unknown\ read\ without\ publishing\ partial\ source|handles\ source\ capsule\ growth\ lookalike\ without\ publishing\ partial\ source|handles\ source\ capsule\ helper\ lookalike\ without\ publishing\ partial\ source|handles\ source\ capsule\ growth\ without\ publishing\ partial\ source|handles\ source\ capsule\ zero\ write\ without\ publishing\ partial\ source|handles\ source\ capsule\ early\ EOF\ without\ publishing\ partial\ source|handles\ source\ capsule\ directory\ open\ without\ publishing\ partial\ source|handles\ source\ capsule\ short\ writes\ without\ publishing\ partial\ source|transports\ verified\ source\ and\ dependencies\ \(provider=aws,\ shallow=true,\ scenario=transport\)|transports\ verified\ source\ and\ dependencies\ \(provider=aws,\ shallow=false,\ scenario=transport\)|transports\ verified\ source\ and\ dependencies\ \(provider=aws,\ shallow=false,\ scenario=arbitrary\)|transports\ verified\ source\ and\ dependencies\ \(provider=blacksmith\-testbox,\ shallow=true,\ scenario=transport\)|transports\ verified\ source\ and\ dependencies\ \(provider=blacksmith\-testbox,\ shallow=false,\ scenario=transport\)|transports\ verified\ source\ and\ dependencies\ \(provider=blacksmith\-testbox,\ shallow=false,\ scenario=captured\-base\)|transports\ verified\ source\ and\ dependencies\ \(provider=blacksmith\-testbox,\ shallow=false,\ scenario=graph\)|transports\ verified\ source\ and\ dependencies\ \(provider=blacksmith\-testbox,\ shallow=false,\ scenario=frozen\)|transports\ verified\ source\ and\ dependencies\ \(provider=blacksmith\-testbox,\ shallow=false,\ scenario=lifecycle\)|transports\ verified\ source\ and\ dependencies\ \(provider=blacksmith\-testbox,\ shallow=false,\ scenario=lifecycle\-staged\-extra\)|transports\ verified\ source\ and\ dependencies\ \(provider=blacksmith\-testbox,\ shallow=false,\ scenario=lifecycle\-base\-ref\)|settles\ wrapper\ cancellation\ and\ cleanup:\ \{"kind":"signal","entrypoint":"node","repeated":true\}|settles\ wrapper\ cancellation\ and\ cleanup:\ \{"kind":"signal","entrypoint":"pnpm","repeated":true\}|settles\ wrapper\ cancellation\ and\ cleanup:\ \{"kind":"signal","entrypoint":"pnpm","repeated":false,"cooperative":true,"provider":"blacksmith\-testbox"\}|settles\ wrapper\ cancellation\ and\ cleanup:\ \{"kind":"signal","entrypoint":"pnpm","repeated":false,"cooperative":true,"provider":"aws"\}|settles\ wrapper\ cancellation\ and\ cleanup:\ \{"kind":"preparation"\}|settles\ wrapper\ cancellation\ and\ cleanup:\ \{"kind":"preparation","cleanupFails":true\}|settles\ wrapper\ cancellation\ and\ cleanup:\ \{"kind":"stdin","target":"macos"\}|settles\ wrapper\ cancellation\ and\ cleanup:\ \{"kind":"stdin","target":"capsule"\}|settles\ wrapper\ cancellation\ and\ cleanup:\ \{"kind":"escaped"\}|settles\ wrapper\ cancellation\ and\ cleanup:\ \{"kind":"removal","target":"script","exitCode":0\}|settles\ wrapper\ cancellation\ and\ cleanup:\ \{"kind":"removal","target":"source","exitCode":23\}|retains\ native\ artifacts\ through\ the\ wrapper\ \(capsule,\ both,\ exit=23,\ fault=undefined\)|retains\ native\ artifacts\ through\ the\ wrapper\ \(sparse,\ both,\ exit=23,\ fault=undefined\)|retains\ native\ artifacts\ through\ the\ wrapper\ \(capsule,\ runs,\ exit=0,\ fault=undefined\)|retains\ native\ artifacts\ through\ the\ wrapper\ \(capsule,\ none,\ exit=0,\ fault=undefined\)|retains\ native\ artifacts\ through\ the\ wrapper\ \(direct,\ captures,\ exit=23,\ fault=undefined\)|retains\ native\ artifacts\ through\ the\ wrapper\ \(capsule,\ both,\ exit=0,\ fault=destination\ file\)|retains\ native\ artifacts\ through\ the\ wrapper\ \(capsule,\ both,\ exit=23,\ fault=claim\ restoration\)|retains\ native\ artifacts\ through\ the\ wrapper\ \(capsule,\ both,\ exit=0,\ fault=source\ root\ link\)|retains\ native\ artifacts\ through\ the\ wrapper\ \(capsule,\ both,\ exit=0,\ fault=source\ captures\ link\)|retains\ native\ artifacts\ through\ the\ wrapper\ \(capsule,\ both,\ exit=0,\ fault=nested\ file\ link\)|retains\ native\ artifacts\ through\ the\ wrapper\ \(capsule,\ both,\ exit=0,\ fault=destination\ root\ link\)|retains\ native\ artifacts\ through\ the\ wrapper\ \(capsule,\ both,\ exit=0,\ fault=destination\ parent\ dangling\ link\)|retains\ native\ artifacts\ through\ the\ wrapper\ \(capsule,\ both,\ exit=0,\ fault=nested\ fifo\))$'
        run: |
          set -euo pipefail
          pnpm test test/scripts/crabbox-wrapper.test.ts --maxWorkers=1 -t "$WRAPPER_PATTERN" --reporter=verbose --reporter=json --outputFile.json "$RUNNER_TEMP/crabbox-fixture-homes-proof/wrapper-results.json" 2>&1 | tee "$RUNNER_TEMP/crabbox-fixture-homes-proof/wrapper.log"
      - name: Verify exact executed and passed case counts
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, pathlib
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'crabbox-fixture-homes-proof'
          receipts = []
          for name, source, expected in (
              ('direct-run', 'test/scripts/direct-run-entrypoints.test.ts', 1),
              ('wrapper', 'test/scripts/crabbox-wrapper.test.ts', 50),
          ):
              report = json.loads((proof / (name + '-results.json')).read_text())
              assert len(report['testResults']) == 1, f'{name}: expected exactly one selected file'
              result = report['testResults'][0]
              assert pathlib.Path(result['name']).resolve() == pathlib.Path(source).resolve()
              selected = [entry for entry in result['assertionResults'] if entry['status'] in ('passed', 'failed')]
              assert len(selected) == expected, f'{name}: expected {expected} executed cases, got {len(selected)}'
              assert len({entry['fullName'] for entry in selected}) == expected
              assert all(entry['status'] == 'passed' for entry in selected)
              assert report['numPassedTests'] == expected and report['numFailedTests'] == 0
              receipts.append({'file': source, 'executed': len(selected), 'passed': expected, 'failed': 0,
                               'selected': [entry['fullName'] for entry in selected]})
          text = json.dumps(receipts, indent=2)
          (proof / 'case-counts.json').write_text(text + '\n')
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('```json\n' + text + '\n```\n')
          PYTHON
      - name: Verify unchanged sources
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --exit-code
      - name: Preserve proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-crabbox-fixture-homes-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crabbox-fixture-homes-proof/
          if-no-files-found: warn
          retention-days: 14
