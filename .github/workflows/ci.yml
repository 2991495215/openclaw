name: Red-main cloud worker documentation proof
run-name: Cloud worker documentation ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full reviewed documentation test repair commit SHA
        type: string
        required: true
      workflow_sha:
        description: Expected proof carrier commit SHA
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-cloud-workers-docs
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.19.0"

jobs:
  cloud-workers-docs:
    name: Exact cloud worker documentation candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      OPENCLAW_TEST_SKIP_FULL_EXTENSIONS_SHARD: "1"
      OPENCLAW_TEST_PROJECTS_PARALLEL: "1"
      OPENCLAW_VITEST_MAX_WORKERS: "1"
      OPENCLAW_VITEST_RUNTIME: node
      OPENCLAW_CI_TEST_RUNTIME_POLICY: node
    steps:
      - name: Checkout reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify and record source provenance
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          git diff --exit-code HEAD --
          test "$(git diff --name-only HEAD^ HEAD)" = src/docs/cloud-workers-config.test.ts
          proof_dir="$RUNNER_TEMP/cloud-workers-docs"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Baseline: $(git rev-parse HEAD^)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- src/docs/cloud-workers-config.test.ts docs/gateway/cloud-workers.md docs/gateway/config-cloud-workers.md src/config/zod-schema.ts pnpm-lock.yaml
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pinned pnpm
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: "off"

      - name: Install frozen dependencies
        env:
          CI: "true"
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prefer-offline --config.ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true --config.side-effects-cache=true

      - name: Lint the changed test with frozen dependencies
        run: pnpm exec oxlint --threads=1 src/docs/cloud-workers-config.test.ts

      - name: Run complete reviewed documentation test file
        id: candidate
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/cloud-workers-docs"
          git diff --exit-code HEAD --
          node --version | tee "$proof_dir/node-version.txt"
          test "$(node --version)" = v24.19.0
          node --import ./scripts/tsx.mjs scripts/test-projects.mts src/docs/cloud-workers-config.test.ts --maxWorkers=1 --reporter=verbose --reporter=json --outputFile.json "$proof_dir/candidate.json" 2>&1 | tee "$proof_dir/candidate.log"
          node --input-type=module <<'PROOF'
          import fs from "node:fs";
          import path from "node:path";
          const report = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, "cloud-workers-docs", "candidate.json"), "utf8"));
          const suites = report.testResults;
          const cases = suites.flatMap((suite) => suite.assertionResults);
          if (report.success !== true || suites.length !== 1 || !suites[0].name.endsWith("/src/docs/cloud-workers-config.test.ts") || cases.length !== 1 || cases[0].status !== "passed" || cases[0].title !== "keeps canonical config examples schema-valid") {
            throw new Error("Expected the complete cloud worker documentation file with exactly one passing case and no skipped cases");
          }
          console.log(`Verified complete documentation file: ${suites[0].name}; ${cases[0].fullName}`);
          PROOF

      - name: Record results and unchanged candidate
        if: ${{ always() }}
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/cloud-workers-docs"
          mkdir -p "$proof_dir"
          echo "Candidate pass: $CANDIDATE_OUTCOME" | tee "$proof_dir/outcome.txt"
          cat "$proof_dir/outcome.txt" >> "$GITHUB_STEP_SUMMARY"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --
          test "$CANDIDATE_OUTCOME" = success

      - name: Preserve focused documentation proof
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-cloud-workers-docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cloud-workers-docs/
          if-no-files-found: warn
          retention-days: 14
