# Temporary exact-candidate proof only. Never merge this workflow.
# Replays only the failing method from scheduled run 38470966677, job 115550036440.
name: Red-main Android branch completion proof
run-name: Android branch completion 1471d9a4d32e ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Unique proof dispatch identifier
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: redmain-android-branch-completion-1471d9a4d32e30e6393c91d823f8314d0eabd9f1
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"
jobs:
  android-branch-completion:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1471d9a4d32e30e6393c91d823f8314d0eabd9f1
          fetch-depth: 1
          persist-credentials: false
      - name: Record candidate and workflow provenance
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1471d9a4d32e30e6393c91d823f8314d0eabd9f1
          proof_dir="$RUNNER_TEMP/android-branch-completion"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- apps/android/app/src/test/java/ai/openclaw/app/ui/chat/ChatComposerLayoutTest.kt apps/android/app/src/main/java/ai/openclaw/app/chat/ChatController.kt apps/android/app/src/main/java/ai/openclaw/app/ui/chat/ChatScreen.kt
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Setup Android toolchain
        id: android-toolchain
        uses: ./.github/actions/setup-android-toolchain
        with:
          cache-mode: restore
      - name: Setup Node environment for native resources
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: restore
          install-bun: "false"
          install-deps: "false"
      - name: Install native asset dependencies
        env:
          CI: "true"
        run: >-
          pnpm install --frozen-lockfile --prefer-offline --optional
          --filter '@openclaw/mermaid-renderer...'
          --filter '@openclaw/gateway-protocol...'
          --config.ignore-scripts=false
          --config.engine-strict=false
          --config.enable-pre-post-scripts=true
          --config.side-effects-cache=true
      - name: Restore Robolectric Maven cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/tmp/openclaw-robolectric-m2
          key: ${{ github.repository }}-robolectric-m2-v1-${{ runner.os }}-${{ runner.arch }}-test-third-party-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/**/gradle-wrapper.properties', 'apps/android/gradle/libs.versions.toml', 'apps/android/**/src/test*/**') }}
          restore-keys: |
            ${{ github.repository }}-robolectric-m2-v1-${{ runner.os }}-${{ runner.arch }}-test-third-party-
      - name: Configure Robolectric Maven cache and JVM evidence
        run: |
          set -euo pipefail
          maven_repo=/var/tmp/openclaw-robolectric-m2
          init_script="$RUNNER_TEMP/openclaw-robolectric-init.gradle"
          mkdir -p "$maven_repo"
          cat >"$init_script" <<'GROOVY'
          println "Gradle JVM: runtime=${System.getProperty('java.runtime.version')} vendor=${System.getProperty('java.vendor')} home=${System.getProperty('java.home')}"
          allprojects {
            tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
              systemProperty "maven.repo.local", System.getenv("OPENCLAW_ROBOLECTRIC_M2")
              doFirst {
                def metadata = javaLauncher.get().metadata
                logger.lifecycle("Test JVM ${path}: runtime=${metadata.javaRuntimeVersion} vendor=${metadata.vendor} home=${metadata.installationPath.asFile} forks=${maxParallelForks}")
              }
            }
          }
          GROOVY
          echo "OPENCLAW_ROBOLECTRIC_M2=$maven_repo" >> "$GITHUB_ENV"
          echo "OPENCLAW_ROBOLECTRIC_INIT=$init_script" >> "$GITHUB_ENV"
      - name: Run only the originally failing Compose test method
        working-directory: apps/android
        env:
          JAVA_HOME: ${{ steps.android-toolchain.outputs.gradle-java-home }}
        run: |
          set -euo pipefail
          test_case=ai.openclaw.app.ui.chat.ChatComposerLayoutTest.branchSelectionRechecksAuthoritativeEligibilityBeforeQueuedDispatch
          ./gradlew --no-daemon --build-cache --init-script "$OPENCLAW_ROBOLECTRIC_INIT" \
            :app:testThirdPartyDebugUnitTest --tests "$test_case" --rerun \
            2>&1 | tee "$RUNNER_TEMP/android-branch-completion/gradle.log"
      - name: Verify the selected test executed and passed
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          path = pathlib.Path('apps/android/app/build/test-results/testThirdPartyDebugUnitTest/TEST-ai.openclaw.app.ui.chat.ChatComposerLayoutTest.xml')
          suite = ET.parse(path).getroot()
          cases = suite.findall('testcase')
          assert len(cases) == 1, f'Expected exactly one test, got {len(cases)}'
          case = cases[0]
          assert case.attrib['classname'] == 'ai.openclaw.app.ui.chat.ChatComposerLayoutTest'
          assert case.attrib['name'] == 'branchSelectionRechecksAuthoritativeEligibilityBeforeQueuedDispatch'
          assert not any(case.find(tag) is not None for tag in ('failure', 'error', 'skipped')), 'Selected test did not pass'
          for key in ('failures', 'errors', 'skipped'):
              assert int(suite.get(key, '0')) == 0, f'Unexpected {key}'
          result = {'test': case.attrib['name'], 'tests': 1, 'seconds': float(case.attrib['time']), 'passed': True}
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'android-branch-completion'
          (proof / 'result.json').write_text(json.dumps(result, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"\nPassed exactly one selected test in {result['seconds']} seconds.\n")
          print(json.dumps(result))
          PY
      - name: Upload focused proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: android-branch-completion-proof
          path: |
            ${{ runner.temp }}/android-branch-completion
            apps/android/app/build/test-results/testThirdPartyDebugUnitTest
            apps/android/app/build/reports/tests/testThirdPartyDebugUnitTest
          if-no-files-found: error
