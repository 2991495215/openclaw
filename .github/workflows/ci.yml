# Temporary exact-case proof only. Never merge this workflow.
name: Red-main desktop observation fixture proof
run-name: Desktop observation fixture proof ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        type: string
        required: true
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENCLAW_LOCAL_CHECK: "0"
      OPENCLAW_VITEST_RUNTIME: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ddfde09231dbef06b7fcf2b4ceedfa1a1e5e9bf0
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source and source-only scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ddfde09231dbef06b7fcf2b4ceedfa1a1e5e9bf0
          test "$(git diff --name-only HEAD^ HEAD)" = ui/src/components/desktop/desktop-panel-abandonment.test.ts
          git show --format=fuller --stat HEAD
          git diff HEAD^ HEAD -- ui/src/components/desktop/desktop-panel-abandonment.test.ts
          git diff --check HEAD^ HEAD
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
      - name: Format and lint changed fixture
        run: |
          pnpm exec oxfmt --check ui/src/components/desktop/desktop-panel-abandonment.test.ts
          node scripts/run-oxlint.mjs ui/src/components/desktop/desktop-panel-abandonment.test.ts
      - name: Run only the two failed observation cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/desktop-abandonment-proof"
          started="$(date +%s)"
          node scripts/run-vitest.mjs run --config ui/vitest.config.ts --configLoader runner \
            ui/src/components/desktop/desktop-panel-abandonment.test.ts --maxWorkers=1 \
            --reporter=verbose --reporter=json --outputFile.json "$RUNNER_TEMP/desktop-abandonment-proof/results.json" \
            -t 'abandons only unauthenticated observations when hidden at the (credentials|returned) stage$' \
            2>&1 | tee "$RUNNER_TEMP/desktop-abandonment-proof/test.log"
          echo "Command seconds: $(( $(date +%s) - started ))"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'desktop-abandonment-proof/results.json'
          r=json.loads(p.read_text())
          assert len(r['testResults'])==1,r
          s=[a for f in r['testResults'] for a in f['assertionResults'] if a['status'] in ('passed','failed')]
          assert len(s)==2,s
          assert {a['title'] for a in s}=={'abandons only unauthenticated observations when hidden at the credentials stage','abandons only unauthenticated observations when hidden at the returned stage'},s
          assert all(a['status']=='passed' for a in s),s
          print(json.dumps(s,indent=2))
          PY
      - name: Verify unchanged proof source
        if: ${{ always() }}
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: desktop-abandonment-exact-case
          path: ${{ runner.temp }}/desktop-abandonment-proof/
