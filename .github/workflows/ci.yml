# Temporary hosted proof only. Never merge this workflow.
name: Red-main reply dispatch repair proof
run-name: Reply dispatch repair proof ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact immutable dispatch assertion repair commit
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-reply-dispatch-timer-repair-${{ github.ref }}
  cancel-in-progress: false
env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  focused:
    name: Complete reply-dispatch file
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENCLAW_LOCAL_CHECK: "0"
      OPENCLAW_VITEST_RUNTIME: node
    steps:
      - name: Validate immutable source input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "f0ee337189e403238f115a2006bcfda96e1d4fd9"
      - name: Checkout exact repair candidate
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify and record source
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          proof_dir="$RUNNER_TEMP/reply-dispatch-timer-repair"
          mkdir -p "$proof_dir"
          {
            echo "Repair source: $SOURCE_SHA"
            echo "Workflow: $WORKFLOW_SHA"
            git show -s --format='%H%n%P%n%s' HEAD
            git ls-tree HEAD -- package.json pnpm-lock.yaml \
              src/auto-reply/reply/dispatch-from-config.reply-dispatch.test.ts \
              src/auto-reply/reply/reply-dispatch-before-deliver.ts \
              src/auto-reply/reply/reply-dispatcher.ts \
              packages/retry/src/index.ts packages/retry/src/index.test.ts
          } | tee "$proof_dir/provenance.log"
          cat "$proof_dir/provenance.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Setup frozen Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
      - name: Check changed-file format and lint
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec oxfmt --check src/auto-reply/reply/dispatch-from-config.reply-dispatch.test.ts
          pnpm exec oxlint --config .oxlintrc.json --deny-warnings src/auto-reply/reply/dispatch-from-config.reply-dispatch.test.ts
      - name: Run complete failing file in its original test order
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.19.0
          proof_dir="$RUNNER_TEMP/reply-dispatch-timer-repair"
          {
            node --version
            pnpm --version
            echo 'Command: pnpm test src/auto-reply/reply/dispatch-from-config.reply-dispatch.test.ts --maxWorkers=1'
          } | tee "$proof_dir/command.log"
          started="$(date +%s)"
          if pnpm test src/auto-reply/reply/dispatch-from-config.reply-dispatch.test.ts --maxWorkers=1 \
            2>&1 | tee "$proof_dir/test.log"; then
            test_exit=0
          else
            test_exit=$?
          fi
          elapsed=$(( $(date +%s) - started ))
          {
            echo "Test exit: $test_exit"
            echo "Elapsed seconds: $elapsed"
          } | tee "$proof_dir/result.txt" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_exit"
      - name: Verify tracked source stayed unchanged
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code HEAD --
      - name: Preserve repair evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-reply-dispatch-timer-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reply-dispatch-timer-repair/
          if-no-files-found: warn
          retention-days: 14
