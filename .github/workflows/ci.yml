# Temporary exact-base diagnostic only. Never merge this workflow.
name: Red-main one-shot ingress base proof
run-name: One-shot ingress base 5415a05cd1ec ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-ingress-base-proof-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.19.0"

jobs:
  ingress-base-proof:
    name: One-shot ingress (exact PR base)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5415a05cd1ec5d5ce70bfd145bdfdf604bf19fde
          fetch-depth: 1
          persist-credentials: false

      - name: Record base source and workflow provenance
        shell: bash
        env:
          EXPECTED_SHA: 5415a05cd1ec5d5ce70bfd145bdfdf604bf19fde
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --
          mkdir -p .artifacts/ingress-base-proof
          {
            echo "Base: $actual_sha"
            echo "Workflow: $WORKFLOW_SHA"
            git show -s --format='%H%n%P%n%an <%ae>%n%s' HEAD
            git ls-tree HEAD -- \
              package.json pnpm-lock.yaml .github/actions/setup-node-env/action.yml \
              src/commands/agent-exec-plugin.e2e.test.ts \
              src/agents/agent-runtime-config.ts src/config/io.runtime.ts \
              src/config/runtime-snapshot.ts src/agents/agent-command.ts
          } | tee .artifacts/ingress-base-proof/provenance.log
          cat .artifacts/ingress-base-proof/provenance.log >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"

      - name: Build the exact base runtime once
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -euo pipefail
          pnpm build qaRuntime 2>&1 | tee .artifacts/ingress-base-proof/build.log

      - name: Run only the original failing ingress case
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
          OPENCLAW_E2E_USE_PREBUILT_DIST: "1"
        run: |
          set -euo pipefail
          started="$(date +%s)"
          if pnpm test src/commands/agent-exec-plugin.e2e.test.ts --maxWorkers=1 -t 'exits naturally after a one-shot ingress turn with workspace skills' 2>&1 | tee .artifacts/ingress-base-proof/test.log; then
            test_exit=0
          else
            test_exit=$?
          fi
          elapsed=$(( $(date +%s) - started ))
          {
            echo "Test exit: $test_exit"
            echo "Elapsed seconds: $elapsed"
          } | tee .artifacts/ingress-base-proof/result.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$test_exit"

      - name: Verify base source remained unchanged
        if: ${{ always() }}
        shell: bash
        env:
          EXPECTED_SHA: 5415a05cd1ec5d5ce70bfd145bdfdf604bf19fde
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --
          mkdir -p .artifacts/ingress-base-proof
          echo "Tracked base source remained unchanged." | tee .artifacts/ingress-base-proof/source-unchanged.log

      - name: Preserve base proof evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-ingress-base-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/ingress-base-proof/
          if-no-files-found: warn
          retention-days: 14
