# Temporary exact-case proof only. Never merge this workflow.
name: Red-main mobile drawer Escape proof
run-name: Mobile drawer Escape proof ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        type: string
        required: true
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENCLAW_LOCAL_CHECK: "0"
      OPENCLAW_VITEST_RUNTIME: node
      OPENCLAW_UI_E2E_SKIP_REAL_GATEWAY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 27eb0bdf632bbb69d97fe7d3c056435b2ecfa186
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source and source-only scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 27eb0bdf632bbb69d97fe7d3c056435b2ecfa186
          test "$(git diff --name-only HEAD^ HEAD)" = ui/src/app/app-shell-chrome.ts
          git show --format=fuller --stat HEAD
          git diff HEAD^ HEAD -- ui/src/app/app-shell-chrome.ts
          git diff --check HEAD^ HEAD
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
      - name: Format and lint changed fixture
        run: |
          pnpm exec oxfmt --check ui/src/app/app-shell-chrome.ts
          node scripts/run-oxlint.mjs ui/src/app/app-shell-chrome.ts
      - name: Install exact browser dependency
        run: pnpm --dir ui exec playwright install --with-deps chromium
      - name: Run the exact failed case on baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import time
          
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'mobile-drawer-proof'
          out.mkdir()
          owner = pathlib.Path('ui/src/app/app-shell-chrome.ts')
          test = pathlib.Path('ui/src/e2e/mobile-new-conversation.e2e.test.ts')
          original_owner = owner.read_text()
          original_test = test.read_text()
          needle = '          await page.keyboard.press("Escape");'
          assert original_test.count(needle) == 1
          diagnostic = '''          const captureDrawer = async (phase: string) => {
                      const state = await page.evaluate(() => ({
                        activeTag: document.activeElement?.tagName,
                        activeClass: document.activeElement?.className,
                        drawerOpen: Boolean(document.querySelector(".shell--nav-drawer-open")),
                        tooltips: [...document.querySelectorAll("openclaw-tooltip")].filter((element) =>
                          element.hasAttribute("open") || element.shadowRoot?.querySelector(":popover-open"),
                        ).map((element) => ({
                          open: element.hasAttribute("open"),
                          nativeOpen: Boolean(element.shadowRoot?.querySelector(":popover-open")),
                          targetClass: element.firstElementChild?.className,
                        })),
                      }));
                      console.log("DRAWER_DIAGNOSTIC", process.env.DRAWER_PROOF_PHASE, phase, JSON.stringify(state));
                      await page.screenshot({ path: path.join(process.env.DRAWER_PROOF_OUTPUT!, `${process.env.DRAWER_PROOF_PHASE}-${phase}.png`) });
                    };
                    await captureDrawer("before-escape");
                    await page.keyboard.press("Escape");
                    await captureDrawer("after-escape");'''
          test.write_text(original_test.replace(needle, diagnostic))
          results = []
          try:
              for phase in ['baseline', 'candidate']:
                  if phase == 'baseline':
                      owner.write_bytes(subprocess.check_output(['git', 'show', 'HEAD^:' + str(owner)]))
                  else:
                      owner.write_text(original_owner)
                  result_file = out / (phase + '.json')
                  command = ['node', 'scripts/run-vitest.mjs', 'run', '--config',
                             'test/vitest/vitest.ui-e2e.config.ts', '--configLoader', 'runner',
                             str(test), '--maxWorkers=1', '--reporter=verbose', '--reporter=json',
                             '--outputFile.json', str(result_file), '-t',
                             'keeps the team agent picker reachable from new$']
                  started = time.monotonic()
                  with (out / (phase + '.log')).open('w') as output:
                      process = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                          env=os.environ | {'DRAWER_PROOF_PHASE': phase, 'DRAWER_PROOF_OUTPUT': str(out)},
                          text=True)
                      for line in process.stdout:
                          print(line, end='', flush=True)
                          output.write(line)
                      code = process.wait()
                  elapsed = time.monotonic() - started
                  report = json.loads(result_file.read_text())
                  selected = [a for f in report['testResults'] for a in f['assertionResults']
                              if a['status'] in ('passed', 'failed')]
                  assert len(selected) == 1, selected
                  assert selected[0]['title'] == 'keeps the team agent picker reachable from new', selected
                  expected = 'failed' if phase == 'baseline' else 'passed'
                  assert selected[0]['status'] == expected, selected
                  if phase == 'baseline':
                      assert code != 0
                      message = '\n'.join(selected[0]['failureMessages'])
                      assert "locator('.shell--nav-drawer-open') to be detached" in message, message
                  else:
                      assert code == 0, code
                  results.append({'phase': phase, 'command_seconds': elapsed, 'assertion': selected[0]})
                  (out / 'summary.json').write_text(json.dumps(results, indent=2) + '\n')
          finally:
              owner.write_text(original_owner)
              test.write_text(original_test)
          PY
      - name: Verify unchanged proof source
        if: ${{ always() }}
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: mobile-drawer-exact-case
          path: ${{ runner.temp }}/mobile-drawer-proof/
