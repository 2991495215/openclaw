# Temporary focused proof only. Never merge this workflow.
name: Red-main scheduler retention candidate and inverse control
run-name: Scheduler retention proof ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full source commit SHA containing the final fixture change
        type: string
        required: true
      workflow_sha:
        description: Expected workflow carrier commit SHA
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-scheduler-retention-${{ github.ref }}
  cancel-in-progress: false
env:
  SOURCE_SHA: ${{ inputs.candidate_sha }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  focused:
    name: Candidate root and scope, then root inverse control
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENCLAW_LOCAL_CHECK: "0"
      OPENCLAW_VITEST_RUNTIME: node
    steps:
      - name: Checkout candidate source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify and record source
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          git diff --exit-code HEAD --
          proof_dir="$RUNNER_TEMP/scheduler-retention-control"
          mkdir -p "$proof_dir"
          {
            echo "Source: $SOURCE_SHA"
            echo "Workflow: $WORKFLOW_SHA"
            git show -s --format='%H%n%P%n%s' HEAD
            git ls-tree HEAD -- package.json pnpm-lock.yaml \
              src/infra/gateway-scheduler.test.ts \
              src/infra/gateway-scheduler.ts \
              src/infra/error-graph-internal.ts
          } | tee "$proof_dir/provenance.log"
          cat "$proof_dir/provenance.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Setup frozen Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
      - name: Prove both candidate retention cases
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.19.0
          proof_dir="$RUNNER_TEMP/scheduler-retention-control"
          node --version | tee "$proof_dir/node-version.txt"
          started="$(date +%s)"
          node scripts/run-vitest.mjs run --config test/vitest/vitest.infra.config.ts \
            src/infra/gateway-scheduler.test.ts --maxWorkers=1 --reporter=verbose --reporter=json \
            --outputFile.json "$proof_dir/candidate-results.json" \
            -t '^Gateway timed work > releases the retiring caller while its (root|scope) abort signal remains reachable$' \
            2>&1 | tee "$proof_dir/candidate.log"
          echo "Candidate elapsed seconds: $(( $(date +%s) - started ))" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json, os, pathlib
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'scheduler-retention-control'
          report = json.loads((proof / 'candidate-results.json').read_text())
          assert len(report['testResults']) == 1, 'Expected exactly one selected file'
          result = report['testResults'][0]
          assert pathlib.Path(result['name']).resolve() == pathlib.Path('src/infra/gateway-scheduler.test.ts').resolve()
          selected = [entry for entry in result['assertionResults'] if entry['status'] in ('passed', 'failed')]
          expected = {f'Gateway timed work releases the retiring caller while its {kind} abort signal remains reachable' for kind in ('root', 'scope')}
          assert len(selected) == 2 and {entry['fullName'] for entry in selected} == expected
          assert all(entry['status'] == 'passed' for entry in selected)
          assert report['numPassedTests'] == 2 and report['numFailedTests'] == 0
          receipt = {'selected': sorted(expected), 'passed': 2, 'failed': 0}
          text = json.dumps(receipt, indent=2)
          (proof / 'candidate-proof.json').write_text(text + '\n')
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
            summary.write('```json\n' + text + '\n```\n')
          PY
      - name: Prove root assertion rejects retained lazy error stacks
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/scheduler-retention-control"
          cat > "$proof_dir/inverse.patch" <<'PATCH'
          diff --git a/src/infra/gateway-scheduler.ts b/src/infra/gateway-scheduler.ts
          --- a/src/infra/gateway-scheduler.ts
          +++ b/src/infra/gateway-scheduler.ts
          @@ -258,7 +258,6 @@ export class GatewayScheduler {
           
             beginClose(): void {
               this.controller.abort();
          -    materializeErrorStack(this.controller.signal.reason);
               this.timerGeneration += 1;
               this.cancelTimer?.();
               this.cancelTimer = undefined;
          PATCH
          git apply --check "$proof_dir/inverse.patch"
          git apply "$proof_dir/inverse.patch"
          trap 'git apply --reverse "$proof_dir/inverse.patch"' EXIT
          git diff -- src/infra/gateway-scheduler.ts > "$proof_dir/inverse-applied.diff"
          started="$(date +%s)"
          if node scripts/run-vitest.mjs run --config test/vitest/vitest.infra.config.ts \
            src/infra/gateway-scheduler.test.ts --maxWorkers=1 --reporter=verbose --reporter=json \
            --outputFile.json "$proof_dir/inverse-results.json" \
            -t '^Gateway timed work > releases the retiring caller while its root abort signal remains reachable$' \
            2>&1 | tee "$proof_dir/inverse.log"; then
            inverse_exit=0
          else
            inverse_exit=$?
          fi
          echo "$inverse_exit" > "$proof_dir/inverse-exit.txt"
          echo "Inverse elapsed seconds: $(( $(date +%s) - started ))" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json, os, pathlib, re
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'scheduler-retention-control'
          assert (proof / 'inverse-exit.txt').read_text().strip() == '1', 'Expected Vitest assertion failure'
          report = json.loads((proof / 'inverse-results.json').read_text())
          assert len(report['testResults']) == 1, 'Expected exactly one selected file'
          result = report['testResults'][0]
          test_path = pathlib.Path('src/infra/gateway-scheduler.test.ts')
          assert pathlib.Path(result['name']).resolve() == test_path.resolve()
          selected = [entry for entry in result['assertionResults'] if entry['status'] in ('passed', 'failed')]
          expected = 'Gateway timed work releases the retiring caller while its root abort signal remains reachable'
          assert len(selected) == 1 and selected[0]['fullName'] == expected
          assert selected[0]['status'] == 'failed'
          assert report['numPassedTests'] == 0 and report['numFailedTests'] == 1
          messages = selected[0]['failureMessages']
          assert len(messages) == 1, 'Expected one retention assertion failure'
          message = re.sub(r'\x1b\[[0-9;]*m', '', messages[0])
          lines = [i for i, line in enumerate(test_path.read_text().splitlines(), 1) if 'expect(queryObjects(RetiredOwner)).toBe(0);' in line]
          assert len(lines) == 1
          assert re.search(r'expected 12 to be \+?0\b', message), 'Expected all twelve callers retained through their signals'
          assert re.search(rf'gateway-scheduler\.test\.ts:{lines[0]}:\d+', message), 'Failure must be at the post-handoff retention assertion'
          receipt = {'selected': expected, 'expected_failure': True, 'retained_callers': 12, 'assertion_line': lines[0], 'mutation': 'Removed only root error-stack materialization'}
          text = json.dumps(receipt, indent=2)
          (proof / 'inverse-proof.json').write_text(text + '\n')
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
            summary.write('```json\n' + text + '\n```\n')
          PY
      - name: Verify candidate source restored
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code HEAD --
      - name: Preserve focused evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-scheduler-retention-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scheduler-retention-control/
          if-no-files-found: warn
          retention-days: 14
