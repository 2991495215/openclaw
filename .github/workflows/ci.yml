# Prepared fallback only: dispatch if ordinary CI omits the original failing case.
# Pinned to the reviewed repair commit; repin only if integrating changes its identity.
name: Red-main sidebar live roster proof
run-name: Sidebar live roster ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-sidebar-live-roster-proof
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  sidebar-live-roster-proof:
    name: Original cached-to-live sidebar no-flicker case
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 294f20f5ba67f1aee884fc3d87877e2ed5d4cedd
          fetch-depth: 1
          persist-credentials: false

      - name: Record candidate and unchanged original test
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 294f20f5ba67f1aee884fc3d87877e2ed5d4cedd
          test "$(git rev-parse HEAD:ui/src/e2e/sidebar-cold-load.e2e.test.ts)" = 00389c0e7f69d5ce7ec0803509f93a2accee46e8
          proof_dir="$RUNNER_TEMP/sidebar-live-proof"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- ui/src/components/app-sidebar-session-navigation.ts ui/src/components/sidebar-agent-roster.ts ui/src/e2e/sidebar-cold-load.e2e.test.ts
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "true"
          vitest-worker-cache: "false"
          node-compile-cache: "true"

      - name: Setup Chromium
        uses: ./.github/actions/setup-playwright-chromium
        with:
          cache-mode: restore

      - name: Run unchanged original no-flicker case
        id: original_case
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
          OPENCLAW_CI_TEST_RUNTIME_POLICY: node
          OPENCLAW_UI_E2E_SKIP_REAL_GATEWAY: "1"
          OPENCLAW_VITEST_MAX_WORKERS: "1"
          OPENCLAW_UI_E2E_DIAGNOSTIC_DIR: .artifacts/control-ui-e2e-timeouts/sidebar-live-proof
        run: |
          set -euo pipefail
          node scripts/run-vitest.mjs run \
            --config test/vitest/vitest.ui-e2e.config.ts \
            --configLoader runner \
            --maxWorkers 1 \
            --reporter=verbose \
            ui/src/e2e/sidebar-cold-load.e2e.test.ts \
            -t 'restores the sessions view and pinned rail before hello through late counts and plugins' \
            2>&1 | tee "$RUNNER_TEMP/sidebar-live-proof/original-case.log"

      - name: Record outcome and verify unchanged sources
        if: ${{ always() }}
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.original_case.outcome }}
        run: |
          set -euo pipefail
          echo "Original cached-to-live no-flicker case: $TEST_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          git diff --exit-code -- ui/src/components/app-sidebar-session-navigation.ts ui/src/components/sidebar-agent-roster.ts ui/src/e2e/sidebar-cold-load.e2e.test.ts

      - name: Preserve proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-sidebar-live-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sidebar-live-proof/
          if-no-files-found: warn
          retention-days: 14
