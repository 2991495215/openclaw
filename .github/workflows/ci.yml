name: Red-main Observe token timer proof
run-name: Observe token timer ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full reviewed source repair SHA
        type: string
        required: true
      workflow_sha:
        description: Expected proof carrier SHA
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-observe-token-timer
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  observe-token:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      OPENCLAW_TEST_PROJECTS_PARALLEL: "1"
      OPENCLAW_VITEST_RUNTIME: node
      OPENCLAW_CI_TEST_RUNTIME_POLICY: node
    steps:
      - name: Checkout reviewed source repair
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify source and workflow provenance
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^)" = d5e82b9936009f082f49fcfc522c5437ec79b283
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = src/gateway/desktop/observe-bridge.test.ts
          git diff --exit-code HEAD --
          mkdir -p "$RUNNER_TEMP/observe-token-timer"
          {
            git rev-parse HEAD HEAD^
            echo "$WORKFLOW_SHA"
            git ls-tree HEAD -- src/gateway/desktop/observe-bridge.test.ts src/gateway/desktop/observe-bridge.ts src/shared/one-time-ticket-store.ts pnpm-lock.yaml
          } | tee "$RUNNER_TEMP/observe-token-timer/provenance.txt"

      - name: Setup matching Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pinned pnpm
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: "off"

      - name: Install frozen dependencies
        env:
          CI: "true"
        run: pnpm install --frozen-lockfile --prefer-offline --config.ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true --config.side-effects-cache=true

      - name: Check changed test source
        run: |
          set -euo pipefail
          pnpm exec oxfmt --check src/gateway/desktop/observe-bridge.test.ts
          pnpm exec oxlint --threads=1 src/gateway/desktop/observe-bridge.test.ts
          git diff --check HEAD^

      - name: Diagnose baseline cleanup timer in exact failing case
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/observe-token-timer"
          cp src/gateway/desktop/observe-bridge.test.ts "$proof_dir/candidate-source.ts"
          git show HEAD^:src/gateway/desktop/observe-bridge.test.ts > src/gateway/desktop/observe-bridge.test.ts
          python3 <<'DIAG'
          from pathlib import Path
          p = Path('src/gateway/desktop/observe-bridge.test.ts')
          source = p.read_text()
          needle = '    vi.restoreAllMocks();\n'
          replacement = needle + """    if (vi.isFakeTimers()) {
                const originalSetTimeout = globalThis.setTimeout;
                vi.spyOn(globalThis, "setTimeout").mockImplementation((...args) => {
                  console.log(JSON.stringify({ diagnostic: "teardown-timeout", delay: args[1], stack: new Error().stack }));
                  return originalSetTimeout(...args);
                });
              }
          """
          assert source.count(needle) == 1
          source = source.replace(needle, replacement)
          needle = '    vi.useRealTimers();\n'
          assert source.count(needle) == 1
          source = source.replace(needle, '    vi.restoreAllMocks();\n' + needle)
          p.write_text(source)
          DIAG
          git diff HEAD^ -- src/gateway/desktop/observe-bridge.test.ts > "$proof_dir/baseline-diagnostic.patch"
          set +e
          node --import ./scripts/tsx.mjs scripts/test-projects.mts src/gateway/desktop/observe-bridge.test.ts -t 'expires unused credential-bearing tokens without a later token operation$' --maxWorkers=1 --reporter=verbose --reporter=json --outputFile.json "$proof_dir/baseline.json" 2>&1 | tee "$proof_dir/baseline.log"
          result=${PIPESTATUS[0]}
          set -e
          echo "$result" > "$proof_dir/baseline-exit.txt"
          cp "$proof_dir/candidate-source.ts" src/gateway/desktop/observe-bridge.test.ts
          git diff --exit-code HEAD --

      - name: Prove exact credential expiry case
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/observe-token-timer"
          test "$(node --version)" = v24.21.0
          node --import ./scripts/tsx.mjs scripts/test-projects.mts src/gateway/desktop/observe-bridge.test.ts -t 'expires unused credential-bearing tokens without a later token operation$' --maxWorkers=1 --reporter=verbose --reporter=json --outputFile.json "$proof_dir/candidate.json" 2>&1 | tee "$proof_dir/candidate.log"
          node --input-type=module <<'PROOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const dir = path.join(process.env.RUNNER_TEMP, 'observe-token-timer');
          const report = JSON.parse(fs.readFileSync(path.join(dir, 'candidate.json'), 'utf8'));
          assert.equal(report.success, true);
          assert.equal(report.testResults.length, 1);
          const suite = report.testResults[0];
          assert.ok(suite.name.endsWith('/src/gateway/desktop/observe-bridge.test.ts'));
          const cases = suite.assertionResults;
          const passed = cases.filter(test => test.status === 'passed');
          assert.equal(passed.length, 1);
          assert.equal(passed[0].title, 'expires unused credential-bearing tokens without a later token operation');
          assert.ok(cases.every(test => ['passed', 'pending', 'skipped', 'todo'].includes(test.status)));
          console.log(JSON.stringify({ passed: passed.length, skipped: cases.length - passed.length }));
          PROOF
          git diff --exit-code HEAD --

      - name: Preserve expiry and diagnostic proof
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-observe-token-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/observe-token-timer/
          if-no-files-found: error
          retention-days: 14
