name: Red-main exact board error wrapper proof
run-name: Board error wrapper ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Reviewed full candidate commit SHA
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-board-error-wrapper-proof-${{ github.ref }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  board-regressions:
    name: Board widget regressions (exact candidate)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          echo "Candidate: $actual_sha"
          echo "Workflow: $WORKFLOW_SHA"
          echo "Candidate: $actual_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow: $WORKFLOW_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"

      - name: Setup Playwright Chromium
        uses: ./.github/actions/setup-playwright-chromium
        with:
          cache-mode: restore

      - name: Run four complete board widget files
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          mkdir -p .artifacts/board-error-wrapper
          /usr/bin/time -p pnpm --dir ui test \
            src/lib/board/widgets/browser.test.ts \
            src/lib/board/widgets/report.test.ts \
            src/lib/board/widgets/website.test.ts \
            src/components/board/board-view-page-chrome.test.ts \
            --maxWorkers=1 \
            --reporter=verbose \
            2>&1 | tee .artifacts/board-error-wrapper/widgets.log

      - name: Preserve full regression log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-board-error-wrapper-regressions-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/board-error-wrapper/*.log
          if-no-files-found: warn
          retention-days: 14

  check-dependencies:
    name: check-dependencies (exact candidate)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          echo "Candidate: $actual_sha"
          echo "Workflow: $WORKFLOW_SHA"
          echo "Candidate: $actual_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow: $WORKFLOW_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"

      - name: Run canonical dependency scans
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
        run: |
          set -euo pipefail
          mkdir -p .artifacts/board-error-wrapper
          # Canonical CI runs these serially on hosted runners with fewer than eight CPUs.
          dc_scripts=(deadcode:dependencies deadcode:unused-files deadcode:exports)
          dc_failures=0
          for dc in "${dc_scripts[@]}"; do
            if ! /usr/bin/time -p pnpm "$dc" 2>&1 | tee ".artifacts/board-error-wrapper/${dc//:/-}.log"; then
              echo "::error title=${dc} failed::${dc} failed"
              dc_failures=1
            fi
          done
          exit "$dc_failures"

      - name: Preserve canonical Knip logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-board-error-wrapper-knip-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/board-error-wrapper/*.log
          if-no-files-found: warn
          retention-days: 14
