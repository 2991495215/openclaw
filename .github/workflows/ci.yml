# PROOF ONLY: one original sessions.dispatch failure; never merge this workflow.
name: Red-main session dispatch Git options
run-name: Session dispatch Git options ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
      workflow_sha:
        description: Exact proof workflow commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-session-dispatch-git-options-proof
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.19.0"
jobs:
  session-dispatch-proof:
    name: Original configured-project admin failure
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pinned candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1978af5747712fbd74f7b05cd5ba5206580239eb
          fetch-depth: 1
          persist-credentials: false
      - name: Record source provenance
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1978af5747712fbd74f7b05cd5ba5206580239eb
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          mkdir -p "$RUNNER_TEMP/session-dispatch-proof"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- package.json pnpm-lock.yaml src/gateway/server-methods/sessions.dispatch.test.ts src/gateway/server-methods/sessions-dispatch.ts src/gateway/worker-environments/placement-destination.ts scripts/stage-openclaw-bun.sh test/vitest/vitest.gateway-methods.config.ts
          } | tee "$RUNNER_TEMP/session-dispatch-proof/provenance.txt"
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
          node-compile-cache: "true"
      - name: Setup original pinned Bun test runtime
        uses: ./.github/actions/setup-test-bun
      - name: Check changed fixture
        shell: bash
        run: |
          set -euo pipefail
          node_modules/.bin/oxfmt --check --threads=1 src/gateway/server-methods/sessions.dispatch.test.ts
          node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.core.json src/gateway/server-methods/sessions.dispatch.test.ts
          git diff --check
      - name: Prove original failing case
        shell: bash
        env:
          OPENCLAW_VITEST_RUNTIME: bun
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.19.0
          test "$(bun --revision)" = 1.4.3-canary.1+65d94e715
          proof_dir="$RUNNER_TEMP/session-dispatch-proof"
          {
            node --version
            bun --version
            bun --revision
            node --input-type=module -e 'import os from "node:os"; console.log(JSON.stringify({ logicalCpuCount: os.availableParallelism(), totalMemoryBytes: os.totalmem() }));'
          } | tee "$proof_dir/runtime.txt"
          started="$(date +%s)"
          node scripts/run-vitest.mjs run --config test/vitest/vitest.gateway-methods.config.ts src/gateway/server-methods/sessions.dispatch.test.ts --maxWorkers=1 --passWithNoTests=false --testNamePattern 'requires admin before resolving a configured project profile$' --reporter=default --reporter=json --outputFile.json="$proof_dir/vitest.json" 2>&1 | tee "$proof_dir/vitest.log"
          echo "Exact failed case elapsed seconds: $(( $(date +%s) - started ))" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify exactly one passing case
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, pathlib
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'session-dispatch-proof'
          data = json.loads((proof / 'vitest.json').read_text())
          results = data['testResults']
          assert len(results) == 1, results
          assert results[0]['name'].endswith('/src/gateway/server-methods/sessions.dispatch.test.ts'), results[0]['name']
          executed = [case for result in results for case in result['assertionResults'] if case['status'] not in ('pending', 'skipped', 'todo', 'disabled')]
          assert len(executed) == 1, executed
          case = executed[0]
          assert case['fullName'] == 'sessions.dispatch requires admin before resolving a configured project profile', case
          assert case['status'] == 'passed', case
          assert data['success'] and data['numPassedTests'] == 1 and data['numFailedTests'] == 0, data
          assert data.get('numRuntimeErrorTestSuites', 0) == 0, data
          receipt = {'executed': 1, 'passed': 1, 'failed': 0, 'selected': case['fullName'], 'duration_ms': case.get('duration'), 'unrelated_skipped': data.get('numPendingTests', 0)}
          text = json.dumps(receipt, indent=2)
          (proof / 'case-counts.json').write_text(text + '\n')
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('```json\n' + text + '\n```\n')
          PYTHON
      - name: Verify unchanged sources
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1978af5747712fbd74f7b05cd5ba5206580239eb
          git status --short
          git diff --exit-code HEAD --
      - name: Preserve proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-session-dispatch-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/session-dispatch-proof/
          if-no-files-found: warn
          retention-days: 14
