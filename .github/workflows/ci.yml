# PROOF ONLY: do not merge this workflow.
name: Red-main Real-Gateway timeout policy proof
run-name: Real-Gateway timeout policy ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
      target_sha:
        description: Exact candidate source commit
        type: string
        required: true
      workflow_sha:
        description: Exact proof workflow commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-real-gateway-timeout-policy-proof
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.19.0"
jobs:
  timeout-policy-proof:
    name: Check only the real-Gateway timeout policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Record source provenance
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          git diff --exit-code HEAD --
          mkdir -p "$RUNNER_TEMP/real-gateway-timeout-policy"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- .github/workflows/ci.yml test/scripts/ci-workflow-guards.test.ts test/scripts/ci-workflow.test-support.ts package.json pnpm-lock.yaml
          } | tee "$RUNNER_TEMP/real-gateway-timeout-policy/provenance.txt"
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
          node-compile-cache: "true"
      - name: Check only the timeout-policy cases
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-vitest.mjs test/scripts/ci-workflow-guards.test.ts --maxWorkers=1 -t 'bounds real-Gateway job time for' --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/real-gateway-timeout-policy/results.json" 2>&1 | tee "$RUNNER_TEMP/real-gateway-timeout-policy/test.log"
      - name: Confirm all selected cases passed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, pathlib
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'real-gateway-timeout-policy'
          report = json.loads((proof / 'results.json').read_text())
          cases = [case for file in report['testResults'] for case in file['assertionResults']]
          selected = [case for case in cases if 'bounds real-Gateway job time for ' in case['fullName']]
          assert report['success'], report
          assert len(selected) == 9, selected
          assert all(case['status'] == 'passed' for case in selected), selected
          assert all(case['status'] in ('pending', 'skipped', 'todo') or case in selected for case in cases), cases
          print(json.dumps({'passed_policy_cases': [case['fullName'] for case in selected]}, indent=2))
          PYTHON
      - name: Verify unchanged sources
        if: ${{ always() }}
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code HEAD --
      - name: Preserve proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-real-gateway-timeout-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/real-gateway-timeout-policy/
          if-no-files-found: warn
          retention-days: 14
