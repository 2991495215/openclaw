             };
             return {
               mark,
          DIAGNOSTIC_PATCH
          echo "c93572933cc2198d33289edf9966cd467b986805ade3c731f5305ee9e95bd57e  .artifacts/session-create-durability-phase/diagnostic.patch" | sha256sum --check
          git apply --check .artifacts/session-create-durability-phase/diagnostic.patch
          git apply .artifacts/session-create-durability-phase/diagnostic.patch
