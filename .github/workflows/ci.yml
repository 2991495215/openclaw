# Temporary focused diagnosis only; never merge this workflow into main.
name: Red-main two UI failures diagnosis
run-name: UI c86d0f8 diagnosis ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-ui-c86-diagnosis
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  BASE_SHA: c86d0f80023d8dc22dcd1f8ed1cc1b7271414336
  CRON_DIAGNOSTIC_SHA: 3d3479664cdc9c697710fe354b6b9ca069a12519
  CANDIDATE_SHA: cb61ce56ca9804481d6efd66dd4e6b809a6f9031

jobs:
  focused-ui-diagnosis:
    name: Exact cron publication and sidebar scope failures
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENCLAW_LOCAL_CHECK: "0"
      OPENCLAW_VITEST_RUNTIME: node
      OPENCLAW_CAPTURE_UI_PROOF: "0"
    steps:
      - name: Checkout exact diagnostic-only source commit
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: cb61ce56ca9804481d6efd66dd4e6b809a6f9031
          fetch-depth: 3
          persist-credentials: false

      - name: Verify source identity and save blob guards
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$CRON_DIAGNOSTIC_SHA"
          test "$(git rev-parse HEAD~2)" = "$BASE_SHA"
          expected_paths=$'ui/src/e2e/cron-duration-save.real-gateway.e2e.test.ts\nui/src/e2e/sidebar-attention-scope.e2e.test-support.ts'
          test "$(git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort)" = "$expected_paths"
          test "$(git rev-parse "$BASE_SHA:ui/src/e2e/cron-duration-save.real-gateway.e2e.test.ts")" = 20cffbc46696c6e111bf48f126f5dd73c2aaad55
          test "$(git rev-parse "$BASE_SHA:ui/src/e2e/sidebar-attention-scope.e2e.test-support.ts")" = fbd811e2e2f9cc3f6a6b6ab22f0b1c0db162fb98
          test -z "$(git status --porcelain --untracked-files=all)"
          proof_dir="$RUNNER_TEMP/ui-c86-diagnosis"
          mkdir -p "$proof_dir"
          cat > "$proof_dir/source-blobs.txt" <<'BLOBS'
          972eeada65c7ef770cbfd8ddd6b8a39245de85c0 ui/src/e2e/cron-duration-save.real-gateway.e2e.test.ts
          2ea0c6cc2495db86fe93aa5a2de8cdc5c96a3b63 ui/src/e2e/sidebar-attention-scope.e2e.test.ts
          fd50fd4bb8f7b38df2a4cb2b317a1a6e85d4f068 ui/src/e2e/sidebar-attention-scope.e2e.test-support.ts
          6d5c4c39f8c8bbf13655aec69bb404b810a7b5d3 test/vitest/vitest.ui-e2e-prebuilt.config.ts
          f27a8cefc1300db1620526d82beccd593c7a5ded test/vitest/vitest.ui-e2e-prebuilt.global-setup.ts
          62a2bafa569fa7c00a87d817f506fbff0c5d61a5 test/vitest/vitest.ui-e2e.config.ts
          0dbfb615085819dab117f2b4175c542a1b56bb0e test/vitest/vitest.ui-e2e.bundled.global-setup.ts
          c19711026b0ef02afa86678fefefb823b4fdf9f4 test/vitest/vitest.ui-paths.mjs
          f7a67f4eb417f7eff97b00a4e9180423e4386405 ui/src/test-helpers/control-ui-e2e-diagnostics.ts
          BLOBS
          while read -r expected_blob source_path; do
            test "$(git hash-object "$source_path")" = "$expected_blob"
          done < "$proof_dir/source-blobs.txt"
          git diff "$BASE_SHA" HEAD -- ui/src/e2e/cron-duration-save.real-gateway.e2e.test.ts ui/src/e2e/sidebar-attention-scope.e2e.test-support.ts > "$proof_dir/diagnostic-only.diff"
          {
            echo "Product base: $BASE_SHA"
            echo "Cron diagnostic parent: $CRON_DIAGNOSTIC_SHA"
            echo "Candidate: $CANDIDATE_SHA"
            echo "Workflow: $WORKFLOW_SHA"
            cat "$proof_dir/source-blobs.txt"
            sha256sum ui/src/e2e/cron-duration-save.real-gateway.e2e.test.ts ui/src/e2e/sidebar-attention-scope.e2e.test.ts ui/src/e2e/sidebar-attention-scope.e2e.test-support.ts
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup clean frozen Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"

      - name: Install Playwright Chromium
        uses: ./.github/actions/setup-playwright-chromium
        with:
          cache-mode: restore
          compatibility-target: "false"

      - name: Build exact runtime and Control UI once
        id: build
        env:
          OPENCLAW_BUILD_PRIVATE_QA: "1"
          OPENCLAW_RUN_NODE_SKIP_DTS_BUILD: "1"
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          pnpm build 2>&1 | tee "$RUNNER_TEMP/ui-c86-diagnosis/build.log"

      - name: Diagnose original cron assertions with added observation only
        id: cron
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          OPENCLAW_UI_E2E_ARTIFACT_DIR: ${{ runner.temp }}/ui-c86-cron-artifacts
          OPENCLAW_UI_E2E_DIAGNOSTIC_DIR: ${{ runner.temp }}/ui-c86-cron-timeouts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-vitest.mjs run \
            --config test/vitest/vitest.ui-e2e-prebuilt.config.ts \
            --configLoader runner --maxWorkers 1 --passWithNoTests=false \
            --reporter verbose --reporter json \
            --outputFile.json="$RUNNER_TEMP/ui-c86-diagnosis/cron.json" \
            ui/src/e2e/cron-duration-save.real-gateway.e2e.test.ts \
            -t 'keeps an open automation draft current through real catalog publication and read recovery' \
            2>&1 | tee "$RUNNER_TEMP/ui-c86-diagnosis/cron.log"

      - name: Diagnose original mocked sidebar scope case against the same build
        id: sidebar
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          OPENCLAW_UI_E2E_ARTIFACT_DIR: ${{ runner.temp }}/ui-c86-sidebar-artifacts
          OPENCLAW_UI_E2E_DIAGNOSTIC_DIR: ${{ runner.temp }}/ui-c86-sidebar-timeouts
        shell: bash
        run: |
          set -euo pipefail
          # Canonical prebuilt config excludes mocks. Reuse its existing admission/setup
          # with the normal config's unchanged bundled project, outside the checkout.
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = process.env.GITHUB_WORKSPACE;
          const owner = path.join(root, 'test/vitest/vitest.ui-e2e.config.ts');
          const output = path.join(process.env.RUNNER_TEMP, 'ui-c86-diagnosis/sidebar-prebuilt.config.ts');
          fs.writeFileSync(output, [
            `import { createUiE2eVitestConfig } from ${JSON.stringify(owner)};`,
            'const config = createUiE2eVitestConfig();',
            `config.root = ${JSON.stringify(root)};`,
            'const project = config.test.projects.find(candidate => candidate.test.name === "ui-e2e-bundled");',
            'if (!project) throw new Error("Canonical bundled UI project is missing");',
            'project.test.globalSetup = ["test/vitest/vitest.ui-e2e-prebuilt.global-setup.ts", ...project.test.globalSetup];',
            'config.test.projects = [project];',
            'export default config;',
            '',
          ].join('\n'));
          NODE
          sha256sum "$RUNNER_TEMP/ui-c86-diagnosis/sidebar-prebuilt.config.ts" | tee "$RUNNER_TEMP/ui-c86-diagnosis/sidebar-config.sha256"
          test -z "$(git status --porcelain --untracked-files=all)"
          node scripts/run-vitest.mjs run \
            --config "$RUNNER_TEMP/ui-c86-diagnosis/sidebar-prebuilt.config.ts" \
            --configLoader runner --maxWorkers 1 --passWithNoTests=false \
            --reporter verbose --reporter json \
            --outputFile.json="$RUNNER_TEMP/ui-c86-diagnosis/sidebar.json" \
            ui/src/e2e/sidebar-attention-scope.e2e.test.ts \
            -t 'scopes automation attention and bulk dismissal across agents' \
            2>&1 | tee "$RUNNER_TEMP/ui-c86-diagnosis/sidebar.log"

      - name: Verify unchanged sources and exact case selection
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CRON_OUTCOME: ${{ steps.cron.outcome }}
          SIDEBAR_OUTCOME: ${{ steps.sidebar.outcome }}
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/ui-c86-diagnosis"
          mkdir -p "$proof_dir"
          {
            echo "Build: $BUILD_OUTCOME"
            echo "Cron case: $CRON_OUTCOME"
            echo "Sidebar case: $SIDEBAR_OUTCOME"
            git status --short
          } | tee "$proof_dir/outcomes.txt"
          cat "$proof_dir/outcomes.txt" >> "$GITHUB_STEP_SUMMARY"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          while read -r expected_blob source_path; do
            test "$(git hash-object "$source_path")" = "$expected_blob"
          done < "$proof_dir/source-blobs.txt"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          if [[ "$BUILD_OUTCOME" == success ]]; then
            node --input-type=module - "$proof_dir" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const root = process.argv[2];
          for (const [label, file, title] of [
            ['cron', 'cron-duration-save.real-gateway.e2e.test.ts', 'keeps an open automation draft current through real catalog publication and read recovery'],
            ['sidebar', 'sidebar-attention-scope.e2e.test.ts', 'scopes automation attention and bulk dismissal across agents'],
          ]) {
            const report = JSON.parse(fs.readFileSync(path.join(root, `${label}.json`), 'utf8'));
            assert.equal(report.testResults.length, 1, `${label}: one selected file`);
            const suite = report.testResults[0];
            assert.ok(suite.name.endsWith(`/ui/src/e2e/${file}`));
            const active = suite.assertionResults.filter(result => ['passed', 'failed'].includes(result.status));
            assert.equal(active.length, 1, `${label}: one executed case, no suite expansion or skipped proof`);
            assert.equal(active[0].title, title);
            console.log(`${label}: ${active[0].status} — ${title}`);
          }
          NODE
          fi

      - name: Preserve focused logs and audited synthetic diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-ui-c86-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ui-c86-diagnosis/
            ${{ runner.temp }}/ui-c86-cron-artifacts/automation-catalog-publication-with-a-real-gateway-*/publication.json
            ${{ runner.temp }}/ui-c86-cron-artifacts/automation-catalog-publication-with-a-real-gateway-*/gateway.log
            ${{ runner.temp }}/ui-c86-cron-timeouts/failure-*/failure.public.json
            ${{ runner.temp }}/ui-c86-sidebar-timeouts/failure-*/failure.public.json
          if-no-files-found: warn
          retention-days: 7
