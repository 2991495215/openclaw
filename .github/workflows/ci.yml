# Temporary exact-case diagnostic. Never merge this workflow or its source commit.
name: Red-main skipped cron retry diagnostic
run-name: Skipped cron retry diagnostic ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        type: string
        required: true
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENCLAW_LOCAL_CHECK: "0"
      OPENCLAW_VITEST_RUNTIME: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a11ad024fe6a680bf78420c0c331f5d70d2b5513
          fetch-depth: 2
          persist-credentials: false
      - name: Verify source provenance and diagnostic-only scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a11ad024fe6a680bf78420c0c331f5d70d2b5513
          test "$(git rev-parse HEAD^)" = d445cc668e6e5c7df65c8c25006d6165e8dc3451
          test "$(git diff --name-only HEAD^ HEAD)" = test/cron-message-read.integration.test.ts
          git show --format=fuller --stat HEAD
          git diff HEAD^ HEAD -- test/cron-message-read.integration.test.ts
          git diff --check HEAD^ HEAD
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
      - name: Run only the previously skipped Discord retry case
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/cron-message-diagnostic"
          started="$(date +%s)"
          set +e
          node scripts/run-vitest.mjs run --config test/vitest/vitest.infra.config.ts \
            test/cron-message-read.integration.test.ts --maxWorkers=1 \
            --reporter=verbose --reporter=json --outputFile.json "$RUNNER_TEMP/cron-message-diagnostic/results.json" \
            -t 'blocks a Discord 429 retry after cron' \
            2>&1 | tee "$RUNNER_TEMP/cron-message-diagnostic/test.log"
          test_rc=${PIPESTATUS[0]}
          echo "Command seconds: $(( $(date +%s) - started ))"
          exit "$test_rc"
      - name: Verify exactly the previously skipped case executed
        if: ${{ always() }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'cron-message-diagnostic/results.json'
          r = json.loads(p.read_text())
          assert len(r['testResults']) == 1, r
          selected = [a for f in r['testResults'] for a in f['assertionResults'] if a['status'] in ('passed', 'failed')]
          expected = {'blocks a Discord 429 retry after cron.u…'}
          assert len(selected) == 1, selected
          assert {a['title'] for a in selected} == expected, selected
          print(json.dumps(selected, indent=2))
          PY
      - name: Verify unchanged diagnostic source
        if: ${{ always() }}
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: cron-message-diagnostic
          path: ${{ runner.temp }}/cron-message-diagnostic/
