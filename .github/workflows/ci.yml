# Diagnostic carrier only. Never merge this workflow into main.
name: Red-main sidebar tooltip causal probe
run-name: Sidebar tooltip causal probe ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-sidebar-tooltip-causal-probe
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  sidebar-occlusion:
    name: Base RTL case with a real Collapse tooltip
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 08f856074937777449a923844b0cf2cedb3d61d8
          fetch-depth: 1
          persist-credentials: false

      - name: Record source and add controlled tooltip interaction
        shell: bash
        env:
          EXPECTED_SHA: 08f856074937777449a923844b0cf2cedb3d61d8
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD:ui/src/components/app-sidebar-session-filter.browser.test.ts)" = 29a0ee2bf1e7cd84d2e2b5c03dfdc232f6dc1f97
          test "$(git rev-parse HEAD:ui/src/lib/native-overlay-occlusion.ts)" = e52cdbf2522d256f63626f58c08fb6d14beba7fa
          proof_dir="$RUNNER_TEMP/sidebar-tooltip-causal-proof"
          mkdir -p "$proof_dir"
          {
            echo "Source: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- ui/src/components/app-sidebar-session-filter.browser.test.ts ui/src/components/sidebar-collapse-toggle.tsx ui/src/lib/native-overlay-occlusion.ts ui/src/components/tooltip-controller.ts ui/src/components/solid/tooltip.tsx
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          from pathlib import Path
          file = Path("ui/src/lib/native-overlay-occlusion.ts")
          source = file.read_text()
          # Keep indentation literal and fail if the reviewed observation point moved.
          needle = "    if (occluded !== previous) {\n      previous = occluded;\n      listener(occluded);\n"
          observation = '''      console.info("SIDEBAR_OCCLUSION", JSON.stringify({
                  at: performance.now(),
                  previous,
                  occluded,
                  activeOverlays,
                  viewport: [innerWidth, innerHeight],
                  direction: document.querySelector("openclaw-app-sidebar")?.getAttribute("dir"),
                  focused: document.activeElement?.getAttribute("aria-label") ?? document.activeElement?.localName,
                  hovered: [...document.querySelectorAll("button:hover")].map((element) => element.getAttribute("aria-label") ?? element.className),
                  surfaces: [...surfaces].map((elements) => {
                    const registered = [...elements()];
                    const first = registered[0];
                    const root = first?.getRootNode();
                    const visible = registered.find((element) => {
                      const rect = element.getBoundingClientRect();
                      return element.isConnected && rect.width > 0 && rect.height > 0 && bounds && rect.left < bounds.right && rect.right > bounds.left && rect.top < bounds.bottom && rect.bottom > bounds.top;
                    });
                    return {
                      tag: first?.localName,
                      class: first?.getAttribute("class"),
                      role: first?.getAttribute("role"),
                      host: root instanceof ShadowRoot ? root.host.localName : undefined,
                      rect: first?.getBoundingClientRect().toJSON(),
                      intersecting: visible ? { tag: visible.localName, class: visible.getAttribute("class"), rect: visible.getBoundingClientRect().toJSON() } : null,
                    };
                  }),
                }));
          '''
          assert source.count(needle) == 1
          file.write_text(source.replace(needle, needle.replace("      previous = occluded;", observation + "      previous = occluded;")))
          test = Path("ui/src/components/app-sidebar-session-filter.browser.test.ts")
          source = test.read_text()
          owners = '      const owners = page.getByRole("button", { name: "Owners: All owners", exact: true });\n'
          interaction = '''      // DIAGNOSTIC BEGIN
                const collapse = page.getByRole("button", { name: "Collapse sidebar", exact: true });
                const tooltip = collapse.element().closest("openclaw-tooltip")!;
                const tooltipSurface = tooltip.shadowRoot!.querySelector<HTMLElement>('[role="tooltip"]')!;
                await userEvent.hover(collapse);
                await expect.element(tooltipSurface).toBeVisible();
                await expect.poll(() => occlusion).toEqual([false, true]);
                console.info("SIDEBAR_INTERVENTION", JSON.stringify({ phase: "tooltip-visible", occlusion }));
                await userEvent.hover(owners);
                await expect.element(tooltipSurface).not.toBeVisible();
                await expect.poll(() => occlusion).toEqual([false, true, false]);
                console.info("SIDEBAR_INTERVENTION", JSON.stringify({ phase: "tooltip-closed-before-owners", occlusion }));
                // DIAGNOSTIC END
          '''
          before_filter = '      await expect.element(owners).toHaveFocus();\n'
          checkpoint = '''      // DIAGNOSTIC BEGIN
                console.info("SIDEBAR_INTERVENTION", JSON.stringify({ phase: "before-filter", occlusion }));
                // DIAGNOSTIC END
          '''
          assert source.count(owners) == 1
          assert source.count(before_filter) == 1
          test.write_text(source.replace(owners, owners + interaction).replace(before_filter, before_filter + checkpoint))
          PY
          git diff -- ui/src/lib/native-overlay-occlusion.ts ui/src/components/app-sidebar-session-filter.browser.test.ts > "$proof_dir/observation-and-interaction.patch"

      - name: Setup Node and the CI Bun runtime
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: restore
          install-bun: "true"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "true"
          vitest-worker-cache: "false"
          node-compile-cache: "true"

      - name: Setup Chromium
        uses: ./.github/actions/setup-playwright-chromium
        with:
          cache-mode: restore

      - name: Run the original base RTL case once with controlled tooltip interaction
        id: cases
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: bun
          OPENCLAW_CI_TEST_RUNTIME_POLICY: bun-compatible
          OPENCLAW_VITEST_MAX_WORKERS: "1"
        run: |
          set -euo pipefail
          node scripts/run-vitest.mjs run \
            --config ui/vitest.config.ts \
            --configLoader runner \
            --project chromium \
            --maxWorkers 1 \
            --reporter=verbose \
            ui/src/components/app-sidebar-session-filter.browser.test.ts \
            -t 'keeps keyboard navigation, focus and surface inside the viewport at 390 px \(rtl\)$' \
            2>&1 | tee "$RUNNER_TEMP/sidebar-tooltip-causal-proof/case.log"

      - name: Record outcome and unchanged original assertions
        if: ${{ always() }}
        shell: bash
        env:
          CASE_OUTCOME: ${{ steps.cases.outcome }}
        run: |
          set -euo pipefail
          echo "Controlled tooltip / original base RTL assertion: $CASE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          file = "ui/src/components/app-sidebar-session-filter.browser.test.ts"
          original = subprocess.check_output(["git", "show", "HEAD:" + file], text=True)
          diagnostic = Path(file).read_text()
          restored, count = re.subn(r"^ *// DIAGNOSTIC BEGIN\n.*?^ *// DIAGNOSTIC END\n", "", diagnostic, flags=re.MULTILINE | re.DOTALL)
          assert count == 2
          assert restored == original, "Original test body or assertions changed"
          print("All original test statements, assertions and deadlines preserved")
          PY
          git diff --exit-code -- ui/src/components/sidebar-collapse-toggle.tsx

      - name: Preserve causal probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sidebar-tooltip-causal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sidebar-tooltip-causal-proof/
          if-no-files-found: warn
          retention-days: 14
