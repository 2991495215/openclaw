# Temporary exact-source diagnostic only. Never merge this workflow or its patch.
name: Red-main session creation phase diagnostic
run-name: Session creation phase diagnostic 838c6ada ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-session-create-phase-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  session-create-phase:
    name: Session creation phase diagnostic (exact main source)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 838c6ada7dc9d657098b552eb846d8e5f176b79e
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source and apply temporary phase logging
        shell: bash
        env:
          EXPECTED_SHA: 838c6ada7dc9d657098b552eb846d8e5f176b79e
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --
          mkdir -p .artifacts/session-create-durability-phase
          {
            echo "Source: $actual_sha"
            echo "Workflow: $WORKFLOW_SHA"
            git show -s --format='%H%n%P%n%an <%ae>%n%s' HEAD
            git ls-tree HEAD -- \
              package.json pnpm-lock.yaml .github/workflows/ci.yml \
              .github/actions/setup-node-env/action.yml \
              src/gateway/server.sessions.create.durability.test.ts \
              src/gateway/session-create-diagnostics.ts \
              src/config/sessions/session-input-actor.ts \
              src/gateway/test-helpers.server.ts \
              src/gateway/test/server-sessions.test-helpers.ts \
              scripts/lib/vitest-build-prerequisites.mts \
              scripts/lib/vitest-runtime-selection.mts \
              scripts/test-projects-run.mts \
              test/vitest/vitest.gateway-server.config.ts
          } | tee .artifacts/session-create-durability-phase/provenance.log
          cat > .artifacts/session-create-durability-phase/baseline.sha256 <<'BASELINE_DIGESTS'
          ca1d0d69a0b90ecef02dccd9c95a148cc33437d01e1a113c0395623cab0edc84  src/config/sessions/session-input-actor.ts
          b6ec4836a4ba4ba6115a41bdded401e76bc7e6c938518d5f146e103f7d10551b  src/gateway/server.sessions.create.durability.test.ts
          bfc5ee357f74cad18a636d6c1f743249077aa4d4254ef21bc313cb5342368a1c  src/gateway/session-create-diagnostics.ts
          BASELINE_DIGESTS
          sha256sum --check .artifacts/session-create-durability-phase/baseline.sha256
          cat > .artifacts/session-create-durability-phase/diagnostic.patch <<'DIAGNOSTIC_PATCH'
          diff --git a/src/config/sessions/session-input-actor.ts b/src/config/sessions/session-input-actor.ts
