# PROOF ONLY: diagnosed full-tree export failure; never merge this workflow.
name: Red-main DiffPairingBudget export
run-name: DiffPairingBudget export ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed source commit
        type: string
        required: true
      workflow_sha:
        description: Exact proof workflow commit
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-diff-budget-export-proof
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.19.0"
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
  ACTUAL_WORKFLOW_SHA: ${{ github.workflow_sha }}
jobs:
  diff-budget-export-proof:
    name: Original full-tree export failure
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pinned candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Record exact source provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/diff-budget-export-proof"
          python3 - <<'PYTHON'
          import json, os, pathlib, re, subprocess
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'diff-budget-export-proof'
          candidate = os.environ['CANDIDATE_SHA']
          expected_workflow = os.environ['EXPECTED_WORKFLOW_SHA']
          actual_workflow = os.environ['ACTUAL_WORKFLOW_SHA']
          assert candidate == '84a3a63750bc55f1436dac109c580488713af14d', candidate
          assert re.fullmatch('[a-f0-9]{40}', expected_workflow), expected_workflow
          assert actual_workflow == expected_workflow, (actual_workflow, expected_workflow)
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == candidate
          assert git('rev-parse', 'HEAD^') == '7665342bcbb06b90ed1a0e0b251336a1e0831516'
          source = 'ui/src/lib/chat/session-diff-split.ts'
          assert git('diff', '--name-only', 'HEAD^', 'HEAD') == source
          assert git('rev-parse', 'HEAD:' + source) == 'a306d763353bb0a4b53073b4b1d6155075334d00'
          subprocess.run(['git', 'diff', '--exit-code', 'HEAD', '--'], check=True)
          paths = [source, 'package.json', 'pnpm-lock.yaml', 'config/knip.all-exports.config.ts', 'scripts/check-deadcode-exports.mts', 'scripts/run-oxlint.mjs', 'scripts/run-oxlint.mts', 'scripts/run-oxlint-shards.mts', 'config/tsconfig/oxlint.core.json', '.oxlintrc.json']
          receipt = {'candidate_sha': candidate, 'base_sha': git('rev-parse', 'HEAD^'), 'workflow_sha': actual_workflow, 'source_tree': git('ls-tree', 'HEAD', '--', *paths)}
          (proof / 'provenance.json').write_text(json.dumps(receipt, indent=2) + '\n')
          (proof / 'candidate.diff').write_text(git('diff', 'HEAD^', 'HEAD', '--', source) + '\n')
          (proof / 'session-diff-split.ts').write_bytes(pathlib.Path(source).read_bytes())
          print(json.dumps(receipt))
          PYTHON
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
          node-compile-cache: "true"
      - name: Check changed source and replay only the full-tree export scan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess, time
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'diff-budget-export-proof'
          version = subprocess.check_output(['node', '--version'], text=True).strip()
          assert version == 'v24.19.0', version
          source = 'ui/src/lib/chat/session-diff-split.ts'
          commands = [
              ('format', ['node_modules/.bin/oxfmt', '--check', '--threads=1', source]),
              ('lint', ['node', 'scripts/run-oxlint.mjs', '--tsconfig', 'config/tsconfig/oxlint.core.json', source]),
              ('diff-check', ['git', 'diff', '--check', 'HEAD^', 'HEAD']),
              ('full-tree-exports', ['pnpm', 'dlx', '--package', 'knip@6.32.2', 'knip', '--config', 'config/knip.all-exports.config.ts', '--no-progress', '--reporter', 'compact', '--include', 'exports,nsExports,types,nsTypes,enumMembers,namespaceMembers', '--no-config-hints']),
          ]
          receipts = []
          for name, command in commands:
              (proof / (name + '-command.json')).write_text(json.dumps(command, indent=2) + '\n')
              started = time.monotonic()
              with (proof / (name + '.log')).open('w', encoding='utf-8') as log:
                  process = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, encoding='utf-8', errors='replace')
                  for line in process.stdout:
                      print(line, end='', flush=True)
                      log.write(line)
                  result = process.wait()
              receipt = {'name': name, 'command': command, 'exit_code': result, 'elapsed_seconds': time.monotonic() - started, 'node': version}
              receipts.append(receipt)
              (proof / (name + '-execution.json')).write_text(json.dumps(receipt, indent=2) + '\n')
              print(json.dumps(receipt))
          (proof / 'execution.json').write_text(json.dumps(receipts, indent=2) + '\n')
          raise SystemExit(1 if any(row['exit_code'] != 0 for row in receipts) else 0)
          PYTHON
      - name: Record unchanged source outcome
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess, time
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'diff-budget-export-proof'
          proof.mkdir(parents=True, exist_ok=True)
          started = time.monotonic()
          command = ['git', 'diff', '--exit-code', 'HEAD', '--']
          head = subprocess.run(['git', 'rev-parse', 'HEAD'], capture_output=True, text=True)
          result = subprocess.run(command, capture_output=True, text=True)
          (proof / 'source-unchanged.log').write_text(head.stderr + result.stdout + result.stderr)
          unchanged = head.returncode == 0 and head.stdout.strip() == os.environ['CANDIDATE_SHA'] and result.returncode == 0
          receipt = {'command': command, 'exit_code': result.returncode, 'elapsed_seconds': time.monotonic() - started, 'head': head.stdout.strip(), 'candidate_sha': os.environ['CANDIDATE_SHA'], 'tracked_source_unchanged': unchanged}
          (proof / 'source-unchanged.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          raise SystemExit(0 if unchanged else 1)
          PYTHON
      - name: Preserve proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-diff-budget-export-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/diff-budget-export-proof/
          if-no-files-found: warn
          retention-days: 14
