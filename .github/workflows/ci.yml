name: Red-main compact plan repair proof
run-name: Compact plan repair ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full reviewed planner repair SHA
        type: string
        required: true
      workflow_sha:
        description: Expected proof carrier SHA
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-compact-plan-79
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  compact-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      OPENCLAW_TEST_PROJECTS_PARALLEL: "1"
      OPENCLAW_VITEST_RUNTIME: node
      OPENCLAW_CI_TEST_RUNTIME_POLICY: node
    steps:
      - name: Checkout reviewed source repair
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify source and workflow provenance
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^)" = dc87e61f9271e124abd7dcec11968a6d216619eb
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = scripts/lib/ci-node-test-plan.mts
          git diff --exit-code HEAD --
          mkdir -p "$RUNNER_TEMP/compact-plan-79"
          {
            git rev-parse HEAD HEAD^
            echo "$WORKFLOW_SHA"
            git ls-tree HEAD -- scripts/lib/ci-node-test-plan.mts test/scripts/ci-node-test-plan.test.ts config/ci-test-timings.json pnpm-lock.yaml
          } | tee "$RUNNER_TEMP/compact-plan-79/provenance.txt"

      - name: Setup matching Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pinned pnpm
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: "off"

      - name: Install frozen dependencies
        env:
          CI: "true"
        run: pnpm install --frozen-lockfile --prefer-offline --config.ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true --config.side-effects-cache=true

      - name: Check changed planner source
        run: |
          set -euo pipefail
          pnpm exec oxfmt --check scripts/lib/ci-node-test-plan.mts
          pnpm exec oxlint --threads=1 scripts/lib/ci-node-test-plan.mts
          git diff --check HEAD^

      - name: Run exact scheduled inventory regression
        id: candidate
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/compact-plan-79"
          test "$(node --version)" = v24.21.0
          node --import ./scripts/tsx.mjs scripts/test-projects.mts test/scripts/ci-node-test-plan.test.ts -t 'keeps the scheduled main inventory within its reserved compact capacity' --maxWorkers=1 --reporter=verbose --reporter=json --outputFile.json "$proof_dir/candidate.json" 2>&1 | tee "$proof_dir/candidate.log"
          node --input-type=module <<'PROOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { createNodeTestShardBundles } from './scripts/lib/ci-node-test-plan.mts';
          const dir = path.join(process.env.RUNNER_TEMP, 'compact-plan-79');
          const report = JSON.parse(fs.readFileSync(path.join(dir, 'candidate.json'), 'utf8'));
          const suites = report.testResults;
          assert.equal(report.success, true);
          assert.equal(suites.length, 1);
          assert.ok(suites[0].name.endsWith('/test/scripts/ci-node-test-plan.test.ts'));
          const cases = suites[0].assertionResults;
          const passed = cases.filter(test => test.status === 'passed');
          assert.equal(passed.length, 1);
          assert.equal(passed[0].title, 'keeps the scheduled main inventory within its reserved compact capacity');
          assert.ok(cases.every(test => ['passed', 'pending', 'skipped', 'todo'].includes(test.status)));
          const options = { includeProofTests:true, includeReleaseOnlyPluginShards:false, includeReleaseOnlyToolingShards:true, includeReleaseOnlyRuntimeTests:false, includePrExemptRuntimeTests:true, compactMode:'pull-request', compactNodeJobCap:76, runnerBackend:'hybrid' };
          const jobs = createNodeTestShardBundles(options);
          assert.ok(jobs.length <= 78);
          assert.ok(jobs.filter(job => !job.requiresDist).length <= 76);
          fs.writeFileSync(path.join(dir, 'candidate-plan.json'), JSON.stringify(jobs, null, 2));
          console.log(JSON.stringify({ passed: passed.length, skipped: cases.length - passed.length, jobs: jobs.length, nondist: jobs.filter(job => !job.requiresDist).length }));
          PROOF
          git diff --exit-code HEAD --

      - name: Preserve exact planner proof
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-compact-plan-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/compact-plan-79/
          if-no-files-found: error
          retention-days: 14
