# Temporary proof only; never merge this workflow branch.
name: Red-main preparation notification proof
run-name: Preparation notification proof ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Reviewed full candidate commit SHA
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-preparation-notification-${{ github.ref }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"
jobs:
  preparation-notification:
    name: Preparation notification baseline and candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate and its parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p "$RUNNER_TEMP/preparation-notification"
          {
            echo "Candidate: $EXPECTED_SHA"
            echo "Workflow: $WORKFLOW_SHA"
            git rev-parse HEAD^
            git diff-tree --no-commit-id --name-only -r HEAD
            git ls-tree HEAD -- src/agents/main-session-recovery/main-session-restart-recovery-runtime.ts src/agents/main-session-recovery/main-session-restart-recovery-admission.test.ts
          } | tee "$RUNNER_TEMP/preparation-notification/provenance.txt"
          cat "$RUNNER_TEMP/preparation-notification/provenance.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "true"
          vitest-worker-cache: "true"
          node-compile-cache: "true"
      - name: Run only diagnosed preparation recovery cases
        id: regression
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, time
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'preparation-notification'
          runtime = pathlib.Path('src/agents/main-session-recovery/main-session-restart-recovery-runtime.ts')
          test = 'src/agents/main-session-recovery/main-session-restart-recovery-admission.test.ts'
          candidate = runtime.read_bytes()
          baseline = subprocess.check_output(['git', 'show', 'HEAD^:' + str(runtime)])
          assert candidate != baseline, 'Candidate must contain the runtime repair'
          receipts = {}
          def run(name, selection):
              cmd = ['pnpm', 'test', test, '--maxWorkers=1', '-t', selection, '--reporter=verbose']
              started = time.monotonic()
              with (proof / (name + '.log')).open('w') as log:
                  completed = subprocess.run(cmd, stdout=log, stderr=subprocess.STDOUT)
              receipts[name] = {'command': cmd, 'exit_code': completed.returncode, 'wall_seconds': time.monotonic() - started}
              (proof / 'results.json').write_text(json.dumps(receipts, indent=2) + '\n')
              print((proof / (name + '.log')).read_text(), flush=True)
              return completed.returncode
          try:
              runtime.write_bytes(baseline)
              before = run('baseline', r'handles resume when initializationPending preparation finishes after startup \(startup replay\)')
          finally:
              runtime.write_bytes(candidate)
          after = run('candidate', 'handles resume when initializationPending')
          assert runtime.read_bytes() == candidate
          receipts['source'] = {'candidate_runtime_sha256': hashlib.sha256(candidate).hexdigest(), 'baseline_runtime_sha256': hashlib.sha256(baseline).hexdigest(), 'test_sha256': hashlib.sha256(pathlib.Path(test).read_bytes()).hexdigest()}
          (proof / 'results.json').write_text(json.dumps(receipts, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Baseline exit: {before}; candidate exit: {after}. Baseline failure still requires intended-assertion audit.\n')
          if before == 0 or after != 0:
              raise SystemExit(1)
          PY
      - name: Verify candidate source restoration
        if: ${{ always() }}
        shell: bash
        run: |
          git diff --exit-code -- src/agents/main-session-recovery/main-session-restart-recovery-runtime.ts src/agents/main-session-recovery/main-session-restart-recovery-admission.test.ts
      - name: Preserve focused proof
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-preparation-notification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preparation-notification/
          if-no-files-found: warn
          retention-days: 14
