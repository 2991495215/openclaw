# Temporary focused proof only. Do not merge this workflow.
name: Red-main Codex recovery fixture proof
run-name: Codex memory-disabled recovery full file ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        type: string
        required: true
      source_sha:
        type: string
        required: true
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify reviewed fixture source and scheduled-main parent
        env:
          DIAGNOSTIC_SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIAGNOSTIC_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_SOURCE_SHA"
          test "$(git rev-parse HEAD^)" = 2597a1aaa98f7d20755a7d65d5d97c770b40c1b3
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
      - name: Run Codex recovery file including cancellation
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/codex-physical-exit
          pnpm test src/gateway/server.codex-failure-recovery.test.ts --maxWorkers=1 2>&1 | tee .artifacts/codex-physical-exit/test.log
      - name: Verify unchanged fixture source
        if: ${{ always() }}
        run: git diff --exit-code
      - name: Preserve diagnostic log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codex-recovery-memory-disabled-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/codex-physical-exit/test.log
          retention-days: 7
