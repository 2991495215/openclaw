name: Red-main Windows PTY diagnostics proof
run-name: Windows PTY ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full reviewed candidate commit SHA
        type: string
        required: true
      workflow_sha:
        description: Expected workflow carrier commit SHA
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-windows-pty-diagnostics
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  windows-pty:
    name: Exact admitted node-pty diagnostics case
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      OPENCLAW_TEST_SKIP_FULL_EXTENSIONS_SHARD: "1"
      OPENCLAW_TEST_PROJECTS_PARALLEL: "1"
      OPENCLAW_VITEST_MAX_WORKERS: "1"
      OPENCLAW_VITEST_RUNTIME: node
      OPENCLAW_CI_TEST_RUNTIME_POLICY: node
    steps:
      - name: Checkout reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify and record source provenance
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          git diff --exit-code HEAD --
          proof_dir="$RUNNER_TEMP/terminal-pty-platform"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- \
              src/process/terminal-pty.test.ts \
              src/process/terminal-pty.ts \
              src/process/spawn-diagnostics.ts \
              src/infra/tmp-openclaw-dir.ts \
              scripts/test-projects.mts \
              pnpm-lock.yaml
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pinned pnpm
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: "off"

      - name: Install frozen dependencies
        env:
          CI: "true"
        run: |
          set -euo pipefail
          node -e 'if (process.platform !== "win32" || process.versions.node !== "24.21.0") throw new Error("Expected native Windows Node 24.21.0"); console.log(JSON.stringify({platform: process.platform, node: process.versions.node}));'
          pnpm -v
          pnpm install --frozen-lockfile --prefer-offline --config.ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true --config.side-effects-cache=true

      - name: Run the exact failing node-pty case
        id: pty_test
        timeout-minutes: 10
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/terminal-pty-platform"
          node --import ./scripts/tsx.mjs scripts/test-projects.mts \
            src/process/terminal-pty.test.ts \
            --maxWorkers=1 \
            -t 'counts an admitted node-pty PTY once with the agent owner' \
            --reporter=verbose --reporter=json \
            --outputFile.json "$proof_dir/vitest.json" \
            2>&1 | tee "$proof_dir/test.log"
          node --input-type=module <<'PROOF'
          import fs from "node:fs";
          import path from "node:path";
          const report = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, "terminal-pty-platform", "vitest.json"), "utf8"));
          const passed = report.testResults.flatMap((suite) => suite.assertionResults).filter((test) => test.status === "passed");
          if (report.success !== true || passed.length !== 1 || passed[0].title !== "counts an admitted node-pty PTY once with the agent owner") {
            throw new Error("Expected exactly the selected node-pty regression case to pass");
          }
          console.log(`Verified selected case: ${passed[0].fullName}`);
          PROOF

      - name: Record result and unchanged candidate
        if: ${{ always() }}
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          TEST_OUTCOME: ${{ steps.pty_test.outcome }}
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/terminal-pty-platform"
          mkdir -p "$proof_dir"
          echo "Exact Windows node-pty case: $TEST_OUTCOME" | tee "$proof_dir/outcome.txt"
          cat "$proof_dir/outcome.txt" >> "$GITHUB_STEP_SUMMARY"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --
          test "$TEST_OUTCOME" = success

      - name: Preserve native Windows proof
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-windows-pty-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/terminal-pty-platform/
          if-no-files-found: warn
          retention-days: 14
