name: Red-main portal IPv6 diagnostic
run-name: Portal IPv6 diagnostic ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full unmodified source commit SHA
        type: string
        required: true
      workflow_sha:
        description: Expected proof carrier commit SHA
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-portal-ipv6-diagnostic
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.19.0"

jobs:
  portal-ipv6:
    name: Exact portal IPv6 diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      OPENCLAW_TEST_SKIP_FULL_EXTENSIONS_SHARD: "1"
      OPENCLAW_TEST_PROJECTS_PARALLEL: "1"
      OPENCLAW_VITEST_MAX_WORKERS: "1"
      OPENCLAW_VITEST_RUNTIME: node
      OPENCLAW_CI_TEST_RUNTIME_POLICY: node
    steps:
      - name: Checkout reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify and record source provenance
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          git diff --exit-code HEAD --
          proof_dir="$RUNNER_TEMP/portal-ipv6"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- src/gateway/portals/portal-http-proxy.test.ts src/gateway/portals/portal-http-proxy.ts src/infra/loopback-connect.ts src/test-utils/port-claims.ts pnpm-lock.yaml
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pinned pnpm
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: "off"

      - name: Install frozen dependencies
        env:
          CI: "true"
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prefer-offline --config.ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true --config.side-effects-cache=true

      - name: Diagnose exact failed IPv6 case
        id: candidate
        env:
          NODE_DEBUG: net
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/portal-ipv6"
          git diff --exit-code HEAD --
          node --version | tee "$proof_dir/node-version.txt"
          node --import ./scripts/tsx.mjs scripts/test-projects.mts src/gateway/portals/portal-http-proxy.test.ts --maxWorkers=1 -t 'reaches IPv6-only targets through the localhost dual-stack dial' --reporter=verbose --reporter=json --outputFile.json "$proof_dir/candidate.json" 2>&1 | tee "$proof_dir/candidate.log"
          node --input-type=module <<'PROOF'
          import fs from "node:fs";
          import path from "node:path";
          const report = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, "portal-ipv6", "candidate.json"), "utf8"));
          const cases = report.testResults.flatMap((suite) => suite.assertionResults);
          const selected = cases.filter((test) => !["pending", "skipped", "todo"].includes(test.status));
          if (report.success !== true || selected.length !== 1 || selected[0].status !== "passed" || selected[0].title !== "reaches IPv6-only targets through the localhost dual-stack dial") {
            throw new Error("Expected exactly the selected portal IPv6 case to pass");
          }
          console.log(`Verified candidate pass: ${selected[0].fullName}; ${cases.length - selected.length} unselected`);
          PROOF

      - name: Record results and unchanged candidate
        if: ${{ always() }}
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/portal-ipv6"
          mkdir -p "$proof_dir"
          echo "Candidate pass: $CANDIDATE_OUTCOME" | tee "$proof_dir/outcome.txt"
          cat "$proof_dir/outcome.txt" >> "$GITHUB_STEP_SUMMARY"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --
          test "$CANDIDATE_OUTCOME" = success

      - name: Preserve focused IPv6 diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-portal-ipv6-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/portal-ipv6/
          if-no-files-found: warn
          retention-days: 14
