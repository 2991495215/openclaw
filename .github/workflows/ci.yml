# Diagnostic carrier only. Never merge this workflow into main.
name: Red-main sidebar occlusion phase diagnostic
run-name: Sidebar occlusion phases ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-sidebar-occlusion-phase
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  sidebar-occlusion:
    name: Three original sidebar cases with phase records
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 64159240da99ea40950c21e716d28a1a19a0ac7c
          fetch-depth: 1
          persist-credentials: false

      - name: Record source and apply phase-only observations
        shell: bash
        env:
          EXPECTED_SHA: 64159240da99ea40950c21e716d28a1a19a0ac7c
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD:ui/src/components/app-sidebar-session-filter.browser.test.ts)" = 29a0ee2bf1e7cd84d2e2b5c03dfdc232f6dc1f97
          proof_dir="$RUNNER_TEMP/sidebar-occlusion-phase"
          mkdir -p "$proof_dir"
          {
            echo "Source: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- ui/src/components/app-sidebar-session-filter.browser.test.ts ui/src/components/sidebar-session-filter-popover.ts ui/src/lib/native-overlay-occlusion.ts ui/src/components/select-picker.ts
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"
          cat > "$proof_dir/instrumentation.patch" <<'PATCH'
          --- a/ui/src/components/app-sidebar-session-filter.browser.test.ts
          +++ b/ui/src/components/app-sidebar-session-filter.browser.test.ts
          @@ -83,9 +83,56 @@
                 const { sidebar, page } = await mountFilters(width);
                 sidebar.dir = direction;
                 const occlusion: boolean[] = [];
          +      // PHASE DIAGNOSTIC BEGIN setup
          +      let occlusionPhase = "before-first-filter-click";
          +      const occlusionTrace: unknown[] = [];
          +      const recordOcclusion = (kind: string, value?: boolean) => {
          +        const elements = new Set(
          +          document.querySelectorAll<HTMLElement>(
          +            "openclaw-sidebar-session-filter-popover, openclaw-menu-surface, .sidebar-session-filter-panel, .sidebar-session-filter-panel__backdrop, [popover]",
          +          ),
          +        );
          +        for (const tooltip of document.querySelectorAll("openclaw-tooltip")) {
          +          for (const surface of tooltip.shadowRoot?.querySelectorAll<HTMLElement>('[role="tooltip"]') ?? []) {
          +            elements.add(surface);
          +          }
          +        }
          +        occlusionTrace.push({
          +          kind,
          +          phase: occlusionPhase,
          +          at: performance.now(),
          +          value,
          +          history: [...occlusion],
          +          focused: document.activeElement?.getAttribute("aria-label") ?? document.activeElement?.localName,
          +          hovered: [...document.querySelectorAll("button:hover")].map((element) => element.getAttribute("aria-label") ?? element.className),
          +          ownersExpanded: sidebar.querySelector("#sidebar-session-owner-title")?.getAttribute("aria-expanded"),
          +          surfaces: [...elements].map((element) => {
          +            const root = element.getRootNode();
          +            return {
          +              tag: element.localName,
          +              class: element.className,
          +              role: element.getAttribute("role"),
          +              phase: element.dataset.phase,
          +              connected: element.isConnected,
          +              popoverOpen: element.matches(":popover-open"),
          +              host: root instanceof ShadowRoot ? root.host.localName : undefined,
          +              rect: element.getBoundingClientRect().toJSON(),
          +            };
          +          }),
          +        });
          +      };
          +      onTestFinished(() => {
          +        console.info("SIDEBAR_OCCLUSION_PHASE", JSON.stringify({ width, direction, events: occlusionTrace }));
          +      });
          +      // PHASE DIAGNOSTIC END setup
                 onTestFinished(
                   subscribeNativeOverlayOcclusion(
          -          (value) => occlusion.push(value),
          +          (value) => {
          +            occlusion.push(value);
          +            // PHASE DIAGNOSTIC BEGIN callback
          +            recordOcclusion("callback", value);
          +            // PHASE DIAGNOSTIC END callback
          +          },
                     () => new DOMRect(0, 0, innerWidth, innerHeight),
                   ),
                 );
          @@ -145,8 +192,19 @@
                 await expect.poll(() => ownerOptions(sidebar)).toHaveLength(4);
                 await userEvent.keyboard("{Escape}");
                 await expect.element(owners).toHaveFocus();
          +      // PHASE DIAGNOSTIC BEGIN before-click
          +      occlusionPhase = "first-filter-click";
          +      recordOcclusion("before-first-filter-click");
          +      // PHASE DIAGNOSTIC END before-click
                 await trigger.click();
          +      // PHASE DIAGNOSTIC BEGIN after-click
          +      occlusionPhase = "first-filter-click-completed";
          +      recordOcclusion("after-first-filter-click");
          +      // PHASE DIAGNOSTIC END after-click
                 await expect.poll(() => occlusion).toEqual([false, true]);
          +      // PHASE DIAGNOSTIC BEGIN after-assertion
          +      occlusionPhase = "remaining-filter-flow";
          +      // PHASE DIAGNOSTIC END after-assertion
                 await expectFits();
                 await expect.element(active).toHaveFocus();
                 await userEvent.keyboard(direction === "rtl" ? "{ArrowLeft}" : "{ArrowRight}");
          PATCH
          echo '5fdb635077ba03a50f3c63779763c1fe119d6b7e199e02dd26c6b03669de0fa9  '"$proof_dir/instrumentation.patch" | sha256sum --check
          git apply --check "$proof_dir/instrumentation.patch"
          git apply "$proof_dir/instrumentation.patch"

      - name: Setup Node and the CI Bun runtime
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: restore
          install-bun: "true"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "true"
          vitest-worker-cache: "false"
          node-compile-cache: "true"

      - name: Setup Chromium
        uses: ./.github/actions/setup-playwright-chromium
        with:
          cache-mode: restore

      - name: Run the three original keyboard and geometry cases once
        id: cases
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: bun
          OPENCLAW_CI_TEST_RUNTIME_POLICY: bun-compatible
          OPENCLAW_VITEST_MAX_WORKERS: "1"
        run: |
          set -euo pipefail
          node scripts/run-vitest.mjs run \
            --config ui/vitest.config.ts \
            --configLoader runner \
            --project chromium \
            --maxWorkers 1 \
            --reporter=verbose \
            ui/src/components/app-sidebar-session-filter.browser.test.ts \
            -t 'keeps keyboard navigation, focus and surface inside the viewport at (1440 px \(ltr\)|390 px \((ltr|rtl)\))$' \
            2>&1 | tee "$RUNNER_TEMP/sidebar-occlusion-phase/cases.log"

      - name: Record outcome and unchanged original assertions
        if: ${{ always() }}
        shell: bash
        env:
          CASE_OUTCOME: ${{ steps.cases.outcome }}
        run: |
          set -euo pipefail
          echo "Original cases with phase records: $CASE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          file = "ui/src/components/app-sidebar-session-filter.browser.test.ts"
          original = subprocess.check_output(["git", "show", "HEAD:" + file], text=True)
          diagnostic = Path(file).read_text()
          restored, count = re.subn(r"^ *// PHASE DIAGNOSTIC BEGIN [^\n]+\n.*?^ *// PHASE DIAGNOSTIC END [^\n]+\n", "", diagnostic, flags=re.MULTILINE | re.DOTALL)
          assert count == 5
          wrapped = "          (value) => {\n            occlusion.push(value);\n          },"
          assert restored.count(wrapped) == 1
          restored = restored.replace(wrapped, "          (value) => occlusion.push(value),")
          assert restored == original, "Original case order, statements, assertions or deadlines changed"
          print("Original three cases, statements, assertions and deadlines preserved")
          PY
          git diff --exit-code -- ui/src/components/sidebar-collapse-toggle.tsx ui/src/lib/native-overlay-occlusion.ts ui/src/components/select-picker.ts ui/src/components/sidebar-session-filter-popover.ts

      - name: Preserve phase evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sidebar-occlusion-phase-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sidebar-occlusion-phase/
          if-no-files-found: warn
          retention-days: 14
