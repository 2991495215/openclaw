# PROOF ONLY: diagnosed full-tree export failure; never merge this workflow.
name: Red-main Static inventory Bash and Wear
run-name: Static inventory Bash and Wear ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
      workflow_sha:
        description: Exact proof workflow commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-static-bash-wear-proof
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.19.0"
jobs:
  static-bash-wear-proof:
    name: Diagnosed static and Bash failures
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pinned candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 428cd4484d694fd10dc3cbf37d3df51f36cd3f69
          fetch-depth: 5
          persist-credentials: false
      - name: Record source provenance
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 428cd4484d694fd10dc3cbf37d3df51f36cd3f69
          git diff --exit-code HEAD --
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          mkdir -p "$RUNNER_TEMP/static-bash-wear-proof"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git diff --stat HEAD~4 HEAD
            git ls-tree HEAD -- package.json pnpm-lock.yaml config/knip.all-exports.config.ts test/scripts/lint-suppressions.test.ts config/knip.all-exports.config.ts scripts/check-deadcode-exports.mts
          } | tee "$RUNNER_TEMP/static-bash-wear-proof/provenance.txt"
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
          node-compile-cache: "true"
      - name: Check changed helper
        shell: bash
        run: |
          set -euo pipefail
          node_modules/.bin/oxfmt --check --threads=1 config/knip.all-exports.config.ts test/scripts/lint-suppressions.test.ts
          node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.json config/knip.all-exports.config.ts test/scripts/lint-suppressions.test.ts
          git diff --check HEAD~4 HEAD
      - name: Replay diagnosed export and UI checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess, time
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'static-bash-wear-proof'
          commands = {
            'all-files': ['pnpm', 'dlx', '--package', 'knip@6.32.2', 'knip', '--config', 'config/knip.all-exports.config.ts', '--no-progress', '--reporter', 'compact', '--files', '--no-config-hints'],
            'suppressions': ['pnpm', 'test', 'test/scripts/lint-suppressions.test.ts', '--maxWorkers=1'],
            'bash': ['pnpm', 'test', 'test/scripts/build-and-run-mac.test.ts', '--maxWorkers=1', '-t', 'keeps system-Bash entrypoints and their sourced libraries compatible with Bash 3.2'],
          }
          results = {}
          for name, command in commands.items():
              started = time.monotonic()
              with (proof / (name + '.log')).open('w', encoding='utf-8') as log:
                  process = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, encoding='utf-8', errors='replace')
                  for line in process.stdout:
                      print(line, end='', flush=True)
                      log.write(line)
                  result = process.wait()
              results[name] = {'exit_code': result, 'elapsed_seconds': time.monotonic() - started, 'command': command}
              (proof / 'execution.json').write_text(json.dumps(results, indent=2) + '\n')
          print(json.dumps(results))
          raise SystemExit(int(any(r['exit_code'] for r in results.values())))
          PYTHON
      - name: Verify unchanged sources
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 428cd4484d694fd10dc3cbf37d3df51f36cd3f69
          git status --short
          git diff --exit-code HEAD --
      - name: Preserve proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-static-bash-wear-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/static-bash-wear-proof/
          if-no-files-found: warn
          retention-days: 14

  wear-abort-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 428cd4484d694fd10dc3cbf37d3df51f36cd3f69
          fetch-depth: 1
          persist-credentials: false
      - name: Record candidate and workflow provenance
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 428cd4484d694fd10dc3cbf37d3df51f36cd3f69
          proof_dir="$RUNNER_TEMP/wear-abort-proof"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- apps/android/wear/src/test/java/ai/openclaw/wear/WearChatEventFlowTest.kt apps/android/wear/src/main/java/ai/openclaw/wear/WearReplySpeaker.kt
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Setup Android toolchain
        id: android-toolchain
        uses: ./.github/actions/setup-android-toolchain
        with:
          cache-mode: restore
      - name: Setup Node environment for native resources
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: restore
          install-bun: "false"
          install-deps: "false"
      - name: Install native asset dependencies
        env:
          CI: "true"
        run: >-
          pnpm install --frozen-lockfile --prefer-offline --optional
          --filter '@openclaw/mermaid-renderer...'
          --filter '@openclaw/gateway-protocol...'
          --config.ignore-scripts=false
          --config.engine-strict=false
          --config.enable-pre-post-scripts=true
          --config.side-effects-cache=true
      - name: Restore Robolectric Maven cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/tmp/openclaw-robolectric-m2
          key: ${{ github.repository }}-robolectric-m2-v1-${{ runner.os }}-${{ runner.arch }}-test-third-party-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/**/gradle-wrapper.properties', 'apps/android/gradle/libs.versions.toml', 'apps/android/**/src/test*/**') }}
          restore-keys: |
            ${{ github.repository }}-robolectric-m2-v1-${{ runner.os }}-${{ runner.arch }}-test-third-party-
      - name: Configure Robolectric Maven cache and JVM evidence
        run: |
          set -euo pipefail
          maven_repo=/var/tmp/openclaw-robolectric-m2
          init_script="$RUNNER_TEMP/openclaw-robolectric-init.gradle"
          mkdir -p "$maven_repo"
          cat >"$init_script" <<'GROOVY'
          println "Gradle JVM: runtime=${System.getProperty('java.runtime.version')} vendor=${System.getProperty('java.vendor')} home=${System.getProperty('java.home')}"
          allprojects {
            tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
              systemProperty "maven.repo.local", System.getenv("OPENCLAW_ROBOLECTRIC_M2")
              doFirst {
                def metadata = javaLauncher.get().metadata
                logger.lifecycle("Test JVM ${path}: runtime=${metadata.javaRuntimeVersion} vendor=${metadata.vendor} home=${metadata.installationPath.asFile} forks=${maxParallelForks}")
              }
            }
          }
          GROOVY
          echo "OPENCLAW_ROBOLECTRIC_M2=$maven_repo" >> "$GITHUB_ENV"
          echo "OPENCLAW_ROBOLECTRIC_INIT=$init_script" >> "$GITHUB_ENV"
      - name: Run only the originally failing Wear abort test method
        working-directory: apps/android
        env:
          JAVA_HOME: ${{ steps.android-toolchain.outputs.gradle-java-home }}
        run: |
          set -euo pipefail
          test_case=ai.openclaw.wear.WearChatEventFlowTest.appOwnAbortFollowsConfirmedOutcomeRatherThanTheRequest
          ./gradlew --no-daemon --build-cache --init-script "$OPENCLAW_ROBOLECTRIC_INIT" \
            :wear:ktlintTestSourceSetCheck :wear:testDebugUnitTest --tests "$test_case" \
            2>&1 | tee "$RUNNER_TEMP/wear-abort-proof/gradle.log"
      - name: Verify the selected test executed and passed
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          path = pathlib.Path('apps/android/wear/build/test-results/testDebugUnitTest/TEST-ai.openclaw.wear.WearChatEventFlowTest.xml')
          suite = ET.parse(path).getroot()
          cases = suite.findall('testcase')
          assert len(cases) == 1, f'Expected exactly one test, got {len(cases)}'
          case = cases[0]
          assert case.attrib['classname'] == 'ai.openclaw.wear.WearChatEventFlowTest'
          assert case.attrib['name'] == 'appOwnAbortFollowsConfirmedOutcomeRatherThanTheRequest'
          assert not any(case.find(tag) is not None for tag in ('failure', 'error', 'skipped')), 'Selected test did not pass'
          for key in ('failures', 'errors', 'skipped'):
              assert int(suite.get(key, '0')) == 0, f'Unexpected {key}'
          result = {'test': case.attrib['name'], 'tests': 1, 'seconds': float(case.attrib['time']), 'passed': True}
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'wear-abort-proof'
          (proof / 'result.json').write_text(json.dumps(result, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"\nPassed exactly one selected test in {result['seconds']} seconds.\n")
          print(json.dumps(result))
          PY
      - name: Upload focused proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: wear-abort-proof-proof
          path: |
            ${{ runner.temp }}/wear-abort-proof
            apps/android/wear/build/test-results/testDebugUnitTest
            apps/android/wear/build/reports/tests/testDebugUnitTest
          if-no-files-found: error
