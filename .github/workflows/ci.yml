# Temporary focused proof only. Never merge this workflow.
name: Red-main Workboard French locale proof
run-name: Workboard French locale ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full reviewed candidate commit SHA
        type: string
        required: true
      workflow_sha:
        description: Full proof workflow commit SHA
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-workboard-locale-${{ github.ref }}-${{ inputs.source_sha }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OPENCLAW_LOCAL_CHECK: "0"
  OPENCLAW_VITEST_RUNTIME: node
  OPENCLAW_UI_E2E_SKIP_REAL_GATEWAY: "1"

jobs:
  french-locale:
    name: Exact Workboard French locale regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify candidate and workflow identity
        shell: bash
        env:
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          echo 'cd15064752a291310c2c2110f1284a490374e99647896e24f1efa7e7bb54d60d  ui/src/e2e/workboard-locale.e2e.test.ts' | sha256sum --check
          proof_dir="$RUNNER_TEMP/workboard-locale"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $SOURCE_SHA"
            echo "Workflow: $WORKFLOW_SHA"
            git show -s --format='%H%n%P%n%s' HEAD
            git ls-tree HEAD -- package.json pnpm-lock.yaml \
              ui/src/e2e/workboard-locale.e2e.test.ts \
              extensions/workboard/browser/i18n/locales/translated.json \
              extensions/workboard/browser/pages/workboard/workboard-page.tsx \
              extensions/workboard/browser/pages/workboard/view-board-modal.tsx \
              test/vitest/vitest.ui-e2e.config.ts \
              test/vitest/vitest.ui-e2e.bundled.global-setup.ts
          } | tee "$proof_dir/provenance.log"
          cat "$proof_dir/provenance.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup frozen Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"

      - name: Setup Chromium
        uses: ./.github/actions/setup-playwright-chromium
        with:
          cache-mode: restore

      - name: Run exact French locale case
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.19.0
          proof_dir="$RUNNER_TEMP/workboard-locale"
          {
            node --version
            pnpm --version
            echo 'Scope: ui-e2e-bundled / ui/src/e2e/workboard-locale.e2e.test.ts / loads plugin copy in fr and preserves drafts across a live locale switch'
          } | tee "$proof_dir/command.log"
          started="$(date +%s)"
          if node scripts/run-vitest.mjs run \
            --config test/vitest/vitest.ui-e2e.config.ts \
            --configLoader runner \
            --project ui-e2e-bundled \
            --maxWorkers 1 \
            ui/src/e2e/workboard-locale.e2e.test.ts \
            -t 'loads plugin copy in fr and preserves drafts across a live locale switch' \
            --reporter=default --reporter=json --outputFile="$proof_dir/vitest.json" \
            2>&1 | tee "$proof_dir/test.log"; then
            test_exit=0
          else
            test_exit=$?
          fi
          {
            echo "Test exit: $test_exit"
            echo "Elapsed seconds: $(( $(date +%s) - started ))"
          } | tee "$proof_dir/result.txt" >> "$GITHUB_STEP_SUMMARY"
          test "$test_exit" -eq 0
          node --input-type=module - "$proof_dir/vitest.json" <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const passed = report.testResults.flatMap((file) => file.assertionResults)
            .filter((result) => result.status === 'passed');
          assert.equal(passed.length, 1);
          assert.equal(passed[0].title, 'loads plugin copy in fr and preserves drafts across a live locale switch');
          assert.equal(report.numFailedTests, 0);
          console.log('Verified exactly the requested French case passed.');
          NODE

      - name: Verify tracked source stayed unchanged
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code HEAD --

      - name: Preserve textual focused evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-workboard-locale-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workboard-locale/
          if-no-files-found: warn
          retention-days: 14
