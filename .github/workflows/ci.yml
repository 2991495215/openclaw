# Focused coverage fallback: ordinary PR CI omitted the original image-auth test file.
# Setup owner: status-usage-focused-workflow.yml. No private QA runtime is needed.
name: Red-main image auth proof
run-name: Image auth 30edf5f4bed3 ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-image-auth-proof-30edf5f4bed3
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  image-auth-proof:
    name: Image auth original six cases
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 30edf5f4bed3e34b3aab06d39c8a914b976ff76d
          fetch-depth: 1
          persist-credentials: false

      - name: Record candidate sources
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 30edf5f4bed3e34b3aab06d39c8a914b976ff76d
          proof_dir="$RUNNER_TEMP/image-auth-proof"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- test/vitest/vitest.database-worker-core-paths.mjs test/vitest-scoped-config.test.ts src/agents/tools/image-generate-tool.auth.test.ts
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "true"
          vitest-worker-cache: "false"
          node-compile-cache: "true"

      - name: Run original image-auth test file
        id: image_auth_cases
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          pnpm test src/agents/tools/image-generate-tool.auth.test.ts --maxWorkers=1 --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/image-auth-proof/image-auth-cases.log"

      - name: Record outcome and verify unchanged sources
        if: ${{ always() }}
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.image_auth_cases.outcome }}
        run: |
          set -euo pipefail
          echo "Image-auth original six cases: $TEST_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          git status --short
          git diff --exit-code -- test/vitest/vitest.database-worker-core-paths.mjs test/vitest-scoped-config.test.ts src/agents/tools/image-generate-tool.auth.test.ts

      - name: Preserve proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-image-auth-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-auth-proof/
          if-no-files-found: warn
          retention-days: 14
