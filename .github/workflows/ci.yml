# Temporary exact-candidate proof only. Never merge this workflow.
name: Red-main Knip owner repair proof
run-name: Knip owner repair ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Reviewed full candidate commit SHA
        type: string
        required: true
      workflow_sha:
        description: Expected full workflow carrier commit SHA
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-knip-owner-repair-${{ github.ref }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  check-exports:
    name: Unused exports and benchmark entry (exact candidate)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record candidate source and workflow provenance
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --
          mkdir -p .artifacts/knip-owner-repair
          {
            echo "Candidate: $actual_sha"
            echo "Workflow: $WORKFLOW_SHA"
            git show -s --format='%H%n%P%n%an <%ae>%n%s' HEAD
            git ls-tree HEAD -- \
              package.json pnpm-lock.yaml \
              scripts/check-deadcode-exports.mts scripts/check-deadcode-unused-files.mts \
              scripts/deadcode-knip-runner.mts \
              config/knip.config.ts config/knip.all-exports.config.ts \
              src/agents/model-catalog.ts ui/src/components/config-form.node.shared.ts \
              scripts/perf/post-restart-burst-measure.ts scripts/perf/README.md
          } | tee .artifacts/knip-owner-repair/provenance.log
          cat .artifacts/knip-owner-repair/provenance.log >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"

      - name: Run affected static scopes once
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
        run: |
          set -euo pipefail
          node --import ./scripts/tsx.mjs --input-type=module <<'NODE' 2>&1 | tee .artifacts/knip-owner-repair/static-scopes.log
          import { runKnip } from './scripts/deadcode-knip-runner.mts';
          import { checkExportScan } from './scripts/check-deadcode-exports.mts';
          import { checkKnipUnusedFileScanResult } from './scripts/check-deadcode-unused-files.mts';
          const common = ['--no-progress', '--reporter', 'compact', '--include',
            'exports,nsExports,types,nsTypes,enumMembers,namespaceMembers', '--no-config-hints'];
          const scopes = [
            ['production unused-export scan', ['--config', 'config/knip.config.ts', '--production']],
            ['full-tree unused-export scan', ['--config', 'config/knip.all-exports.config.ts']],
          ];
          for (const [name, args] of scopes) {
            const result = await runKnip([...args, ...common], { scanName: name });
            if (result.output) console.log(result.output);
            const verdict = checkExportScan(name, result.output);
            if (result.errorCode || result.status !== 0 || !verdict.ok) {
              console.error(`${name}: FAILED`, result.errorCode ?? result.signal ?? result.status,
                result.errorMessage ?? '', verdict.message);
              process.exitCode = 1;
            } else {
              console.log(`[deadcode] Knip ${name} passed with 0 entries.`);
            }
          }
          const fileScanName = 'full-tree unused-file scan';
          const fileResult = await runKnip([
            '--config', 'config/knip.all-exports.config.ts', '--no-progress',
            '--reporter', 'compact', '--files', '--no-config-hints',
          ], { scanName: fileScanName });
          if (fileResult.output) console.log(fileResult.output);
          const fileVerdict = checkKnipUnusedFileScanResult(fileResult);
          if (!fileVerdict.ok) {
            console.error(`${fileScanName}: FAILED`, fileVerdict.failureReason,
              fileResult.errorMessage ?? '', fileVerdict.message);
            process.exitCode = 1;
          } else {
            console.log(`[deadcode] Knip ${fileScanName} passed with 0 entries.`);
          }
          NODE

      - name: Verify candidate source remained unchanged
        if: ${{ always() }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --
          echo "Tracked candidate source remained unchanged." >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve export outcomes and provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-knip-owner-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/knip-owner-repair/
          if-no-files-found: warn
          retention-days: 14
