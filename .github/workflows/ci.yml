# Temporary focused proof only. Fill all __...__ hashes; never merge into main.
name: Red-main auth schema admission proof
run-name: Auth schema admission ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-auth-schema-admission-proof
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CANDIDATE_SHA: 3c9db8d5fbaf70d541bbb61afd3640490dd86ff5
  PARENT_SHA: 8b2d702d9fc37bdb0ea789b76fe783faeb930d63
  PRODUCTION_BLOB: ce7e4ef60bd76ac5f233bf76d941ab810301388a
  REGRESSION_BLOB: 47c0f164127fa405ef3ad3906eb03200c8787141
  PARENT_PRODUCTION_BLOB: d5d1abbf9f29042c29fe9318a7ff14fceedfe68d

jobs:
  auth-schema-admission:
    name: Exact schema-zero baseline and candidate proof
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENCLAW_LOCAL_CHECK: "0"
      OPENCLAW_VITEST_RUNTIME: node
    steps:
      - name: Checkout exact reviewed candidate and its parent
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 3c9db8d5fbaf70d541bbb61afd3640490dd86ff5
          fetch-depth: 2
          persist-credentials: false

      - name: Verify source identity and record provenance
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          for object in "$CANDIDATE_SHA" "$PARENT_SHA" "$PRODUCTION_BLOB" "$REGRESSION_BLOB" "$PARENT_PRODUCTION_BLOB"; do
            [[ "$object" =~ ^[a-f0-9]{40}$ ]]
          done
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD:src/agents/auth-profiles/sqlite-json.ts)" = "$PRODUCTION_BLOB"
          test "$(git rev-parse HEAD:src/infra/sqlite-readonly-worker.auth.test.ts)" = "$REGRESSION_BLOB"
          test "$(git rev-parse "$PARENT_SHA:src/agents/auth-profiles/sqlite-json.ts")" = "$PARENT_PRODUCTION_BLOB"
          test "$(git rev-parse HEAD:src/agents/auth-profiles.sqlite-read-pool.test.ts)" = 391726a458e9ffb74753bdefbb51eae45a7236e6
          test "$(git rev-parse HEAD:ui/src/e2e/command-palette-catalog.real-gateway.e2e.test.ts)" = 334c146507b1887c4901d69d6f3b75e1c704d0a8
          test "$(git rev-parse HEAD:test/vitest/vitest.ui-e2e-prebuilt.config.ts)" = 6d5c4c39f8c8bbf13655aec69bb404b810a7b5d3
          test "$(git rev-parse HEAD:test/vitest/vitest.ui-e2e-prebuilt.global-setup.ts)" = f27a8cefc1300db1620526d82beccd593c7a5ded
          proof_dir="$RUNNER_TEMP/auth-schema-admission-proof"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $CANDIDATE_SHA"
            echo "Parent: $PARENT_SHA"
            echo "Workflow: $WORKFLOW_SHA"
            git show --format=fuller --stat --no-renames HEAD
            git ls-tree HEAD -- src/agents/auth-profiles/sqlite-json.ts src/infra/sqlite-readonly-worker.auth.test.ts src/agents/auth-profiles.sqlite-read-pool.test.ts ui/src/e2e/command-palette-catalog.real-gateway.e2e.test.ts test/vitest/vitest.ui-e2e-prebuilt.config.ts test/vitest/vitest.ui-e2e-prebuilt.global-setup.ts
            sha256sum src/agents/auth-profiles/sqlite-json.ts src/infra/sqlite-readonly-worker.auth.test.ts src/agents/auth-profiles.sqlite-read-pool.test.ts ui/src/e2e/command-palette-catalog.real-gateway.e2e.test.ts
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"

      - name: Require the new regression to expose the parent schema-zero failure
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/auth-schema-admission-proof"
          source_path=src/agents/auth-profiles/sqlite-json.ts
          saved_source="$RUNNER_TEMP/auth-schema-admission-candidate.ts"
          test -z "$(git status --porcelain --untracked-files=all)"
          cp "$source_path" "$saved_source"
          restore_candidate() { cp "$saved_source" "$source_path"; }
          trap restore_candidate EXIT
          git show "$PARENT_SHA:$source_path" > "$source_path"
          test "$(git hash-object "$source_path")" = "$PARENT_PRODUCTION_BLOB"
          test "$(git diff --name-only)" = "$source_path"
          test "$(git hash-object src/infra/sqlite-readonly-worker.auth.test.ts)" = "$REGRESSION_BLOB"
          {
            echo "Baseline = candidate plus only parent sqlite-json.ts"
            git diff --stat
            sha256sum "$source_path" src/infra/sqlite-readonly-worker.auth.test.ts
          } | tee "$proof_dir/baseline-source.txt"
          set +e
          pnpm test src/infra/sqlite-readonly-worker.auth.test.ts -- \
            --maxWorkers=1 \
            -t '^observes agent initialization after a cold auth read in the same worker$' \
            --reporter=verbose --reporter=json \
            --outputFile.json="$proof_dir/baseline.json" \
            2>&1 | tee "$proof_dir/baseline.log"
          pipeline_codes=("${PIPESTATUS[@]}")
          set -e
          baseline_exit="${pipeline_codes[0]}"
          test "${pipeline_codes[1]}" -eq 0
          echo "$baseline_exit" > "$proof_dir/baseline.exit-code"
          restore_candidate
          trap - EXIT
          test "$(git hash-object "$source_path")" = "$PRODUCTION_BLOB"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          node --input-type=module - "$proof_dir/baseline.json" "$baseline_exit" "$proof_dir/baseline.log" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const [file, code, logFile] = process.argv.slice(2);
          assert.equal(code, '1', 'Baseline must be an ordinary assertion failure');
          const report = JSON.parse(fs.readFileSync(file, 'utf8'));
          assert.equal(report.success, false);
          assert.equal(report.numFailedTests, 1);
          assert.equal(report.numPassedTests, 0);
          assert.equal(report.testResults.length, 1);
          const suite = report.testResults[0];
          assert.ok(suite.name.endsWith('/src/infra/sqlite-readonly-worker.auth.test.ts'));
          assert.equal(suite.message, '', 'Suite/collection failure is not a baseline');
          const active = suite.assertionResults.filter(result => !['pending', 'skipped', 'todo', 'disabled'].includes(result.status));
          assert.equal(active.length, 1);
          assert.equal(active[0].status, 'failed');
          assert.equal(active[0].title, 'observes agent initialization after a cold auth read in the same worker');
          assert.equal(active[0].failureMessages.length, 1);
          const log = fs.readFileSync(logFile, 'utf8').replace(/\u001b\[[0-9;]*m/g, '');
          assert.doesNotMatch(log, /Unhandled (?:Errors?|Rejections?|Exceptions?)/);
          // Native JSON keeps only the outer stack; verbose output includes assertion causes.
          const signature = /SQLite read-only worker OpenClaw agent database [^\n]*openclaw-agent\.sqlite uses schema version 0; run openclaw doctor --fix to migrate persisted media before using it\./;
          assert.ok(signature.test(active[0].failureMessages[0]) || signature.test(log), 'The sole regression must expose the exact schema-zero worker cause');
          console.log('Confirmed: the sole executed regression failed with the exact schema-zero worker error.');
          NODE
          echo 'Baseline: precise schema-zero regression confirmed; candidate source restored.' >> "$GITHUB_STEP_SUMMARY"

      - name: Run candidate auth transport and retained-reader owner files
        id: owner_tests
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/auth-schema-admission-proof"
          test "$(git hash-object src/agents/auth-profiles/sqlite-json.ts)" = "$PRODUCTION_BLOB"
          pnpm test src/infra/sqlite-readonly-worker.auth.test.ts src/agents/auth-profiles.sqlite-read-pool.test.ts -- \
            --maxWorkers=1 --reporter=verbose --reporter=json \
            --outputFile.json="$proof_dir/candidate-owners.json" \
            2>&1 | tee "$proof_dir/candidate-owners.log"

      - name: Install Playwright Chromium
        uses: ./.github/actions/setup-playwright-chromium
        with:
          cache-mode: restore
          compatibility-target: "false"

      - name: Build restored candidate runtime and Control UI once
        id: build
        env:
          OPENCLAW_BUILD_PRIVATE_QA: "1"
          OPENCLAW_RUN_NODE_SKIP_DTS_BUILD: "1"
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          pnpm build 2>&1 | tee "$RUNNER_TEMP/auth-schema-admission-proof/build.log"

      - name: Run original catalog publication real-Gateway file
        id: palette
        env:
          OPENCLAW_CAPTURE_UI_PROOF: "0"
          OPENCLAW_UI_E2E_ARTIFACT_DIR: ${{ runner.temp }}/auth-schema-admission-ui
          OPENCLAW_UI_E2E_DIAGNOSTIC_DIR: ${{ runner.temp }}/auth-schema-admission-timeouts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-vitest.mjs run \
            --config test/vitest/vitest.ui-e2e-prebuilt.config.ts \
            --configLoader runner --reporter verbose --maxWorkers 1 \
            ui/src/e2e/command-palette-catalog.real-gateway.e2e.test.ts \
            2>&1 | tee "$RUNNER_TEMP/auth-schema-admission-proof/palette.log"

      - name: Verify final source and record outcomes
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        env:
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          OWNER_OUTCOME: ${{ steps.owner_tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PALETTE_OUTCOME: ${{ steps.palette.outcome }}
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/auth-schema-admission-proof"
          mkdir -p "$proof_dir"
          {
            echo "Baseline: $BASELINE_OUTCOME"
            echo "Candidate owners: $OWNER_OUTCOME"
            echo "Candidate build: $BUILD_OUTCOME"
            echo "Original palette file: $PALETTE_OUTCOME"
            git status --short
            sha256sum src/agents/auth-profiles/sqlite-json.ts src/infra/sqlite-readonly-worker.auth.test.ts
          } | tee "$proof_dir/outcomes.txt"
          cat "$proof_dir/outcomes.txt" >> "$GITHUB_STEP_SUMMARY"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git hash-object src/agents/auth-profiles/sqlite-json.ts)" = "$PRODUCTION_BLOB"
          test "$(git hash-object src/infra/sqlite-readonly-worker.auth.test.ts)" = "$REGRESSION_BLOB"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Preserve focused reports and suite-owned synthetic diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-auth-schema-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/auth-schema-admission-proof/
            ${{ runner.temp }}/auth-schema-admission-ui/control-ui-catalog-publication-with-a-real-gateway-*/settings-acquisition.json
            ${{ runner.temp }}/auth-schema-admission-ui/control-ui-catalog-publication-with-a-real-gateway-*/acquisition-outcomes.json
            ${{ runner.temp }}/auth-schema-admission-ui/control-ui-catalog-publication-with-a-real-gateway-*/publication.json
            ${{ runner.temp }}/auth-schema-admission-ui/control-ui-catalog-publication-with-a-real-gateway-*/gateway.log
            ${{ runner.temp }}/auth-schema-admission-timeouts/failure-*/failure.public.json
          if-no-files-found: warn
          retention-days: 7
