# Diagnostic carrier only. Never merge this workflow into main.
name: Red-main sidebar occlusion comparison
run-name: Sidebar occlusion ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-sidebar-occlusion-comparison
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  sidebar-occlusion:
    name: Three original sidebar cases (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: base
            sha: 08f856074937777449a923844b0cf2cedb3d61d8
          - label: candidate
            sha: 64159240da99ea40950c21e716d28a1a19a0ac7c
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record source and add transition-only observations
        shell: bash
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD:ui/src/components/app-sidebar-session-filter.browser.test.ts)" = 29a0ee2bf1e7cd84d2e2b5c03dfdc232f6dc1f97
          test "$(git rev-parse HEAD:ui/src/lib/native-overlay-occlusion.ts)" = e52cdbf2522d256f63626f58c08fb6d14beba7fa
          proof_dir="$RUNNER_TEMP/sidebar-occlusion-proof"
          mkdir -p "$proof_dir"
          {
            echo "Source: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- ui/src/components/app-sidebar-session-filter.browser.test.ts ui/src/components/sidebar-collapse-toggle.tsx ui/src/lib/native-overlay-occlusion.ts ui/src/components/tooltip-controller.ts ui/src/components/solid/tooltip.tsx
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          from pathlib import Path
          file = Path("ui/src/lib/native-overlay-occlusion.ts")
          source = file.read_text()
          # Keep indentation literal and fail if the reviewed observation point moved.
          needle = "    if (occluded !== previous) {\n      previous = occluded;\n      listener(occluded);\n"
          observation = '''      console.info("SIDEBAR_OCCLUSION", JSON.stringify({
                  at: performance.now(),
                  previous,
                  occluded,
                  activeOverlays,
                  viewport: [innerWidth, innerHeight],
                  direction: document.querySelector("openclaw-app-sidebar")?.getAttribute("dir"),
                  focused: document.activeElement?.getAttribute("aria-label") ?? document.activeElement?.localName,
                  hovered: [...document.querySelectorAll("button:hover")].map((element) => element.getAttribute("aria-label") ?? element.className),
                  surfaces: [...surfaces].map((elements) => {
                    const registered = [...elements()];
                    const first = registered[0];
                    const root = first?.getRootNode();
                    const visible = registered.find((element) => {
                      const rect = element.getBoundingClientRect();
                      return element.isConnected && rect.width > 0 && rect.height > 0 && bounds && rect.left < bounds.right && rect.right > bounds.left && rect.top < bounds.bottom && rect.bottom > bounds.top;
                    });
                    return {
                      tag: first?.localName,
                      class: first?.getAttribute("class"),
                      role: first?.getAttribute("role"),
                      host: root instanceof ShadowRoot ? root.host.localName : undefined,
                      rect: first?.getBoundingClientRect().toJSON(),
                      intersecting: visible ? { tag: visible.localName, class: visible.getAttribute("class"), rect: visible.getBoundingClientRect().toJSON() } : null,
                    };
                  }),
                }));
          '''
          assert source.count(needle) == 1
          file.write_text(source.replace(needle, needle.replace("      previous = occluded;", observation + "      previous = occluded;")))
          PY
          git diff -- ui/src/lib/native-overlay-occlusion.ts > "$proof_dir/observation.patch"
          git diff --exit-code -- ui/src/components/app-sidebar-session-filter.browser.test.ts

      - name: Setup Node and the CI Bun runtime
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: restore
          install-bun: "true"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "true"
          vitest-worker-cache: "false"
          node-compile-cache: "true"

      - name: Setup Chromium
        uses: ./.github/actions/setup-playwright-chromium
        with:
          cache-mode: restore

      - name: Run the three original keyboard and geometry cases once
        id: cases
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: bun
          OPENCLAW_CI_TEST_RUNTIME_POLICY: bun-compatible
          OPENCLAW_VITEST_MAX_WORKERS: "1"
        run: |
          set -euo pipefail
          node scripts/run-vitest.mjs run \
            --config ui/vitest.config.ts \
            --configLoader runner \
            --project chromium \
            --maxWorkers 1 \
            --reporter=verbose \
            ui/src/components/app-sidebar-session-filter.browser.test.ts \
            -t 'keeps keyboard navigation, focus and surface inside the viewport at (1440 px \(ltr\)|390 px \((ltr|rtl)\))$' \
            2>&1 | tee "$RUNNER_TEMP/sidebar-occlusion-proof/cases.log"

      - name: Record outcome and unchanged original assertions
        if: ${{ always() }}
        shell: bash
        env:
          CASE_OUTCOME: ${{ steps.cases.outcome }}
          SOURCE_LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          echo "$SOURCE_LABEL original cases: $CASE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          git diff --exit-code -- ui/src/components/app-sidebar-session-filter.browser.test.ts ui/src/components/sidebar-collapse-toggle.tsx

      - name: Preserve comparison evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sidebar-occlusion-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sidebar-occlusion-proof/
          if-no-files-found: warn
          retention-days: 14
