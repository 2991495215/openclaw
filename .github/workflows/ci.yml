# Temporary hosted proof only. Never merge this workflow.
name: Red-main membership authority diagnostics
run-name: Membership authority diagnostic ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact immutable membership diagnostic commit
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-chat-membership-diagnostic-${{ github.ref }}
  cancel-in-progress: false
env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  focused:
    name: Complete membership authority file
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENCLAW_LOCAL_CHECK: "0"
      OPENCLAW_VITEST_RUNTIME: node
    steps:
      - name: Validate immutable source input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "1b5976c54bd0c9f236131133514e3cb8567bf1d8"
      - name: Checkout exact diagnostic source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify and record source
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          proof_dir="$RUNNER_TEMP/chat-membership-diagnostic"
          mkdir -p "$proof_dir"
          {
            echo "Diagnostic source: $SOURCE_SHA"
            echo "Workflow: $WORKFLOW_SHA"
            git show -s --format='%H%n%P%n%s' HEAD
            git ls-tree HEAD -- package.json pnpm-lock.yaml \
              src/gateway/server.chat-membership-authority.product.test.ts \
              src/gateway/session-sharing-authorization-async.ts \
              src/gateway/server-methods/request-authorization.ts
          } | tee "$proof_dir/provenance.log"
          cat "$proof_dir/provenance.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Setup frozen Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
      - name: Check diagnostic file format and lint
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec oxfmt --check src/gateway/server.chat-membership-authority.product.test.ts
          pnpm exec oxlint --config .oxlintrc.json --deny-warnings src/gateway/server.chat-membership-authority.product.test.ts
      - name: Run complete failing file in its original test order
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.19.0
          proof_dir="$RUNNER_TEMP/chat-membership-diagnostic"
          {
            node --version
            pnpm --version
            echo 'Command: pnpm test src/gateway/server.chat-membership-authority.product.test.ts --maxWorkers=1'
          } | tee "$proof_dir/command.log"
          started="$(date +%s)"
          if pnpm test src/gateway/server.chat-membership-authority.product.test.ts --maxWorkers=1 \
            2>&1 | tee "$proof_dir/test.log"; then
            test_exit=0
          else
            test_exit=$?
          fi
          elapsed=$(( $(date +%s) - started ))
          {
            echo "Test exit: $test_exit"
            echo "Elapsed seconds: $elapsed"
          } | tee "$proof_dir/result.txt" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_exit"
      - name: Verify tracked source stayed unchanged
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code HEAD --
      - name: Preserve diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-chat-membership-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chat-membership-diagnostic/
          if-no-files-found: warn
          retention-days: 14
