# Temporary exact-source diagnostic only. Never merge this workflow or its patch.
name: Red-main cron message read phase diagnostic
run-name: Cron read phase diagnostic c8a1db6f ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-cron-message-read-phase-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  cron-message-read-phase:
    name: Cron read phase diagnostic (exact main source)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c8a1db6f389b8bdf1eae4b595027a96490c5fba4
          fetch-depth: 1
          persist-credentials: false

      - name: Record source provenance and apply phase logging
        shell: bash
        env:
          EXPECTED_SHA: c8a1db6f389b8bdf1eae4b595027a96490c5fba4
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --
          mkdir -p .artifacts/cron-message-read-phase
          echo "4855968c49e54e0389dfc4d5b2634c5f2457cdcfec7e88daf77077e24bf7b5ee  test/cron-message-read.integration.test.ts" | sha256sum --check
          {
            echo "Source: $actual_sha"
            echo "Workflow: $WORKFLOW_SHA"
            git show -s --format='%H%n%P%n%an <%ae>%n%s' HEAD
            git ls-tree HEAD -- \
              package.json pnpm-lock.yaml .github/workflows/ci.yml \
              .github/actions/setup-node-env/action.yml \
              test/cron-message-read.integration.test.ts \
              test/helpers/cron/message-read-runtime.ts test/helpers/qa-gateway-cleanup.ts \
              scripts/lib/vitest-build-prerequisites.mts scripts/lib/vitest-runtime-selection.mts
          } | tee .artifacts/cron-message-read-phase/provenance.log
          cat > .artifacts/cron-message-read-phase/diagnostic.patch <<'DIAGNOSTIC_PATCH'
          diff --git a/test/cron-message-read.integration.test.ts b/test/cron-message-read.integration.test.ts
          --- a/test/cron-message-read.integration.test.ts
          +++ b/test/cron-message-read.integration.test.ts
          @@ -225,6 +225,18 @@
             const tempDirs = useAutoCleanupTempDirTracker(afterEach);
           
