# Temporary exact-candidate backup proof. Never merge this workflow.
name: Red-main backup image reuse proof
run-name: Backup image reuse ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed candidate commit (40 lowercase hexadecimal characters)
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-backup-image-reuse-proof
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  OPENCLAW_LOCAL_CHECK: "0"
  OPENCLAW_VITEST_RUNTIME: node

jobs:
  backup-image-reuse:
    name: Backup CLI, Linux aliases, and matched PostgreSQL user export
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify original tests and record exact source provenance
        id: source_before
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/backup-image-reuse-proof
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git diff --exit-code HEAD --
          cat > .artifacts/backup-image-reuse-proof/original-tests.sha256 <<'HASHES'
          03f01e2b6bb4ac336d9c0aa32a9e93dea112b44f551458ab2ff932004a1aba4b  src/cli/program/register.backup.product-path.test.ts
          0e4dc7b7ca37d725be22570d7174f9ffdc7318b8a0a8bd6aca04fd7a54b3958e  src/infra/backup-create.sqlite-hardlinks.test.ts
          41cacf68fa7ba030951bcd5e8a7caa39f91b1b4585feedc676c87ae4fafa1b42  src/infra/database-engine/backup.test.ts
          HASHES
          sha256sum --check .artifacts/backup-image-reuse-proof/original-tests.sha256 | tee .artifacts/backup-image-reuse-proof/original-tests.log
          proof_paths=(
            package.json pnpm-lock.yaml .github/workflows/ci.yml
            .github/actions/setup-node-env/action.yml
            src/cli/program/register.backup.product-path.test.ts
            src/infra/backup-create.sqlite-hardlinks.test.ts
            src/infra/database-engine/backup.test.ts
            src/snapshot/database-backup.ts src/infra/backup-sqlite-snapshot.ts
            src/infra/backup-sqlite-source-groups.ts src/infra/sqlite-snapshot.ts
            src/infra/sqlite-snapshot-source.ts src/infra/sqlite-readonly-location.worker.ts
            src/infra/sqlite-readonly-location.ts src/infra/database-engine/open.ts
            src/commands/backup.ts src/commands/backup-shared.ts src/infra/backup-create.ts
            src/config/sessions/session-cold-storage-backup.ts
            src/infra/database-engine/workboard-port.generated.json
            extensions/workboard/src/workboard-schema.postgres.sql
            scripts/test-database-conformance.mjs scripts/test-database-conformance-preload.mjs
            scripts/lib/vitest-build-prerequisites.mts scripts/lib/vitest-runtime-selection.mts
            scripts/test-projects.mts scripts/test-projects-run.mts
          )
          sha256sum "${proof_paths[@]}" > .artifacts/backup-image-reuse-proof/source-before.sha256
          {
            echo "Candidate: $CANDIDATE_SHA"
            echo "Workflow: $WORKFLOW_SHA"
            git show -s --format='%H%n%P%n%an <%ae>%n%s' HEAD
            git ls-tree HEAD -- "${proof_paths[@]}"
          } | tee .artifacts/backup-image-reuse-proof/provenance.log
          cat .artifacts/backup-image-reuse-proof/provenance.log >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"

      # Canonical test commands own their prerequisites; no separate QA build.
      - name: Run original backup CLI full file
        id: cli
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            node --version
            pnpm --version
            echo 'Command: pnpm test src/cli/program/register.backup.product-path.test.ts --maxWorkers=1'
          } | tee .artifacts/backup-image-reuse-proof/cli-command.log
          started="$(date +%s)"
          if pnpm test src/cli/program/register.backup.product-path.test.ts --maxWorkers=1 2>&1 | tee .artifacts/backup-image-reuse-proof/cli-test.log; then
            test_exit=0
          else
            test_exit=$?
          fi
          elapsed=$(( $(date +%s) - started ))
          {
            echo "Test exit: $test_exit"
            echo "Elapsed seconds: $elapsed"
          } | tee .artifacts/backup-image-reuse-proof/cli-result.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$test_exit"

      - name: Run Linux hardlink full file including live POSIX locks
        id: hardlinks
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.platform')" = linux
          echo 'Command: pnpm test src/infra/backup-create.sqlite-hardlinks.test.ts --maxWorkers=1' | tee .artifacts/backup-image-reuse-proof/hardlinks-command.log
          started="$(date +%s)"
          if pnpm test src/infra/backup-create.sqlite-hardlinks.test.ts --maxWorkers=1 2>&1 | tee .artifacts/backup-image-reuse-proof/hardlinks-test.log; then
            test_exit=0
          else
            test_exit=$?
          fi
          elapsed=$(( $(date +%s) - started ))
          {
            echo "Test exit: $test_exit"
            echo "Elapsed seconds: $elapsed"
          } | tee .artifacts/backup-image-reuse-proof/hardlinks-result.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$test_exit"

      # Same disposable PostgreSQL 17 service as the candidate CI conformance job.
      - name: Start disposable loopback PostgreSQL service
        id: postgres_service
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            docker run --detach --name openclaw-postgres --publish 127.0.0.1:5432:5432 \
              --shm-size=1g --user postgres postgres:17 bash -ec \
              'initdb -A trust -U postgres -D /tmp/openclaw-pg >/dev/null;
               echo "host all all all trust" >> /tmp/openclaw-pg/pg_hba.conf;
               exec postgres -D /tmp/openclaw-pg -h 0.0.0.0'
            timeout 60s docker exec openclaw-postgres bash -c 'until pg_isready -U postgres; do sleep 1; done'
          } 2>&1 | tee .artifacts/backup-image-reuse-proof/postgres-service-start.log

      - name: Run only matched PostgreSQL user export through conformance owner
        id: postgres
        if: ${{ !cancelled() && steps.postgres_service.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "Command: node scripts/test-database-conformance.mjs --engine postgres --connection postgresql://postgres@127.0.0.1:5432/postgres -- src/infra/database-engine/backup.test.ts --maxWorkers=1 -t 'restores a user export into a fresh namespace and rejects an unmatched anchor'" | tee .artifacts/backup-image-reuse-proof/postgres-command.log
          started="$(date +%s)"
          if node scripts/test-database-conformance.mjs --engine postgres --connection postgresql://postgres@127.0.0.1:5432/postgres -- src/infra/database-engine/backup.test.ts --maxWorkers=1 -t 'restores a user export into a fresh namespace and rejects an unmatched anchor' 2>&1 | tee .artifacts/backup-image-reuse-proof/postgres-test.log; then
            test_exit=0
          else
            test_exit=$?
          fi
          elapsed=$(( $(date +%s) - started ))
          {
            echo "Test exit: $test_exit"
            echo "Elapsed seconds: $elapsed"
          } | tee .artifacts/backup-image-reuse-proof/postgres-result.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$test_exit"

      - name: Verify exact candidate source remained unchanged
        id: source_after
        if: ${{ always() && steps.source_before.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          sha256sum --check .artifacts/backup-image-reuse-proof/source-before.sha256 | tee .artifacts/backup-image-reuse-proof/source-after.log
          git diff --exit-code HEAD --
          echo 'Exact candidate and original test files remained unchanged; no diagnostic patch or instrumentation.' | tee .artifacts/backup-image-reuse-proof/source-unchanged.log

      - name: Preserve PostgreSQL logs and stop disposable service
        id: cleanup
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/backup-image-reuse-proof
          if docker inspect openclaw-postgres >/dev/null 2>&1; then
            docker logs openclaw-postgres > .artifacts/backup-image-reuse-proof/postgres-service.log 2>&1
            docker rm --force openclaw-postgres | tee .artifacts/backup-image-reuse-proof/postgres-service-cleanup.log
          fi

      - name: Require all three proofs and source integrity
        if: ${{ always() }}
        shell: bash
        env:
          SOURCE_BEFORE_OUTCOME: ${{ steps.source_before.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          CLI_OUTCOME: ${{ steps.cli.outcome }}
          HARDLINKS_OUTCOME: ${{ steps.hardlinks.outcome }}
          POSTGRES_SERVICE_OUTCOME: ${{ steps.postgres_service.outcome }}
          POSTGRES_OUTCOME: ${{ steps.postgres.outcome }}
          SOURCE_AFTER_OUTCOME: ${{ steps.source_after.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/backup-image-reuse-proof
          gate_failed=0
          result_file=.artifacts/backup-image-reuse-proof/outcomes.txt
          : > "$result_file"
          record() {
            printf '%s: %s\n' "$1" "$2" | tee -a "$result_file"
            if [ "$2" != success ]; then
              gate_failed=1
            fi
          }
          record source-before "$SOURCE_BEFORE_OUTCOME"
          record setup "$SETUP_OUTCOME"
          record cli "$CLI_OUTCOME"
          record hardlinks "$HARDLINKS_OUTCOME"
          record postgres-service "$POSTGRES_SERVICE_OUTCOME"
          record postgres "$POSTGRES_OUTCOME"
          record source-after "$SOURCE_AFTER_OUTCOME"
          record cleanup "$CLEANUP_OUTCOME"
          cat "$result_file" >> "$GITHUB_STEP_SUMMARY"
          exit "$gate_failed"

      - name: Preserve focused backup proof
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-backup-image-reuse-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/backup-image-reuse-proof/
          if-no-files-found: warn
          retention-days: 14
