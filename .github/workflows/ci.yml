name: Red-main compact plan diagnostic
run-name: Compact plan diagnostic ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      workflow_sha:
        description: Expected proof carrier SHA
        type: string
        required: true
      dispatch_id:
        description: Diagnostic correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-compact-plan-79
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  compact-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact failed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dc87e61f9271e124abd7dcec11968a6d216619eb
          persist-credentials: false

      - name: Setup matching Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"

      - name: Verify source and capture final failed plan
        env:
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = dc87e61f9271e124abd7dcec11968a6d216619eb
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          git diff --exit-code HEAD --
          test "$(node --version)" = v24.21.0
          mkdir -p "$RUNNER_TEMP/compact-plan-79"
          node --input-type=module <<'DIAGNOSTIC'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const file = 'scripts/lib/ci-node-test-plan.mts';
          const original = fs.readFileSync(file, 'utf8');
          const anchor = '    if (measuredJobs.length > compactJobCap) {\n      throw new Error(';
          assert.equal(original.split(anchor).length, 2);
          const dump = `    if (measuredJobs.length > compactJobCap) {\n      console.log('FAILED_PLAN_JSON=' + JSON.stringify({ compactJobCap, measuredJobs }));\n      throw new Error(`;
          fs.writeFileSync(file, original.replace(anchor, dump));
          try {
            const { createNodeTestShardBundles } = await import('./scripts/lib/ci-node-test-plan.mts');
            const options = { includeProofTests:true, includeReleaseOnlyPluginShards:false, includeReleaseOnlyToolingShards:true, includeReleaseOnlyRuntimeTests:false, includePrExemptRuntimeTests:true, compactMode:'pull-request', compactNodeJobCap:76, runnerBackend:'hybrid' };
            const log = console.log;
            console.log = (...args) => {
              if (typeof args[0] === 'string' && args[0].startsWith('FAILED_PLAN_JSON=')) {
                fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'compact-plan-79', 'failed-plan.json'), args[0].slice('FAILED_PLAN_JSON='.length));
              } else log(...args);
            };
            assert.throws(() => createNodeTestShardBundles(options), /compact hybrid node test plan exceeds 78 jobs \(79 planned\)/);
            const result = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'compact-plan-79', 'failed-plan.json'), 'utf8'));
            assert.equal(result.measuredJobs.length, 79);
            log(JSON.stringify({ source: 'dc87e61f9271e124abd7dcec11968a6d216619eb', cap: result.compactJobCap, jobs: result.measuredJobs.length }));
          } finally {
            fs.writeFileSync(file, original);
          }
          DIAGNOSTIC
          git diff --exit-code HEAD --

      - name: Preserve diagnostic descriptors
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-compact-plan-79-${{ github.run_id }}
          path: ${{ runner.temp }}/compact-plan-79/
          if-no-files-found: error
          retention-days: 7
