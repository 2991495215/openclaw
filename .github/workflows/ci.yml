name: Red-main cron parked fixture proof
run-name: Cron parked fixture ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        type: string
        required: true
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1d362e027f90f2b564fd42c43d0eae69f855d686
          persist-credentials: false
      - name: Verify reviewed fixture source
        run: test "$(git rev-parse HEAD)" = 1d362e027f90f2b564fd42c43d0eae69f855d686
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
      - name: Run focused maintenance fixture proof
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: pnpm test src/cron/maintenance.test.ts --maxWorkers=1
      - name: Verify unchanged fixture source
        if: ${{ always() }}
        run: git diff --exit-code
