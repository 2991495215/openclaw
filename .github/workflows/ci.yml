# Focused coverage fallback: ordinary PR CI omitted both original failing commands.
# Setup owner: status-usage-focused-workflow.yml. No private QA runtime is needed.
name: Red-main interrupted fixture export proof
run-name: Interrupted fixture export 49437d08abb5 ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-interrupted-fixture-export-proof
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  interrupted-fixture-export-proof:
    name: Original dependency and export scans
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 49437d08abb5fcd4c028628a9d58ea8f5b83475f
          fetch-depth: 1
          persist-credentials: false

      - name: Record candidate sources
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 49437d08abb5fcd4c028628a9d58ea8f5b83475f
          proof_dir="$RUNNER_TEMP/interrupted-fixture-export-proof"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- ui/src/test-helpers/interrupted-chat-history.ts scripts/check-deadcode-exports.mts scripts/deadcode-knip-runner.mts config/knip.all-exports.config.ts
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
          node-compile-cache: "true"

      - name: Run original dependency scan
        id: dependencies
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
        run: |
          set -euo pipefail
          pnpm deadcode:dependencies 2>&1 | tee "$RUNNER_TEMP/interrupted-fixture-export-proof/dependencies.log"

      - name: Run original export scans
        id: exports
        if: ${{ !cancelled() }}
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
        run: |
          set -euo pipefail
          pnpm deadcode:exports 2>&1 | tee "$RUNNER_TEMP/interrupted-fixture-export-proof/exports.log"

      - name: Record outcome and verify unchanged sources
        if: ${{ always() }}
        shell: bash
        env:
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          EXPORTS_OUTCOME: ${{ steps.exports.outcome }}
        run: |
          set -euo pipefail
          echo "Dependencies: $DEPENDENCIES_OUTCOME; exports: $EXPORTS_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          git status --short
          git diff --exit-code -- ui/src/test-helpers/interrupted-chat-history.ts scripts/check-deadcode-exports.mts scripts/deadcode-knip-runner.mts config/knip.all-exports.config.ts

      - name: Preserve proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-interrupted-fixture-export-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/interrupted-fixture-export-proof/
          if-no-files-found: warn
          retention-days: 14
