# Temporary exact-candidate proof only. Never merge this workflow.
name: Red-main PR 171230 static proof
run-name: PR 171230 integrated static proof ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-static-171230-proof-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  check-dependencies:
    name: Three original static scans (integrated candidate)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact integrated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 3f134aedca5b2ae0b6e71e64c36c6a18d2109bfb
          fetch-depth: 1
          persist-credentials: false

      - name: Record candidate source and workflow provenance
        shell: bash
        env:
          EXPECTED_SHA: 3f134aedca5b2ae0b6e71e64c36c6a18d2109bfb
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --
          test "$(git rev-parse HEAD:config/knip.config.ts)" = "e24a625979bd1548fae1ad61bb796ed2ed70cab6"
          test "$(git rev-parse HEAD:config/test-mock-exports-baseline.txt)" = "22690b5370e3b87e8bd0292a620ac344f88d38ab"
          test "$(git rev-parse HEAD:scripts/perf/team-shape-sessions.ts)" = "fc00416186a8dfd0cd96e5ee3431e64f8cfe2f4a"
          test "$(git rev-parse HEAD:src/agents/agent-runtime-config.ts)" = "40a6d1f77d844bdb82d1f11cef5bb2543fe654fe"
          test "$(git rev-parse HEAD:src/commands/agent.delivery-format.test.ts)" = "886b6ae46526abb64999c60abb1cbbcf4648ef06"
          test "$(git rev-parse HEAD:src/commands/agent.runtime-config.test.ts)" = "d420689b73f408583bda745bb8b2f786635258e5"
          test "$(git rev-parse HEAD:src/commands/agent.test.ts)" = "4fef83da37668eb8d3733a4fe052ec753d2a17bc"
          test "$(git rev-parse HEAD:src/commands/agent.worktree-race.test.ts)" = "db84b9a4f631c52f97eac4a18a7184e2ffe9befa"
          test "$(git rev-parse HEAD:src/gateway/server/ws-connection/authenticated-request-dispatch.metrics.test.ts)" = "b4787da7d75358b4ce804b25cbaf9ce35659f3e7"
          test "$(git rev-parse HEAD:src/gateway/session-row-selection.ts)" = "84e0bba095e7781a972e5a47225b5210ec4a3149"
          test "$(git rev-parse HEAD:ui/src/components/sidebar-collapse-toggle.tsx)" = "818c5e2da4871f861e17fa8274339e7936c0cf6e"
          mkdir -p .artifacts/ownership-static
          {
            echo "Integrated source: $actual_sha"
            echo "Reviewed candidate: 64159240da99ea40950c21e716d28a1a19a0ac7c"
            echo "Reviewed candidate: 9dff1404c52e25aa5d66a465abf931150f376b9c"
            echo "Reviewed candidate: dbb1361d2b94c539ca7b73d201370a3eb498c96b"
            echo "Reviewed candidate: 2523afd923481614e50a9dd9ca01354558ec8a85"
            echo "Main base: 2d84a2dc6713319227b75c6f9de41aea8cc14a8f"
            echo "Workflow: $WORKFLOW_SHA"
            git show -s --format='%H%n%P%n%an <%ae>%n%s' HEAD
            git ls-tree HEAD -- \
              package.json pnpm-lock.yaml \
              .github/actions/setup-node-env/action.yml \
              scripts/check-deadcode-exports.mts scripts/deadcode-knip-runner.mts \
              config/knip.config.ts config/knip.all-exports.config.ts \
              config/knip.scripts-exports.config.ts \
              scripts/check-deadcode-unused-files.mts \
              ui/src/components/sidebar-collapse-toggle.tsx \
              scripts/perf/team-shape-sessions.ts scripts/perf/team-shape-measure.ts \
              scripts/perf/README.md
          } | tee .artifacts/ownership-static/provenance.log
          cat .artifacts/ownership-static/provenance.log >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"

      - name: Run each originally failing command once
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
        run: |
          set -euo pipefail
          mkdir -p .artifacts/ownership-static
          printf 'command\texit_code\n' > .artifacts/ownership-static/results.tsv
          dc_scripts=(deadcode:dependencies deadcode:unused-files deadcode:exports)
          dc_failures=0
          for dc in "${dc_scripts[@]}"; do
            dc_log=".artifacts/ownership-static/${dc//:/-}.log"
            dc_rc=0
            pnpm "$dc" > "$dc_log" 2>&1 || dc_rc=$?
            cat "$dc_log"
            printf '%s\t%s\n' "$dc" "$dc_rc" >> .artifacts/ownership-static/results.tsv
            if [ "$dc_rc" -ne 0 ]; then
              echo "::error title=${dc} failed::${dc} exited ${dc_rc}"
              dc_failures=1
            fi
          done
          cat .artifacts/ownership-static/results.tsv >> "$GITHUB_STEP_SUMMARY"
          exit "$dc_failures"

      - name: Verify candidate source remained unchanged
        if: ${{ always() }}
        shell: bash
        env:
          EXPECTED_SHA: 3f134aedca5b2ae0b6e71e64c36c6a18d2109bfb
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --
          echo "Tracked candidate source remained unchanged." | tee .artifacts/ownership-static/source-unchanged.log

      - name: Preserve all command outcomes and provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-static-171230-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/ownership-static/
          if-no-files-found: warn
          retention-days: 14
