# Scratch proposal: standalone exact-SHA SDK report. Not installed or dispatched.
name: Plugin SDK API report
on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full predecessor commit SHA
        required: true
        type: string
      head_sha:
        description: Full candidate commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: plugin-sdk-api-report-${{ inputs.base_sha }}-${{ inputs.head_sha }}
  cancel-in-progress: false
jobs:
  render:
    name: Render SDK API (${{ matrix.role }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - role: base
            commit: ${{ inputs.base_sha }}
          - role: head
            commit: ${{ inputs.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ensure-base-commit
        with:
          base-sha: ${{ inputs.base_sha }}
          fetch-ref: ${{ inputs.base_sha }}
      - uses: ./.github/actions/ensure-base-commit
        with:
          base-sha: ${{ inputs.head_sha }}
          fetch-ref: ${{ inputs.head_sha }}
      - uses: ./.github/actions/setup-node-env
        with:
          semantic-checks: "true"
          install-bun: "false"
          cache-mode: restore
      - name: Render one frozen revision
        env:
          SDK_SHA: ${{ matrix.commit }}
        run: |
          set -euo pipefail
          [[ "$SDK_SHA" =~ ^[a-f0-9]{40}$ ]]
          node --import tsx scripts/plugin-sdk-api-diff.mts \
            --render-revision "$SDK_SHA" --output ".artifacts/sdk-surfaces/$SDK_SHA.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdk-api-surface-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.role }}
          path: .artifacts/sdk-surfaces/*.json
          if-no-files-found: error
          retention-days: 14
  compare:
    name: Report SDK API diff
    needs: [render]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ensure-base-commit
        with:
          base-sha: ${{ inputs.base_sha }}
          fetch-ref: ${{ inputs.base_sha }}
      - uses: ./.github/actions/ensure-base-commit
        with:
          base-sha: ${{ inputs.head_sha }}
          fetch-ref: ${{ inputs.head_sha }}
      - uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          cache-mode: restore
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: sdk-api-surface-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: .artifacts/sdk-surfaces
          merge-multiple: true
      - name: Compare immutable surfaces
        env:
          SDK_BASE: ${{ inputs.base_sha }}
          SDK_HEAD: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$SDK_BASE" =~ ^[a-f0-9]{40}$ && "$SDK_HEAD" =~ ^[a-f0-9]{40}$ ]]
          node --import tsx scripts/plugin-sdk-api-diff.mts \
            --base "$SDK_BASE" --head "$SDK_HEAD" \
            --surfaces-directory .artifacts/sdk-surfaces \
            --json .artifacts/plugin-sdk-api-diff.json \
            --evidence .artifacts/plugin-sdk-api-evidence.json \
            --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plugin-sdk-api-diff-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/plugin-sdk-api-diff.json
            .artifacts/plugin-sdk-api-evidence.json
          if-no-files-found: error
          retention-days: 14
