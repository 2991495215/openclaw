name: Red-main transferred worker observer proof
run-name: Worker observer proof ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Reviewed four-file source commit
        type: string
        required: true
      workflow_sha:
        description: Exact proof carrier SHA
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-transferred-worker-observers
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.19.0"
  OPENCLAW_VITEST_RUNTIME: node
  OPENCLAW_CI_TEST_RUNTIME_POLICY: node
jobs:
  worker-observers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify source and workflow provenance
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
          EXPECTED_WORKFLOW: ${{ inputs.workflow_sha }}
          WORKFLOW: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^)" = 00b330babd579bea362a074f5e3c0efd03606fd2
          test "$WORKFLOW" = "$EXPECTED_WORKFLOW"
          mkdir -p "$RUNNER_TEMP/worker-observers"
          python3 - <<'PY'
          import subprocess
          expected = sorted(['extensions/reef/src/flow.worker-outbound.test.ts', 'extensions/memory-core/src/memory/manager-publication-generation.test.ts', 'src/cli/update-cli/update-command-mutable-signals.test.ts', 'src/cli/update-cli/update-command-mutable-signals-compensation.test-support.ts'])
          actual = sorted(subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines())
          assert actual == expected, actual
          PY
          {
            git rev-parse HEAD HEAD^
            echo "$WORKFLOW"
            git ls-tree HEAD -- package.json pnpm-lock.yaml extensions/reef/src/flow.worker-outbound.test.ts extensions/memory-core/src/memory/manager-publication-generation.test.ts src/cli/update-cli/update-command-mutable-signals.test.ts src/cli/update-cli/update-command-mutable-signals-compensation.test-support.ts src/infra/sqlite-worker-broker-reply.ts
          } | tee "$RUNNER_TEMP/worker-observers/provenance.txt"
      - name: Setup Node environment
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
          node-compile-cache: "true"
      - name: Check four changed files
        id: changed
        run: |
          set -euo pipefail
          changed=(extensions/reef/src/flow.worker-outbound.test.ts extensions/memory-core/src/memory/manager-publication-generation.test.ts src/cli/update-cli/update-command-mutable-signals.test.ts src/cli/update-cli/update-command-mutable-signals-compensation.test-support.ts)
          node_modules/.bin/oxfmt --check --threads=1 "${changed[@]}"
          node scripts/run-oxlint.mjs "${changed[@]}"
          git diff --check HEAD^
      - name: Diagnose the two natural update failure signatures
        id: baseline
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/worker-observers"
          python3 - <<'PY'
          import os, pathlib, subprocess
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'worker-observers'
          files = ['src/cli/update-cli/update-command-mutable-signals.test.ts', 'src/cli/update-cli/update-command-mutable-signals-compensation.test-support.ts']
          for filename in files:
              path = pathlib.Path(filename)
              (proof / path.name).write_bytes(path.read_bytes())
              text = subprocess.check_output(['git','show','HEAD^:'+filename],text=True)
              needle = 'deserialize(request.input).type'
              assert text.count(needle) == 1, filename
              observer = "(() => { try { return deserialize(request.input).type; } catch (error) { console.error('TRANSFER_DIAG ' + JSON.stringify({mode, byteLength:request.input.byteLength, error:error.message})); throw error; } })()"
              text = text.replace(needle, observer)
              if filename.endswith('update-command-mutable-signals.test.ts'):
                  needle = '          stderr += chunk;\n'
                  assert text.count(needle) == 1
                  text = text.replace(needle, needle + '          if (String(chunk).includes("TRANSFER_DIAG")) console.log(String(chunk));\n')
              path.write_text(text)
          PY
          git diff HEAD^ -- src/cli/update-cli/update-command-mutable-signals.test.ts src/cli/update-cli/update-command-mutable-signals-compensation.test-support.ts > "$proof_dir/baseline-diagnostic.patch"
          set +e
          node scripts/run-vitest.mjs run --config test/vitest/vitest.cli.config.ts src/cli/update-cli/update-command-mutable-signals.test.ts --maxWorkers=1 --passWithNoTests=false --testNamePattern 'SIGINT/(queued-progress|accepted-compensation)$' --reporter=default --reporter=json --outputFile.json="$proof_dir/baseline.json" 2>&1 | tee "$proof_dir/baseline.log"
          result=${PIPESTATUS[0]}
          set -e
          echo "$result" > "$proof_dir/baseline-exit.txt"
          for filename in src/cli/update-cli/update-command-mutable-signals.test.ts src/cli/update-cli/update-command-mutable-signals-compensation.test-support.ts; do
            cp "$proof_dir/${filename##*/}" "$filename"
          done
          git diff --exit-code HEAD --
      - name: Prove the five failed update signal cases
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.changed.outcome == 'success' && steps.baseline.outcome == 'success' }}
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/worker-observers"
          node scripts/run-vitest.mjs run --config test/vitest/vitest.cli.config.ts src/cli/update-cli/update-command-mutable-signals.test.ts --maxWorkers=1 --passWithNoTests=false --testNamePattern 'SIGINT/(queued-progress|refused-progress|uncertain-progress|accepted-compensation|uncertain-compensation)$' --reporter=default --reporter=json --outputFile.json="$proof_dir/signals.json" 2>&1 | tee "$proof_dir/signals.log"
      - name: Prove six failed command probes and the changed memory sibling
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.changed.outcome == 'success' && steps.baseline.outcome == 'success' }}
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/worker-observers"
          node scripts/run-vitest.mjs run --config test/vitest/vitest.extension-database-workers.config.ts extensions/reef/src/flow.worker-outbound.test.ts extensions/memory-core/src/memory/manager-publication-generation.test.ts --maxWorkers=1 --passWithNoTests=false --testNamePattern 'persists proposal, verdict, envelope and exact delivery in two worker commands without host SQL|settles an existing denied review in one command without classifying again|reclassifies an approved review once and commits its approved send in two commands|keeps the guard audit on a review-capacity refusal without recording delivery|reserves an in-flight message id without another worker request|^retains published memory facts across session and embedding-cache writes$|^refreshes facts once after another in-process writer commits$' --reporter=default --reporter=json --outputFile.json="$proof_dir/probes.json" 2>&1 | tee "$proof_dir/probes.log"
      - name: Verify exact baseline failures and twelve candidate passes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'worker-observers'
          baseline = json.loads((proof / 'baseline.json').read_text())
          cases = [case for result in baseline['testResults'] for case in result['assertionResults'] if case['status'] not in ('pending','skipped','todo','disabled')]
          assert len(baseline['testResults']) == 1 and len(cases) == 2 and all(c['status'] == 'failed' for c in cases), cases
          assert baseline['numFailedTests'] == 2 and baseline.get('numRuntimeErrorTestSuites',0) == 0
          assert (proof / 'baseline-exit.txt').read_text().strip() != '0'
          log = (proof / 'baseline.log').read_text()
          for mode in ['queued-progress','accepted-compensation']:
              assert f'"mode":"{mode}","byteLength":0' in log, mode
          queued, = [c for c in cases if c['fullName'].endswith('SIGINT/queued-progress')]
          accepted, = [c for c in cases if c['fullName'].endswith('SIGINT/accepted-compensation')]
          assert 'undefined' in str(queued['failureMessages']), queued
          assert 'database is locked' in str(accepted['failureMessages']), accepted
          expected = {
              'signals': {'src/cli/update-cli/update-command-mutable-signals.test.ts':5},
              'probes': {'extensions/reef/src/flow.worker-outbound.test.ts':5,'extensions/memory-core/src/memory/manager-publication-generation.test.ts':2},
          }
          receipts = {'baseline': {'failed':2,'detached_buffer_signatures':['queued-progress','accepted-compensation']}}
          for name, files in expected.items():
              data = json.loads((proof / (name + '.json')).read_text())
              assert len(data['testResults']) == len(files), data
              executed = []
              for filename, count in files.items():
                  result, = [r for r in data['testResults'] if r['name'].endswith('/'+filename)]
                  cases = [case for case in result['assertionResults'] if case['status'] not in ('pending','skipped','todo','disabled')]
                  assert len(cases) == count and all(c['status']=='passed' for c in cases), (filename,cases)
                  executed += cases
              assert data['success'] and data['numPassedTests'] == sum(files.values()) and data['numFailedTests'] == 0
              assert data.get('numRuntimeErrorTestSuites',0) == 0
              receipts[name] = {'passed':len(executed),'selected':[c['fullName'] for c in executed],'duration_ms':sum(c.get('duration',0) for c in executed)}
          assert receipts['signals']['passed'] + receipts['probes']['passed'] == 12
          text = json.dumps(receipts,indent=2)
          (proof / 'case-counts.json').write_text(text+'\n')
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('```json\n'+text+'\n```\n')
          PY
      - name: Verify unchanged candidate sources
        if: ${{ always() }}
        run: |
          set -euo pipefail
          git status --short
          git diff --exit-code HEAD --
      - name: Preserve scoped proof
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-worker-observers-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worker-observers/
          if-no-files-found: error
          retention-days: 14
