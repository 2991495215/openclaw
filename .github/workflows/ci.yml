      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"

      # The exact file is absent from built-runtime consumers. Canonical pnpm test
      # owns source worker preparation; no additional build or warmup is selected.
      - name: Run only the original failing session creation case
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          {
            node --version
            pnpm --version
            echo "Command: pnpm test src/gateway/server.sessions.create.durability.test.ts --maxWorkers=1 -t 'persists and dispatches concurrent Gateway inputs while participant writes queue'"
          } | tee .artifacts/session-create-durability-phase/command.log
          started="$(date +%s)"
          if pnpm test src/gateway/server.sessions.create.durability.test.ts --maxWorkers=1 -t 'persists and dispatches concurrent Gateway inputs while participant writes queue' 2>&1 | tee .artifacts/session-create-durability-phase/test.log; then
            test_exit=0
          else
            test_exit=$?
          fi
          elapsed=$(( $(date +%s) - started ))
          {
            echo "Test exit: $test_exit"
            echo "Elapsed seconds: $elapsed"
          } | tee .artifacts/session-create-durability-phase/result.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$test_exit"

      - name: Verify exact diagnostic source remained unchanged
        if: ${{ always() }}
        shell: bash
        env:
          EXPECTED_SHA: 838c6ada7dc9d657098b552eb846d8e5f176b79e
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "c93572933cc2198d33289edf9966cd467b986805ade3c731f5305ee9e95bd57e  .artifacts/session-create-durability-phase/diagnostic.patch" | sha256sum --check
          sha256sum --check .artifacts/session-create-durability-phase/diagnostic.sha256
          git diff HEAD --binary | cmp - .artifacts/session-create-durability-phase/expected-source.diff
          echo "Exact source plus recorded diagnostic patch remained unchanged." | tee .artifacts/session-create-durability-phase/source-unchanged.log

      - name: Preserve diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-session-create-phase-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/session-create-durability-phase/
          if-no-files-found: warn
          retention-days: 14
