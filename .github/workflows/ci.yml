# Temporary exact-task proof carrier. Never merge.
name: Red-main Android review helper lint proof
run-name: Android review helper lint ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        required: true
        type: string
permissions:
  contents: read
jobs:
  android-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source fix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e8d525a50f3f8b54036d486ae1f73a2680eb3d96
          fetch-depth: 2
          persist-credentials: false
      - name: Verify source scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e8d525a50f3f8b54036d486ae1f73a2680eb3d96
          test "$(git diff --name-only HEAD^ HEAD)" = apps/android/app/src/test/java/ai/openclaw/app/ui/chat/ChatComposerLayoutTest.kt
          git diff --check HEAD^ HEAD
          git show --stat --oneline HEAD
          git diff HEAD^ HEAD
      - name: Set up Android lint toolchain
        id: android
        uses: ./.github/actions/setup-android-toolchain
        with:
          cache-mode: restore
      - name: Run the exact failed Kotlin lint task
        working-directory: apps/android
        env:
          JAVA_HOME: ${{ steps.android.outputs.gradle-java-home }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-review-format"
          started="$(date +%s)"
          ./gradlew --no-daemon --build-cache :app:ktlintTestSourceSetCheck \
            2>&1 | tee "$RUNNER_TEMP/android-review-format/gradle.log"
          echo "Kotlin lint command seconds: $(( $(date +%s) - started ))" | tee "$RUNNER_TEMP/android-review-format/timing.txt"
      - name: Verify unchanged checkout
        if: ${{ always() }}
        run: git diff --exit-code
      - name: Upload lint proof
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-review-helper-lint
          path: |
            ${{ runner.temp }}/android-review-format/
            apps/android/app/build/reports/ktlint/ktlintTestSourceSetCheck/
