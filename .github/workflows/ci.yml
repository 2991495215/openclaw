# Temporary diagnostic only. Never merge this workflow or its source logging.
name: Red-main agent config readiness diagnosis
run-name: Agent config readiness diagnosis ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-config-readiness-diagnosis-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  BASE_SHA: 61ed639e61fcee505956d1a81f56f292833b195c
  CANDIDATE_SHA: 1028fc14c4a9ae7067a19d3b7f5470837d9c6072

jobs:
  config-readiness:
    name: Agent config readiness (all three original cases)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENCLAW_LOCAL_CHECK: "0"
      OPENCLAW_VITEST_RUNTIME: node
    steps:
      - name: Checkout exact diagnostic source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1028fc14c4a9ae7067a19d3b7f5470837d9c6072
          fetch-depth: 2
          persist-credentials: false

      - name: Verify diagnostic scope and record source
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA" HEAD)" = src/gateway/server.agents.config-readiness.test.ts
          test "$(git rev-parse HEAD:src/gateway/server.agents.config-readiness.test.ts)" = 8c5125a181a2f7b9bd7e77d0c1683686d61579f3
          git diff --exit-code HEAD --
          proof_dir="$RUNNER_TEMP/config-readiness-diagnosis"
          mkdir -p "$proof_dir"
          git diff "$BASE_SHA" HEAD -- src/gateway/server.agents.config-readiness.test.ts > "$proof_dir/diagnostic.patch"
          {
            echo "Product base: $BASE_SHA"
            echo "Diagnostic source: $CANDIDATE_SHA"
            echo "Workflow: $WORKFLOW_SHA"
            git show -s --format='%H%n%P%n%an <%ae>%n%s' HEAD
            git ls-tree HEAD -- package.json pnpm-lock.yaml \
              src/gateway/server.agents.config-readiness.test.ts \
              src/gateway/config-reload.ts src/infra/errors.ts \
              .github/actions/setup-node-env/action.yml
          } | tee "$proof_dir/provenance.log"
          cat "$proof_dir/provenance.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup frozen Node environment matching failed schedule
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"

      - name: Run only the complete agent config readiness file
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.19.0
          proof_dir="$RUNNER_TEMP/config-readiness-diagnosis"
          {
            node --version
            pnpm --version
            echo "Command: pnpm test src/gateway/server.agents.config-readiness.test.ts --maxWorkers=1"
          } | tee "$proof_dir/command.log"
          started="$(date +%s)"
          if pnpm test src/gateway/server.agents.config-readiness.test.ts --maxWorkers=1 2>&1 | tee "$proof_dir/test.log"; then
            test_exit=0
          else
            test_exit=$?
          fi
          elapsed=$(( $(date +%s) - started ))
          {
            echo "Test exit: $test_exit"
            echo "Elapsed seconds: $elapsed"
          } | tee "$proof_dir/result.txt" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_exit"

      - name: Verify tracked source stayed unchanged
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git hash-object src/gateway/server.agents.config-readiness.test.ts)" = 8c5125a181a2f7b9bd7e77d0c1683686d61579f3
          git diff --exit-code HEAD --

      - name: Preserve focused diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-config-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/config-readiness-diagnosis/
          if-no-files-found: warn
          retention-days: 14
