# Temporary controlled-order diagnosis only. Never merge this workflow or its source logging.
name: Red-main config watcher-first diagnosis
run-name: Config watcher-first diagnosis ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact diagnostic source commit
        type: string
        required: true
      workflow_sha:
        description: Exact workflow carrier commit
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-config-watcher-first-${{ github.ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  BASE_SHA: 22841b21de786b63920af7c4118be5e1058badc0
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
jobs:
  focused:
    name: Controlled watcher-first cold-owner config diagnosis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENCLAW_LOCAL_CHECK: "0"
      OPENCLAW_VITEST_RUNTIME: node
    steps:
      - name: Checkout exact diagnostic source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source and controlled fixture provenance
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git rev-parse "$BASE_SHA":src/gateway/server.config-patch.test.ts)" = 73e9f07ee017a02a952181cf0dac12fd298c5eb3
          test "$(git rev-parse HEAD:src/gateway/server.config-patch.test.ts)" = 9d127872de23a8605294d1ed54f3417065f42483
          python3 - <<'PY'
          import os, subprocess
          actual = subprocess.check_output(['git', 'diff', '--name-only', os.environ['BASE_SHA'], 'HEAD'], text=True).splitlines()
          expected = ['src/config/runtime-write-application.ts', 'src/gateway/config-reload.ts', 'src/gateway/server-methods/config-write-flow.ts', 'src/gateway/server-methods/config.ts', 'src/gateway/server-reload-managed-secrets.ts', 'src/gateway/server.config-patch.test.ts']
          assert actual == expected, actual
          PY
          git diff --exit-code HEAD --
          proof_dir="$RUNNER_TEMP/config-watcher-first"
          mkdir -p "$proof_dir"
          git diff "$BASE_SHA" HEAD > "$proof_dir/diagnostic.patch"
          {
            echo "Product base: $BASE_SHA"
            echo "Diagnostic source: $CANDIDATE_SHA"
            echo "Workflow: $WORKFLOW_SHA"
            git show -s --format='%H%n%P%n%an <%ae>%n%s' HEAD
            git ls-tree HEAD -- package.json pnpm-lock.yaml src/gateway/server.config-patch.test.ts test/helpers/gateway/config-rpc-gateway.ts src/config/runtime-write-application.ts src/gateway/config-reload.ts src/gateway/server-methods/config-write-flow.ts src/gateway/server-methods/config.ts src/gateway/server-reload-managed-secrets.ts
            uname -a
            getconf _NPROCESSORS_ONLN
          } | tee "$proof_dir/provenance.log"
      - name: Setup original Node runtime and frozen dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
      - name: Run the original failing case with controlled ordering once
        id: focused
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.19.0
          proof_dir="$RUNNER_TEMP/config-watcher-first"
          {
            node --version
            pnpm --version
            echo 'Command: pnpm test src/gateway/server.config-patch.test.ts --maxWorkers=1 --reporter=verbose --reporter=json --outputFile.json results.json -t "reloads owners independently and reports a changed unresolved owner as cold"'
          } | tee "$proof_dir/command.log"
          started="$(date +%s)"
          if pnpm test src/gateway/server.config-patch.test.ts --maxWorkers=1 \
            --reporter=verbose --reporter=json --outputFile.json "$proof_dir/results.json" \
            -t 'reloads owners independently and reports a changed unresolved owner as cold' \
            2>&1 | tee "$proof_dir/test.log"; then
            test_exit=0
          else
            test_exit=$?
          fi
          {
            echo "Test exit: $test_exit"
            echo "Elapsed seconds: $(( $(date +%s) - started ))"
          } | tee "$proof_dir/result.txt"
          exit "$test_exit"
      - name: Qualify the controlled ordering and record observations
        if: ${{ always() && steps.focused.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'config-watcher-first'
          report = json.loads((proof / 'results.json').read_text())
          assert len(report['testResults']) == 1
          result = report['testResults'][0]
          assert pathlib.Path(result['name']).resolve() == pathlib.Path('src/gateway/server.config-patch.test.ts').resolve()
          selected = [entry for entry in result['assertionResults'] if entry['status'] in ('passed', 'failed')]
          expected = 'gateway config methods reloads owners independently and reports a changed unresolved owner as cold'
          assert len(selected) == 1 and selected[0]['fullName'] == expected
          assert report['numPassedTests'] + report['numFailedTests'] == 1
          log = re.sub(r'\x1b\[[0-9;]*m', '', (proof / 'test.log').read_text())
          events = [json.loads(raw) for raw in re.findall(r'\[config-(?:rpc|candidate|fixture)-phase\] (\{[^\n]*\})', log)]
          assert 1 <= len(events) <= 1024
          for event in events:
              assert {'phase', 'atMs'} <= set(event)
              assert set(event) <= {'phase', 'atMs', 'epoch', 'origin', 'receipts', 'running', 'pending', 'watcherReload', 'timer', 'revision', 'writerRevision', 'activeEpoch', 'retryEpoch', 'stopped', 'initialized', 'initialEpoch', 'superseded'}
              if 'receipts' in event:
                  assert event['origin'] in (None, 'file', 'write')
                  assert event['epoch'] is None or type(event['epoch']) is int
                  assert all(item is None or type(item) is int for item in event['receipts'])
              for key, value in event.items():
                  if key not in ('phase', 'atMs', 'epoch', 'origin', 'receipts'):
                      assert type(value) in (bool, int)
              assert re.fullmatch(r'[a-z0-9:-]+', event['phase'])
              assert isinstance(event['atMs'], int) and event['atMs'] >= 0
          phases = [event['phase'] for event in events]
          markers = ['fixture:armed', 'fixture:writer-held', 'fixture:watcher-returned', 'fixture:writer-released', 'fixture:qualified']
          invalid_reasons = [f'{marker} count is {phases.count(marker)}' for marker in markers if phases.count(marker) != 1]
          if 'fixture:invalid' in phases:
              invalid_reasons.append('fixture cleanup reported invalid ordering')
          cold_receipt = None
          if not invalid_reasons:
              arm, held, watched, released, qualified = [phases.index(marker) for marker in markers]
              if not (arm < held < released < qualified and arm < watched < released):
                  invalid_reasons.append('controlled boundary order was not established')
              receipts = [re.fullmatch(r'receipt:(\d+):created', phase) for phase in phases[arm + 1:held]]
              receipt_ids = [int(match[1]) for match in receipts if match]
              if len(receipt_ids) != 1:
                  invalid_reasons.append('cold write receipt was not uniquely identified')
              else:
                  cold_receipt = receipt_ids[0]
                  claimed = f'receipt:{cold_receipt}:claimed'
                  if phases.count(claimed) != 1 or phases.index(claimed) <= released:
                      invalid_reasons.append('cold receipt was not claimed after watcher release')
          mismatch = False
          applying_cold_receipt = False
          for event in events:
              if event['phase'] == 'candidate:apply':
                  applying_cold_receipt = cold_receipt is not None and cold_receipt in event.get('receipts', [])
              elif event['phase'] in ('effective:reuse-mismatch', 'effective:prepared-mismatch') and applying_cold_receipt:
                  mismatch = True
              elif event['phase'] == 'candidate:catch' or event['phase'].startswith('candidate:settle:'):
                  applying_cold_receipt = False
          retained = cold_receipt is not None and any(event['phase'] in ('candidate:retain-write', 'candidate:retain-retry') and cold_receipt in event.get('receipts', []) for event in events)
          timeout = any('GatewayClientRequestTimeoutError' in message and 'config.patch' in message for message in selected[0].get('failureMessages', []))
          prediction_observed = not invalid_reasons and mismatch and retained and timeout
          qualification = 'invalid_controlled_fixture' if invalid_reasons else ('controlled_prediction_observed' if prediction_observed else 'controlled_order_qualified_prediction_not_observed')
          outcome = {
              'candidate': os.environ['CANDIDATE_SHA'], 'base': os.environ['BASE_SHA'], 'selected': expected,
              'status': selected[0]['status'], 'qualification': qualification, 'fixture_invalid_reasons': invalid_reasons,
              'cold_receipt': cold_receipt, 'effective_mismatch': mismatch, 'cold_receipt_retained': retained,
              'config_patch_request_timeout': timeout,
              'prediction': 'Watcher commits cold runtime before managed write publication; the receipt-bearing write then reaches the unchanged-source credential mismatch, retains its receipt, and times out.',
              'events': events, 'controlled_fixture': True, 'original_failure_attributed': False,
              'diagnostic_only': True, 'production_fix_claim': False,
          }
          text = json.dumps(outcome, indent=2)
          (proof / 'observations.json').write_text(text + '\n')
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('```json\n' + text + '\n```\n')
          PY
      - name: Verify tracked source remained exact
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git diff --exit-code HEAD --
      - name: Preserve focused diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-config-watcher-first-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/config-watcher-first/
          if-no-files-found: warn
          retention-days: 14
