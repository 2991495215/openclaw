# Temporary security-case proof only. Never merge this workflow.
name: Red-main chat authorization retention proof proof
run-name: Chat authorization retention proof proof ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact temporary proof source commit
        type: string
        required: true
      reproduction_sha:
        description: Exact reproduction source commit
        type: string
        required: true
      workflow_sha:
        description: Exact workflow carrier commit
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-sessions-goal-retention-${{ github.ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  BASE_SHA: 3ee1b6d806cea2e21d837ece3aeec8c4b8575dd7
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
jobs:
  focused:
    name: First-turn authorization retention and 14 Goal cases
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENCLAW_LOCAL_CHECK: "0"
      OPENCLAW_VITEST_RUNTIME: node
    steps:
      - name: Checkout exact proof source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify diagnostic source
        id: provenance
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          proof_dir="$RUNNER_TEMP/sessions-goal-retention"
          mkdir -p "$proof_dir"
          git diff "$BASE_SHA" HEAD > "$proof_dir/diagnostic-source.patch"
          git show -s --format='%H%n%P%n%an <%ae>%n%s' HEAD > "$proof_dir/provenance.log"
          git diff --exit-code HEAD --
      - name: Setup original Node runtime and frozen dependencies
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
      - name: Format and lint fixture fix
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec oxfmt --check src/gateway/server-methods/chat-send-admission.reads.test.ts
          node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.core.json src/gateway/server-methods/chat-send-admission.reads.test.ts
      - name: Reproduce unreleased first-turn authorization
        id: reproduction
        env:
          REPRODUCTION_SHA: ${{ inputs.reproduction_sha }}
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/sessions-goal-retention"
          file=src/gateway/server-methods/chat-send-admission.reads.test.ts
          cp "$file" "$proof_dir/candidate.test.ts"
          git fetch --depth=1 origin "$REPRODUCTION_SHA"
          git show "$REPRODUCTION_SHA:$file" > "$file"
          test "$(git hash-object "$file")" = "$(git rev-parse "$REPRODUCTION_SHA:$file")"
          started="$(date +%s)"
          if pnpm test "$file" --maxWorkers=1 -t 'prepares and authorizes a first chat turn without caller-thread SQL' \
            --reporter=verbose --reporter=json --outputFile.json "$proof_dir/reproduction.json" 2>&1 | tee "$proof_dir/reproduction.log"; then
            test_exit=0
          else
            test_exit=$?
          fi
          echo "Reproduction exit: $test_exit; elapsed: $(( $(date +%s) - started )) seconds" | tee "$proof_dir/reproduction-result.txt"
          cp "$proof_dir/candidate.test.ts" "$file"
          git diff --exit-code HEAD --
          python3 - <<'PYINNER'
          import json, os, pathlib
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sessions-goal-retention'
          report = json.loads((proof / 'reproduction.json').read_text())
          selected = [e for f in report['testResults'] for e in f['assertionResults'] if e['status'] in ('passed','failed')]
          assert len(selected) == 2, selected
          failures = [e for e in selected if e['status'] == 'failed']
          assert len(failures) == 1 and 'admitted agent store' in failures[0]['title'], failures
          assert 'Completed handlers must release retained session sharing facts' in str(failures[0]), failures
          print(json.dumps({'selected_count': 2, 'passed': 1, 'failed': 1, 'failed_case': failures[0]['fullName']}))
          PYINNER
      - name: Prove repaired producer and all original Goal cases
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/sessions-goal-retention"
          started="$(date +%s)"
          if pnpm test src/gateway/server-methods/chat-send-admission.reads.test.ts src/gateway/server-methods/sessions-goal.test.ts --maxWorkers=1 \
            -t 'prepares and authorizes a first chat turn without caller-thread SQL|typed Goal management RPCs' \
            --reporter=verbose --reporter=json --outputFile.json "$proof_dir/candidate.json" 2>&1 | tee "$proof_dir/candidate.log"; then
            test_exit=0
          else
            test_exit=$?
          fi
          echo "Candidate exit: $test_exit; elapsed: $(( $(date +%s) - started )) seconds" | tee "$proof_dir/candidate-result.txt"
          python3 - <<'PYINNER'
          import json, os, pathlib
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sessions-goal-retention'
          report = json.loads((proof / 'candidate.json').read_text())
          selected = [e for f in report['testResults'] for e in f['assertionResults'] if e['status'] in ('passed','failed')]
          assert len(selected) == 16, selected
          assert report['numPassedTests'] == 16 and report['numFailedTests'] == 0, report
          observation = {'selected_count': 16, 'passed': 16, 'failed': 0, 'source': os.environ['CANDIDATE_SHA'], 'base': os.environ['BASE_SHA']}
          (proof / 'observations.json').write_text(json.dumps(observation, indent=2) + '\n')
          print(json.dumps(observation))
          PYINNER
          git diff --exit-code HEAD --
          exit "$test_exit"
      - name: Preserve exact-case evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: redmain-sessions-goal-retention-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sessions-goal-retention/
          if-no-files-found: warn
          retention-days: 14
