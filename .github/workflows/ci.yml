name: Red-main cron retention diagnosis
run-name: Cron retention ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        type: string
        required: true
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 770f70b9658540d4d5498955cd186b4986d79ac5
          persist-credentials: false
      - name: Verify diagnostic source
        run: test "$(git rev-parse HEAD)" = 770f70b9658540d4d5498955cd186b4986d79ac5
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
      - name: Run only failed parked retention case
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: pnpm test src/cron/maintenance.test.ts --maxWorkers=1 -t 'rearms parked retention from a committed worker history write'
      - name: Verify unchanged diagnostic source
        if: ${{ always() }}
        run: git diff --exit-code
