          +              recordPhase("provider:channel-read");
          +            } else if (
          +              req.method === "GET" &&
          +              url.pathname === `/api/v10/channels/${channelId}/messages`
          +            ) {
          +              recordPhase("provider:messages-read");
          +            }
                       requests.push({ method: req.method ?? "", path: url.pathname, authorizationMatches });
                       expect(authorizationMatches, "Discord fixture authorization matches").toBe(true);
                       if (req.method === "PATCH" && url.pathname === `/api/v10/channels/${channelId}`) {
          @@ -619,7 +643,9 @@
                   }
           
                   vi.stubEnv("DISCORD_API_URL", `${providerOrigin}/api/v10`);
          +        recordPhase("mcp-listener:enter");
                   await ensureMcpLoopbackServer(0);
          +        recordPhase("mcp-listener:exit");
                   cleanup.push(() => closeMcpLoopbackServer());
                   const mcpRuntime = expectDefined(getActiveMcpLoopbackRuntime(), "task-owned MCP runtime");
                   const mcpOrigin = `http://127.0.0.1:${mcpRuntime.port}`;
          @@ -639,16 +665,19 @@
                     }),
                   );
           
          +        recordPhase("runtime-install:enter");
                   const stopBindingManager = await installScheduledMessageReadRuntime({
                     cfg,
                     childPath,
                     nativeCreatorAccountId: nativeCreator ? creatorAccountId : undefined,
                     cleanup,
                   });
          +        recordPhase("runtime-install:exit");
                   cleanup.push(() => resetPreparedModelRuntimeSnapshotsForTest());
                   const finished = createDeferred<Record<string, unknown>>();
                   const scheduledJob: { id?: string } = {};
                   unstartedGatewayPortClaim = undefined;
          +        recordPhase("gateway-start:enter");
                   const gateway = await startGatewayWithClient({
                     portClaim: gatewayPortClaim,
                     cfg,
          @@ -662,22 +691,30 @@
                         event.payload.action === "finished" &&
                         event.payload.jobId === scheduledJob.id
                       ) {
          +              recordPhase("cron:finished-event");
                         finished.resolve(event.payload);
                       }
                     },
                   });
          +        recordPhase("gateway-start:exit");
                   cleanup.push(async () => {
          +          recordPhase("gateway-cleanup:enter");
                     await runQaGatewayFixture(
                       () => disconnectGatewayClient(gateway.client),
                       () => stopBindingManager(),
                       () => gateway.server.close({ reason: "scheduled read fixture complete" }),
                     );
          +          recordPhase("gateway-cleanup:exit");
                   });
          +        recordPhase("gateway-settled:enter");
                   await gateway.server.startupSettled;
          +        recordPhase("gateway-settled:exit");
          +        recordPhase("catalog-prepare:enter");
                   await refreshPreparedModelRuntimeSnapshots(getRuntimeConfig(), {
                     gatewayLifecycle: true,
                     catalogMode: "static",
                   });
          +        recordPhase("catalog-prepare:exit");
                   const runtimeConfig = getRuntimeConfig();
                   const params = {
                     name: nativeCreator
          @@ -751,7 +788,9 @@
                     }
                     created = { id: response.id };
                   } else if (creator === "trusted") {
          +          recordPhase("cron-add:enter");
                     created = await gateway.client.request<{ id: string }>("cron.add", params);
          +          recordPhase("cron-add:exit");
                   } else {
                     created = await createAccountOwnedScheduledJob({
                       cfg: runtimeConfig,
          @@ -768,10 +807,12 @@
                   }
                   scheduledJob.id = created.id;
                   const storePath = resolveCronJobsStorePathFromConfig(getRuntimeConfig());
          +        recordPhase("cron-store:enter");
                   const job = expectDefined(
                     (await loadCronStore(storePath)).jobs.find((entry) => entry.id === created.id),
                     "persisted scheduled job",
                   );
          +        recordPhase("cron-store:exit");
                   if (nativeCreator) {
                     expect(job).toMatchObject({
                       owner: { sessionKey: creatorSessionKey, accountId: creatorAccountId },
          @@ -820,9 +861,11 @@
                     });
                   }
                   expect(job).toMatchObject({ payload: { toolsAllow: ["message"] } });
          +        recordPhase("cron-run:enter");
                   expect(
                     await gateway.client.request("cron.run", { id: job.id, mode: "force" }),
                   ).toMatchObject({ ok: true, enqueued: true });
          +        recordPhase("cron-run:exit");
                   if (heldPatch) {
                     try {
                       await withTestTimeout(
          @@ -873,14 +916,17 @@
                       heldPatch.release.resolve();
                     }
                   }
          +        recordPhase("completion-wait:enter");
                   const completion = await withTestTimeout(
                     finished.promise,
                     45_000,
                     "Expected scheduled agent completion",
                   );
          +        recordPhase("completion-wait:exit");
                   if (!disableBeforeResponse) {
                     expect(completion, diagnostics(completion)).toMatchObject({ status: "ok" });
                   }
          +        recordPhase("result-assertions:enter");
                   let text: string | undefined;
                   if (runtime === "claude-cli") {
                     const observation: {
          @@ -965,13 +1011,21 @@
                     expect(edits).toEqual([]);
                   }
                   expect(providerErrors).toEqual([]);
          +        recordPhase("result-assertions:exit");
                 },
                 // Release provider responses before Gateway shutdown waits for pending writes.
          -      () => heldPatch?.release.resolve(),
          +      () => {
          +        recordPhase("cleanup:enter");
          +        heldPatch?.release.resolve();
          +      },
                 () => runQaGatewayFixture(async () => {}, ...cleanup.toReversed()),
                 () => vi.restoreAllMocks(),
                 () => vi.unstubAllGlobals(),
          -      () => vi.unstubAllEnvs(),
          +      () => {
          +        vi.unstubAllEnvs();
          +        recordPhase("cleanup:exit");
          +      },
               );
          +    recordPhase("test:exit");
             });
           });
          DIAGNOSTIC_PATCH
          echo "6de41acb27e182aa52a1a4f51297db4cdd5b35feb64b78e44386b714204bde0c  .artifacts/cron-message-read-phase/diagnostic.patch" | sha256sum --check
          git apply --check .artifacts/cron-message-read-phase/diagnostic.patch
          git apply .artifacts/cron-message-read-phase/diagnostic.patch
          test "$(git diff --name-only HEAD)" = "test/cron-message-read.integration.test.ts"
          echo "ab8b92243747141bc9b21648d57a6e357dde98ad107832ec41548feba184a997  test/cron-message-read.integration.test.ts" | sha256sum --check
          git diff --check
          git diff HEAD --binary > .artifacts/cron-message-read-phase/expected-source.diff
          cp test/cron-message-read.integration.test.ts .artifacts/cron-message-read-phase/diagnostic.ts
          {
            echo "Diagnostic patch SHA256: 6de41acb27e182aa52a1a4f51297db4cdd5b35feb64b78e44386b714204bde0c"
            echo "Patched test SHA256: ab8b92243747141bc9b21648d57a6e357dde98ad107832ec41548feba184a997"
            git diff --stat
          } | tee -a .artifacts/cron-message-read-phase/provenance.log
          cat .artifacts/cron-message-read-phase/provenance.log >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"

      # The canonical runner owns worker preparation. This source-based infra test
      # is not a built-runtime consumer; do not build qaRuntime or bypass setup.
      - name: Run only the original failing cron read case
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          started="$(date +%s)"
          if pnpm test test/cron-message-read.integration.test.ts --maxWorkers=1 -t 'claude-cli/read' 2>&1 | tee .artifacts/cron-message-read-phase/test.log; then
            test_exit=0
          else
            test_exit=$?
          fi
          elapsed=$(( $(date +%s) - started ))
          {
            echo "Test exit: $test_exit"
            echo "Elapsed seconds: $elapsed"
          } | tee .artifacts/cron-message-read-phase/result.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$test_exit"

      - name: Verify exact diagnostic source remained unchanged
        if: ${{ always() }}
        shell: bash
        env:
          EXPECTED_SHA: c8a1db6f389b8bdf1eae4b595027a96490c5fba4
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "ab8b92243747141bc9b21648d57a6e357dde98ad107832ec41548feba184a997  test/cron-message-read.integration.test.ts" | sha256sum --check
          git diff HEAD --binary | cmp - .artifacts/cron-message-read-phase/expected-source.diff
          echo "Exact source plus recorded diagnostic patch remained unchanged." | tee .artifacts/cron-message-read-phase/source-unchanged.log

      - name: Preserve diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-cron-message-read-phase-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/cron-message-read-phase/
          if-no-files-found: warn
          retention-days: 14
