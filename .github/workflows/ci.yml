name: Focused main and SDK proof
on:
  workflow_dispatch:
    inputs:
      render_sdk:
        description: Also render and compare SDK surfaces
        required: false
        default: false
        type: boolean
      diagnose_readiness:
        description: Diagnose frozen session publication with test-only stage instrumentation
        required: false
        default: false
        type: boolean
      diagnose_upgrade:
        description: Run the frozen Linux Bun upgrade owner diagnostic
        required: false
        default: false
        type: boolean
      verify_usage:
        description: Verify the frozen actor usage-cache invalidation regression
        required: false
        default: false
        type: boolean
      verify_sdk_static:
        description: Check the frozen SDK surface and runtime API guardrails
        required: false
        default: false
        type: boolean
      diagnose_doctor:
        description: Run the frozen side-question and consent fixture regressions
        required: false
        default: false
        type: boolean
      diagnose_node_wire:
        description: Run the frozen node worker launch wire regression
        required: false
        default: false
        type: boolean
      diagnose_actor:
        description: Diagnose frozen actor row publication with test-only phase instrumentation
        required: false
        default: false
        type: boolean
      diagnose_copilot:
        description: Diagnose the frozen actor row baseline
        required: false
        default: false
        type: boolean
      diagnose_final:
        description: Run frozen protocol baseline/candidate and registry candidate regressions
        required: false
        default: false
        type: boolean
      diagnose_protocol:
        description: Verify only candidate protocol and transcript effect-authority regressions
        required: false
        default: false
        type: boolean
      diagnose_fixtures:
        description: Verify the frozen merge-conflict fixture resolutions
        required: false
        default: false
        type: boolean
      base_sha:
        description: Full predecessor commit SHA
        required: true
        type: string
      head_sha:
        description: Full candidate commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: plugin-sdk-api-report-${{ inputs.base_sha }}-${{ inputs.head_sha }}-${{ inputs.verify_sdk_static }}-${{ inputs.diagnose_doctor }}-${{ inputs.diagnose_node_wire }}-${{ inputs.diagnose_copilot }}-${{ inputs.diagnose_final }}-${{ inputs.diagnose_protocol }}-${{ inputs.diagnose_fixtures }}-${{ inputs.diagnose_readiness }}-${{ inputs.diagnose_actor }}
  cancel-in-progress: false
jobs:
  render:
    if: ${{ inputs.render_sdk }}
    name: Render SDK API (${{ matrix.role }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - role: base
            commit: ${{ inputs.base_sha }}
          - role: head
            commit: ${{ inputs.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ensure-base-commit
        with:
          base-sha: ${{ inputs.base_sha }}
          fetch-ref: ${{ inputs.base_sha }}
      - uses: ./.github/actions/ensure-base-commit
        with:
          base-sha: ${{ inputs.head_sha }}
          fetch-ref: ${{ inputs.head_sha }}
      - uses: ./.github/actions/setup-node-env
        with:
          semantic-checks: "true"
          install-bun: "false"
          cache-mode: restore
      - name: Render one frozen revision
        env:
          SDK_SHA: ${{ matrix.commit }}
        run: |
          set -euo pipefail
          [[ "$SDK_SHA" =~ ^[a-f0-9]{40}$ ]]
          node --import tsx scripts/plugin-sdk-api-diff.mts \
            --render-revision "$SDK_SHA" --output ".artifacts/sdk-surfaces/$SDK_SHA.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdk-api-surface-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.role }}
          path: .artifacts/sdk-surfaces/*.json
          if-no-files-found: error
          retention-days: 14
  compare:
    if: ${{ inputs.render_sdk }}
    name: Report SDK API diff
    needs: [render]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ensure-base-commit
        with:
          base-sha: ${{ inputs.base_sha }}
          fetch-ref: ${{ inputs.base_sha }}
      - uses: ./.github/actions/ensure-base-commit
        with:
          base-sha: ${{ inputs.head_sha }}
          fetch-ref: ${{ inputs.head_sha }}
      - uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          cache-mode: restore
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: sdk-api-surface-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: .artifacts/sdk-surfaces
          merge-multiple: true
      - name: Compare immutable surfaces
        env:
          SDK_BASE: ${{ inputs.base_sha }}
          SDK_HEAD: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$SDK_BASE" =~ ^[a-f0-9]{40}$ && "$SDK_HEAD" =~ ^[a-f0-9]{40}$ ]]
          node --import tsx scripts/plugin-sdk-api-diff.mts \
            --base "$SDK_BASE" --head "$SDK_HEAD" \
            --surfaces-directory .artifacts/sdk-surfaces \
            --json .artifacts/plugin-sdk-api-diff.json \
            --evidence .artifacts/plugin-sdk-api-evidence.json \
            --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plugin-sdk-api-diff-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/plugin-sdk-api-diff.json
            .artifacts/plugin-sdk-api-evidence.json
          if-no-files-found: error
          retention-days: 14
  main-dependencies:
    name: Main dependency attribution
    needs: [render]
    if: ${{ always() && !inputs.diagnose_upgrade && !inputs.diagnose_doctor && !inputs.diagnose_node_wire && !inputs.diagnose_copilot && !inputs.diagnose_actor && !inputs.diagnose_readiness }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-harness
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.ci-harness/.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          semantic-checks: "true"
          cache-mode: off
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
      - name: Run the same dependency scan on immutable main
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          MAIN_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          [[ "$MAIN_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          mkdir -p .artifacts
          pnpm dlx --package knip@6.32.2 knip --config config/knip.config.ts --production --no-progress --reporter compact --no-config-hints --exclude duplicates 2>&1 | tee .artifacts/main-dependencies.log
      - name: Run the independent all-exports scan on the frozen revision
        if: ${{ !cancelled() }}
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          CANDIDATE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          printf 'All-exports candidate: %s\n' "$CANDIDATE_SHA"
          pnpm dlx --package knip@6.32.2 knip --config config/knip.all-exports.config.ts --no-progress --reporter compact --no-config-hints --exports --exclude duplicates 2>&1 | tee .artifacts/main-all-exports.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: main-dependencies-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/main-dependencies.log
            .artifacts/main-all-exports.log
          if-no-files-found: warn
          retention-days: 14
  sdk-static:
    if: ${{ inputs.verify_sdk_static }}
    name: Frozen SDK static guardrails
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-harness
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.ci-harness/.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          semantic-checks: "true"
          cache-mode: off
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
      - name: Record the frozen SDK candidate
        env:
          CANDIDATE_SHA: ${{ inputs.base_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p .artifacts
          node --input-type=module -e 'console.log(JSON.stringify({ candidate: process.env.CANDIDATE_SHA, workflow: process.env.WORKFLOW_SHA, runtime: "node", commands: ["pnpm plugin-sdk:surface:check", "pnpm test src/plugins/contracts/plugin-sdk-runtime-api-guardrails.test.ts --maxWorkers=1"] }, null, 2))' > .artifacts/sdk-static-provenance.json
      - name: Check the frozen SDK surface budget
        env:
          OPENCLAW_LOCAL_CHECK: "0"
        run: |
          set -euo pipefail
          pnpm plugin-sdk:surface:check 2>&1 | tee .artifacts/sdk-static-surface.log
      - name: Check the frozen runtime API guardrails
        if: ${{ !cancelled() }}
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          pnpm test src/plugins/contracts/plugin-sdk-runtime-api-guardrails.test.ts --maxWorkers=1 --reporter=verbose 2>&1 | tee .artifacts/sdk-static-runtime-api.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: sdk-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/sdk-static*
          if-no-files-found: warn
          retention-days: 14
  readiness-diagnostic:
    if: ${{ inputs.diagnose_readiness }}
    name: Frozen session publication diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-harness
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.ci-harness/.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          semantic-checks: "true"
          cache-mode: off
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
      - name: Apply the diagnostic-only owner facts
        env:
          CANDIDATE_SHA: ${{ inputs.head_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p .artifacts
          patch=.ci-harness/.github/diagnostics/readiness-authority-diagnostic.patch
          git apply --check "$patch"
          git apply "$patch"
          git diff -- src/gateway/server.agents.config-readiness.test.ts > .artifacts/readiness-diagnostic.patch
          node --input-type=module -e 'console.log(JSON.stringify({ candidate: process.env.CANDIDATE_SHA, workflow: process.env.WORKFLOW_SHA, runtime: "node", test: "src/gateway/server.agents.config-readiness.test.ts" }, null, 2))' > .artifacts/readiness-diagnostic-provenance.json
          sha256sum "$patch"
      - name: Diagnose frozen session publication
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          pnpm test src/gateway/server.agents.config-readiness.test.ts --maxWorkers=1 --reporter=verbose 2>&1 | tee .artifacts/readiness-diagnostic.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: readiness-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/readiness-diagnostic*
          if-no-files-found: warn
          retention-days: 14
  upgrade-diagnostic:
    if: ${{ inputs.diagnose_upgrade }}
    name: Frozen Linux Bun upgrade diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-harness
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.ci-harness/.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          semantic-checks: "true"
          cache-mode: off
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
      - uses: ./.ci-harness/.github/actions/setup-test-bun
      - name: Apply the diagnostic-only owner facts
        env:
          CANDIDATE_SHA: ${{ inputs.base_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p .artifacts
          patch=.ci-harness/.github/diagnostics/canonical-readiness-owner.patch
          git apply --check "$patch"
          git apply "$patch"
          git diff -- src/config/sessions/session-canonical-validation-readiness.ts > .artifacts/upgrade-diagnostic.patch
          node --input-type=module -e 'console.log(JSON.stringify({ candidate: process.env.CANDIDATE_SHA, workflow: process.env.WORKFLOW_SHA, runtime: "bun", test: "src/gateway/server-methods/agents-delete.upgrade.test.ts", filter: "deleteFiles=false" }, null, 2))' > .artifacts/upgrade-diagnostic-provenance.json
          sha256sum "$patch"
          bun --version
          bun --revision
      - name: Diagnose the frozen upgrade owner on Bun
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: bun
        run: |
          set -euo pipefail
          pnpm test src/gateway/server-methods/agents-delete.upgrade.test.ts --maxWorkers=1 -t 'deleteFiles=false' 2>&1 | tee .artifacts/upgrade-diagnostic.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: upgrade-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/upgrade-diagnostic*
          if-no-files-found: warn
          retention-days: 14
  usage-regression:
    if: ${{ inputs.verify_usage }}
    name: Frozen actor usage-cache regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-harness
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.ci-harness/.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          semantic-checks: "true"
          cache-mode: off
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
      - name: Verify the frozen usage-cache write scopes
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
          CANDIDATE_SHA: ${{ inputs.base_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p .artifacts
          node --input-type=module -e 'console.log(JSON.stringify({ candidate: process.env.CANDIDATE_SHA, workflow: process.env.WORKFLOW_SHA, runtime: "node", test: "src/config/sessions/session-actor-replica.test.ts", filter: "keeps actor facts after usage cache writes and refresh lock release" }, null, 2))' > .artifacts/usage-regression-provenance.json
          pnpm test src/config/sessions/session-actor-replica.test.ts --maxWorkers=1 -t 'keeps actor facts after usage cache writes and refresh lock release' --reporter=verbose 2>&1 | tee .artifacts/usage-regression.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: usage-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/usage-regression*
          if-no-files-found: warn
          retention-days: 14
  side-question-regression:
    if: ${{ inputs.diagnose_doctor }}
    name: Frozen side-question and consent regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-harness
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.ci-harness/.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          semantic-checks: "true"
          cache-mode: off
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
      - name: Verify the frozen side-question and consent regressions
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
          CANDIDATE_SHA: ${{ inputs.head_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p .artifacts
          node --input-type=module -e 'console.log(JSON.stringify({ candidate: process.env.CANDIDATE_SHA, workflow: process.env.WORKFLOW_SHA, runtime: "node", tests: ["extensions/codex/src/app-server/side-question.test.ts", "extensions/codex/src/app-server/side-question.app-consent.test.ts"] }, null, 2))' > .artifacts/side-question-regression-provenance.json
          pnpm test extensions/codex/src/app-server/side-question.test.ts extensions/codex/src/app-server/side-question.app-consent.test.ts --maxWorkers=1 --reporter=verbose 2>&1 | tee .artifacts/side-question-regression.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: side-question-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/side-question-regression*
          if-no-files-found: warn
          retention-days: 14
  node-wire:
    if: ${{ inputs.diagnose_node_wire }}
    name: Frozen node worker launch wire regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-harness
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.ci-harness/.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          semantic-checks: "true"
          cache-mode: off
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
      - name: Build the private runtime once
        env:
          OPENCLAW_BUILD_ALL_NO_PNPM: "1"
          OPENCLAW_BUILD_PRIVATE_QA: "1"
          NODE_OPTIONS: --max-old-space-size=8192
          VITEST: "1"
        run: pnpm build qaRuntime
      - name: Verify the frozen node worker launch wire
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
          OPENCLAW_E2E_USE_PREBUILT_DIST: "1"
          OPENCLAW_BUILD_ALL_NO_PNPM: "1"
          OPENCLAW_VITEST_MAX_WORKERS: "1"
          OPENCLAW_NODE_TEST_TARGETS_JSON: '["test/e2e/qa-lab/runtime/node-worker-launch-wire.e2e.test.ts"]'
          OPENCLAW_NODE_TEST_VITEST_ARGS_JSON: '["--reporter=verbose"]'
          NODE_OPTIONS: --max-old-space-size=8192
          CANDIDATE_SHA: ${{ inputs.head_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p .artifacts
          node --input-type=module -e 'console.log(JSON.stringify({ candidate: process.env.CANDIDATE_SHA, workflow: process.env.WORKFLOW_SHA, runtime: "node", test: "test/e2e/qa-lab/runtime/node-worker-launch-wire.e2e.test.ts" }, null, 2))' > .artifacts/node-wire-provenance.json
          node --import tsx scripts/ci-run-node-test-shard.mts 2>&1 | tee .artifacts/node-wire.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: node-wire-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/node-wire*
          if-no-files-found: warn
          retention-days: 14
  worktree-selection:
    if: ${{ inputs.diagnose_copilot || inputs.diagnose_actor }}
    name: Frozen actor row publication (${{ matrix.role }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - role: base
            commit: ${{ inputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-harness
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.ci-harness/.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          semantic-checks: "true"
          cache-mode: off
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
      - name: Apply test-only actor publication phases
        if: ${{ inputs.diagnose_actor }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          patch=.ci-harness/.github/diagnostics/actor-row-publication-diagnostic.patch
          git apply --check "$patch"
          git apply "$patch"
          git diff -- src/gateway/session-row-projection.actor.test.ts > .artifacts/actor-row-baseline.patch
          sha256sum "$patch"
      - name: Diagnose frozen actor row publication
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
          PROOF_SHA: ${{ matrix.commit }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$PROOF_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$PROOF_SHA"
          mkdir -p .artifacts
          node --input-type=module -e 'console.log(JSON.stringify({ commit: process.env.PROOF_SHA, workflow: process.env.WORKFLOW_SHA }, null, 2))' > .artifacts/actor-row-baseline-provenance.json
          pnpm test src/gateway/session-row-projection.actor.test.ts --maxWorkers=1 --reporter=verbose 2>&1 | tee .artifacts/actor-row-baseline.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: actor-row-baseline-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/actor-row-baseline*
          if-no-files-found: warn
          retention-days: 14
  final-regressions:
    if: ${{ inputs.diagnose_final || inputs.diagnose_protocol }}
    name: Frozen final regression (${{ matrix.case }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case: ${{ inputs.diagnose_protocol && fromJSON('["protocol-candidate"]') || fromJSON('["registry-candidate","startup-candidate","agent-wait-candidate"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-harness
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.ci-harness/.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          semantic-checks: "true"
          cache-mode: off
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
      - name: Run the frozen regression
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
          PROOF_SHA: ${{ inputs.head_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          PROOF_CASE: ${{ matrix.case }}
          TEST_FILE: ${{ matrix.case == 'registry-candidate' && 'src/config/sessions/startup-migration.registry-recovery.test.ts' || matrix.case == 'startup-candidate' && 'src/config/sessions/startup-migration.concurrency.test.ts' || matrix.case == 'agent-wait-candidate' && 'src/gateway/agent-turn/agent-wait-dedupe.test.ts' || 'extensions/codex/src/app-server/run-attempt.protocol-validation.test.ts' }}
        run: |
          set -euo pipefail
          [[ "$PROOF_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$PROOF_SHA"
          mkdir -p .artifacts
          node --input-type=module -e 'console.log(JSON.stringify({ commit: process.env.PROOF_SHA, workflow: process.env.WORKFLOW_SHA, case: process.env.PROOF_CASE, test: process.env.TEST_FILE }, null, 2))' > .artifacts/final-regression-provenance.json
          test_files=("$TEST_FILE")
          if [ "$PROOF_CASE" = protocol-candidate ]; then
            test_files+=(src/config/sessions/session-transcript-context-read.worker.test.ts)
          elif [ "$PROOF_CASE" = registry-candidate ]; then
            test_files+=(src/gateway/server-plugin-in-process-dispatch.authorization.test.ts)
          elif [ "$PROOF_CASE" = startup-candidate ]; then
            test_files+=(src/gateway/server-agent-database-startup.test.ts)
          elif [ "$PROOF_CASE" = agent-wait-candidate ]; then
            test_files+=(src/gateway/worker-environments/placement-dispatch-staged-results.test.ts)
            test_files+=(src/gateway/server-methods/sessions.abort-embedded.test.ts)
          fi
          pnpm test "${test_files[@]}" --maxWorkers=1 --reporter=verbose 2>&1 | tee .artifacts/final-regression.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: final-regression-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/final-regression*
          if-no-files-found: warn
          retention-days: 14
  fixture-regressions:
    if: ${{ inputs.diagnose_fixtures }}
    name: Frozen conflict fixtures (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - group: sharing-grants-node
            runtime: node
          - group: sharing-siblings-node
            runtime: node
          - group: fixture-imports-node
            runtime: node
          - group: native-and-merge-node
            runtime: node
          - group: creation-mention-node
            runtime: node
          - group: patch-recovery-node
            runtime: node
          - group: goal-history-node
            runtime: node
          - group: typed-fixtures-node
            runtime: node
          - group: sharing-routes-node
            runtime: node
          - group: session-utils-node
            runtime: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-harness
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.ci-harness/.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          semantic-checks: "true"
          cache-mode: off
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
      - uses: ./.ci-harness/.github/actions/setup-test-bun
        if: ${{ matrix.runtime == 'bun' }}
      - name: Verify the frozen fixture corrections
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          PROOF_GROUP: ${{ matrix.group }}
          OPENCLAW_VITEST_RUNTIME: ${{ matrix.runtime }}
          CANDIDATE_SHA: ${{ inputs.head_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p .artifacts
          node --input-type=module -e 'console.log(JSON.stringify({ candidate: process.env.CANDIDATE_SHA, workflow: process.env.WORKFLOW_SHA, runtime: process.env.OPENCLAW_VITEST_RUNTIME }, null, 2))' > .artifacts/fixture-provenance.json
          case "$PROOF_GROUP" in
            sharing-grants-node)
              files=(
                src/gateway/session-sharing-committed-read.test.ts
                src/gateway/session-sharing.worker.test.ts
                src/gateway/session-sharing.prepared.test.ts
              )
              ;;
            sharing-siblings-node)
              files=(
                src/gateway/session-sharing.memory.test.ts
                src/gateway/session-sharing.incognito.test.ts
                src/gateway/session-sharing-store-cache.test.ts
                src/gateway/session-sharing-creation-receipts.test.ts
              )
              ;;
            fixture-imports-node)
              files=(
                src/agents/embedded-agent-runner/skill-runtime.library-read.test.ts
                src/auto-reply/reply/agent-runner-result-accounting.fallback.test.ts
              )
              ;;
            creation-mention-node)
              files=(
                src/gateway/session-create-preparation.test.ts
                src/gateway/mention-directory.test.ts
                src/plugin-sdk/gateway-mention-inbox-compat.test.ts
              )
              ;;
            patch-recovery-node)
              files=(
                src/gateway/server-methods.session-patch-orchestration.test.ts
                src/gateway/server-methods/sessions-patch-native-recovery.test.ts
              )
              ;;
            sharing-routes-node)
              files=(
                src/gateway/server-methods/sessions-sharing.test.ts
                src/gateway/server-methods/sessions-sharing.identities.test.ts
              )
              ;;
            session-utils-node)
              files=(
                src/gateway/session-utils-store-lookup.test.ts
                src/gateway/session-utils.single-row-cache.test.ts
                src/gateway/session-utils.test.ts
              )
              ;;
            typed-fixtures-node)
              files=(
                src/gateway/server-methods/github-personal-authorization.test.ts
                src/gateway/server-worker-placement-startup.test.ts
                src/agents/main-session-recovery/main-session-restart-recovery.test.ts
              )
              ;;
            goal-history-node)
              files=(
                src/gateway/server-methods/sessions-goal.test.ts
                src/gateway/server-methods/sessions-goal.event-custody.test.ts
                src/gateway/sessions-history-http.revocation.test.ts
              )
              ;;
            native-and-merge-node)
              files=(
                src/gateway/talk/handlers/client-native-actions.test.ts
                src/gateway/server-methods/chat.abort-incarnation.test.ts
                src/gateway/server-methods/sessions.abort-yielded.test.ts
                src/gateway/server-plugin-subagent-runtime.test.ts
                src/infra/session-cost-usage-cache.creation-race.test.ts
              )
              ;;
          esac
          if [ "$OPENCLAW_VITEST_RUNTIME" = bun ]; then
            bun --version
            bun --revision
          fi
          failed=0
          for file in "${files[@]}"; do
            pnpm test "$file" --maxWorkers=1 --reporter=verbose 2>&1 | tee -a .artifacts/fixture-regressions.log || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: fixture-regressions-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/fixture-*
          if-no-files-found: warn
          retention-days: 14
