# Prepared only: the coordinator owns publication and dispatch.
# Baseline uses the observed Bun unit-fast runtime; candidate uses its canonical Node infra owner.
name: Red-main auth endpoint ownership proof
run-name: Auth endpoint ownership 6bc2d13d88e13 ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-auth-endpoint-proof-6bc2d13d88e13
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  endpoint-proof:
    name: Auth endpoint ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline
            ref: 95b3b97a4c38457f1c615ec34c7947d35e2a191f
            runtime: bun
          - label: candidate
            ref: 6bc2d13d88e13c9b1309a393476e3af83a80e568
            runtime: node
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record exact sources
        shell: bash
        env:
          EXPECTED_SHA: ${{ matrix.ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          proof_dir="$RUNNER_TEMP/auth-endpoint-proof"
          mkdir -p "$proof_dir"
          {
            echo "Source: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- src/agents/auth-profiles/session-override.model-endpoint.test.ts src/agents/auth-profiles/credential-write-custody.ts src/test-utils/openclaw-test-state.ts test/vitest/vitest.database-worker-core-paths.mjs test/vitest-unit-fast-config.test.ts
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node and Bun
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "true"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "true"
          vitest-worker-cache: "false"
          node-compile-cache: "true"

      - name: Run exact endpoint file
        id: endpoint
        continue-on-error: ${{ matrix.label == 'baseline' }}
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: ${{ matrix.runtime }}
        run: |
          set -euo pipefail
          /usr/bin/time -p pnpm test src/agents/auth-profiles/session-override.model-endpoint.test.ts --maxWorkers=1 --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/auth-endpoint-proof/endpoint.log"

      - name: Verify baseline reproduces the exact custody failure
        if: ${{ always() && matrix.label == 'baseline' }}
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.endpoint.outcome }}
        run: |
          set -euo pipefail
          test "$TEST_OUTCOME" = failure
          python3 - <<'PYCODE'
          import os, pathlib, re
          log = pathlib.Path(os.environ["RUNNER_TEMP"], "auth-endpoint-proof", "endpoint.log").read_text()
          log = re.sub(r"\x1b\[[0-9;]*m", "", log)
          assert "Auth profile credential writes require an admitted worker" in log
          assert "credential-write-custody.ts" in log
          assert "session-override.model-endpoint.test.ts" in log
          assert re.search(r"Tests\s+5 failed", log), "Expected all five endpoint cases to fail"
          PYCODE
          echo "Baseline reproduced the five endpoint custody failures." >> "$GITHUB_STEP_SUMMARY"

      - name: Run changed routing regression
        if: ${{ matrix.label == 'candidate' }}
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          /usr/bin/time -p pnpm test test/vitest-unit-fast-config.test.ts --maxWorkers=1 --reporter=verbose -t "keeps obvious stateful files out of the unit-fast lane" 2>&1 | tee "$RUNNER_TEMP/auth-endpoint-proof/routing.log"

      - name: Record outcome and verify unchanged sources
        if: ${{ always() }}
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.endpoint.outcome }}
        run: |
          set -euo pipefail
          echo "Endpoint file result: $TEST_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          git status --short
          git diff --exit-code -- src/agents/auth-profiles/session-override.model-endpoint.test.ts src/agents/auth-profiles/credential-write-custody.ts src/test-utils/openclaw-test-state.ts test/vitest/vitest.database-worker-core-paths.mjs test/vitest-unit-fast-config.test.ts

      - name: Preserve proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-auth-endpoint-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/auth-endpoint-proof/
          if-no-files-found: warn
          retention-days: 14
