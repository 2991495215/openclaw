# Temporary observational diagnosis only. Never merge this workflow or its source logging.
name: Red-main agent creation phase diagnosis
run-name: Agent creation phase diagnosis ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact diagnostic source commit
        type: string
        required: true
      workflow_sha:
        description: Exact workflow carrier commit
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-agents-create-timeout-${{ github.ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  BASE_SHA: 9e45e1ab3d92e01ff9d40df2af0c6892cfd6d1ca
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
jobs:
  focused:
    name: Exact agent revision creation timeout case
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENCLAW_LOCAL_CHECK: "0"
      OPENCLAW_VITEST_RUNTIME: node
    steps:
      - name: Checkout exact diagnostic source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify and record exact diagnostic scope
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          expected_paths="$(printf '%s\n' src/agents/agent-create.ts src/gateway/server-methods/agents.ts src/gateway/server.config-agent-mutations.test-support.ts)"
          test "$(git diff --name-only "$BASE_SHA" HEAD)" = "$expected_paths"
          test "$(git rev-parse HEAD:src/agents/agent-create.ts)" = 4233698afe92db0295ca637bf9ad3a84f034b9ec
          test "$(git rev-parse HEAD:src/gateway/server-methods/agents.ts)" = e4a1e52959c61daec4580b619818eb77f3756a97
          test "$(git rev-parse HEAD:src/gateway/server.config-agent-mutations.test-support.ts)" = 045c5079145359669eb1084190054d92b75999e5
          git diff --exit-code HEAD --
          proof_dir="$RUNNER_TEMP/agents-create-timeout"
          mkdir -p "$proof_dir"
          git diff "$BASE_SHA" HEAD -- > "$proof_dir/diagnostic.patch"
          for source_path in src/agents/agent-create.ts src/gateway/server-methods/agents.ts src/gateway/server.config-agent-mutations.test-support.ts; do
            mkdir -p "$proof_dir/source/$(dirname "$source_path")"
            cp "$source_path" "$proof_dir/source/$source_path"
          done
          {
            echo "Product base: $BASE_SHA"
            echo "Diagnostic source: $CANDIDATE_SHA"
            echo "Workflow: $WORKFLOW_SHA"
            git show -s --format='%H%n%P%n%an <%ae>%n%s' HEAD
            git ls-tree HEAD -- package.json pnpm-lock.yaml \
              src/gateway/server.config-patch.test.ts \
              src/gateway/config-reload.ts \
              src/gateway/server.config-agent-mutations.test-support.ts \
              src/agents/agent-create.ts \
              src/gateway/server-methods/agents.ts \
              src/gateway/server-methods/agents-config-mutations.ts \
              src/config/runtime-write-application.ts \
              test/helpers/gateway/config-rpc-gateway.ts \
              .github/actions/setup-node-env/action.yml
          } | tee "$proof_dir/provenance.log"
          cat "$proof_dir/provenance.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Setup frozen Node environment matching failed schedule
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
      - name: Run only the original agent revision case
        id: focused
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.19.0
          proof_dir="$RUNNER_TEMP/agents-create-timeout"
          {
            node --version
            pnpm --version
            echo 'Command: pnpm test src/gateway/server.config-patch.test.ts --maxWorkers=1 --reporter=verbose --reporter=json --outputFile.json "results.json (under runner temporary proof directory)" -t "uses fresh revisions after agent create, update, and delete before reload applies"'
          } | tee "$proof_dir/command.log"
          started="$(date +%s)"
          if pnpm test src/gateway/server.config-patch.test.ts --maxWorkers=1 \
            --reporter=verbose --reporter=json --outputFile.json "$proof_dir/results.json" \
            -t 'uses fresh revisions after agent create, update, and delete before reload applies' \
            2>&1 | tee "$proof_dir/test.log"; then
            test_exit=0
          else
            test_exit=$?
          fi
          elapsed=$(( $(date +%s) - started ))
          {
            echo "Test exit: $test_exit"
            echo "Elapsed seconds: $elapsed"
          } | tee "$proof_dir/result.txt" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_exit"
      - name: Verify exact selection and record observed phases
        if: ${{ always() && steps.focused.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'agents-create-timeout'
          expected = 'gateway config methods uses fresh revisions after agent create, update, and delete before reload applies'
          log_path = proof / 'test.log'
          log = re.sub(r'\x1b\[[0-9;]*m', '', log_path.read_text()) if log_path.exists() else ''
          marker = '[agents-create-phase]'
          events = []
          errors = []
          allowed = {
              'create:entered', 'config-lock:waiting', 'config-lock:entered',
              'recovery-holds:start', 'recovery-holds:settled', 'main-gate:start', 'main-gate:settled',
              'deletion-journal:start', 'deletion-journal:settled', 'transform:start', 'transform:entered',
              'workspace:start', 'workspace:settled', 'database:start', 'database:settled',
              'transform:settled', 'provenance:start', 'provenance:settled', 'create:return',
              'handler:entered', 'create-owner:settled', 'revival:start', 'revival:settled',
              'application:start', 'application:settled', 'respond', 'operation:start', 'request:start',
              'barrier:entered', 'barrier:observed', 'held-read:start', 'held-read:settled',
              'barrier:release', 'request:settled', 'finally:release',
          }
          for line in log.splitlines():
              if marker not in line:
                  continue
              try:
                  event = json.loads(line.split(marker, 1)[1].strip())
                  assert set(event) in ({'phase', 'atMs'}, {'phase', 'method', 'atMs'})
                  assert event['phase'] in allowed
                  assert type(event['atMs']) is int and event['atMs'] >= 0
                  if 'method' in event:
                      assert event['method'] in ('agents.create', 'agents.update', 'agents.delete')
                  events.append(event)
              except Exception as error:
                  errors.append('Invalid diagnostic event: ' + str(error))
          if not 1 <= len(events) <= 128:
              errors.append('Expected between 1 and 128 immediate phase observations')
          selected = []
          report_path = proof / 'results.json'
          try:
              report = json.loads(report_path.read_text())
              assert len(report['testResults']) == 1, 'Expected exactly one test file'
              result = report['testResults'][0]
              assert pathlib.Path(result['name']).resolve() == pathlib.Path('src/gateway/server.config-patch.test.ts').resolve()
              selected = [entry for entry in result['assertionResults'] if entry['status'] in ('passed', 'failed')]
              assert len(selected) == 1 and selected[0]['fullName'] == expected, 'Expected only the original failing case'
              assert report['numPassedTests'] + report['numFailedTests'] == 1, 'Expected exactly one executed case'
          except Exception as error:
              errors.append('Selection report unavailable or invalid: ' + str(error))
          outcome = {
              'candidate': os.environ['CANDIDATE_SHA'], 'base': os.environ['BASE_SHA'],
              'selected': expected, 'status': selected[0]['status'] if len(selected) == 1 else 'unknown',
              'events': events, 'validation_errors': errors, 'diagnostic_only': True,
          }
          text = json.dumps(outcome, indent=2)
          (proof / 'observations.json').write_text(text + '\n')
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('```json\n' + text + '\n```\n')
          if errors:
              raise SystemExit('Diagnostic validation failed; observations retained')
          PY
      - name: Verify tracked source stayed unchanged
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git hash-object src/agents/agent-create.ts)" = 4233698afe92db0295ca637bf9ad3a84f034b9ec
          test "$(git hash-object src/gateway/server-methods/agents.ts)" = e4a1e52959c61daec4580b619818eb77f3756a97
          test "$(git hash-object src/gateway/server.config-agent-mutations.test-support.ts)" = 045c5079145359669eb1084190054d92b75999e5
          git diff --exit-code HEAD --
      - name: Preserve focused evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-agents-create-timeout-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agents-create-timeout/
          if-no-files-found: warn
          retention-days: 14
