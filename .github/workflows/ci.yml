# Temporary exact-case proof only. Never merge this workflow.
name: Red-main lint suppression inventory proof
run-name: Lint suppression inventory proof ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        type: string
        required: true
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENCLAW_LOCAL_CHECK: "0"
      OPENCLAW_VITEST_RUNTIME: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 20416769fab681432b4f26c484c591f06ce67cb4
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source and source-only scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 20416769fab681432b4f26c484c591f06ce67cb4
          test "$(git diff --name-only HEAD^ HEAD)" = test/scripts/lint-suppressions.test.ts
          git show --format=fuller --stat HEAD
          git diff HEAD^ HEAD -- test/scripts/lint-suppressions.test.ts
          git diff --check HEAD^ HEAD
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
      - name: Format and lint changed test
        run: |
          pnpm exec oxfmt --check test/scripts/lint-suppressions.test.ts
          node scripts/run-oxlint.mjs test/scripts/lint-suppressions.test.ts
      - name: Run only the failed suppression inventory case
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lint-suppression-proof"
          started="$(date +%s)"
          node scripts/run-vitest.mjs run --config test/vitest/vitest.tooling.config.ts --configLoader runner \
            test/scripts/lint-suppressions.test.ts --maxWorkers=1 \
            --reporter=verbose --reporter=json --outputFile.json "$RUNNER_TEMP/lint-suppression-proof/results.json" \
            -t 'keeps the intentional production suppression tail on an explicit allowlist$' \
            2>&1 | tee "$RUNNER_TEMP/lint-suppression-proof/test.log"
          echo "Command seconds: $(( $(date +%s) - started ))"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'lint-suppression-proof/results.json'
          r=json.loads(p.read_text())
          assert len(r['testResults'])==1,r
          s=[a for f in r['testResults'] for a in f['assertionResults'] if a['status'] in ('passed','failed')]
          assert len(s)==1,s
          assert s[0]['title']=='keeps the intentional production suppression tail on an explicit allowlist',s
          assert all(a['status']=='passed' for a in s),s
          print(json.dumps(s,indent=2))
          PY
      - name: Verify unchanged proof source
        if: ${{ always() }}
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: lint-suppression-exact-case
          path: ${{ runner.temp }}/lint-suppression-proof/
