# Temporary proof workflow only. Root pins candidate_sha after source review.
# Canonical qaRuntime/setup source: ba1dd61a4e250be287ebbe103b1779899008d976.
name: Red-main account route proof
run-name: Account route proof ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Reviewed full candidate commit SHA; no branch names
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-account-route-proof-${{ github.ref }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  account-route-product-proof:
    name: Complete account route product proof
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify candidate and unchanged product proof
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD:test/e2e/qa-lab/runtime/codex-account-model-route.product-proof.e2e.test.ts)" = "1a57139deb9c81a10b747530aee97543ac830cd4"
          proof_dir="$RUNNER_TEMP/account-route-product-proof"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $actual_sha"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- test/e2e/qa-lab/runtime/codex-account-model-route.product-proof.e2e.test.ts src/agents/embedded-agent-runner/run/model-setup.ts
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "true"
          vitest-worker-cache: "false"
          node-compile-cache: "true"

      - name: Build private QA runtime
        id: qa_runtime
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCLAW_BUILD_PRIVATE_QA: "1"
          VITEST: "1"
        run: |
          set -euo pipefail
          pnpm build qaRuntime 2>&1 | tee "$RUNNER_TEMP/account-route-product-proof/qa-runtime-build.log"

      - name: Run complete three-case product proof
        id: product_proof
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
          OPENCLAW_E2E_USE_PREBUILT_DIST: "1"
          OPENCLAW_E2E_WORKERS: "1"
          OPENCLAW_CI_TEST_RUNTIME_POLICY: node
          OPENCLAW_VITEST_MAX_WORKERS: "1"
          OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS: "300000"
          OPENCLAW_NODE_TEST_PLAN_CONCURRENCY: "1"
          OPENCLAW_NODE_TEST_TARGETS_JSON: '["test/e2e/qa-lab/runtime/codex-account-model-route.product-proof.e2e.test.ts"]'
          OPENCLAW_NODE_TEST_VITEST_ARGS_JSON: '["--maxWorkers=1","--reporter=verbose"]'
        run: |
          set -euo pipefail
          node --import tsx scripts/ci-run-node-test-shard.mts 2>&1 | tee "$RUNNER_TEMP/account-route-product-proof/product-proof.log"

      - name: Record product proof outcome and source status
        if: ${{ always() }}
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.qa_runtime.outcome }}
          TEST_OUTCOME: ${{ steps.product_proof.outcome }}
        run: |
          set -euo pipefail
          echo "QA runtime build: $BUILD_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "Full product proof: $TEST_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          git status --short
          git diff --exit-code -- test/e2e/qa-lab/runtime/codex-account-model-route.product-proof.e2e.test.ts src/agents/embedded-agent-runner/run/model-setup.ts

      - name: Preserve product proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-account-route-product-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/account-route-product-proof/
          if-no-files-found: warn
          retention-days: 14

  model-setup-owner-regressions:
    name: Complete model setup ownership regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          proof_dir="$RUNNER_TEMP/account-route-owner-regressions"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $actual_sha"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- src/agents/embedded-agent-runner/run/model-setup.ownership.test.ts src/agents/embedded-agent-runner/run/model-setup.ts
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "true"
          vitest-worker-cache: "true"
          node-compile-cache: "true"

      - name: Run complete model setup ownership file
        id: owner_regressions
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          pnpm test src/agents/embedded-agent-runner/run/model-setup.ownership.test.ts --maxWorkers=1 --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/account-route-owner-regressions/model-setup-ownership.log"

      - name: Run targeted type-aware owner lint
        id: owner_lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          GOMAXPROCS: "2"
          GOGC: "30"
          GOMEMLIMIT: 3GiB
        run: |
          set -euo pipefail
          node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.core.json --threads=1 \
            src/agents/embedded-agent-runner/run/model-setup.ts \
            src/agents/embedded-agent-runner/run/model-setup.ownership.test.ts \
            2>&1 | tee "$RUNNER_TEMP/account-route-owner-regressions/model-setup-type-aware-lint.log"

      - name: Record owner regression outcome and source status
        if: ${{ always() }}
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.owner_regressions.outcome }}
          LINT_OUTCOME: ${{ steps.owner_lint.outcome }}
        run: |
          set -euo pipefail
          echo "Full owner regression file: $TEST_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "Targeted type-aware lint: $LINT_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          git status --short
          git diff --exit-code -- src/agents/embedded-agent-runner/run/model-setup.ownership.test.ts src/agents/embedded-agent-runner/run/model-setup.ts

      - name: Preserve owner regression logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-account-route-owner-regressions-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/account-route-owner-regressions/
          if-no-files-found: warn
          retention-days: 14
