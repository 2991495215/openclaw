name: Red-main external-main profile followthrough
run-name: External-main profile ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full external-main candidate SHA; this is separate from rollback proof
        type: string
        default: "c445da4029e17aca9bf1288c08389dc35698d634"
        required: true
      dispatch_id:
        description: External-main proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-profile-main-proof-${{ github.ref }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  profile-main-regressions:
    name: External-main profile (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - group: profiles-and-accounts
            files: |
              src/state/user-profile-list.resident.test.ts
              src/state/user-profile-authority.test.ts
              src/infra/sqlite-transaction.test.ts
              src/gateway/server-methods/users-auth-connect.test.ts
              src/gateway/server.sessions.create.accounts.test.ts
          - group: admission-and-placement
            files: |
              src/skills/library/selection-authority.test.ts
              src/state/openclaw-state-db-schema-policy.test.ts
              src/infra/sqlite-post-commit.test.ts
              src/gateway/server-methods/users-auth-connect.control-plane.test.ts
              src/gateway/server.placement-abandonment.test.ts
          - group: lifecycle-and-effects
            files: |
              src/cron/isolated-agent/run.manual-tool-authority.test.ts
              src/state/openclaw-state-db-async-lifecycle.test.ts
              src/agents/auth-profiles/oauth-personal.worker.test.ts
              test/model-account-catalog-authority.integration.test.ts
              src/gateway/server/skill-library-read.test.ts
    steps:
      - name: Checkout exact external-main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify external-main candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          PROOF_GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          echo "External-main candidate: $actual_sha"
          echo "External-main workflow: $WORKFLOW_SHA"
          echo "External-main group: $PROOF_GROUP"
          echo "External-main candidate: $actual_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "External-main workflow: $WORKFLOW_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "External-main group: $PROOF_GROUP" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"

      - name: Run complete external-main regression files
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          PROOF_GROUP: ${{ matrix.group }}
          TEST_FILES: ${{ matrix.files }}
        run: |
          set -euo pipefail
          artifact_dir=".artifacts/profile-main/$PROOF_GROUP"
          mkdir -p "$artifact_dir"
          mapfile -t files <<< "$TEST_FILES"
          failures=0
          for file in "${files[@]}"; do
            [[ -n "$file" ]] || continue
            echo "::group::External-main $EXPECTED_SHA: $file"
            log_name="${file//\//_}"
            echo "External-main candidate: $EXPECTED_SHA; group: $PROOF_GROUP; file: $file" | tee "$artifact_dir/$log_name.log"
            pnpm test "$file" --maxWorkers=1 --reporter=verbose 2>&1 | tee -a "$artifact_dir/$log_name.log" || failures=1
            echo "::endgroup::"
          done
          exit "$failures"

      - name: Preserve external-main regression logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: external-main-profile-${{ inputs.candidate_sha }}-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/profile-main/${{ matrix.group }}/*.log
          if-no-files-found: warn
          retention-days: 14
