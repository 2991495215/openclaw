# Temporary diagnostic workflow. Do not merge this workflow into main.
name: Red-main Stop reply diagnostic
run-name: Stop reply diagnostic ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full diagnostic candidate commit SHA
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-stop-reply-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  stop-reply:
    name: Exact slash Stop diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact diagnostic candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          mkdir -p .artifacts/stop-reply
          {
            echo "Candidate: $actual_sha"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- ui/src/e2e/chat-stop-owned-exec.real-gateway.e2e.test.ts ui/src/e2e/background-work.real-gateway.test-support.ts
          } | tee .artifacts/stop-reply/provenance.txt
          cat .artifacts/stop-reply/provenance.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"

      - name: Install Playwright Chromium
        uses: ./.github/actions/setup-playwright-chromium
        with:
          cache-mode: restore
          compatibility-target: "false"

      - name: Build runtime and Control UI artifacts for real-Gateway test
        env:
          OPENCLAW_BUILD_PRIVATE_QA: "1"
          OPENCLAW_RUN_NODE_SKIP_DTS_BUILD: "1"
        run: pnpm build

      - name: Run exact failing slash Stop case
        env:
          OPENCLAW_UI_E2E_ARTIFACT_DIR: .artifacts/control-ui-e2e/real-gateway
          OPENCLAW_UI_E2E_DIAGNOSTIC_DIR: .artifacts/control-ui-e2e-timeouts/stop-reply
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-vitest.mjs run \
            --config test/vitest/vitest.ui-e2e-prebuilt.config.ts \
            --configLoader runner \
            --reporter verbose \
            ui/src/e2e/chat-stop-owned-exec.real-gateway.e2e.test.ts \
            -t 'Composer slash Stop' \
            2>&1 | tee .artifacts/stop-reply/test.log

      - name: Preserve diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-stop-reply-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/stop-reply/
            .artifacts/control-ui-e2e/real-gateway/chat-stop-owned-exec-slash-*/next-reply-diagnostic.json
            .artifacts/control-ui-e2e/real-gateway/chat-stop-owned-exec-slash-*/proof.json
            .artifacts/control-ui-e2e-timeouts/stop-reply/failure-*/failure.public.json
          if-no-files-found: warn
          retention-days: 7
