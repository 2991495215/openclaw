# Parent-authorized pinned proof; temporary workflow branch is never merged.
# Original failing cases only; three commands share one Node setup.
name: Red-main credential and runtime fixture proof
run-name: Credential and runtime fixtures 9c2b307ad2f5 ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-credential-runtime-fixtures-proof
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  credential-runtime-fixtures-proof:
    name: Original 13 credential and runtime fixture cases
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 9c2b307ad2f56b287c4283436c6ac2d835454ec7
          fetch-depth: 1
          persist-credentials: false

      - name: Record candidate sources
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9c2b307ad2f56b287c4283436c6ac2d835454ec7
          proof_dir="$RUNNER_TEMP/credential-runtime-fixtures-proof"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- test/vitest/vitest.database-worker-core-paths.mjs test/e2e/qa-lab/runtime/quota-reset-provider.test.ts src/commands/doctor/shared/xai-auto-retirement.test.ts src/test-utils/openclaw-test-state.auth.test.ts packages/memory-host-sdk/src/host/session-transcript-corpus.test.ts src/gateway/server.heartbeat-store-lifecycle.product-proof.test.ts
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
          node-compile-cache: "true"

      - name: Original failing cases 1
        id: cases_1
        if: ${{ !cancelled() }}
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          pnpm test test/e2e/qa-lab/runtime/quota-reset-provider.test.ts src/commands/doctor/shared/xai-auto-retirement.test.ts src/test-utils/openclaw-test-state.auth.test.ts --maxWorkers=1 --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/credential-runtime-fixtures-proof/cases-1.log"

      - name: Original failing cases 2
        id: cases_2
        if: ${{ !cancelled() }}
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          pnpm test packages/memory-host-sdk/src/host/session-transcript-corpus.test.ts --maxWorkers=1 -t 'reads worker content revisions without claiming an agent database lease' --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/credential-runtime-fixtures-proof/cases-2.log"

      - name: Original failing cases 3
        id: cases_3
        if: ${{ !cancelled() }}
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          pnpm test src/gateway/server.heartbeat-store-lifecycle.product-proof.test.ts --maxWorkers=1 -t 'handles a queued child notice after same-store replacement' --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/credential-runtime-fixtures-proof/cases-3.log"

      - name: Verify unchanged sources
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --exit-code -- test/vitest/vitest.database-worker-core-paths.mjs test/e2e/qa-lab/runtime/quota-reset-provider.test.ts src/commands/doctor/shared/xai-auto-retirement.test.ts src/test-utils/openclaw-test-state.auth.test.ts packages/memory-host-sdk/src/host/session-transcript-corpus.test.ts src/gateway/server.heartbeat-store-lifecycle.product-proof.test.ts

      - name: Preserve proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-credential-runtime-fixtures-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/credential-runtime-fixtures-proof/
          if-no-files-found: warn
          retention-days: 14
