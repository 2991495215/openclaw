name: Red-main cost-refresh fixture proof
run-name: Cost-refresh fixture ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        type: string
        required: true
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 772b182e245e286560a5794ee21d6a6dc9762936
          persist-credentials: false
      - name: Verify reviewed fixture source
        run: test "$(git rev-parse HEAD)" = 772b182e245e286560a5794ee21d6a6dc9762936
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
      - name: Run failing cost-refresh file
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: pnpm test src/infra/session-cost-usage-refresh.test.ts --maxWorkers=1
      - name: Verify unchanged fixture source
        if: ${{ always() }}
        run: git diff --exit-code
