# DIAGNOSTIC ONLY: never merge this workflow or source instrumentation.
name: Red-main Node configuration diagnostics
run-name: Node configuration diagnostics ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
      workflow_sha:
        description: Exact proof workflow commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-node-config-diagnostic-proof
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.19.0"
jobs:
  node-config-diagnostic-proof:
    name: Trace node configuration database refusal
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pinned candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fb84169e6fa3cb9e0cdf4ba9fa7343ca2ec8aa18
          fetch-depth: 3
          persist-credentials: false
      - name: Record source provenance
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = fb84169e6fa3cb9e0cdf4ba9fa7343ca2ec8aa18
          git diff --exit-code HEAD --
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          mkdir -p "$RUNNER_TEMP/node-config-diagnostic-proof"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git diff --stat HEAD~1 HEAD
            git ls-tree HEAD -- package.json pnpm-lock.yaml src/infra/sqlite-store.worker.ts src/node-host/config.test.ts src/node-host/config-worker.test-support.ts
          } | tee "$RUNNER_TEMP/node-config-diagnostic-proof/provenance.txt"
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
          node-compile-cache: "true"
      - name: Check changed helper
        shell: bash
        run: |
          set -euo pipefail
          node_modules/.bin/oxfmt --check --threads=1 src/infra/sqlite-store.worker.ts
          node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.json src/infra/sqlite-store.worker.ts
          git diff --check HEAD~1 HEAD
      - name: Replay only the diagnosed node configuration test file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess, time
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'node-config-diagnostic-proof'
          commands = {
            'node-config': ['node', 'scripts/run-vitest.mjs', 'src/node-host/config.test.ts', '--maxWorkers=1'],
          }
          results = {}
          for name, command in commands.items():
              started = time.monotonic()
              with (proof / (name + '.log')).open('w', encoding='utf-8') as log:
                  process = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, encoding='utf-8', errors='replace')
                  for line in process.stdout:
                      print(line, end='', flush=True)
                      log.write(line)
                  result = process.wait()
              results[name] = {'exit_code': result, 'elapsed_seconds': time.monotonic() - started, 'command': command}
              (proof / 'execution.json').write_text(json.dumps(results, indent=2) + '\n')
          print(json.dumps(results))
          raise SystemExit(int(any(r['exit_code'] for r in results.values())))
          PYTHON
      - name: Verify unchanged sources
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = fb84169e6fa3cb9e0cdf4ba9fa7343ca2ec8aa18
          git status --short
          git diff --exit-code HEAD --
      - name: Preserve proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-node-config-diagnostic-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/node-config-diagnostic-proof/
          if-no-files-found: warn
          retention-days: 14
