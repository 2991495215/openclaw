# PROOF ONLY: one exact failing case on an immutable candidate; never merge this workflow.
name: Red-main heartbeat replacement visible-reply
run-name: Heartbeat replacement visible-reply 580af7b99b1f ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-heartbeat-replacement-visible-reply-proof
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  heartbeat-replacement-visible-reply-proof:
    name: One heartbeat same-store replacement regression
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout pinned candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 580af7b99b1f892c17fbc5e8f8f3cbfd69fd0cf4
          fetch-depth: 1
          persist-credentials: false

      - name: Record candidate sources
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 580af7b99b1f892c17fbc5e8f8f3cbfd69fd0cf4
          proof_dir="$RUNNER_TEMP/heartbeat-replacement-visible-reply-proof"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- src/gateway/server.heartbeat-store-lifecycle.product-proof.test.ts
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
          node-compile-cache: "true"

      - name: Prove original same-store replacement case
        id: visible_reply_case
        if: ${{ !cancelled() }}
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          pnpm test src/gateway/server.heartbeat-store-lifecycle.product-proof.test.ts --maxWorkers=1 -t 'handles a queued child notice after same-store replacement' --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/heartbeat-replacement-visible-reply-proof/visible-reply-case.log"

      - name: Verify unchanged sources
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --exit-code -- src/gateway/server.heartbeat-store-lifecycle.product-proof.test.ts

      - name: Preserve proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-heartbeat-replacement-visible-reply-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/heartbeat-replacement-visible-reply-proof/
          if-no-files-found: warn
          retention-days: 14
