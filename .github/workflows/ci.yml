name: Red-main Matrix CLI phase diagnostic
run-name: Matrix CLI phase diagnostic ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Unique diagnostic correlation ID
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: redmain-matrix-cli-timeout-9e45e1a
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.19.0"
jobs:
  matrix-cli-timeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      OPENCLAW_TEST_PROJECTS_PARALLEL: "1"
      OPENCLAW_VITEST_RUNTIME: node
      OPENCLAW_CI_TEST_RUNTIME_POLICY: node
    steps:
      - name: Checkout exact natural failing revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 9e45e1ab3d92e01ff9d40df2af0c6892cfd6d1ca
          fetch-depth: 1
          persist-credentials: false
      - name: Record source and workflow provenance
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9e45e1ab3d92e01ff9d40df2af0c6892cfd6d1ca
          test "$(git hash-object test/scripts/code-mode-model-matrix.gateway-evidence.test.ts)" = f9877d0fc340448f0520a25ff2bfbccef8fe14fb
          test "$(git hash-object test/scripts/code-mode-model-matrix.gateway-evidence.test.ts)" = f9877d0fc340448f0520a25ff2bfbccef8fe14fb
          test "$(git hash-object scripts/code-mode-model-matrix.ts)" = 5eb34e727f14d61f2beeed44ada39c1265312fa3
          test "$(git hash-object scripts/lib/code-mode-matrix-gateway.ts)" = 5bfd9a626891ace829627b2b5103f1faf5c5183d
          test "$(git hash-object scripts/lib/code-mode-matrix-provider.ts)" = 417e35b3b52c5d55e6659eb98e24d7697f0ae74b
          test "$(git hash-object scripts/lib/code-mode-matrix-config.ts)" = 92f70ef8868dd1e10982ebe9e8e1cbe8f60f88da
          test "$(git hash-object scripts/lib/code-mode-matrix-usage.ts)" = 2d9f4bb0b70ac0673e34dd83a7a60146cdd6619b
          test "$(git hash-object scripts/lib/tsx-cli-shim.mjs)" = 3b94800ce6286b818d9ee1b7e9c1f6e28d4dc5c1
          test "$(git hash-object scripts/tsx.mjs)" = 5a77d5f15a20f084db0c120581ef936970816101
          test "$(git hash-object extensions/qa-lab/test-api.ts)" = 651fdfe89b86d2d1e456c8e16d8448967511d8b0
          test "$(git hash-object extensions/qa-lab/src/evidence-environment.ts)" = bd8efb4f8b5d5879dec9fe61d23f564f81f3d5c9
          test "$(git hash-object src/secrets/provider-env-vars.ts)" = e0a2ba8c727fa90e6817d7c55e3e50d06e6721e4
          test "$(git hash-object src/agents/model-auth-env.ts)" = bc790be8e05c8a6429742c204e0e33784ed368d1
          test "$(git hash-object src/plugins/plugin-metadata-snapshot.ts)" = 25c06d9b6604ba3b74b5fcc7add064753bc95864
          test "$(git hash-object src/agents/code-mode-runtime.ts)" = 7356be5ff906570460f201ab71f8e7e6a3144176
          mkdir -p "$RUNNER_TEMP/matrix-cli-timeout"
          {
            git rev-parse HEAD
            echo "$WORKFLOW_SHA"
            git ls-tree HEAD -- test/scripts/code-mode-model-matrix.gateway-evidence.test.ts scripts/code-mode-model-matrix.ts scripts/lib/code-mode-matrix-gateway.ts scripts/lib/code-mode-matrix-provider.ts
          } | tee "$RUNNER_TEMP/matrix-cli-timeout/provenance.txt"
      - name: Setup matching Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup pinned pnpm
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: "off"
      - name: Install frozen dependencies
        env:
          CI: "true"
        run: pnpm install --frozen-lockfile --prefer-offline --config.ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true --config.side-effects-cache=true
      - name: Instrument the unchanged failing path with bounded phase markers
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json
          
          def replace(path, before, after):
              p = Path(path)
              source = p.read_text()
              assert source.count(before) == 1, (path, before, source.count(before))
              p.write_text(source.replace(before, after))
          
          def marker(phase, indent=""):
              return indent + 'if (process.argv[1]?.endsWith("code-mode-model-matrix.ts")) console.error("[matrix-phase] " + JSON.stringify({ phase: ' + json.dumps(phase) + ', ms: Math.round(process.uptime() * 1000) }));\n'
          
          test = "test/scripts/code-mode-model-matrix.gateway-evidence.test.ts"
          replace(test, "  const run = spawnSync(\n", "  const cliStartedAt = performance.now();\n  const run = spawnSync(\n")
          replace(test, "  expect(run.error).toBeUndefined();\n", '''  console.log("[matrix-cli-diagnostic]", JSON.stringify({
              elapsedMs: performance.now() - cliStartedAt,
              status: run.status,
              signal: run.signal,
              error: run.error?.message,
              stdout: run.stdout,
              stderr: run.stderr,
              artifacts: await fs.readdir(path.join(root, "artifacts")).catch(() => []),
            }));
            expect(run.error).toBeUndefined();
          ''')
          
          preload = "scripts/tsx.mjs"
          replace(preload, "await registerToolingTsx();", marker("preload:start") + "await registerToolingTsx();\n" + marker("preload:registered"))
          
          matrix = "scripts/code-mode-model-matrix.ts"
          replace(matrix, "const execFileAsync = promisify(execFile);", marker("matrix:imports-evaluated") + "const execFileAsync = promisify(execFile);")
          replace(matrix, "  const sourceIdentity = deps.readSourceIdentity\n", marker("source-identity:start", "  ") + "  const sourceIdentity = deps.readSourceIdentity\n")
          replace(matrix, "  if (options.runtimeDir && sourceIdentity.sourceDirty) {", marker("source-identity:done", "  ") + "  if (options.runtimeDir && sourceIdentity.sourceDirty) {")
          replace(matrix, "  const buildSha256 = options.dryRun\n", marker("output:reserved", "  ") + "  const buildSha256 = options.dryRun\n")
          replace(matrix, "  const launch: QaEvidenceIdentity = {", marker("runtime:hashed", "  ") + "  const launch: QaEvidenceIdentity = {")
          replace(matrix, '  await writeJson(path.join(outputDir, "manifest.json"), manifest);', marker("manifest:prepared", "  ") + '  await writeJson(path.join(outputDir, "manifest.json"), manifest);')
          replace(matrix, "    const runtime = runtimeRoot\n", marker("runtime:prepare-start", "    ") + "    const runtime = runtimeRoot\n")
          replace(matrix, "    const results: CodeModeMatrixCellResult[] = [];", marker("runtime:prepared", "    ") + "    const results: CodeModeMatrixCellResult[] = [];")
          replace(matrix, "      const workload = isGatewayTask(cell.task)\n", marker("gateway-import:start", "      ") + "      const workload = isGatewayTask(cell.task)\n")
          replace(matrix, "      // Repetitions are independent scheduled cells, not retries whose eventual", marker("gateway-import:done", "      ") + "      // Repetitions are independent scheduled cells, not retries whose eventual")
          replace(matrix, "        result = await executeCell({", marker("cell:start", "        ") + "        result = await executeCell({")
          replace(matrix, "      if (workload) {", marker("cell:done", "      ") + "      if (workload) {")
          replace(matrix, "    await writeEvidence(summary.finishedAt);", "    await writeEvidence(summary.finishedAt);\n" + marker("results:written", "    "))
          replace(matrix, "    if (runtimeRoot) {\n      await fs.rm(runtimeRoot, { force: true, recursive: true });\n    }", marker("cleanup:start", "    ") + "    if (runtimeRoot) {\n      await fs.rm(runtimeRoot, { force: true, recursive: true });\n    }\n" + marker("cleanup:done", "    "))
          replace(matrix, "    const options = parseCodeModeMatrixOptions(process.argv.slice(2));", marker("main:entered", "    ") + "    const options = parseCodeModeMatrixOptions(process.argv.slice(2));")
          
          provider = "scripts/lib/code-mode-matrix-provider.ts"
          replace(provider, "export type MatrixProviderFailureCategory =", marker("provider:imports-evaluated") + "export type MatrixProviderFailureCategory =")
          replace(provider, "  const names = getProviderEnvVarsCore(provider, {", marker("provider-metadata:start", "  ") + "  const names = getProviderEnvVarsCore(provider, {")
          replace(provider, "  const supplied = names.filter((name) => baseEnv[name]?.trim());", marker("provider-metadata:done", "  ") + "  const supplied = names.filter((name) => baseEnv[name]?.trim());")
          
          gateway = "scripts/lib/code-mode-matrix-gateway.ts"
          replace(gateway, "export type GatewayMatrixTask =", marker("gateway:imports-evaluated") + "export type GatewayMatrixTask =")
          
          evidence = "extensions/qa-lab/src/evidence-environment.ts"
          replace(evidence, '      return await execFileAsync("git", args, options);', marker("provenance-git:start", "      ") + '      const result = await execFileAsync("git", args, options);\n' + marker("provenance-git:done", "      ") + "      return result;")
          
          for file, anchor, phase in [
              ("src/plugins/plugin-metadata-snapshot.ts", "export function loadPluginMetadataSnapshot(\n", "plugin-metadata:imports-evaluated"),
              ("src/secrets/provider-env-vars.ts", "const CORE_PROVIDER_AUTH_ENV_VAR_CANDIDATES =", "provider-env:imports-evaluated"),
              ("src/agents/code-mode-runtime.ts", "export const CODE_MODE_RESUME_MARGIN_MS =", "code-mode-runtime:imports-evaluated"),
          ]:
              replace(file, anchor, marker(phase) + anchor)
          PY
          git diff --binary > "$RUNNER_TEMP/matrix-cli-timeout/diagnostic.patch"
      - name: Run only the naturally failing CLI case once
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/matrix-cli-timeout"
          test "$(node --version)" = v24.19.0
          set +e
          node --import ./scripts/tsx.mjs scripts/test-projects.mts test/scripts/code-mode-model-matrix.gateway-evidence.test.ts -t '^the actual CLI completes a Gateway cell without a live provider or entrypoint import cycle$' --maxWorkers=1 --reporter=verbose --reporter=json --outputFile.json "$proof_dir/result.json" 2>&1 | tee "$proof_dir/diagnostic.log"
          result=${PIPESTATUS[0]}
          set -e
          echo "$result" > "$proof_dir/exit.txt"
          exit "$result"
      - name: Verify exactly one case executed
        if: ${{ always() }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const report = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'matrix-cli-timeout/result.json'), 'utf8'));
          assert.equal(report.testResults.length, 1);
          const cases = report.testResults[0].assertionResults;
          const executed = cases.filter(test => ['passed', 'failed'].includes(test.status));
          assert.equal(executed.length, 1);
          assert.equal(executed[0].title, 'the actual CLI completes a Gateway cell without a live provider or entrypoint import cycle');
          console.log(JSON.stringify({status: executed[0].status, duration: executed[0].duration, executed: 1, unselected: cases.length - 1}));
          JS
      - name: Preserve exact-case diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: redmain-matrix-cli-timeout-${{ github.run_id }}
          path: ${{ runner.temp }}/matrix-cli-timeout/
          if-no-files-found: error
          retention-days: 14
