# Temporary observational diagnosis only. Never merge this workflow or its source logging.
name: Red-main config owner reload diagnosis
run-name: Config owner reload diagnosis ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact diagnostic source commit
        type: string
        required: true
      workflow_sha:
        description: Exact workflow carrier commit
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-config-owner-timeout-${{ github.ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  BASE_SHA: ebee33a97ee08b17115a805f10566a572fffa5e2
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
jobs:
  focused:
    name: Exact unresolved secret owner reload case
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENCLAW_LOCAL_CHECK: "0"
      OPENCLAW_VITEST_RUNTIME: node
    steps:
      - name: Checkout exact diagnostic source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify and record exact diagnostic scope
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA" HEAD)" = src/gateway/server.config-patch.test.ts
          test "$(git rev-parse HEAD:src/gateway/server.config-patch.test.ts)" = 0680423eb65d58900b9fc3d7af61d7cc97ebfcf1
          git diff --exit-code HEAD --
          proof_dir="$RUNNER_TEMP/config-owner-timeout"
          mkdir -p "$proof_dir"
          git diff "$BASE_SHA" HEAD -- src/gateway/server.config-patch.test.ts > "$proof_dir/diagnostic.patch"
          {
            echo "Product base: $BASE_SHA"
            echo "Diagnostic source: $CANDIDATE_SHA"
            echo "Workflow: $WORKFLOW_SHA"
            git show -s --format='%H%n%P%n%an <%ae>%n%s' HEAD
            git ls-tree HEAD -- package.json pnpm-lock.yaml \
              src/gateway/server.config-patch.test.ts \
              src/gateway/config-reload.ts \
              src/gateway/config-applied-revision.ts \
              src/gateway/server-reload-managed-secrets.ts \
              src/gateway/server-reload-hot.ts \
              test/helpers/gateway/config-rpc-gateway.ts \
              .github/actions/setup-node-env/action.yml
          } | tee "$proof_dir/provenance.log"
          cat "$proof_dir/provenance.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Setup frozen Node environment matching failed schedule
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
      - name: Run only the unresolved owner case
        id: focused
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.21.0
          proof_dir="$RUNNER_TEMP/config-owner-timeout"
          {
            node --version
            pnpm --version
            echo 'Command: pnpm test src/gateway/server.config-patch.test.ts --maxWorkers=1 --reporter=verbose --reporter=json --outputFile.json "results.json (under runner temporary proof directory)" -t "reloads owners independently and reports a changed unresolved owner as cold"'
          } | tee "$proof_dir/command.log"
          started="$(date +%s)"
          if pnpm test src/gateway/server.config-patch.test.ts --maxWorkers=1 \
            --reporter=verbose --reporter=json --outputFile.json "$proof_dir/results.json" \
            -t 'reloads owners independently and reports a changed unresolved owner as cold' \
            2>&1 | tee "$proof_dir/test.log"; then
            test_exit=0
          else
            test_exit=$?
          fi
          elapsed=$(( $(date +%s) - started ))
          {
            echo "Test exit: $test_exit"
            echo "Elapsed seconds: $elapsed"
          } | tee "$proof_dir/result.txt" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_exit"
      - name: Verify exact selection and record observed phases
        if: ${{ always() && steps.focused.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'config-owner-timeout'
          report = json.loads((proof / 'results.json').read_text())
          assert len(report['testResults']) == 1, 'Expected exactly one test file'
          result = report['testResults'][0]
          assert pathlib.Path(result['name']).resolve() == pathlib.Path('src/gateway/server.config-patch.test.ts').resolve()
          selected = [entry for entry in result['assertionResults'] if entry['status'] in ('passed', 'failed')]
          expected = 'gateway config methods reloads owners independently and reports a changed unresolved owner as cold'
          assert len(selected) == 1 and selected[0]['fullName'] == expected, 'Expected only the original failing case'
          assert report['numPassedTests'] + report['numFailedTests'] == 1, 'Expected exactly one executed case'
          log = re.sub(r'\x1b\[[0-9;]*m', '', (proof / 'test.log').read_text())
          marker = '[config-owner-reload-diagnostic]'
          observations = [json.loads(line.split(marker, 1)[1].strip()) for line in log.splitlines() if marker in line]
          assert len(observations) == 1, 'Expected one diagnostic, no retries'
          events = observations[0]
          assert 1 <= len(events) <= 64
          allowed = {
              'prepare-candidate:start', 'prepare-candidate:settled',
              'hot-reload:start', 'hot-reload:settled',
              'config-applied:start', 'config-applied:settled',
              'config-accepted:start', 'config-accepted:settled',
              'revision-applied', 'runtime-committed', 'source-committed',
              'seed-patch:start', 'seed-patch:resolved',
              'secrets-reload:start', 'secrets-reload:resolved',
              'cold-patch:start', 'cold-patch:resolved', 'test:finally',
              'write:start', 'write:returned', 'application:resolved', 'application:rejected',
              'restart-result:start', 'restart-result:settled',
              'sentinel-write:start', 'sentinel-write:settled',
          }
          for event in events:
              assert set(event) == {'phase', 'elapsedMs'}
              assert event['phase'] in allowed
              assert isinstance(event['elapsedMs'], int) and event['elapsedMs'] >= 0
          outcome = {
              'candidate': os.environ['CANDIDATE_SHA'], 'base': os.environ['BASE_SHA'],
              'selected': expected, 'status': selected[0]['status'],
              'events': events, 'diagnostic_only': True,
          }
          text = json.dumps(outcome, indent=2)
          (proof / 'observations.json').write_text(text + '\n')
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('```json\n' + text + '\n```\n')
          PY
      - name: Verify tracked source stayed unchanged
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git hash-object src/gateway/server.config-patch.test.ts)" = 0680423eb65d58900b9fc3d7af61d7cc97ebfcf1
          git diff --exit-code HEAD --
      - name: Preserve focused evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-config-owner-timeout-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/config-owner-timeout/
          if-no-files-found: warn
          retention-days: 14
