# PROOF ONLY: diagnosed full-tree export failure; never merge this workflow.
name: Red-main LaunchAgent fixture export
run-name: LaunchAgent fixture export ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
      workflow_sha:
        description: Exact proof workflow commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-launchd-fixture-export-proof
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.19.0"
jobs:
  launchd-export-proof:
    name: Original full-tree export failure
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pinned candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: da6597075edd6dfba1648945676c02e60e9e36ed
          fetch-depth: 2
          persist-credentials: false
      - name: Record source provenance
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = da6597075edd6dfba1648945676c02e60e9e36ed
          git diff --exit-code HEAD --
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          mkdir -p "$RUNNER_TEMP/launchd-export-proof"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git diff --stat HEAD^ HEAD
            git ls-tree HEAD -- package.json pnpm-lock.yaml src/daemon/launchd-install.test-support.ts src/daemon/launchd.test.ts config/knip.all-exports.config.ts scripts/check-deadcode-exports.mts
          } | tee "$RUNNER_TEMP/launchd-export-proof/provenance.txt"
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
          node-compile-cache: "true"
      - name: Check changed helper
        shell: bash
        run: |
          set -euo pipefail
          node_modules/.bin/oxfmt --check --threads=1 src/daemon/launchd-install.test-support.ts
          node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.core.json src/daemon/launchd-install.test-support.ts
          git diff --check HEAD^ HEAD
      - name: Replay only the failing full-tree export scan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess, time
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'launchd-export-proof'
          version = subprocess.check_output(['node', '--version'], text=True).strip()
          assert version == 'v24.19.0', version
          command = ['pnpm', 'dlx', '--package', 'knip@6.32.2', 'knip', '--config', 'config/knip.all-exports.config.ts', '--no-progress', '--reporter', 'compact', '--include', 'exports,nsExports,types,nsTypes,enumMembers,namespaceMembers', '--no-config-hints']
          (proof / 'command.json').write_text(json.dumps(command, indent=2) + '\n')
          started = time.monotonic()
          with (proof / 'scan.log').open('w', encoding='utf-8') as log:
              process = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, encoding='utf-8', errors='replace')
              for line in process.stdout:
                  print(line, end='', flush=True)
                  log.write(line)
              result = process.wait()
          receipt = {'exit_code': result, 'elapsed_seconds': time.monotonic() - started, 'node': version}
          (proof / 'execution.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          raise SystemExit(result)
          PYTHON
      - name: Verify unchanged sources
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = da6597075edd6dfba1648945676c02e60e9e36ed
          git status --short
          git diff --exit-code HEAD --
      - name: Preserve proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-launchd-export-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/launchd-export-proof/
          if-no-files-found: warn
          retention-days: 14
