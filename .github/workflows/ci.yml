# Temporary exact-case proof only. Never merge this workflow.
name: Red-main native titlebar retry diagnostic proof
run-name: Native titlebar retry diagnostic proof ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        type: string
        required: true
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENCLAW_LOCAL_CHECK: "0"
      OPENCLAW_VITEST_RUNTIME: node
      OPENCLAW_UI_E2E_SKIP_REAL_GATEWAY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8bcb4ced3cd8cf7eff08f2081ca5833c5aee1dc9
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source and source-only scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8bcb4ced3cd8cf7eff08f2081ca5833c5aee1dc9
          test "$(git diff --name-only HEAD^ HEAD)" = ui/src/e2e/lazy-custom-element-recovery.e2e.test.ts
          git show --format=fuller --stat HEAD
          git diff HEAD^ HEAD -- ui/src/e2e/lazy-custom-element-recovery.e2e.test.ts
          git diff --check HEAD^ HEAD
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
      - name: Install exact browser dependency
        run: pnpm --dir ui exec playwright install --with-deps chromium
      - name: Run only the failed native titlebar case
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-retry-proof"
          started="$(date +%s)"
          node scripts/run-vitest.mjs run --config test/vitest/vitest.ui-e2e.config.ts --configLoader runner \
            ui/src/e2e/lazy-custom-element-recovery.e2e.test.ts --maxWorkers=1 \
            --reporter=verbose --reporter=json --outputFile.json "$RUNNER_TEMP/native-retry-proof/results.json" \
            -t 'recovers the native titlebar visibly after its chunk fails$' \
            2>&1 | tee "$RUNNER_TEMP/native-retry-proof/test.log"
          echo "Command seconds: $(( $(date +%s) - started ))"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-retry-proof/results.json'
          r=json.loads(p.read_text())
          assert len(r['testResults'])==1,r
          s=[a for f in r['testResults'] for a in f['assertionResults'] if a['status'] in ('passed','failed')]
          assert len(s)==1,s
          assert s[0]['title']=='recovers the native titlebar visibly after its chunk fails',s
          assert s[0]['status']=='passed',s
          print(json.dumps(s[0],indent=2))
          PY
      - name: Verify unchanged proof source
        if: ${{ always() }}
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: native-retry-exact-case
          path: |
            ${{ runner.temp }}/native-retry-proof/
            ${{ runner.temp }}/native-retry-failed.png
