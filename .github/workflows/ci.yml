# Temporary exact-candidate proof only. Never merge this workflow.
name: Red-main service capability expectation proof
run-name: Service capability ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full reviewed repair commit SHA
        type: string
        required: true
      workflow_sha:
        description: Expected workflow carrier commit SHA
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-service-capability-expectation
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  service-capability:
    name: Exact service refusal case and changed-file checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout reviewed candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record candidate and workflow provenance
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          git diff --exit-code HEAD --
          proof_dir="$RUNNER_TEMP/service-capability-expectation"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- \
              src/cli/gateway-service-capability.process.test.ts \
              src/cli/daemon-cli/install.ts \
              src/daemon/service-reconciliation.ts \
              src/commands/startup-config-preflight.ts \
              src/config/io.context.ts \
              scripts/run-vitest.mjs \
              scripts/run-oxlint.mjs \
              package.json pnpm-lock.yaml \
              .github/actions/setup-node-env/action.yml
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment and frozen dependencies
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "true"
          vitest-worker-cache: "false"
          node-compile-cache: "true"

      - name: Run exact service refusal case
        id: test_case
        continue-on-error: true
        timeout-minutes: 12
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
          OPENCLAW_CI_TEST_RUNTIME_POLICY: node
          OPENCLAW_VITEST_MAX_WORKERS: "1"
        run: |
          set -euo pipefail
          node scripts/run-vitest.mjs \
            src/cli/gateway-service-capability.process.test.ts \
            --maxWorkers=1 --reporter=verbose --reporter=json \
            --outputFile.json "$RUNNER_TEMP/service-capability-expectation/test.json" \
            -t '^candidate service capability startup preserves the live Gateway database when update install cannot inspect the service$' \
            2>&1 | tee "$RUNNER_TEMP/service-capability-expectation/test.log"

      - name: Check changed-file lint
        id: lint
        continue-on-error: true
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
        run: |
          set -euo pipefail
          node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.core.json \
            src/cli/gateway-service-capability.process.test.ts \
            2>&1 | tee "$RUNNER_TEMP/service-capability-expectation/lint.log"

      - name: Check changed-file format
        id: format
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec oxfmt --check src/cli/gateway-service-capability.process.test.ts \
            2>&1 | tee "$RUNNER_TEMP/service-capability-expectation/format.log"

      - name: Validate exact passing case and unchanged source
        if: ${{ always() }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          TEST_OUTCOME: ${{ steps.test_case.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
        run: |
          set -uo pipefail
          proof_dir="$RUNNER_TEMP/service-capability-expectation"
          mkdir -p "$proof_dir"
          source_outcome=failure
          if test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" && git diff --quiet HEAD --; then
            source_outcome=success
          fi
          report_outcome=failure
          if node --input-type=module <<'SELECTED_TEST' | tee "$proof_dir/selected-test.json"
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import path from "node:path";

          const report = JSON.parse(readFileSync(path.join(process.env.RUNNER_TEMP, "service-capability-expectation/test.json"), "utf8"));
          const expectedName = "candidate service capability startup preserves the live Gateway database when update install cannot inspect the service";
          assert.equal(report.success, true, "successful report");
          assert.equal(report.testResults.length, 1, "one test file");
          assert.equal(report.numPassedTests, 1, "exactly one passed test");
          assert.equal(report.numFailedTests, 0, "no failed tests");
          assert.equal(report.numFailedTestSuites, 0, "no failed suites");
          const result = report.testResults[0];
          assert.equal(result.name, path.resolve("src/cli/gateway-service-capability.process.test.ts"));
          assert.equal(result.status, "passed", "file passed");
          const selected = result.assertionResults.filter((entry) => entry.fullName === expectedName);
          assert.equal(selected.length, 1, "exactly one matching case");
          assert.equal(selected[0].status, "passed", "selected case passed");
          assert.deepEqual(result.assertionResults.filter((entry) => entry.status === "passed").map((entry) => entry.fullName), [expectedName]);
          console.log(JSON.stringify({ selected: selected.length, passed: report.numPassedTests, failed: report.numFailedTests, fullName: expectedName }));
          SELECTED_TEST
          then
            report_outcome=success
          fi
          {
            echo "Setup: $SETUP_OUTCOME"
            echo "Exact service refusal case: $TEST_OUTCOME"
            echo "Exactly one passing case verified from JSON: $report_outcome"
            echo "Changed-file lint: $LINT_OUTCOME"
            echo "Changed-file format: $FORMAT_OUTCOME"
            echo "Unchanged tracked source at candidate: $source_outcome"
          } | tee "$proof_dir/outcomes.txt"
          cat "$proof_dir/outcomes.txt" >> "$GITHUB_STEP_SUMMARY"
          test "$SETUP_OUTCOME" = success && \
            test "$TEST_OUTCOME" = success && \
            test "$report_outcome" = success && \
            test "$LINT_OUTCOME" = success && \
            test "$FORMAT_OUTCOME" = success && \
            test "$source_outcome" = success

      - name: Preserve proof logs and JSON report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-service-capability-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/service-capability-expectation/
          if-no-files-found: warn
          retention-days: 14
