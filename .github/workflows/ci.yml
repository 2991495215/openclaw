# Temporary focused proof only. Never merge this workflow.
name: Red-main required native placement proof
run-name: Required native placement ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Reviewed full candidate commit SHA
        type: string
        required: true
      workflow_sha:
        description: Reviewed full proof workflow commit SHA
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-native-placement-proof-${{ github.ref }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.19.0"
  OPENCLAW_LOCAL_CHECK: "0"
  OPENCLAW_VITEST_RUNTIME: node

jobs:
  native-placement:
    name: Required native placement (exact candidate)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify candidate and workflow identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          proof_dir="$RUNNER_TEMP/native-placement"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $EXPECTED_SHA"
            echo "Workflow: $WORKFLOW_SHA"
            git show -s --format='%H%n%P%n%s' HEAD
            git ls-tree HEAD -- package.json pnpm-lock.yaml \
              src/gateway/worker-environments/worker-turn-admission.ts \
              src/gateway/worker-environments/worker-turn-launcher.ts \
              src/gateway/worker-environments/worker-turn-launcher.lazy.test.ts \
              test/e2e/qa-lab/runtime/required-native-same-session.e2e.test.ts
          } | tee "$proof_dir/provenance.log"
          cat "$proof_dir/provenance.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup frozen Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"

      - name: Run pending publication regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.19.0
          proof_dir="$RUNNER_TEMP/native-placement"
          started="$(date +%s)"
          if pnpm test src/gateway/worker-environments/worker-turn-launcher.lazy.test.ts \
            --maxWorkers=1 -t 'keeps required-profile execution current during workspace result publication' \
            2>&1 | tee "$proof_dir/regression.log"; then
            test_exit=0
          else
            test_exit=$?
          fi
          {
            echo "Regression exit: $test_exit"
            echo "Regression seconds: $(( $(date +%s) - started ))"
          } | tee "$proof_dir/regression-result.txt" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_exit"

      - name: Build private QA runtime
        shell: bash
        env:
          OPENCLAW_BUILD_PRIVATE_QA: "1"
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -euo pipefail
          pnpm build qaRuntime 2>&1 | tee "$RUNNER_TEMP/native-placement/build.log"

      - name: Run original required native same-session case
        shell: bash
        env:
          OPENCLAW_BUILD_PRIVATE_QA: "1"
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/native-placement"
          started="$(date +%s)"
          if pnpm test test/e2e/qa-lab/runtime/required-native-same-session.e2e.test.ts \
            --maxWorkers=1 2>&1 | tee "$proof_dir/native-e2e.log"; then
            test_exit=0
          else
            test_exit=$?
          fi
          {
            echo "Native E2E exit: $test_exit"
            echo "Native E2E seconds: $(( $(date +%s) - started ))"
          } | tee "$proof_dir/native-e2e-result.txt" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_exit"

      - name: Verify tracked source stayed unchanged
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --

      - name: Preserve focused evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-native-placement-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-placement/
          if-no-files-found: warn
          retention-days: 14
