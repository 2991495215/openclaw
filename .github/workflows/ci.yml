name: Red-main exact Usage Unicode proof
run-name: Usage Unicode ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Reviewed full candidate commit SHA
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-usage-unicode-proof-${{ github.ref }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  usage-unicode-regression:
    name: Usage Unicode full Playwright file (exact candidate)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          mkdir -p .artifacts/usage-unicode-refresh
          echo "Candidate: $actual_sha" | tee .artifacts/usage-unicode-refresh/provenance.log
          echo "Workflow: $WORKFLOW_SHA" | tee -a .artifacts/usage-unicode-refresh/provenance.log
          git rev-parse HEAD:ui/src/e2e/usage-session-unicode.e2e.test.ts | tee -a .artifacts/usage-unicode-refresh/provenance.log
          cat .artifacts/usage-unicode-refresh/provenance.log >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"

      - name: Setup Playwright Chromium
        uses: ./.github/actions/setup-playwright-chromium
        with:
          cache-mode: restore

      - name: Run complete Usage Unicode Playwright file
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          node scripts/run-vitest.mjs run \
            --config test/vitest/vitest.ui-e2e.config.ts \
            --configLoader runner \
            --maxWorkers=1 \
            --reporter=verbose \
            ui/src/e2e/usage-session-unicode.e2e.test.ts \
            2>&1 | tee .artifacts/usage-unicode-refresh/playwright.log

      - name: Preserve full regression log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-usage-unicode-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/usage-unicode-refresh/*.log
          if-no-files-found: warn
          retention-days: 14
