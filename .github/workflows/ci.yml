# Temporary exact-candidate proof only. Never merge this workflow.
name: Red-main ClawHub dormant catalog proof
run-name: ClawHub dormant catalog ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Reviewed full candidate commit SHA
        type: string
        required: true
      workflow_sha:
        description: Expected full workflow carrier commit SHA
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-clawhub-dormant-catalog-${{ github.ref }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.19.0"

jobs:
  check-exports:
    name: Production and full-tree exports (exact candidate)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record candidate source and workflow provenance
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --
          mkdir -p .artifacts/clawhub-dormant-catalog
          {
            echo "Candidate: $actual_sha"
            echo "Workflow: $WORKFLOW_SHA"
            git show -s --format='%H%n%P%n%an <%ae>%n%s' HEAD
            git ls-tree HEAD -- \
              package.json pnpm-lock.yaml \
              scripts/check-deadcode-exports.mts scripts/deadcode-knip-runner.mts \
              config/knip.config.ts config/knip.all-exports.config.ts \
              src/infra/clawhub-packages.ts src/infra/clawhub-packages.test.ts \
              src/claws/clawhub-source.ts src/claws/clawhub-source.test.ts src/claws/clawhub-manifest-summary.ts
          } | tee .artifacts/clawhub-dormant-catalog/provenance.log
          cat .artifacts/clawhub-dormant-catalog/provenance.log >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"

      - name: Run affected export scopes once
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
        run: |
          set -euo pipefail
          node --import ./scripts/tsx.mjs --input-type=module <<'NODE' 2>&1 | tee .artifacts/clawhub-dormant-catalog/exports.log
          import { runKnip } from './scripts/deadcode-knip-runner.mts';
          import { checkExportScan } from './scripts/check-deadcode-exports.mts';
          const common = ['--no-progress', '--reporter', 'compact', '--include',
            'exports,nsExports,types,nsTypes,enumMembers,namespaceMembers', '--no-config-hints'];
          const scopes = [
            ['production unused-export scan', ['--config', 'config/knip.config.ts', '--production']],
            ['full-tree unused-export scan', ['--config', 'config/knip.all-exports.config.ts']],
          ];
          for (const [name, args] of scopes) {
            const result = await runKnip([...args, ...common], { scanName: name });
            if (result.output) console.log(result.output);
            const verdict = checkExportScan(name, result.output);
            if (result.errorCode || result.status !== 0 || !verdict.ok) {
              console.error(`${name}: FAILED`, result.errorCode ?? result.signal ?? result.status,
                result.errorMessage ?? '', verdict.message);
              process.exitCode = 1;
            } else {
              console.log(`[deadcode] Knip ${name} passed with 0 entries.`);
            }
          }
          NODE

      - name: Verify candidate source remained unchanged
        if: ${{ always() }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --
          echo "Tracked candidate source remained unchanged." >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve export outcomes and provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-clawhub-dormant-catalog-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/clawhub-dormant-catalog/
          if-no-files-found: warn
          retention-days: 14
