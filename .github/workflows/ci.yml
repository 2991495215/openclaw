# Temporary focused proof only. Never merge this workflow.
name: Red-main worker launcher mock proof
run-name: Worker launcher mock contract ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Reviewed full candidate commit SHA
        type: string
        required: true
      workflow_sha:
        description: Reviewed full proof workflow commit SHA
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-worker-launcher-mock-proof-${{ github.ref }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"
  OPENCLAW_LOCAL_CHECK: "0"
  BASE_SHA: "61ed7497922beb4013a4b2bfa599904cc75e3681"

jobs:
  worker-launcher-mock:
    name: Worker launcher mock contract (exact candidate)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify candidate and workflow identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          proof_dir="$RUNNER_TEMP/worker-launcher-mock"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $EXPECTED_SHA"
            echo "Workflow: $WORKFLOW_SHA"
            git show -s --format='%H%n%P%n%s' HEAD
            git ls-tree HEAD -- package.json pnpm-lock.yaml \
              src/gateway/worker-environments/worker-turn-launcher.lazy.test.ts \
              scripts/check-test-mock-exports.mts scripts/lib/mock-factory-scan.mts \
              config/test-mock-exports-baseline.txt .github/actions/setup-node-env/action.yml
          } | tee "$proof_dir/provenance.log"
          cat "$proof_dir/provenance.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup frozen Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"

      - name: Check first-party mock exports
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/worker-launcher-mock"
          started="$(date +%s)"
          if node --import ./scripts/tsx.mjs scripts/check-test-mock-exports.mts --base "$BASE_SHA" \
            2>&1 | tee "$proof_dir/mock-exports.log"; then
            check_exit=0
          else
            check_exit=$?
          fi
          {
            echo "Mock exports exit: $check_exit"
            echo "Mock exports seconds: $(( $(date +%s) - started ))"
          } | tee "$proof_dir/mock-exports-result.txt" >> "$GITHUB_STEP_SUMMARY"
          exit "$check_exit"

      - name: Verify tracked source stayed unchanged
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --

      - name: Preserve focused evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-worker-launcher-mock-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worker-launcher-mock/
          if-no-files-found: warn
          retention-days: 14
