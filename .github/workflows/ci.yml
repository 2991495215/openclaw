name: Red-main exact dropdown export Knip proof
run-name: Dropdown export Knip ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Reviewed full candidate commit SHA
        type: string
        required: true
      workflow_sha:
        description: Reviewed full proof workflow commit SHA
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-dropdown-knip-proof-${{ github.ref }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  check-exports:
    name: check-exports (exact candidate)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          echo "Candidate: $actual_sha"
          echo "Workflow: $WORKFLOW_SHA"
          echo "Candidate: $actual_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow: $WORKFLOW_SHA" >> "$GITHUB_STEP_SUMMARY"
          git ls-tree HEAD -- ui/src/components/web-awesome.ts ui/src/components/web-awesome.test.ts

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"

      - name: Run canonical export scan
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
        run: |
          set -euo pipefail
          pnpm deadcode:exports
          echo "deadcode:exports: success" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify tracked source is unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD --
