# Prepared fallback only: dispatch after ordinary CI selection is known.
# Shared setup/qaRuntime pattern: account-route-focused-workflow.yml.
name: Red-main status usage proof
run-name: Status usage b80841f6946b ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
      run_owner_regression:
        description: Run the changed unit-test file only if ordinary PR CI omitted it
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: redmain-status-usage-proof-b80841f6946b
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  status-usage-proof:
    name: Original auth-product case and optional status owner regression
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b80841f6946b6f72c008220eafd51d9b37ed2948
          fetch-depth: 1
          persist-credentials: false

      - name: Record candidate and unchanged original test
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b80841f6946b6f72c008220eafd51d9b37ed2948
          test "$(git rev-parse HEAD:test/e2e/qa-lab/runtime/codex-auth-product-proof.e2e.test.ts)" = af91cc0579e9daf4863cd52a66017c1c717c99df
          proof_dir="$RUNNER_TEMP/status-usage-proof"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- src/commands/status-json-runtime.ts src/commands/status-json-runtime.test.ts test/e2e/qa-lab/runtime/codex-auth-product-proof.e2e.test.ts
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "true"
          vitest-worker-cache: "false"
          node-compile-cache: "true"

      - name: Run status owner regression file if omitted by ordinary CI
        id: owner_regression
        if: ${{ inputs.run_owner_regression }}
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          pnpm test src/commands/status-json-runtime.test.ts --maxWorkers=1 --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/status-usage-proof/status-owner.log"

      - name: Build private QA runtime
        id: qa_runtime
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCLAW_BUILD_PRIVATE_QA: "1"
          VITEST: "1"
        run: |
          set -euo pipefail
          pnpm build qaRuntime 2>&1 | tee "$RUNNER_TEMP/status-usage-proof/qa-runtime-build.log"

      - name: Run unchanged original auth-product case
        id: product_case
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
          OPENCLAW_E2E_USE_PREBUILT_DIST: "1"
          OPENCLAW_E2E_WORKERS: "1"
          OPENCLAW_CI_TEST_RUNTIME_POLICY: node
          OPENCLAW_VITEST_MAX_WORKERS: "1"
          OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS: "300000"
          OPENCLAW_NODE_TEST_PLAN_CONCURRENCY: "1"
          OPENCLAW_NODE_TEST_TARGETS_JSON: '["test/e2e/qa-lab/runtime/codex-auth-product-proof.e2e.test.ts"]'
          OPENCLAW_NODE_TEST_VITEST_ARGS_JSON: '["--maxWorkers=1","--reporter=verbose","--testNamePattern","repairs mixed legacy auth into SQLite and sends the selected OAuth profile to app-server"]'
        run: |
          set -euo pipefail
          node --import tsx scripts/ci-run-node-test-shard.mts 2>&1 | tee "$RUNNER_TEMP/status-usage-proof/original-auth-product-case.log"

      - name: Record outcomes and verify unchanged sources
        if: ${{ always() }}
        shell: bash
        env:
          OWNER_OUTCOME: ${{ steps.owner_regression.outcome }}
          BUILD_OUTCOME: ${{ steps.qa_runtime.outcome }}
          TEST_OUTCOME: ${{ steps.product_case.outcome }}
        run: |
          set -euo pipefail
          {
            echo "Status owner file: $OWNER_OUTCOME"
            echo "QA runtime build: $BUILD_OUTCOME"
            echo "Original auth-product case: $TEST_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"
          git status --short
          git diff --exit-code -- src/commands/status-json-runtime.ts src/commands/status-json-runtime.test.ts test/e2e/qa-lab/runtime/codex-auth-product-proof.e2e.test.ts

      - name: Preserve proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-status-usage-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/status-usage-proof/
          if-no-files-found: warn
          retention-days: 14
