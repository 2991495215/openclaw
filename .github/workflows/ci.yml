# Temporary proof workflow only. Root pins candidate_sha after source review.
# Setup matches the existing account-route owner proof; no product build or unrelated tests.
name: Red-main metadata thinking proof
run-name: Metadata thinking proof ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Reviewed full candidate commit SHA; no branch names
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-metadata-thinking-proof-${{ github.ref }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  metadata-thinking-regressions:
    name: Session metadata thinking regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          proof_dir="$RUNNER_TEMP/metadata-thinking-regressions"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $actual_sha"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- src/gateway/session-utils.metadata-perf.test.ts src/gateway/session-utils-model.ts
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "true"
          vitest-worker-cache: "true"
          node-compile-cache: "true"

      - name: Run exact CI-failing metadata file
        id: owner_regressions
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          pnpm test src/gateway/session-utils.metadata-perf.test.ts --maxWorkers=1 --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/metadata-thinking-regressions/metadata-perf.log"

      - name: Record owner regression outcome and source status
        if: ${{ always() }}
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.owner_regressions.outcome }}
        run: |
          set -euo pipefail
          echo "Exact metadata regression file: $TEST_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          git status --short
          git diff --exit-code -- src/gateway/session-utils.metadata-perf.test.ts src/gateway/session-utils-model.ts

      - name: Preserve owner regression logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-metadata-thinking-regressions-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/metadata-thinking-regressions/
          if-no-files-found: warn
          retention-days: 14
