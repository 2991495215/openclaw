# Parent-authorized exact original membership file and active-writer case; never merge workflow.
name: Red-main membership and writer fixture proof
run-name: Membership and writer fixtures 3fcd55ee95d3 ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-membership-writer-fixtures-proof
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  membership-writer-fixtures-proof:
    name: Original membership and active-writer fixture proof
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 3fcd55ee95d3047e41ebe9d47dc8a48695665f64
          fetch-depth: 1
          persist-credentials: false

      - name: Record candidate sources
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 3fcd55ee95d3047e41ebe9d47dc8a48695665f64
          proof_dir="$RUNNER_TEMP/membership-writer-fixtures-proof"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- src/gateway/server.chat-membership-authority.product.test.ts src/config/sessions/session-accessor.sqlite-reclamation-reuse.test.ts
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
          node-compile-cache: "true"

      - name: Original failing cases 1
        id: cases_1
        if: ${{ !cancelled() }}
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          pnpm test src/gateway/server.chat-membership-authority.product.test.ts --maxWorkers=1 --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/membership-writer-fixtures-proof/cases-1.log"

      - name: Original failing cases 2
        id: cases_2
        if: ${{ !cancelled() }}
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          pnpm test src/config/sessions/session-accessor.sqlite-reclamation-reuse.test.ts --maxWorkers=1 -t 'retires a retained active writer on Gateway drain and preserves its clean witness' --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/membership-writer-fixtures-proof/cases-2.log"

      - name: Verify unchanged sources
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --exit-code -- src/gateway/server.chat-membership-authority.product.test.ts src/config/sessions/session-accessor.sqlite-reclamation-reuse.test.ts

      - name: Preserve proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-membership-writer-fixtures-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/membership-writer-fixtures-proof/
          if-no-files-found: warn
          retention-days: 14
