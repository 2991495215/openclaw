# Temporary exact-candidate proof only. Never merge this workflow.
# Replace b2c1b8d8e32ef85aa5092f256ebc69b481e0a51e and b2c1b8d8e32e after committing.
name: Red-main handshake expectation proof
run-name: Handshake expectations b2c1b8d8e32e ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-handshake-expectations-proof-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  handshake-expectations:
    name: Original two handshake failures
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b2c1b8d8e32ef85aa5092f256ebc69b481e0a51e
          fetch-depth: 1
          persist-credentials: false

      - name: Record source and workflow provenance
        shell: bash
        env:
          EXPECTED_SHA: b2c1b8d8e32ef85aa5092f256ebc69b481e0a51e
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --
          proof_dir="$RUNNER_TEMP/handshake-expectations-proof"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $EXPECTED_SHA"
            echo "Workflow: $WORKFLOW_SHA"
            echo "Baseline: scheduled run 38470966677, job 115550039641"
            git ls-tree HEAD -- \
              src/gateway/server.auth.control-ui.test.ts \
              src/gateway/server.auth.control-ui.bootstrap-lifecycle.suite.ts \
              src/gateway/server.node-version-mismatch.test.ts \
              src/gateway/server/ws-connection/message-handler.ts \
              src/gateway/server/ws-connection/connect-hello.ts \
              src/gateway/server/ws-connection/connect-node-session.ts \
              src/gateway/server/ws-connection/connect-session.ts
          } | tee "$proof_dir/provenance.log"
          cat "$proof_dir/provenance.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
          node-compile-cache: "true"

      - name: Prove the original two failures once
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/handshake-expectations-proof"
          proof_started="$(date +%s)"
          proof_rc=0
          pnpm test \
            src/gateway/server.auth.control-ui.test.ts \
            src/gateway/server.node-version-mismatch.test.ts \
            --maxWorkers=1 \
            -t 'does not consume bootstrap token when node reconcile fails before hello-ok|rejected local reconnects preserve the active node pending reapproval' \
            --reporter=verbose 2>&1 | tee "$proof_dir/tests.log" || proof_rc=$?
          proof_elapsed=$(( $(date +%s) - proof_started ))
          printf 'Exit code: %s\nWall time: %s seconds\n' "$proof_rc" "$proof_elapsed" | tee "$proof_dir/result.log"
          cat "$proof_dir/result.log" >> "$GITHUB_STEP_SUMMARY"
          exit "$proof_rc"

      - name: Verify candidate source remained unchanged
        if: ${{ always() }}
        shell: bash
        env:
          EXPECTED_SHA: b2c1b8d8e32ef85aa5092f256ebc69b481e0a51e
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --

      - name: Preserve proof logs and provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-handshake-expectations-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/handshake-expectations-proof/
          if-no-files-found: warn
          retention-days: 14
