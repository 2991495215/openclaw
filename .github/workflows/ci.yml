name: Red-main live inventory and plugin contract proof
run-name: Live inventory and plugin contract ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Reviewed combined candidate commit SHA
        type: string
        required: true
        default: f94ebc5594561c9b9af8ae46f28458314b850f77
      workflow_sha:
        description: Expected workflow carrier commit SHA
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-live-manifest-contract-proof
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.19.0"

jobs:
  live-manifest-contract:
    name: Exact live inventory and plugin config contract cases
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repaired candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record candidate and workflow provenance
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$EXPECTED_SHA" = f94ebc5594561c9b9af8ae46f28458314b850f77
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          git diff --exit-code HEAD --
          proof_dir="$RUNNER_TEMP/live-manifest-contract"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- \
              test/scripts/test-live-shard.test.ts \
              src/plugins/contracts/boundary-invariants.test.ts \
              scripts/test-live-shard.mts \
              extensions/diffs/src/plugin.ts \
              scripts/run-vitest.mjs \
              .github/actions/setup-node-env/action.yml
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "true"
          vitest-worker-cache: "false"
          node-compile-cache: "true"

      - name: Run exact native live inventory case
        id: inventory
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
          OPENCLAW_CI_TEST_RUNTIME_POLICY: node
          OPENCLAW_VITEST_MAX_WORKERS: "1"
          OPENCLAW_VITEST_PRINT_IMPORT_BREAKDOWN: "1"
        run: |
          set -uo pipefail
          set +e
          timeout --signal=TERM --kill-after=10s 280s \
            node scripts/run-vitest.mjs \
            test/scripts/test-live-shard.test.ts \
            --maxWorkers=1 --reporter=verbose --reporter=json \
            --outputFile.json "$RUNNER_TEMP/live-manifest-contract/inventory.json" \
            -t 'covers every native live test and tracks provider-filtered release fanout$' \
            2>&1 | tee "$RUNNER_TEMP/live-manifest-contract/inventory.log"
          test_exit=$?
          echo "exit_code=$test_exit" >> "$GITHUB_OUTPUT"
          echo "Inventory command exit: $test_exit" | tee -a "$RUNNER_TEMP/live-manifest-contract/inventory.log"
          exit "$test_exit"

      - name: Run exact live plugin config contract case
        id: contract
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
          OPENCLAW_CI_TEST_RUNTIME_POLICY: node
          OPENCLAW_VITEST_MAX_WORKERS: "1"
          OPENCLAW_VITEST_PRINT_IMPORT_BREAKDOWN: "1"
        run: |
          set -uo pipefail
          set +e
          timeout --signal=TERM --kill-after=10s 280s \
            node scripts/run-vitest.mjs \
            src/plugins/contracts/boundary-invariants.test.ts \
            --maxWorkers=1 --reporter=verbose --reporter=json \
            --outputFile.json "$RUNNER_TEMP/live-manifest-contract/contract.json" \
            -t 'keeps long-lived bundled hook handlers on live runtime config lookups$' \
            2>&1 | tee "$RUNNER_TEMP/live-manifest-contract/contract.log"
          test_exit=$?
          echo "exit_code=$test_exit" >> "$GITHUB_OUTPUT"
          echo "Contract command exit: $test_exit" | tee -a "$RUNNER_TEMP/live-manifest-contract/contract.log"
          exit "$test_exit"

      - name: Record outcomes and verify unchanged tracked source
        if: ${{ always() }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          INVENTORY_OUTCOME: ${{ steps.inventory.outcome }}
          INVENTORY_EXIT: ${{ steps.inventory.outputs.exit_code }}
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
          CONTRACT_EXIT: ${{ steps.contract.outputs.exit_code }}
        run: |
          set -uo pipefail
          proof_dir="$RUNNER_TEMP/live-manifest-contract"
          mkdir -p "$proof_dir"
          source_outcome=failure
          if test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" && git diff --quiet HEAD --; then
            source_outcome=success
          fi
          report_outcome=failure
          if node --input-type=module <<'SELECTED_TESTS' | tee "$proof_dir/selected-tests.jsonl"
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import path from "node:path";

          const cases = [
            {
              name: "inventory",
              file: "test/scripts/test-live-shard.test.ts",
              expectedNames: ["scripts/test-live-shard covers every native live test and tracks provider-filtered release fanout"],
            },
            {
              name: "contract",
              file: "src/plugins/contracts/boundary-invariants.test.ts",
              expectedNames: ["plugin contract boundary invariants keeps long-lived bundled hook handlers on live runtime config lookups"],
            },
          ];
          for (const { name, file, expectedNames } of cases) {
            const report = JSON.parse(readFileSync(path.join(process.env.RUNNER_TEMP, "live-manifest-contract", `${name}.json`), "utf8"));
            assert.equal(report.success, true, `${name}: successful report`);
            assert.equal(report.testResults.length, 1, `${name}: one test file`);
            assert.equal(report.numPassedTests, expectedNames.length, `${name}: exact passed count`);
            assert.equal(report.numFailedTests, 0, `${name}: no failed tests`);
            assert.equal(report.numFailedTestSuites, 0, `${name}: no failed suites`);
            const result = report.testResults[0];
            assert.equal(result.name, path.resolve(file), `${name}: expected test file`);
            assert.equal(result.status, "passed", `${name}: file passed`);
            const selected = result.assertionResults.filter((entry) => expectedNames.includes(entry.fullName));
            assert.deepEqual(selected.map((entry) => entry.fullName).sort(), [...expectedNames].sort(), `${name}: exact selected names`);
            assert.deepEqual(result.assertionResults.filter((entry) => entry.status === "passed").map((entry) => entry.fullName).sort(), [...expectedNames].sort(), `${name}: exact passed names`);
            for (const entry of selected) {
              assert.equal(entry.status, "passed", entry.fullName);
            }
            console.log(JSON.stringify({ proof: name, selected: selected.length, passed: report.numPassedTests, failed: report.numFailedTests, fullNames: expectedNames }));
          }
          SELECTED_TESTS
          then
            report_outcome=success
          fi
          {
            echo "Setup: $SETUP_OUTCOME"
            echo "Native live inventory: $INVENTORY_OUTCOME (command exit ${INVENTORY_EXIT:-not recorded})"
            echo "Live plugin config contract: $CONTRACT_OUTCOME (command exit ${CONTRACT_EXIT:-not recorded})"
            echo "Exact JSON results (inventory 1 passed, contract 1 passed): $report_outcome"
            echo "Unchanged tracked source at candidate: $source_outcome"
          } | tee "$proof_dir/outcomes.txt"
          cat "$proof_dir/outcomes.txt" >> "$GITHUB_STEP_SUMMARY"
          test "$SETUP_OUTCOME" = success && \
            test "$INVENTORY_OUTCOME" = success && \
            test "$CONTRACT_OUTCOME" = success && \
            test "$report_outcome" = success && \
            test "$source_outcome" = success

      - name: Preserve proof logs and JSON reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-live-manifest-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-manifest-contract/
          if-no-files-found: warn
          retention-days: 14
