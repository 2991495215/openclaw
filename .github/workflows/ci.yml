name: Red-main exact cron persistence proof
run-name: Cron persistence proof ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Reviewed full candidate commit SHA
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-cron-persistence-proof-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  cron-persistence:
    name: Complete cron model forwarding and session state files
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          mkdir -p .artifacts/cron-persistence-proof
          node --input-type=module -e 'console.log(JSON.stringify({ candidate: process.env.EXPECTED_SHA, workflow: process.env.WORKFLOW_SHA, runtime: "node", files: ["src/cron/isolated-agent/run.cron-model-override-forwarding.test.ts", "src/cron/isolated-agent/run-session-state.test.ts"] }, null, 2))' > .artifacts/cron-persistence-proof/provenance.json
          echo "Candidate: $actual_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow: $WORKFLOW_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          restore-test-caches: "true"

      - name: Run complete cron persistence files
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          /usr/bin/time -p pnpm test \
            src/cron/isolated-agent/run.cron-model-override-forwarding.test.ts \
            src/cron/isolated-agent/run-session-state.test.ts \
            --maxWorkers=1 --reporter=verbose \
            2>&1 | tee .artifacts/cron-persistence-proof/tests.log

      - name: Preserve test log and exact source provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cron-persistence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/cron-persistence-proof/
          if-no-files-found: warn
          retention-days: 14
