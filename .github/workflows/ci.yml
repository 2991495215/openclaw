# PROOF ONLY: diagnosed full-tree export failure; never merge this workflow.
name: Red-main Session exports and lazy header
run-name: Session exports and lazy header ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
      workflow_sha:
        description: Exact proof workflow commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-session-header-proof
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.19.0"
jobs:
  session-header-proof:
    name: Diagnosed exports and header failures
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pinned candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a024f7f03af45889af55848f5b5bbb5c1df11506
          fetch-depth: 3
          persist-credentials: false
      - name: Record source provenance
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a024f7f03af45889af55848f5b5bbb5c1df11506
          git diff --exit-code HEAD --
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          mkdir -p "$RUNNER_TEMP/session-header-proof"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git diff --stat HEAD~2 HEAD
            git ls-tree HEAD -- package.json pnpm-lock.yaml src/config/sessions/session-history-budget-state.ts src/config/sessions/session-accessor.sqlite-maintenance-store.ts ui/src/pages/chat/components/chat-pane-header.test.ts config/knip.all-exports.config.ts scripts/check-deadcode-exports.mts
          } | tee "$RUNNER_TEMP/session-header-proof/provenance.txt"
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
          node-compile-cache: "true"
      - name: Check changed helper
        shell: bash
        run: |
          set -euo pipefail
          node_modules/.bin/oxfmt --check --threads=1 src/config/sessions/session-history-budget-state.ts src/config/sessions/session-accessor.sqlite-maintenance-store.ts ui/src/pages/chat/components/chat-pane-header.test.ts
          node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.json src/config/sessions/session-history-budget-state.ts src/config/sessions/session-accessor.sqlite-maintenance-store.ts ui/src/pages/chat/components/chat-pane-header.test.ts
          git diff --check HEAD~2 HEAD
      - name: Replay diagnosed export and UI checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess, time
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'session-header-proof'
          common = ['pnpm', 'dlx', '--package', 'knip@6.32.2', 'knip', '--no-progress', '--reporter', 'compact', '--include', 'exports,nsExports,types,nsTypes,enumMembers,namespaceMembers', '--no-config-hints']
          commands = {
            'production-exports': common + ['--config', 'config/knip.config.ts', '--production'],
            'all-exports': common + ['--config', 'config/knip.all-exports.config.ts'],
            'header': ['pnpm', '--dir', 'ui', 'test', 'src/pages/chat/components/chat-pane-header.test.ts', '--maxWorkers=1', '-t', 'renders the bounded static participant facepile beside the owner'],
          }
          results = {}
          for name, command in commands.items():
              started = time.monotonic()
              with (proof / (name + '.log')).open('w', encoding='utf-8') as log:
                  process = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, encoding='utf-8', errors='replace')
                  for line in process.stdout:
                      print(line, end='', flush=True)
                      log.write(line)
                  result = process.wait()
              results[name] = {'exit_code': result, 'elapsed_seconds': time.monotonic() - started, 'command': command}
              (proof / 'execution.json').write_text(json.dumps(results, indent=2) + '\n')
          print(json.dumps(results))
          raise SystemExit(int(any(r['exit_code'] for r in results.values())))
          PYTHON
      - name: Verify unchanged sources
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a024f7f03af45889af55848f5b5bbb5c1df11506
          git status --short
          git diff --exit-code HEAD --
      - name: Preserve proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-session-header-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/session-header-proof/
          if-no-files-found: warn
          retention-days: 14
