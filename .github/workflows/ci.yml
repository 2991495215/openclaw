name: Red-main provider boolean parity proof
run-name: Provider boolean parity ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Reviewed full candidate commit SHA
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-provider-boolean-parity-proof-${{ github.ref }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  provider-parity-regressions:
    name: Provider auth parity regressions (exact candidate)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          echo "Candidate: $actual_sha"
          echo "Workflow: $WORKFLOW_SHA"
          echo "Candidate: $actual_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow: $WORKFLOW_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"

      - name: Run complete provider parity and consent regression files
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          mkdir -p .artifacts/provider-boolean-parity
          test_files=(
            test/plugins/bundled-provider-auth-literal-parity.test.ts
            test/plugins/bundled-provider-auth-literal-parity.2.test.ts
            test/plugins/bundled-provider-auth-literal-parity.3.test.ts
            extensions/llama-cpp/src/setup.non-interactive.test.ts
          )
          test_failures=0
          for test_file in "${test_files[@]}"; do
            log_name="${test_file##*/}"
            echo "::group::${test_file}"
            if pnpm test "$test_file" --maxWorkers=1 2>&1 | tee ".artifacts/provider-boolean-parity/${log_name}.log"; then
              echo "PASS: $test_file" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error title=Focused regression failed::${test_file} failed"
              echo "FAIL: $test_file" >> "$GITHUB_STEP_SUMMARY"
              test_failures=1
            fi
            echo "::endgroup::"
          done
          exit "$test_failures"

      - name: Preserve full regression log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-provider-boolean-parity-regressions-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/provider-boolean-parity/*.log
          if-no-files-found: warn
          retention-days: 14
