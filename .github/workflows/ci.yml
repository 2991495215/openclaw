name: Red-main preparation executable proof
run-name: Preparation executable ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full reviewed source repair SHA
        type: string
        required: true
      workflow_sha:
        description: Expected proof carrier SHA
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-preparation-executable
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.19.0"

jobs:
  preparation-executable:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      OPENCLAW_TEST_PROJECTS_PARALLEL: "1"
      OPENCLAW_VITEST_RUNTIME: node
      OPENCLAW_CI_TEST_RUNTIME_POLICY: node
    steps:
      - name: Checkout reviewed source repair
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify source and workflow provenance
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^)" = 218baa949d79658554d81b26f5f8f8a1171a7951
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = src/gateway/worker-environments/project-preparation-environment.test.ts
          git diff --exit-code HEAD --
          mkdir -p "$RUNNER_TEMP/preparation-executable"
          {
            git rev-parse HEAD HEAD^
            echo "$WORKFLOW_SHA"
            git ls-tree HEAD -- src/gateway/worker-environments/project-preparation-environment.test.ts src/gateway/worker-environments/node-toolchain.ts test/helpers/close-on-exec-copy.ts pnpm-lock.yaml
          } | tee "$RUNNER_TEMP/preparation-executable/provenance.txt"

      - name: Setup matching Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check Linux close-on-exec inheritance mechanism
        run: |
          python3 <<'PROBE'
          import errno, fcntl, json, os, pathlib, shutil, subprocess, tempfile
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'preparation-executable'
          with tempfile.TemporaryDirectory(dir=proof) as root:
              root = pathlib.Path(root)
              baseline = root / 'baseline-node'
              candidate = root / 'candidate-node'
              node = shutil.which('node')
              shutil.copy2(node, baseline)
              descriptor = os.open(baseline, os.O_WRONLY | os.O_CLOEXEC)
              assert fcntl.fcntl(descriptor, fcntl.F_GETFD) & fcntl.FD_CLOEXEC
              reader, writer = os.pipe()
              sibling = os.fork()
              if sibling == 0:
                  os.close(writer)
                  os.read(reader, 1)
                  os._exit(0)
              os.close(reader)
              os.close(descriptor)
              try:
                  try:
                      subprocess.run([str(baseline), '--version'], check=True)
                  except OSError as error:
                      assert error.errno == errno.ETXTBSY, error
                  else:
                      raise AssertionError('Inherited writable descriptor did not prevent exec')
                  script = 'const fs = require("node:fs"); fs.copyFileSync(process.execPath, process.argv[1], fs.constants.COPYFILE_FICLONE)'
                  subprocess.run([node, '-e', script, str(candidate)], check=True)
                  observed = subprocess.check_output([str(candidate), '-p', 'process.execPath'], text=True).strip()
                  assert observed == str(candidate), observed
                  result = {'synthetic_mechanism_probe': True, 'inherited_cloexec_handle': 'ETXTBSY', 'child_copy': 'executable at fixture-local path', 'natural_sibling': 'unknown'}
                  (proof / 'mechanism.json').write_text(json.dumps(result) + '\n')
                  print(json.dumps(result))
              finally:
                  os.close(writer)
                  _, child_status = os.waitpid(sibling, 0)
                  assert child_status == 0, child_status
          PROBE

      - name: Setup pinned pnpm
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: "off"

      - name: Install frozen dependencies
        env:
          CI: "true"
        run: pnpm install --frozen-lockfile --prefer-offline --config.ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true --config.side-effects-cache=true

      - name: Check changed test source
        run: |
          set -euo pipefail
          pnpm exec oxfmt --check src/gateway/worker-environments/project-preparation-environment.test.ts
          pnpm exec oxlint --threads=1 src/gateway/worker-environments/project-preparation-environment.test.ts
          git diff --check HEAD^

      - name: Prove exact declared parallel setup case
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/preparation-executable"
          test "$(node --version)" = v24.19.0
          node --import ./scripts/tsx.mjs scripts/test-projects.mts src/gateway/worker-environments/project-preparation-environment.test.ts -t 'fails declared parallel setup visibly after all branches settle and records the reason$' --maxWorkers=1 --reporter=verbose --reporter=json --outputFile.json "$proof_dir/candidate.json" 2>&1 | tee "$proof_dir/candidate.log"
          node --input-type=module <<'PROOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const dir = path.join(process.env.RUNNER_TEMP, 'preparation-executable');
          const report = JSON.parse(fs.readFileSync(path.join(dir, 'candidate.json'), 'utf8'));
          assert.equal(report.success, true);
          assert.equal(report.testResults.length, 1);
          const suite = report.testResults[0];
          assert.ok(suite.name.endsWith('/src/gateway/worker-environments/project-preparation-environment.test.ts'));
          const cases = suite.assertionResults;
          const passed = cases.filter(test => test.status === 'passed');
          assert.equal(passed.length, 1);
          assert.equal(passed[0].title, 'fails declared parallel setup visibly after all branches settle and records the reason');
          assert.ok(cases.every(test => ['passed', 'pending', 'skipped', 'todo'].includes(test.status)));
          console.log(JSON.stringify({ passed: passed.length, skipped: cases.length - passed.length }));
          PROOF
          git diff --exit-code HEAD --

      - name: Preserve preparation proof
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-preparation-executable-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/preparation-executable/
          if-no-files-found: error
          retention-days: 14
