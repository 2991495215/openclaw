# PROOF ONLY: three compiler fixture failures after metadata split; never merge.
name: Red-main runtime metadata native import proof
run-name: Runtime metadata native import proof ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
      workflow_sha:
        description: Exact proof workflow commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-runtime-metadata-proof
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.19.0"
jobs:
  runtime-metadata-proof:
    name: Runtime metadata native compiler boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pinned candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: da03e9b1ca933e63c5ea8b4e3b89becda5e57be3
          fetch-depth: 1
          persist-credentials: false
      - name: Record source provenance
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = da03e9b1ca933e63c5ea8b4e3b89becda5e57be3
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          mkdir -p "$RUNNER_TEMP/runtime-metadata-proof"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- package.json pnpm-lock.yaml src/infra/runtime-process-entrypoints.ts src/infra/runtime-process-manifest.ts src/infra/worker-diagnostic-script.ts test/scripts/fixtures/vitest-worker-compiler.mjs test/scripts/vitest-worker-artifacts.transforms.test.ts test/scripts/vitest-worker-shutdown.test.ts test/scripts/vitest-fork-shutdown.test.ts test/scripts/vitest-report-owner.test.ts src/infra/bun-sqlite-close-probe.test.ts
          } | tee "$RUNNER_TEMP/runtime-metadata-proof/provenance.txt"
      - name: Setup Node environment
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
          node-compile-cache: "true"
      - name: Check six changed files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          changed=(src/infra/runtime-process-entrypoints.ts src/infra/runtime-process-manifest.ts src/infra/worker-diagnostic-script.ts test/scripts/fixtures/vitest-worker-compiler.mjs test/scripts/vitest-worker-artifacts.transforms.test.ts test/scripts/vitest-worker-shutdown.test.ts)
          node_modules/.bin/oxfmt --check --threads=1 "${changed[@]}"
          node scripts/run-oxlint.mjs "${changed[@]}"
          git diff --check
      - name: Replay three failed compiler fixture cases
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.changed.outcome == 'success' }}
        shell: bash
        env:
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/runtime-metadata-proof"
          started="$(date +%s)"
          node scripts/run-vitest.mjs run --config test/vitest/vitest.tooling.config.ts test/scripts/vitest-worker-artifacts.transforms.test.ts test/scripts/vitest-worker-shutdown.test.ts --maxWorkers=1 --passWithNoTests=false --testNamePattern 'preserves filesystem transforms across fresh generations, source mode, and edits|^rejects a live borrower when its owner closes during verification$' --reporter=default --reporter=json --outputFile.json="$proof_dir/tooling.json" 2>&1 | tee "$proof_dir/tooling.log"
          echo "Compiler fixtures elapsed seconds: $(( $(date +%s) - started ))" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify exactly three passing cases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, pathlib
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'runtime-metadata-proof'
          expected = {
              'tooling': {'test/scripts/vitest-worker-artifacts.transforms.test.ts': 2, 'test/scripts/vitest-worker-shutdown.test.ts': 1},
          }
          receipts = {}
          for name, files in expected.items():
              data = json.loads((proof / (name + '.json')).read_text())
              results = data['testResults']
              assert len(results) == len(files), (name, results)
              executed = []
              for filename, count in files.items():
                  result, = [r for r in results if r['name'].endswith('/' + filename)]
                  cases = [case for case in result['assertionResults'] if case['status'] not in ('pending', 'skipped', 'todo', 'disabled')]
                  assert len(cases) == count, (filename, cases)
                  assert all(case['status'] == 'passed' for case in cases), cases
                  executed += cases
              assert data['success'] and data['numPassedTests'] == sum(files.values()) and data['numFailedTests'] == 0, data
              assert data.get('numRuntimeErrorTestSuites', 0) == 0, data
              receipts[name] = {'executed': len(executed), 'passed': len(executed), 'failed': 0, 'selected': [case['fullName'] for case in executed], 'duration_ms': sum(case.get('duration', 0) for case in executed), 'unrelated_skipped': data.get('numPendingTests', 0)}
          assert sum(r['executed'] for r in receipts.values()) == 3
          text = json.dumps(receipts, indent=2)
          (proof / 'case-counts.json').write_text(text + '\n')
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('```json\n' + text + '\n```\n')
          PYTHON
      - name: Verify unchanged sources
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = da03e9b1ca933e63c5ea8b4e3b89becda5e57be3
          git status --short
          git diff --exit-code HEAD --
      - name: Preserve proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-runtime-metadata-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-metadata-proof/
          if-no-files-found: warn
          retention-days: 14
