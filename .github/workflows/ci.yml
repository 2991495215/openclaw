# PROOF ONLY: one exact failing case on its immutable original base; never merge this workflow.
name: Red-main finalizer diagnostic baseline
run-name: Finalizer diagnostic baseline 9650b2c4bb5f ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-finalizer-diagnostic-baseline-proof
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  finalizer-diagnostic-baseline-proof:
    name: One original finalizer diagnostic regression
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout pinned baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 9650b2c4bb5f6c557de4ba4633bb746e783fa5b9
          fetch-depth: 1
          persist-credentials: false

      - name: Record baseline sources
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9650b2c4bb5f6c557de4ba4633bb746e783fa5b9
          proof_dir="$RUNNER_TEMP/finalizer-diagnostic-baseline-proof"
          mkdir -p "$proof_dir"
          {
            echo "Baseline: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- src/agents/bash-tools.process.e2e.test.ts src/agents/bash-tools.exec-runtime.ts src/agents/bash-tools.exec-notify.ts src/agents/bash-tools.exec-settlement.ts src/logging/redact.ts test/vitest/vitest.e2e.config.ts
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
          node-compile-cache: "true"

      - name: Run original finalizer diagnostic case
        id: finalizer_case
        if: ${{ !cancelled() }}
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          node scripts/run-vitest.mjs run --config test/vitest/vitest.e2e.config.ts src/agents/bash-tools.process.e2e.test.ts --maxWorkers=1 -t 'keeps post-exit finalizer failure truthful across a real background child, notification, and waiting poll' --reporter=verbose 2>&1 | python3 -u -c 'import re, sys; sys.stdout.writelines(re.sub(r"sk-[A-Za-z0-9_-]+", "[SYNTHETIC KEY REDACTED]", line) for line in sys.stdin)' | tee "$RUNNER_TEMP/finalizer-diagnostic-baseline-proof/finalizer-case.log"

      - name: Verify unchanged sources
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --exit-code

      - name: Preserve proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-finalizer-diagnostic-baseline-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/finalizer-diagnostic-baseline-proof/
          if-no-files-found: warn
          retention-days: 14
