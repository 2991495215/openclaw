# Focused coverage fallback: ordinary PR CI omitted the full-tree unused-file scan.
# Setup owner: status-usage-focused-workflow.yml. No private QA runtime is needed.
name: Red-main Bun unused-file proof
run-name: Bun unused-file d79c87980ff4 ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-bun-unused-files-proof-d79c87980ff4
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  bun-unused-files-proof:
    name: Bun full-tree unused-file scan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d79c87980ff41b2218803b907201de9cfa164ff6
          fetch-depth: 1
          persist-credentials: false

      - name: Record candidate sources
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d79c87980ff41b2218803b907201de9cfa164ff6
          proof_dir="$RUNNER_TEMP/bun-unused-files-proof"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- src/infra/sqlite-existing-database.bun.test.ts src/infra/sqlite-existing-database.bun.test-support.ts scripts/check-deadcode-unused-files.mts scripts/deadcode-knip-runner.mts config/knip.all-exports.config.ts
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
          node-compile-cache: "true"

      - name: Run full-tree unused-file scan
        id: bun_unused_files
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
        run: |
          set -euo pipefail
          pnpm dlx --package knip@6.32.2 knip --no-progress --reporter compact --files --no-config-hints --config config/knip.all-exports.config.ts 2>&1 | tee "$RUNNER_TEMP/bun-unused-files-proof/bun-unused-files-cases.log"

      - name: Record outcome and verify unchanged sources
        if: ${{ always() }}
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.bun_unused_files.outcome }}
        run: |
          set -euo pipefail
          echo "Bun full-tree unused-file scan: $TEST_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          git status --short
          git diff --exit-code -- src/infra/sqlite-existing-database.bun.test.ts src/infra/sqlite-existing-database.bun.test-support.ts scripts/check-deadcode-unused-files.mts scripts/deadcode-knip-runner.mts config/knip.all-exports.config.ts

      - name: Preserve proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-bun-unused-files-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bun-unused-files-proof/
          if-no-files-found: warn
          retention-days: 14
