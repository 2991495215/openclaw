name: Red-main exact Workboard manifest generation
run-name: Workboard manifest ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full source commit SHA to regenerate
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
      expect_manifest_change:
        description: Expect the first build to repair a stale committed manifest
        type: boolean
        default: true
        required: false

permissions:
  contents: read

concurrency:
  group: redmain-workboard-manifest-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"
  GIT_NO_LAZY_FETCH: "1"

jobs:
  generate:
    name: Canonical Workboard generation and idempotency
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p "$RUNNER_TEMP/workboard-manifest-proof"
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/workboard-manifest-proof/checkout-status.txt"
          test ! -s "$RUNNER_TEMP/workboard-manifest-proof/checkout-status.txt"
          echo "Source: $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow: $WORKFLOW_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"

      - name: Regenerate with the canonical Workboard builder
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECT_MANIFEST_CHANGE: ${{ inputs.expect_manifest_change }}
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/workboard-manifest-proof"
          manifest="extensions/workboard/openclaw.plugin.json"
          git status --porcelain --untracked-files=all > "$proof_dir/prebuild-status.txt"
          test ! -s "$proof_dir/prebuild-status.txt"
          cp "$manifest" "$proof_dir/baseline-openclaw.plugin.json"
          node --import ./scripts/tsx.mjs scripts/build-plugin-control-ui.mts extensions/workboard \
            2>&1 | tee "$proof_dir/generation-first.log"
          cp "$manifest" "$proof_dir/generated-openclaw.plugin.json"
          git diff --binary -- "$manifest" > "$proof_dir/manifest.patch"
          git status --porcelain --untracked-files=all > "$proof_dir/first-status.txt"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'workboard-manifest-proof'
          manifest = 'extensions/workboard/openclaw.plugin.json'
          entries = subprocess.check_output(['git', 'status', '--porcelain', '-z', '--untracked-files=all']).decode().split('\0')
          entries = [entry for entry in entries if entry]
          expected_dirty = os.environ['EXPECT_MANIFEST_CHANGE'] == 'true'
          assert entries == ([f' M {manifest}'] if expected_dirty else []), entries
          baseline = (proof / 'baseline-openclaw.plugin.json').read_bytes()
          generated = (proof / 'generated-openclaw.plugin.json').read_bytes()
          before = json.loads(baseline)
          after = json.loads(generated)
          old_control_ui = before.pop('controlUi')
          new_control_ui = after.pop('controlUi')
          assert before == after, 'Generation changed non-Control-UI manifest metadata'
          assert (old_control_ui != new_control_ui) == expected_dirty
          receipt = {
            'sourceSha': os.environ['EXPECTED_SHA'],
            'workflowSha': os.environ['WORKFLOW_SHA'],
            'expectedManifestChange': expected_dirty,
            'canonicalCommand': 'node --import ./scripts/tsx.mjs scripts/build-plugin-control-ui.mts extensions/workboard',
            'baselineSha256': hashlib.sha256(baseline).hexdigest(),
            'generatedSha256': hashlib.sha256(generated).hexdigest(),
            'oldControlUi': old_control_ui,
            'newControlUi': new_control_ui,
            'sourceStatusAfterFirstBuild': entries,
            'otherManifestMetadataUnchanged': True,
          }
          (proof / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY

      - name: Verify second generation is identical
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/workboard-manifest-proof"
          node --import ./scripts/tsx.mjs scripts/build-plugin-control-ui.mts extensions/workboard \
            2>&1 | tee "$proof_dir/generation-second.log"
          cmp extensions/workboard/openclaw.plugin.json "$proof_dir/generated-openclaw.plugin.json"
          git diff --binary -- extensions/workboard/openclaw.plugin.json > "$proof_dir/second-manifest.patch"
          cmp "$proof_dir/manifest.patch" "$proof_dir/second-manifest.patch"
          git status --porcelain --untracked-files=all > "$proof_dir/second-status.txt"
          cmp "$proof_dir/first-status.txt" "$proof_dir/second-status.txt"
          git diff --check
          python3 - <<'PY'
          import json, os, pathlib
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'workboard-manifest-proof'
          receipt_path = proof / 'receipt.json'
          receipt = json.loads(receipt_path.read_text())
          receipt['secondGenerationIdentical'] = True
          receipt_path.write_text(json.dumps(receipt, indent=2) + '\n')
          PY
          echo 'Canonical Workboard generation repeated with identical manifest bytes and source status.' >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve generated manifest and proof
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-workboard-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workboard-manifest-proof/
          if-no-files-found: error
          retention-days: 14
