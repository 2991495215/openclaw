# Focused coverage fallback: ordinary CI did not provide a located outcome for this case.
# Setup owner: status-usage-focused-workflow.yml. No private QA runtime is needed.
name: Red-main native consent proof
run-name: Native consent a98eaf10ecf23 ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-native-consent-proof-a98eaf10ecf23
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  native-consent-proof:
    name: Reject replacement database before first-send consent creation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a98eaf10ecf23b194e7b4c722012added4d2c8ed
          fetch-depth: 1
          persist-credentials: false

      - name: Record candidate sources
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a98eaf10ecf23b194e7b4c722012added4d2c8ed
          proof_dir="$RUNNER_TEMP/native-consent-proof"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- src/config/sessions/session-accessor.reset.ts src/gateway/server-methods/chat-send-session.ts src/gateway/server-methods/chat.native-runtime-consent.test.ts
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "true"
          vitest-worker-cache: "false"
          node-compile-cache: "true"

      - name: Run exact failing native-consent case
        id: consent_case
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          pnpm test src/gateway/server-methods/chat.native-runtime-consent.test.ts --maxWorkers=1 --reporter=verbose -t "rejects first-send consent when its captured database owner is replaced" 2>&1 | tee "$RUNNER_TEMP/native-consent-proof/native-consent-case.log"

      - name: Record outcome and verify unchanged sources
        if: ${{ always() }}
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.consent_case.outcome }}
        run: |
          set -euo pipefail
          echo "Native-consent exact case: $TEST_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          git status --short
          git diff --exit-code -- src/config/sessions/session-accessor.reset.ts src/gateway/server-methods/chat-send-session.ts src/gateway/server-methods/chat.native-runtime-consent.test.ts

      - name: Preserve proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-native-consent-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-consent-proof/
          if-no-files-found: warn
          retention-days: 14
