# Temporary diagnosis only. Never merge this workflow or its instrumentation.
name: Red-main QA plugin entry diagnosis
run-name: QA plugin entry diagnosis ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      workflow_sha:
        description: Expected proof workflow commit
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-qa-bundle-entry-${{ github.ref }}
  cancel-in-progress: false
env:
  SOURCE_SHA: 2e084ea7cb6232dfb893cf02b9b4ee2df10d1394
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  focused:
    name: Original Gateway smoke with plugin-output trace
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout failed scheduled source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2e084ea7cb6232dfb893cf02b9b4ee2df10d1394
          persist-credentials: false
      - name: Record source and add diagnostic trace
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          mkdir -p .artifacts/qa-bundle-entry
          {
            echo "Source: $SOURCE_SHA"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- scripts/run-node.mts scripts/lib/bundled-plugin-build-entries.mjs \
              scripts/build-external-plugin-local-dist.mts scripts/copy-bundled-plugin-metadata.mts \
              extensions/qa-lab/src/gateway-child-setup.ts extensions/qa-lab/src/gateway-child-command.ts
          } | tee .artifacts/qa-bundle-entry/provenance.log
          cat > .artifacts/qa-bundle-entry/diagnostic.patch <<'PATCH'
          --- a/scripts/run-node.mts
          +++ b/scripts/run-node.mts
          @@ -311,7 +311,27 @@
             return latestInputMtime != null && latestInputMtime > stampMtime;
           };
 
          +// Temporary diagnostic, never a production repair.
          +const recordQaEntryDiagnostic = (
          +  deps: RunNodeRequirementDeps,
          +  phase: string,
          +  missingRuntime?: string[],
          +) => {
          +  const qaDeps = { ...deps, env: { ...deps.env, OPENCLAW_BUILD_PRIVATE_QA: "1" } };
          +  const missing = collectRunNodeBundledPluginBuildEntries(qaDeps).flatMap((entry) =>
          +    listBundledPluginRuntimeEntryPaths(entry, qaDeps)
          +      .filter((file) => !deps.fs.existsSync(file))
          +      .map((file) => path.relative(deps.cwd, file)),
          +  );
          +  const directory = path.join(deps.cwd, ".artifacts");
          +  fs.mkdirSync(directory, { recursive: true });
          +  fs.appendFileSync(path.join(directory, "redmain-qa-entry.jsonl"), JSON.stringify({
          +    phase, pid: process.pid, privateQa: deps.env.OPENCLAW_BUILD_PRIVATE_QA ?? null, missing, missingRuntime,
          +  }) + "\n");
          +};
          +
           const hasMissingBuiltBundledPluginRuntimeEntryOutput = (deps: RunNodeRequirementDeps) => {
          +  recordQaEntryDiagnostic(deps, "entry-check");
             return collectRunNodeBundledPluginBuildEntries(deps).some((pluginEntry) => {
               const entryPaths = listBundledPluginRuntimeEntryPaths(pluginEntry, deps);
               return entryPaths.some((filePath) => !deps.fs.existsSync(filePath));
          @@ -374,6 +394,7 @@
                     path.relative(distExtensionsRoot, entryPath),
                   );
                   if (statMtime(runtimePath, deps.fs) == null) {
          +          recordQaEntryDiagnostic(deps, "missing-runtime-overlay", [path.relative(deps.cwd, runtimePath)]);
                     return true;
                   }
                 }
          @@ -474,6 +495,13 @@
               listRequiredStaticExtensionAssetOutputs(deps),
               listRequiredBundledPluginMetadataOutputs(builtPluginEntries, deps),
             ];
          +  recordQaEntryDiagnostic(
          +    deps,
          +    "runtime-output-check",
          +    requiredOutputGroups.flatMap((outputs) => outputs
          +      .filter((filePath) => statMtime(filePath, deps.fs) == null)
          +      .map((filePath) => path.relative(deps.cwd, filePath))),
          +  );
             return (
               requiredOutputGroups.some((outputs) =>
                 outputs.some((filePath) => statMtime(filePath, deps.fs) == null),
          @@ -1436,7 +1464,9 @@
 
           const syncRuntimeArtifacts = async (deps: RunNodeDeps) => {
             try {
          +    recordQaEntryDiagnostic(deps, "postbuild-before");
               await deps.runRuntimePostBuild({ cwd: deps.cwd, env: deps.env });
          +    recordQaEntryDiagnostic(deps, "postbuild-after");
             } catch (error) {
               logRunner(`Failed to write runtime build artifacts: ${getErrorMessage(error)}`, deps);
               return false;
          @@ -1717,6 +1747,7 @@
                 return await finishRun(exitCode);
               }
               const buildRequirement = resolveBuildRequirement(deps);
          +    recordQaEntryDiagnostic(deps, `build-decision:${buildRequirement.reason}`);
               const immutableDeployment = isImmutableGitDeployment(deps);
               if (immutableDeployment && buildRequirement.shouldBuild) {
                 return await finishRun(
          @@ -1739,6 +1770,7 @@
               }
               if (!buildRequirement.shouldBuild) {
                 const runtimePostBuildRequirement = resolveRuntimePostBuildRequirement(deps);
          +      recordQaEntryDiagnostic(deps, `runtime-decision:${runtimePostBuildRequirement.reason}`);
                 if (immutableDeployment && runtimePostBuildRequirement.shouldSync) {
                   return await finishRun(
                     refuseImmutableDeploymentMutation(
          @@ -1778,6 +1810,7 @@
                 const lockedBuildRequirement = resolveBuildRequirement(deps);
                 if (!lockedBuildRequirement.shouldBuild) {
                   const runtimePostBuildRequirement = resolveRuntimePostBuildRequirement(deps);
          +        recordQaEntryDiagnostic(deps, `runtime-decision:${runtimePostBuildRequirement.reason}`);
                   if (!runtimePostBuildRequirement.shouldSync) {
                     return 0;
                   }
          PATCH
          git apply --check .artifacts/qa-bundle-entry/diagnostic.patch
          git apply .artifacts/qa-bundle-entry/diagnostic.patch
          # A clean temporary diagnostic commit preserves normal source-runner admission.
          # Leaving instrumentation dirty would itself force a build and spoil diagnosis.
          git add scripts/run-node.mts
          git -c user.name='Peter Steinberger' -c user.email='steipete@gmail.com' \
            commit -m 'test(qa): diagnose missing plugin build artifacts'
          git rev-parse HEAD | tee .artifacts/qa-bundle-entry/diagnostic-head.txt
          git diff --exit-code HEAD --
          sha256sum scripts/run-node.mts > .artifacts/qa-bundle-entry/instrumented.sha256
      - name: Setup frozen Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
      - name: Build exact QA runtime profile once
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.19.0
          OPENCLAW_BUILD_PRIVATE_QA=1 pnpm build qaRuntime 2>&1 | tee .artifacts/qa-bundle-entry/build.log
          node --input-type=module <<'JS' | tee .artifacts/qa-bundle-entry/post-build.json
          import fs from 'node:fs';
          import path from 'node:path';
          import { collectSourceCheckoutPluginBuildEntries } from './scripts/lib/bundled-plugin-build-entries.mjs';
          const entries = collectSourceCheckoutPluginBuildEntries({env: {...process.env, OPENCLAW_BUILD_PRIVATE_QA: '1'}});
          const expected = entries.flatMap(e => e.sourceEntries.map(s => path.join('dist/extensions', e.id, s.replace(/^\.\//, '').replace(/\.[^.]+$/, e.runtimeExtension))));
          console.log(JSON.stringify({phase: 'after-build', expectedCount: expected.length, missing: expected.filter(p => !fs.existsSync(p))}));
          JS
      - name: Run only the failed Gateway smoke scenario
        shell: bash
        env:
          OPENCLAW_BUILD_PRIVATE_QA: "1"
          OPENCLAW_ENABLE_PRIVATE_QA_CLI: "1"
          OPENCLAW_DISABLE_BUNDLED_PLUGINS: "0"
          OPENCLAW_QA_REDACT_PUBLIC_METADATA: "1"
          OPENCLAW_QA_TRANSPORT_READY_TIMEOUT_MS: "180000"
          NODE_OPTIONS: --max-old-space-size=16384
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 10m node openclaw.mjs qa run \
            --repo-root . --qa-profile smoke-ci --concurrency 10 \
            --output-dir .artifacts/qa-bundle-entry/scenario --scenario gateway-smoke \
            2>&1 | tee .artifacts/qa-bundle-entry/test.log
      - name: Preserve instrumented source and print output trace
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          if test -f .artifacts/qa-bundle-entry/instrumented.sha256; then
            sha256sum -c .artifacts/qa-bundle-entry/instrumented.sha256
          fi
          if test -f .artifacts/redmain-qa-entry.jsonl; then
            cp .artifacts/redmain-qa-entry.jsonl .artifacts/qa-bundle-entry/output-trace.jsonl
            cat .artifacts/qa-bundle-entry/output-trace.jsonl
          fi
          git status --porcelain=v1 > .artifacts/qa-bundle-entry/final-source-status.txt
      - name: Preserve focused diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-qa-bundle-entry-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/qa-bundle-entry/*.log
            .artifacts/qa-bundle-entry/*.json
            .artifacts/qa-bundle-entry/*.jsonl
            .artifacts/qa-bundle-entry/*.txt
            .artifacts/qa-bundle-entry/*.sha256
            .artifacts/qa-bundle-entry/*.patch
            .artifacts/qa-bundle-entry/scenario/qa-evidence.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
