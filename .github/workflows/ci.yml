name: Red-main exact maintenance authority proof
run-name: Maintenance authority ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Reviewed full candidate commit SHA
        type: string
        required: true
        default: cb2a4051a2b49d43c3e7b94670a8131dc1a2020e
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-maintenance-authority-proof-${{ github.ref }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  maintenance-authority-regressions:
    name: Maintenance requester authority (exact candidate, both cases)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          echo "Candidate: $actual_sha"
          echo "Workflow: $WORKFLOW_SHA"
          echo "Candidate: $actual_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow: $WORKFLOW_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"

      - name: Run complete maintenance requester authority file
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          mkdir -p .artifacts/maintenance-authority
          test_exit=0
          proof_start=$SECONDS
          echo "::group::Complete maintenance requester authority file (configured-owner, profile)"
          if pnpm test src/commands/doctor-maintenance.requester-authority.test.ts --maxWorkers=1 2>&1 | tee .artifacts/maintenance-authority/doctor-maintenance.requester-authority.test.ts.log; then
            echo "PASS: complete maintenance requester authority file ($((SECONDS - proof_start)) wall seconds)" >> "$GITHUB_STEP_SUMMARY"
          else
            test_exit=$?
            echo "::error title=Maintenance requester authority regression failed::The complete maintenance requester authority test file failed"
            echo "FAIL: complete maintenance requester authority file ($((SECONDS - proof_start)) wall seconds)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "::endgroup::"
          echo "Total focused test wall time: $((SECONDS - proof_start)) seconds" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_exit"

      - name: Preserve full regression log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-maintenance-authority-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/maintenance-authority/*.log
          if-no-files-found: warn
          retention-days: 14
