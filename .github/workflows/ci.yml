# PROOF ONLY: original failing update restart cases; never merge this workflow.
name: Red-main update restart fixture
run-name: Update restart fixture 6772d6f6 ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
      workflow_sha:
        description: Exact proof workflow commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-update-restart-fixture-proof
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"
jobs:
  update-restart-fixture-proof:
    name: Original nine update restart failures
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pinned candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 6772d6f6464b337141571c3ec8d77be3a04bc101
          fetch-depth: 1
          persist-credentials: false
      - name: Record candidate sources
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 6772d6f6464b337141571c3ec8d77be3a04bc101
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          mkdir -p "$RUNNER_TEMP/update-restart-fixture-proof"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- package.json pnpm-lock.yaml scripts/tests/update-restart-module-outcome.mjs scripts/tests/update-restart-swap-fixture.mjs src/infra/acquire-with-wait.ts src/cli/update-cli/update-command-result.ts src/cli/update-cli/update-command-post-update.ts src/cli/update-cli/update-command-terminal.ts
          } | tee "$RUNNER_TEMP/update-restart-fixture-proof/provenance.txt"
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
          node-compile-cache: "true"
      - name: Check changed fixture
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec oxfmt --check --threads=1 scripts/tests/update-restart-module-outcome.mjs
          node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.scripts.json scripts/tests/update-restart-module-outcome.mjs
          git diff --check
      - name: Prove original nine failed cases
        if: ${{ !cancelled() }}
        shell: bash
        env:
          FAILED_CASES: '^(?:production\ finishUpdate:\ in\-root\ ENOENT\ JS\ chunk\ retains\ transaction\ backup|production\ finishUpdate:\ in\-root\ ERR_MODULE_NOT_FOUND\ retains\ transaction\ backup|production\ finishUpdate:\ unrelated\ module\ retains\ transaction\ backup|production\ finishUpdate:\ in\-root\ missing\ data\ file\ retains\ transaction\ backup|production\ finishUpdate\ authorizes\ backup\ retirement\ only\ after\ verified\ success|accepted\ restart\ without\ healthy\ successor\ cannot\ authorize\ retirement|filesystem\ swap:\ missing\-module\ cannot\ retire\ an\ unverified\ backup|filesystem\ swap:\ ENOENT\ cannot\ retire\ an\ unverified\ backup|filesystem\ swap:\ verified\-result\-control\ cannot\ retire\ an\ unverified\ backup)$'
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.21.0
          proof_dir="$RUNNER_TEMP/update-restart-fixture-proof"
          started="$(date +%s)"
          node --experimental-vm-modules --test-reporter=tap --test-name-pattern "$FAILED_CASES" --test scripts/tests/update-restart-module-outcome.mjs 2>&1 | tee "$proof_dir/native.tap"
          echo "Exact nine cases elapsed seconds: $(( $(date +%s) - started ))" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify exact executed and passed cases
        if: ${{ !cancelled() }}
        shell: bash
        env:
          EXPECTED_CASES: '["production finishUpdate: in-root ENOENT JS chunk retains transaction backup", "production finishUpdate: in-root ERR_MODULE_NOT_FOUND retains transaction backup", "production finishUpdate: unrelated module retains transaction backup", "production finishUpdate: in-root missing data file retains transaction backup", "production finishUpdate authorizes backup retirement only after verified success", "accepted restart without healthy successor cannot authorize retirement", "filesystem swap: missing-module cannot retire an unverified backup", "filesystem swap: ENOENT cannot retire an unverified backup", "filesystem swap: verified-result-control cannot retire an unverified backup"]'
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, pathlib, re
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'update-restart-fixture-proof'
          log = (proof / 'native.tap').read_text()
          expected = json.loads(os.environ['EXPECTED_CASES'])
          passed = re.findall(r'^ok [0-9]+ - (.+)$', log, re.M)
          assert len(passed) == 9 and set(passed) == set(expected), passed
          for key, count in (('tests', 9), ('pass', 9), ('fail', 0), ('cancelled', 0), ('skipped', 0)):
              assert re.findall(r'^# ' + key + r' ([0-9]+)$', log, re.M) == [str(count)], key
          receipt = {'executed': 9, 'passed': 9, 'failed': 0, 'skipped': 0, 'selected': passed}
          text = json.dumps(receipt, indent=2)
          (proof / 'case-counts.json').write_text(text + '\n')
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('```json\n' + text + '\n```\n')
          PYTHON
      - name: Verify unchanged sources
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --exit-code HEAD --
      - name: Preserve proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-update-restart-fixture-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/update-restart-fixture-proof/
          if-no-files-found: warn
          retention-days: 14
