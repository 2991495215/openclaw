# Temporary exact-candidate proof only. Never merge this workflow.
name: Red-main Knip two-root repair proof
run-name: Knip two-root repair ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Reviewed full candidate commit SHA
        type: string
        required: true
      workflow_sha:
        description: Expected full workflow carrier commit SHA
        type: string
        required: true
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-knip-two-roots-${{ github.ref }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  check-exports:
    name: Production, script, and full-tree exports (exact candidate)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record candidate source and workflow provenance
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --
          mkdir -p .artifacts/knip-owner-repair
          {
            echo "Candidate: $actual_sha"
            echo "Workflow: $WORKFLOW_SHA"
            git show -s --format='%H%n%P%n%an <%ae>%n%s' HEAD
            git ls-tree HEAD -- \
              package.json pnpm-lock.yaml \
              scripts/check-deadcode-exports.mts \
              scripts/deadcode-knip-runner.mts \
              config/knip.config.ts config/knip.all-exports.config.ts config/knip.scripts-exports.config.ts \
              scripts/ci-build-manifest.mjs scripts/lib/ci-changed-node-test-plan.mts \
              extensions/crabbox/src/crabbox-worker-timeouts.ts \
              extensions/crabbox/src/crabbox-worker-provider.test.ts
          } | tee .artifacts/knip-owner-repair/provenance.log
          cat .artifacts/knip-owner-repair/provenance.log >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"

      - name: Run affected static scopes once
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
        run: |
          set -euo pipefail
          pnpm deadcode:exports 2>&1 | tee .artifacts/knip-owner-repair/static-scopes.log

      - name: Verify candidate source remained unchanged
        if: ${{ always() }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --
          echo "Tracked candidate source remained unchanged." >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve export outcomes and provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-knip-two-roots-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/knip-owner-repair/
          if-no-files-found: warn
          retention-days: 14
