# Temporary exact-case proof only. Never merge this workflow.
name: Red-main Codex history prefix proof
run-name: Codex history prefix proof ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        type: string
        required: true
      workflow_sha:
        type: string
        required: true
      dispatch_id:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-codex-history-prefix-${{ github.ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  BASE_SHA: 00b330babd579bea362a074f5e3c0efd03606fd2
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
jobs:
  focused:
    name: Codex oversized mirrored tool frame
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENCLAW_LOCAL_CHECK: "0"
      OPENCLAW_VITEST_RUNTIME: node
    steps:
      - name: Checkout exact proof source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify source provenance
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          proof_dir="$RUNNER_TEMP/codex-history-prefix"
          mkdir -p "$proof_dir"
          git diff "$BASE_SHA" HEAD > "$proof_dir/source.patch"
          git show -s --format='%H%n%P%n%an <%ae>%n%s' HEAD > "$proof_dir/provenance.log"
          cp extensions/codex/src/app-server/session-history.test.ts "$proof_dir/candidate.test.ts"
          git diff --exit-code HEAD --
      - name: Setup Node and frozen dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
      - name: Format and lint changed test
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec oxfmt --check extensions/codex/src/app-server/session-history.test.ts
          pnpm exec oxlint extensions/codex/src/app-server/session-history.test.ts
      - name: Prove exact failed case
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/codex-history-prefix"
          started="$(date +%s)"
          if pnpm test extensions/codex/src/app-server/session-history.test.ts --maxWorkers=1 \
            -t 'prepares an oversized mirrored tool frame without losing the incoming request or native evidence' \
            --reporter=verbose --reporter=json --outputFile.json "$proof_dir/candidate.json" 2>&1 | tee "$proof_dir/candidate.log"; then
            test_exit=0
          else
            test_exit=$?
          fi
          echo "Candidate exit: $test_exit; elapsed: $(( $(date +%s) - started )) seconds" | tee "$proof_dir/candidate-result.txt"
          python3 - <<'PYINNER'
          import json, os, pathlib
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'codex-history-prefix'
          report = json.loads((proof / 'candidate.json').read_text())
          selected = [e for f in report['testResults'] for e in f['assertionResults'] if e['status'] in ('passed','failed')]
          assert len(selected) == 1, selected
          assert report['numPassedTests'] == 1 and report['numFailedTests'] == 0, report
          observation = {'selected_count': 1, 'passed': 1, 'failed': 0, 'source': os.environ['CANDIDATE_SHA'], 'base': os.environ['BASE_SHA']}
          (proof / 'observations.json').write_text(json.dumps(observation, indent=2) + '\n')
          print(json.dumps(observation))
          PYINNER
          git diff --exit-code HEAD --
          exit "$test_exit"
      - name: Preserve exact-case evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: redmain-codex-history-prefix-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codex-history-prefix/
          if-no-files-found: warn
          retention-days: 14
