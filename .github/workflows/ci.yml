# Temporary primary-error diagnostic. Never merge this workflow or its assertion-message patch.
name: Red-main backup primary error diagnostic
run-name: Backup primary error ${{ inputs.candidate_sha }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact source commit (40 lowercase hexadecimal characters)
        type: string
        required: true
      dispatch_id:
        description: Diagnostic correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-backup-primary-error-diagnostic
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}

jobs:
  backup-primary-error:
    name: Original backup writer cases with JSON error visibility
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact source candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source hashes and record provenance
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git diff --exit-code HEAD --
          mkdir -p .artifacts/backup-primary-error
          cat > .artifacts/backup-primary-error/source-before.sha256 <<'HASHES'
          03f01e2b6bb4ac336d9c0aa32a9e93dea112b44f551458ab2ff932004a1aba4b  src/cli/program/register.backup.product-path.test.ts
          e0ec409cf3603e1a2f5c19bab087ecc662039adcdd95af2e18acc39a44736c1c  src/snapshot/database-backup.ts
          9dc85a4ac028d2f341135925912066395949c7f81ade1dc851bec3822267ab00  src/infra/backup-sqlite-snapshot.ts
          0b2d7434cdddf5a5755ede2097ea2cf965c80cb34ee6c8a3e7c14042829001e0  src/commands/backup.ts
          031e1ac8c32f32d56dd9a998339a261f6302bafbc2e6fbd90bdae5ff68177372  src/commands/backup-shared.ts
          3dfb3148d1844d0e0105d7b0a396158fef52f51271b04f758ffa2d87982eaafc  src/infra/backup-create.ts
          a97ff0f74fecfeb1f408b18c4acac02294cea132c2fe5304910df7dd87bd3f32  src/infra/sqlite-snapshot-source.ts
          452709e4d8fcaaea43cf03a78f58821f52559dc4ec55dae5f5088e390967ae51  src/infra/sqlite-readonly-location.worker.ts
          8fa40892199d5cc966b8f3e998cc1e2d1fb3eca4ff29cd2196d9fd2ecd38bc3b  src/infra/sqlite-readonly-location.ts
          HASHES
          sha256sum --check .artifacts/backup-primary-error/source-before.sha256 | tee .artifacts/backup-primary-error/source-before.log
          {
            echo "Candidate: $CANDIDATE_SHA"
            echo "Workflow: $WORKFLOW_SHA"
            git show -s --format='%H%n%P%n%an <%ae>%n%s' HEAD
            git ls-tree HEAD --               package.json pnpm-lock.yaml .github/workflows/ci.yml               .github/actions/setup-node-env/action.yml               src/cli/program/register.backup.product-path.test.ts               src/snapshot/database-backup.ts               src/infra/backup-sqlite-snapshot.ts               src/commands/backup.ts src/commands/backup-shared.ts               src/infra/backup-create.ts src/infra/sqlite-snapshot-source.ts               src/infra/sqlite-readonly-location.worker.ts               src/infra/sqlite-readonly-location.ts               scripts/lib/vitest-build-prerequisites.mts               scripts/lib/vitest-runtime-selection.mts               scripts/test-projects-run.mts
          } | tee .artifacts/backup-primary-error/provenance.log
          cat .artifacts/backup-primary-error/provenance.log >> "$GITHUB_STEP_SUMMARY"

      - name: Add stdout to the existing failure message only
        shell: bash
        run: |
          set -euo pipefail
          cat > .artifacts/backup-primary-error/diagnostic.patch <<'PATCH'
          diff --git a/src/cli/program/register.backup.product-path.test.ts b/src/cli/program/register.backup.product-path.test.ts
          --- a/src/cli/program/register.backup.product-path.test.ts
          +++ b/src/cli/program/register.backup.product-path.test.ts
          @@ -117,7 +117,7 @@
                       outputPath,
                       includeWorkspace,
                     });
          -          expect(result.code, result.stderr).toBe(0);
          +          expect(result.code, `${result.stderr}\n${result.stdout}`).toBe(0);
                     const archive = JSON.parse(result.stdout);
                     expect(archive.agentRoots).toEqual([expect.objectContaining({ agentId: "main" })]);
                     expect(archive.verified).toBe(true);
          PATCH
          echo 'd34876c5cf51bfe9e4f2a4f7bb8c45b99d71b68224dd864260238be6c265b338  .artifacts/backup-primary-error/diagnostic.patch' | sha256sum --check
          git apply --check .artifacts/backup-primary-error/diagnostic.patch
          git apply .artifacts/backup-primary-error/diagnostic.patch
          cat > .artifacts/backup-primary-error/source-diagnostic.sha256 <<'HASHES'
          4b65310d02c33509069b6ba01592519b9032c021540fa39dd6b32eb39c95fcb0  src/cli/program/register.backup.product-path.test.ts
          e0ec409cf3603e1a2f5c19bab087ecc662039adcdd95af2e18acc39a44736c1c  src/snapshot/database-backup.ts
          9dc85a4ac028d2f341135925912066395949c7f81ade1dc851bec3822267ab00  src/infra/backup-sqlite-snapshot.ts
          0b2d7434cdddf5a5755ede2097ea2cf965c80cb34ee6c8a3e7c14042829001e0  src/commands/backup.ts
          031e1ac8c32f32d56dd9a998339a261f6302bafbc2e6fbd90bdae5ff68177372  src/commands/backup-shared.ts
          3dfb3148d1844d0e0105d7b0a396158fef52f51271b04f758ffa2d87982eaafc  src/infra/backup-create.ts
          a97ff0f74fecfeb1f408b18c4acac02294cea132c2fe5304910df7dd87bd3f32  src/infra/sqlite-snapshot-source.ts
          452709e4d8fcaaea43cf03a78f58821f52559dc4ec55dae5f5088e390967ae51  src/infra/sqlite-readonly-location.worker.ts
          8fa40892199d5cc966b8f3e998cc1e2d1fb3eca4ff29cd2196d9fd2ecd38bc3b  src/infra/sqlite-readonly-location.ts
          HASHES
          sha256sum --check .artifacts/backup-primary-error/source-diagnostic.sha256 | tee .artifacts/backup-primary-error/source-diagnostic.log
          git diff --exit-code HEAD -- . ':(exclude)src/cli/program/register.backup.product-path.test.ts'
          git diff -- src/cli/program/register.backup.product-path.test.ts | tee .artifacts/backup-primary-error/diagnostic.diff

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"

      # Canonical pnpm test owns prerequisites. No separate build or extra test command.
      - name: Run the two original failing backup writer cases
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          {
            node --version
            pnpm --version
            echo "Command: pnpm test src/cli/program/register.backup.product-path.test.ts --maxWorkers=1 -t 'retains workspace-discovered owners under state write load'"
          } | tee .artifacts/backup-primary-error/command.log
          started="$(date +%s)"
          if pnpm test src/cli/program/register.backup.product-path.test.ts --maxWorkers=1 -t 'retains workspace-discovered owners under state write load' 2>&1 | tee .artifacts/backup-primary-error/test.log; then
            test_exit=0
          else
            test_exit=$?
          fi
          elapsed=$(( $(date +%s) - started ))
          {
            echo "Test exit: $test_exit"
            echo "Elapsed seconds: $elapsed"
          } | tee .artifacts/backup-primary-error/result.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$test_exit"

      - name: Verify product source and diagnostic hashes after the run
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          sha256sum --check .artifacts/backup-primary-error/source-diagnostic.sha256 | tee .artifacts/backup-primary-error/source-after.log
          git diff --exit-code HEAD -- . ':(exclude)src/cli/program/register.backup.product-path.test.ts'
          echo "Product source unchanged; only the pinned assertion message includes stdout." | tee .artifacts/backup-primary-error/source-unchanged.log

      - name: Preserve primary-error evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-backup-primary-error-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/backup-primary-error/
          if-no-files-found: warn
          retention-days: 14
