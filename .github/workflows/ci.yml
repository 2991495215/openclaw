# PROOF ONLY: one exact failing case on an immutable candidate; never merge this workflow.
name: Red-main worker archive heartbeat
run-name: Worker archive heartbeat 83181a8203ad ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: redmain-worker-archive-heartbeat-proof
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.21.0"

jobs:
  worker-archive-heartbeat-proof:
    name: One relocated worker archive regression
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout pinned candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 83181a8203ad6237fb8a1429f2729c0bf20501b8
          fetch-depth: 1
          persist-credentials: false

      - name: Record candidate sources
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 83181a8203ad6237fb8a1429f2729c0bf20501b8
          proof_dir="$RUNNER_TEMP/worker-archive-heartbeat-proof"
          mkdir -p "$proof_dir"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git ls-tree HEAD -- src/gateway/worker-environments/bootstrap.test.ts src/gateway/worker-environments/bundle.test.ts src/infra/gateway-state-owner-heartbeat.ts src/shared/worker-bundle-hash.ts src/worker/worker-deploy-runtime.ts test/scripts/check-cli-bootstrap-imports.test.ts test/scripts/worker-deploy-build-plugin.test.ts tsdown.config.ts
          } | tee "$proof_dir/provenance.txt"
          cat "$proof_dir/provenance.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
          node-compile-cache: "true"

      - name: Prove original relocated archive case
        id: archive_case
        if: ${{ !cancelled() }}
        shell: bash
        env:
          OPENCLAW_LOCAL_CHECK: "0"
          OPENCLAW_VITEST_RUNTIME: node
        run: |
          set -euo pipefail
          pnpm test test/scripts/worker-deploy-build-plugin.test.ts --maxWorkers=1 -t 'reads exec environment and commits authorization through SQLite workers in a relocated archive' --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/worker-archive-heartbeat-proof/archive-case.log"

      - name: Verify unchanged sources
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --exit-code

      - name: Preserve proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-worker-archive-heartbeat-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worker-archive-heartbeat-proof/
          if-no-files-found: warn
          retention-days: 14
