# PROOF ONLY: diagnosed copied-source failures; never merge this workflow.
name: Red-main runtime manifest closure
run-name: Runtime manifest closure ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Proof correlation ID
        type: string
        required: true
      workflow_sha:
        description: Exact proof workflow commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: redmain-runtime-manifest-closure-proof
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.19.0"
  PYTHONIOENCODING: utf-8
jobs:
  manifest-closure-proof:
    name: Original manifest failures (${{ matrix.platform }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - platform: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout pinned candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 893eb6de4ed2e472cd73cdeff6a18ec6d7279e4d
          fetch-depth: 2
          persist-credentials: false
      - name: Record source provenance
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 893eb6de4ed2e472cd73cdeff6a18ec6d7279e4d
          git diff --exit-code HEAD --
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          mkdir -p "$RUNNER_TEMP/runtime-manifest-proof"
          {
            echo "Candidate: $(git rev-parse HEAD)"
            echo "Workflow: $WORKFLOW_SHA"
            git diff --stat HEAD^ HEAD
            git ls-tree HEAD -- package.json pnpm-lock.yaml scripts/pr-lib/wrapper-components.txt test/scripts/tsdown-declaration-fixture.ts src/infra/runtime-process-manifest.ts test/vitest/vitest.tooling.config.ts
          } | tee "$RUNNER_TEMP/runtime-manifest-proof/provenance.txt"
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "false"
          frozen-lockfile: "true"
          vitest-fs-cache: "false"
          vitest-worker-cache: "false"
          node-compile-cache: "true"
      - name: Check changed fixture
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          node_modules/.bin/oxfmt --check --threads=1 test/scripts/tsdown-declaration-fixture.ts
          node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.core.json test/scripts/tsdown-declaration-fixture.ts
          git diff --check HEAD^ HEAD
      - name: Prove selected original failures
        shell: bash
        env:
          OPENCLAW_VITEST_RUNTIME: node
          PROOF_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, pathlib, re, subprocess, time
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'runtime-manifest-proof'
          selections = json.loads(r'''{"linux": [{"file": "test/scripts/eager-import-closure.test.ts", "suite": "", "title": "keeps the PR wrapper inventory closed over runtime imports"}, {"file": "test/scripts/eager-import-closure.test.ts", "suite": "", "title": "acquires wrapper leases and manages templates without the application command runtime"}, {"file": "test/scripts/pr-wrappers.test.ts", "suite": "scripts/pr wrappers", "title": "executes tooling and publisher code from the extracted anchor dependency closure"}, {"file": "test/scripts/pr-main-refresh.test.ts", "suite": "native PR main refresh boundaries", "title": "uses the private checkpoint after an uninterrupted cold bootstrap while main moves"}, {"file": "test/scripts/write-plugin-sdk-entry-dts.test.ts", "suite": "write-plugin-sdk-entry-dts", "title": "preserves repository input metadata during direct declaration builds"}, {"file": "test/scripts/write-unified-entry-dts.test.ts", "suite": "write-unified-entry-dts", "title": "compiles declarations once and restores them while rebuilding runtime after input edits"}, {"file": "test/scripts/tsdown-declaration-resolution.test.ts", "suite": "tsdown checkout declaration resolution", "title": "uses local explicit references and records real inputs for SDK"}, {"file": "test/scripts/dist-artifact-ownership.test.ts", "suite": "dist artifact ownership", "title": "retains nested write-plugin-sdk-entry-dts.ts unjoined work without staging cleanup"}, {"file": "test/scripts/dist-artifact-ownership.test.ts", "suite": "dist artifact ownership", "title": "retains nested write-unified-entry-dts.ts unjoined work without staging cleanup"}, {"file": "test/scripts/pr-wrapper-source-closure.test.ts", "suite": "", "title": "retains src/infra/gateway-state-owner.ts and its relative ESM runtime dependencies in the wrapper inventory"}, {"file": "test/scripts/pr-wrapper-source-closure.test.ts", "suite": "", "title": "retains src/plugins/discovery.ts and its relative ESM runtime dependencies in the wrapper inventory"}, {"file": "test/scripts/pr-wrapper-source-closure.test.ts", "suite": "", "title": "retains src/infra/sqlite-readonly-location.worker.ts and its relative ESM runtime dependencies in the wrapper inventory"}, {"file": "test/scripts/pr-worktree-provision-error.test.ts", "suite": "native PR provisioning diagnostics", "title": "reports the real native storage failure, keeps its exit status, and releases the drained lock"}], "windows": [{"file": "test/scripts/write-plugin-sdk-entry-dts.test.ts", "suite": "write-plugin-sdk-entry-dts", "title": "preserves repository input metadata during direct declaration builds"}, {"file": "test/scripts/tsdown-declaration-resolution.test.ts", "suite": "tsdown checkout declaration resolution", "title": "uses local explicit references and records real inputs for SDK"}]}''')
          selected = selections[os.environ['PROOF_PLATFORM']]
          (proof / 'selections.json').write_text(json.dumps(selected, indent=2) + '\n')
          version = subprocess.check_output(['node', '--version'], text=True).strip()
          assert version == 'v24.19.0', version
          (proof / 'runtime.txt').write_text(version + '\n' + os.environ['PROOF_PLATFORM'] + '\n')
          pattern = '^(?:' + '|'.join(re.escape((case['suite'] + ' > ' if case['suite'] else '') + case['title']) for case in selected) + ')$'
          files = list(dict.fromkeys(case['file'] for case in selected))
          command = ['node', 'scripts/run-vitest.mjs', 'run', '--config', 'test/vitest/vitest.tooling.config.ts', *files, '--maxWorkers=1', '--passWithNoTests=false', '--testNamePattern', pattern, '--reporter=default', '--reporter=json', '--outputFile.json=' + str(proof / 'vitest.json')]
          (proof / 'command.json').write_text(json.dumps(command, indent=2) + '\n')
          started = time.monotonic()
          with (proof / 'vitest.log').open('w', encoding='utf-8') as log:
              process = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, encoding='utf-8', errors='replace')
              for line in process.stdout:
                  print(line, end='', flush=True)
                  log.write(line)
              result = process.wait()
          (proof / 'execution.json').write_text(json.dumps({'exit_code': result, 'elapsed_seconds': time.monotonic() - started}, indent=2) + '\n')
          raise SystemExit(result)
          PYTHON
      - name: Verify exact passing case set
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, pathlib
          proof = pathlib.Path(os.environ['RUNNER_TEMP']) / 'runtime-manifest-proof'
          selected = json.loads((proof / 'selections.json').read_text())
          data = json.loads((proof / 'vitest.json').read_text())
          expected = {(case['file'], (case['suite'] + ' ' if case['suite'] else '') + case['title']) for case in selected}
          executed = [(result['name'].replace('\\', '/'), case) for result in data['testResults'] for case in result['assertionResults'] if case['status'] not in ('pending', 'skipped', 'todo', 'disabled')]
          assert len(executed) == len(expected), executed
          actual = set()
          for filename, case in executed:
              assert any(filename.endswith('/' + file) and case['fullName'] == name for file, name in expected), (filename, case)
              actual.add(next((file, name) for file, name in expected if filename.endswith('/' + file) and case['fullName'] == name))
              assert case['status'] == 'passed', case
          assert actual == expected, (actual, expected)
          assert data['success'] and data['numPassedTests'] == len(expected) and data['numFailedTests'] == 0, data
          assert data.get('numRuntimeErrorTestSuites', 0) == 0, data
          receipt = {'executed': len(executed), 'passed': len(executed), 'failed': 0, 'selected': sorted(expected), 'duration_ms': sum(case.get('duration', 0) for _, case in executed), 'unrelated_skipped': data.get('numPendingTests', 0)}
          text = json.dumps(receipt, indent=2)
          (proof / 'case-counts.json').write_text(text + '\n')
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('```json\n' + text + '\n```\n')
          PYTHON
      - name: Verify unchanged sources
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 893eb6de4ed2e472cd73cdeff6a18ec6d7279e4d
          git status --short
          git diff --exit-code HEAD --
      - name: Preserve proof logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: redmain-runtime-manifest-proof-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-manifest-proof/
          if-no-files-found: warn
          retention-days: 14
