name: Android qualification dependency replay

on:
  workflow_call:
    inputs:
      target_sha:
        type: string
        required: true
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Temporary controller: pin the reviewed diagnostic candidate independently of this workflow.
      TARGET_SHA: 6feaf9806c76c129b158d05ee68b38ad458c5d64
    steps:
      - name: Initialize failure proof and validate target
        shell: bash
        run: |
          set -euo pipefail
          export PROOF_PATH="$RUNNER_TEMP/android-release-e2e-proof.json"
          echo "PROOF_PATH=$PROOF_PATH" >> "$GITHUB_ENV"
          echo "GATEWAY_SELECTION_DIR=$RUNNER_TEMP/android-release-gateway-selection" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json, os, re
          sha = os.environ["TARGET_SHA"]
          with open(os.environ["PROOF_PATH"], "w") as out:
              json.dump({"schema": 1, "status": "failed",
                         "targetSha": sha if re.fullmatch(r"[a-f0-9]{40}", sha) else None,
                         "errors": ["workflow-setup-incomplete"]}, out)
          PY
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_WORKFLOW_REF" == "openclaw/openclaw/.github/workflows/android-release-e2e.yml@refs/heads/debug/android-qualification-lock-replay" ]]
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]

      - name: Checkout exact qualification target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Verify target and require target-owned harness
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          test -f scripts/android-release-e2e.ts
          test -f scripts/ios-release-gateway.ts

      - name: Restore original failed run's Gateway selection
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: 12212018221
          github-token: ${{ github.token }}
          run-id: 39301341726
          path: ${{ env.GATEWAY_SELECTION_DIR }}
          digest-mismatch: error

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          install-bun: "false"
          cache-mode: "off"

      - name: Bind frozen Gateway selection to diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { copyFile, readFile, writeFile } from 'node:fs/promises';
          import path from 'node:path';
          const file = path.join(process.env.GATEWAY_SELECTION_DIR, 'selection.json');
          const selection = JSON.parse(await readFile(file, 'utf8'));
          assert.equal(selection.targetSha, '98f1df64529364bc1731ffee1ea938a96f900f3e');
          assert.equal(selection.lockSha256, '259fa77354b4f37b594f41deae2382f299ab61fc0b553331e294273bf96af370');
          await copyFile(file, path.join(process.env.GATEWAY_SELECTION_DIR, 'original-selection.json'));
          selection.targetSha = process.env.TARGET_SHA;
          await writeFile(file, `${JSON.stringify(selection, null, 2)}\n`);
          NODE
          # The existing owner verifies the unchanged manifest and lock hashes, Node, npm and platform.
          node --import ./scripts/tsx.mjs scripts/ios-release-gateway.ts \
            --target-sha "$TARGET_SHA" --selection-dir "$GATEWAY_SELECTION_DIR"

      - name: Save this run's stable Gateway selection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-gateway-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.GATEWAY_SELECTION_DIR }}/selection.json
            ${{ env.GATEWAY_SELECTION_DIR }}/original-selection.json
            ${{ env.GATEWAY_SELECTION_DIR }}/package.json
            ${{ env.GATEWAY_SELECTION_DIR }}/package-lock.json
          if-no-files-found: error
          retention-days: 30

      - name: Setup Android toolchain and standard emulator images
        id: android-toolchain
        uses: ./.github/actions/setup-android-toolchain
        with:
          cache-mode: "off"
          install-screenshot-emulators: "true"

      - name: Qualify phone and controlled Wear boundary
        env:
          OPENCLAW_GRADLE_JAVA_HOME: ${{ steps.android-toolchain.outputs.gradle-java-home }}
        run: |
          pnpm android:release:validate -- \
            --target-sha "$TARGET_SHA" --output "$PROOF_PATH" \
            --selection-dir "$GATEWAY_SELECTION_DIR" \
            --artifacts-dir "$RUNNER_TEMP/android-release-e2e"

      - name: Retain sanitized qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/android-release-e2e-proof.json
            ${{ runner.temp }}/android-release-e2e/screenshots/*.png
          if-no-files-found: error
          retention-days: 14
