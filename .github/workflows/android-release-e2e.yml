name: Android ADB directory stress probe

on:
  workflow_call:
    inputs:
      target_sha:
        type: string
        required: true
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Temporary controller: pin the reviewed diagnostic candidate independently of this workflow.
      TARGET_SHA: 3498da253bc84fc2992537ba71aaf6f1838db580
    steps:
      - name: Initialize failure proof and validate target
        shell: bash
        run: |
          set -euo pipefail
          export PROOF_PATH="$RUNNER_TEMP/android-release-e2e-proof.json"
          echo "PROOF_PATH=$PROOF_PATH" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json, os, re
          sha = os.environ["TARGET_SHA"]
          with open(os.environ["PROOF_PATH"], "w") as out:
              json.dump({"schema": 1, "status": "failed",
                         "targetSha": sha if re.fullmatch(r"[a-f0-9]{40}", sha) else None,
                         "errors": ["workflow-setup-incomplete"]}, out)
          PY
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_WORKFLOW_REF" == "openclaw/openclaw/.github/workflows/android-release-e2e.yml@refs/heads/debug/android-qualification-lock-replay" ]]
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]

      - name: Checkout exact qualification target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Verify target and require target-owned harness
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          test -f scripts/android-adb-directory-probe.ts
          test -f scripts/android-adb-bridge-trace.py
          test -f scripts/android-adbd-socket-inspect.c

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          install-bun: "false"
          install-deps: "false"
          cache-mode: "off"

      - name: Setup Android toolchain and standard emulator images
        id: android-toolchain
        uses: ./.github/actions/setup-android-toolchain
        with:
          cache-mode: "off"
          install-screenshot-emulators: "true"

      - name: Ensure diagnostic tracers are available
        run: |
          if ! command -v strace >/dev/null || ! command -v gdb >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends strace gdb
          fi
          strace --version
          gdb --version
          sudo -n true

      - name: Build the metadata-only guest socket inspector
        run: |
          cc -std=c11 -Wall -Wextra -Werror -static -Os -s \
            scripts/android-adbd-socket-inspect.c \
            -o "$RUNNER_TEMP/android-adbd-socket-inspect"
          echo "ANDROID_ADB_SOCKET_INSPECT=$RUNNER_TEMP/android-adbd-socket-inspect" >> "$GITHUB_ENV"

      - name: Stress recursive directory pulls on two fresh phone emulators
        run: node scripts/android-adb-directory-probe.ts

      - name: Retain sanitized qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/android-release-e2e-proof.json
          if-no-files-found: error
          retention-days: 14
