name: Compiler comparison experiment

on:
  push:
    branches: [bench/tsc-ts-ci-20261017]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-comparison-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    name: Compiler comparison group ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        # The full matrix retained 37 complete triples before group 0 hit
        # its job deadline. Run only the unfinished canonical graph (index 36).
        group: [36]
    steps:
      - name: Checkout temporary experiment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare pinned repository dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.x
          install-bun: false
          cache-mode: off
      - name: Prepare compiler isolation
        shell: bash
        run: |
          set -euo pipefail
          image=ubuntu@sha256:a2d43bffc46670d7108bb3c0468c67c5557c4c92e83e1e34cbff1322ad1b94dc
          docker pull "$image"
          docker run --rm --network none --read-only --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges "$image" /bin/true
      - name: Compare canonical CI typecheck graphs
        env:
          GROUP: ${{ matrix.group }}
        run: node .github/scripts/compiler-comparison.mjs --group "$GROUP" --groups 38 --repeats 3 --isolation docker
      - name: Upload complete measurement evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-comparison-group-${{ matrix.group }}
          path: |
            .artifacts/compiler-comparison/group-${{ matrix.group }}/
            !.artifacts/compiler-comparison/**/native/**
            !.artifacts/compiler-comparison/**/reference/**
            !.artifacts/compiler-comparison/**/*.tgz
          retention-days: 7
          if-no-files-found: warn
