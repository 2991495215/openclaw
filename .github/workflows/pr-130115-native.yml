name: Mac catalog main reproduction

on:
  push:
    branches: [brzezowski/repro-130115-native]
    paths:
      - .github/workflows/pr-130115-native.yml
      - scripts/pr-130115-reproduction/**

permissions:
  contents: read
  actions: read

concurrency:
  group: pr-130115-native
  cancel-in-progress: false

jobs:
  main:
    if: github.repository == 'openclaw/openclaw'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      MAIN_SHA: d535d274183d19e2e838c7a7fc96063df676b368
      CATALOG_HTTP_PREFLIGHT_ONLY: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      # Do not publish until owner 177970 provides and reviews the shared helper.
      LAUNCH_SUPPORT_SHA256: 177112c2a6652f5bd815910cff199f04b7b236dbde0c7bcf70899e1c9d397338
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify the preserved package provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/openclaw/openclaw/actions/artifacts/12452308201 --jq '
            select(.expired == false and .workflow_run.id == 39833929614 and
              .workflow_run.head_sha == "6f9be3a1bedb338cb3830028d2c71c4ae51e00b3" and
              .digest == "sha256:2be735384558987d132b48d28131ab4f886d920d974e3a7eec8652fabd74bb62") | .id')" = 12452308201
      - name: Restore the already verified official main package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          repository: openclaw/openclaw
          run-id: 39833929614
          name: pr-130115-main-bundle
          path: ${{ runner.temp }}/pr-130115-reused-main
      - name: Select the preinstalled supported Xcode
        shell: bash
        run: |
          set -euo pipefail
          for app in /Applications/Xcode_26.4.1.app /Applications/Xcode_26.4.app; do
            if [[ -d "$app" ]]; then
              echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo 'Supported preinstalled Xcode is unavailable.' >&2
          exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Prepare the maintained external XCTest tooling
        if: env.CATALOG_HTTP_PREFLIGHT_ONLY != '1'
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          scripts/install-xcodegen.sh "$RUNNER_TEMP/catalog-tools/bin"
          echo "$RUNNER_TEMP/catalog-tools/bin" >> "$GITHUB_PATH"
      - name: Run the selected main-only proof stage
        env:
          REUSED_MAIN_BUNDLE: ${{ runner.temp }}/pr-130115-reused-main
        shell: bash
        run: |
          python3 scripts/pr-130115-reproduction/run-main.py \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/pr-130115-native-evidence" "$RUNNER_TEMP/pr-130115-main-bundle"
      - name: Preserve synthetic sources and the verified main bundle reference
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-130115-recovery-inputs
          path: ${{ runner.temp }}/pr-130115-main-bundle
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      - name: Preserve native observations and failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-130115-native-evidence
          path: ${{ runner.temp }}/pr-130115-native-evidence
          if-no-files-found: warn
          retention-days: 7
