name: Admitcut export proof

on:
  push:
    branches: [dbasync/admitcut-knip-proof]

permissions:
  contents: read

concurrency:
  group: admitcut-knip-proof
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"

jobs:
  exports:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 02d5010ba90781a50165ccd6321c85b7ce3c569c
          persist-credentials: false
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          install-bun: "false"
          cache-mode: restore
          semantic-checks: "true"
      - name: Verify candidate and export surface
        run: |
          test "$(git rev-parse HEAD)" = 02d5010ba90781a50165ccd6321c85b7ce3c569c
          git rev-parse HEAD
          pnpm deadcode:exports
