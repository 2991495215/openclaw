name: Admitcut focused base proof

on:
  push:
    branches: [dbasync/admitcut-knip-proof]

permissions:
  contents: read

concurrency:
  group: admitcut-focused-base-proof
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"

jobs:
  exports:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e589d87d7b7e02bccf241fad47b62f0fdab04a2a
          persist-credentials: false
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          install-bun: "false"
          cache-mode: restore
          semantic-checks: "true"
      - name: Verify base and reproduce session failures
        run: |
          test "$(git rev-parse HEAD)" = e589d87d7b7e02bccf241fad47b62f0fdab04a2a
          git rev-parse HEAD
          pnpm test src/gateway/server-methods/chat-send-reply-dispatch.test.ts src/auto-reply/reply/agent-runner-completion.persistence.test.ts --maxWorkers=1 -t 'reads released actor reply facts and rejects the old answer|preserves the completed reply after one invalidated|does not retry or publish a completed reply past second-invalidation'
