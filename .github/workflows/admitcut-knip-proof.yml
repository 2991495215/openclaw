name: Admitcut export proof

on:
  push:
    branches: [dbasync/admitcut-knip-proof]

permissions:
  contents: read

concurrency:
  group: admitcut-knip-proof
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"

jobs:
  exports:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e589d87d7b7e02bccf241fad47b62f0fdab04a2a
          persist-credentials: false
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          install-bun: "false"
          cache-mode: restore
          semantic-checks: "true"
      - name: Verify candidate and export surface
        run: |
          test "$(git rev-parse HEAD)" = e589d87d7b7e02bccf241fad47b62f0fdab04a2a
          git rev-parse HEAD
          pnpm deadcode:exports
      - name: Build base runtime for auth failure attribution
        id: auth_runtime
        if: ${{ !cancelled() }}
        run: node --import ./scripts/tsx.mjs scripts/build-all.mts qaRuntime
      - name: Reproduce selected-profile logout on base
        if: ${{ !cancelled() && steps.auth_runtime.outcome == 'success' }}
        run: pnpm test test/e2e/qa-lab/runtime/codex-auth-product-proof.e2e.test.ts --maxWorkers=1 -t 'returns bounded recovery after the explicitly selected profile is removed'
