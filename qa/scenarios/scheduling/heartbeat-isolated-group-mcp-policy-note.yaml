title: Isolated group scheduled check keeps configured MCP after a policy note

scenario:
  id: heartbeat-isolated-group-mcp-policy-note
  surface: cron
  category: automation.heartbeat
  coverage:
    secondary:
      - automation.manual-cron-runs
      - channels.qa-channel-final-reply
  regressionRefs:
    - openclaw/openclaw#140279
  gatewayConfigPatch:
    tools:
      # Keep MCP tools directly visible in the provider request instead of behind
      # tool search, and route exec to a node host so the Codex harness drops its
      # native tool surface and materializes configured MCP through OpenClaw.
      toolSearch: false
      exec:
        host: node
    channels:
      qa-channel:
        allowFrom:
          - qa-channel:group:qa-heartbeat-mcp-room
  objective: Verify an isolated scheduled check addressed to a group keeps its configured MCP tools and does not receive the incomplete-MCP blocker.
  successCriteria:
    - An ordinary cron job runs the isolated group check through a real Gateway, the Codex app-server harness, a real stdio MCP server, and the mock provider boundary.
    - The scheduled provider request offers the configured MCP server's tools.
    - That request carries no "Configured MCP is incomplete" blocker in its developer instructions or input.
    - The scheduled reply is delivered to the configured qa-channel group.
  docsRefs:
    - docs/automation/cron-jobs/payloads.md
    - docs/tools/mcp.md
  codeRefs:
    - src/agents/agent-bundle-mcp-harness.ts
    - src/cron/isolated-agent/run-prompt-executor.ts
    - extensions/codex/src/app-server/run-attempt-tool-setup.ts
  execution:
    kind: flow
    runtime: codex
    suiteIsolation: isolated
    isolationReason: Creates and forces an isolated group cron job with an MCP server on the real Gateway.
    channel: qa-channel
    retryCount: 0
    timeoutMs: 300000
    summary: Prove an isolated group scheduled check with configured MCP reaches its normal assessment instead of a warning-only MCP blocker.
    config:
      requiredProviderMode: mock-openai
      heartbeatPromptNeedle: Isolated group heartbeat MCP proof
      heartbeatRoom: qa-heartbeat-mcp-room
      heartbeatMarker: QA-HEARTBEAT-MCP-OK
      heartbeatJobName: heartbeat-qa
      mcpServerName: proof
      expectedMcpTools: [proof__resources_list, proof__resources_read, proof__show]
      mcpServerScript: scripts/e2e/mcp-app-conformance-server.mjs
      blockerNeedle: Configured MCP is incomplete

flow:
  steps:
    - name: runs the isolated group check with its MCP tools and no warning-only blocker
      actions:
        - assert:
            expr: "env.providerMode === config.requiredProviderMode"
            message: isolated group heartbeat MCP proof requires mock-openai
        - call: waitForGatewayHealthy
          args:
            - ref: env
            - 60000
        - call: waitForQaChannelReady
          args:
            - ref: env
            - 60000
        - call: reset
        - call: patchConfig
          saveAs: mcpPatchResult
          args:
            - env:
                ref: env
              patch:
                mcp:
                  servers:
                    expr: "({ [config.mcpServerName]: { command: 'node', args: [path.join(env.repoRoot, config.mcpServerScript)], transport: 'stdio' } })"
        - call: waitForGatewayHealthy
          args:
            - ref: env
            - 60000
        - call: waitForQaChannelReady
          args:
            - ref: env
            - 60000
        - call: env.gateway.call
          saveAs: heartbeatJob
          args:
            - cron.add
            - agentId: qa
              name:
                expr: config.heartbeatJobName
              enabled: true
              schedule:
                kind: at
                at:
                  expr: "new Date(Date.now() + 10 * 60 * 1000).toISOString()"
              sessionTarget: isolated
              wakeMode: now
              payload:
                kind: agentTurn
                message:
                  expr: "`${config.heartbeatPromptNeedle}. Reply exactly: ${config.heartbeatMarker}`"
              delivery:
                mode: announce
                channel: qa-channel
                to:
                  expr: "`group:${config.heartbeatRoom}`"
                directPolicy: block
            - timeoutMs: 30000
        - assert:
            expr: "Boolean(heartbeatJob.id) && heartbeatJob.agentId === 'qa' && heartbeatJob.sessionTarget === 'isolated' && heartbeatJob.payload?.kind === 'agentTurn'"
            message: Cron did not retain the isolated group MCP job contract.
        - set: heartbeatRequestCursor
          value:
            expr: "(await fetchJson(`${env.mock.baseUrl}/debug/request-cursor`)).cursor"
        - call: env.gateway.call
          saveAs: runResponse
          args:
            - cron.run
            - id:
                expr: heartbeatJob.id
              mode: force
            - timeoutMs: 30000
        - assert:
            expr: "runResponse?.ok === true && runResponse?.ran !== false"
            message:
              expr: "`expected cron.run to start the group MCP check, got ${JSON.stringify(runResponse)}`"
        - call: waitForCondition
          saveAs: heartbeatRequest
          args:
            - lambda:
                expr: "(async () => (await fetchJson(`${env.mock.baseUrl}/debug/requests?after=${heartbeatRequestCursor}`)).find((request) => String(request.allInputText ?? '').includes(config.heartbeatPromptNeedle)))()"
            - expr: "liveTurnTimeoutMs(env, 150000)"
            - 200
        - set: heartbeatToolNames
          value:
            expr: "(heartbeatRequest.body?.tools ?? []).map((tool) => tool.name ?? tool.type)"
        - set: mcpToolNames
          value:
            expr: "heartbeatToolNames.filter((name) => String(name).startsWith(`${config.mcpServerName}__`))"
        - set: blockerText
          value:
            expr: "[String(heartbeatRequest.instructions ?? ''), String(heartbeatRequest.allInputText ?? '')].map((text) => { const index = text.indexOf(config.blockerNeedle); return index >= 0 ? text.slice(index, index + 320) : null; }).find((text) => text !== null) ?? null"
        - assert:
            expr: "JSON.stringify(mcpToolNames.toSorted()) === JSON.stringify(config.expectedMcpTools.toSorted())"
            message:
              expr: "`heartbeat request did not offer every configured MCP tool. job=${JSON.stringify({ id: heartbeatJob.id, name: heartbeatJob.name })} tools=${JSON.stringify(heartbeatToolNames)}`"
        - assert:
            expr: "blockerText === null"
            message:
              expr: "`heartbeat received the warning-only MCP blocker although its MCP tools ${JSON.stringify(mcpToolNames)} were kept: ${JSON.stringify(blockerText)}`"
        - call: waitForOutboundMessage
          saveAs: heartbeatOutbound
          args:
            - ref: state
            - lambda:
                params: [candidate]
                expr: "candidate.direction === 'outbound' && candidate.conversation.kind === 'group' && candidate.conversation.id === config.heartbeatRoom && String(candidate.text ?? '').trim() === config.heartbeatMarker"
            - expr: "liveTurnTimeoutMs(env, 150000)"
        - assert:
            expr: "getTransportSnapshot().messages.filter((candidate) => candidate.direction === 'outbound' && candidate.conversation.kind === 'group' && candidate.conversation.id === config.heartbeatRoom && String(candidate.text ?? '').trim() === config.heartbeatMarker).length === 1"
            message: expected exactly one heartbeat reply in the configured group
      detailsExpr: "JSON.stringify({ verdict: 'PASS', gateway: 'ephemeral-child', provider: env.providerMode, runtime: 'codex', job: { id: heartbeatJob.id, name: heartbeatJob.name }, mcpTools: mcpToolNames, blockerText, deliveredTo: `${heartbeatOutbound.conversation.kind}:${heartbeatOutbound.conversation.id}`, deliveredText: heartbeatOutbound.text, toolCount: heartbeatToolNames.length })"
