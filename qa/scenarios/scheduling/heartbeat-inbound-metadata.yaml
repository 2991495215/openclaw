title: Scheduled check inbound metadata boundary

scenario:
  id: heartbeat-inbound-metadata
  surface: cron
  category: automation.heartbeat
  coverage:
    secondary:
      - automation.manual-cron-runs
      - channels.qa-channel-final-reply
  regressionRefs:
    - openclaw/openclaw#97067
  objective: Verify an isolated scheduled check keeps delivery routing while omitting user-role inbound metadata, and ordinary channel ingress still retains that metadata.
  successCriteria:
    - A forced ordinary cron job executes the scheduled check through a real Gateway and mock provider boundary.
    - The scheduled provider request contains neither the Conversation info block nor the raw delivery target.
    - The scheduled reply is delivered to the configured qa-channel DM target.
    - A normal qa-channel inbound turn retains both the Conversation info block and its raw route id.
    - Ordinary inbound metadata reaches the provider as labeled application context without the legacy internal-context delimiters.
  docsRefs:
    - docs/automation/cron-jobs/payloads.md
    - docs/channels/qa-channel.md
  codeRefs:
    - src/cron/isolated-agent/run-prompt-executor.ts
    - src/auto-reply/reply/get-reply-run-context.ts
    - src/auto-reply/reply/inbound-meta.ts
    - extensions/qa-channel/src/inbound.ts
  execution:
    kind: flow
    suiteIsolation: isolated
    isolationReason: Creates and forces an isolated cron job with its own delivery route on the real Gateway.
    channel: qa-channel
    retryCount: 0
    summary: Prove scheduled routing stays operational without leaking inbound metadata into the model prompt.
    config:
      requiredProviderMode: mock-openai
      heartbeatPromptNeedle: Configured heartbeat metadata boundary proof
      heartbeatRoute: dm:qa-heartbeat-metadata-route
      heartbeatConversationId: qa-heartbeat-metadata-route
      heartbeatMarker: QA-HEARTBEAT-METADATA-OK
      normalPromptNeedle: Normal inbound metadata control
      normalRoute: dm:qa-normal-metadata-route
      normalConversationId: qa-normal-metadata-route
      normalMarker: QA-NORMAL-METADATA-OK

flow:
  steps:
    - name: omits inbound metadata from a scheduled check without losing delivery
      actions:
        - assert:
            expr: "env.providerMode === config.requiredProviderMode"
            message: heartbeat metadata proof requires mock-openai
        - call: waitForGatewayHealthy
          args:
            - ref: env
            - 60000
        - call: waitForQaChannelReady
          args:
            - ref: env
            - 60000
        - call: reset
        - call: env.gateway.call
          saveAs: heartbeatJob
          args:
            - cron.add
            - agentId: qa
              name: qa-heartbeat-metadata
              enabled: true
              schedule:
                kind: at
                at:
                  expr: "new Date(Date.now() + 10 * 60 * 1000).toISOString()"
              sessionTarget: isolated
              wakeMode: now
              payload:
                kind: agentTurn
                message:
                  expr: "`${config.heartbeatPromptNeedle}. Reply exactly: ${config.heartbeatMarker}`"
                # Automatic delivery needs no model-facing destination context.
                toolsAllow: []
              delivery:
                mode: announce
                channel: qa-channel
                to:
                  expr: config.heartbeatRoute
                directPolicy: allow
            - timeoutMs: 30000
        - assert:
            expr: "Boolean(heartbeatJob.id) && heartbeatJob.agentId === 'qa' && heartbeatJob.sessionTarget === 'isolated' && heartbeatJob.payload?.kind === 'agentTurn'"
            message: Cron did not retain the isolated metadata-check job contract.
        - set: heartbeatRequestCursor
          value:
            expr: "(await fetchJson(`${env.mock.baseUrl}/debug/request-cursor`)).cursor"
        - call: env.gateway.call
          saveAs: runResponse
          args:
            - cron.run
            - id:
                expr: heartbeatJob.id
              mode: force
            - timeoutMs: 30000
        - assert:
            expr: "runResponse?.ok === true && runResponse?.ran !== false"
            message:
              expr: "`expected cron.run to start the metadata check, got ${JSON.stringify(runResponse)}`"
        - call: waitForCondition
          saveAs: heartbeatRequest
          args:
            - lambda:
                expr: "(async () => (await fetchJson(`${env.mock.baseUrl}/debug/requests?after=${heartbeatRequestCursor}`)).find((request) => String(request.allInputText ?? '').includes(config.heartbeatPromptNeedle)))()"
            - expr: "liveTurnTimeoutMs(env, 60000)"
            - 100
        - assert:
            expr: "!String(heartbeatRequest.allInputText ?? '').includes('Conversation info:') && !String(heartbeatRequest.allInputText ?? '').includes(config.heartbeatRoute)"
            message:
              expr: "`heartbeat leaked user-role routing metadata: ${JSON.stringify({ prompt: heartbeatRequest.prompt, allInputText: heartbeatRequest.allInputText })}`"
        - call: waitForOutboundMessage
          saveAs: heartbeatOutbound
          args:
            - ref: state
            - lambda:
                params: [candidate]
                expr: "candidate.direction === 'outbound' && candidate.conversation.kind === 'direct' && candidate.conversation.id === config.heartbeatConversationId && String(candidate.text ?? '').trim() === config.heartbeatMarker"
            - expr: "liveTurnTimeoutMs(env, 60000)"
      detailsExpr: "JSON.stringify({ verdict: 'PASS', gateway: 'ephemeral-child', provider: env.providerMode, heartbeatConversationInfoPresent: String(heartbeatRequest.allInputText ?? '').includes('Conversation info:'), heartbeatRawRoutePresent: String(heartbeatRequest.allInputText ?? '').includes(config.heartbeatRoute), deliveredTo: `${heartbeatOutbound.conversation.kind}:${heartbeatOutbound.conversation.id}`, deliveredText: heartbeatOutbound.text })"

    - name: retains inbound metadata for an ordinary channel turn
      actions:
        - set: normalRequestCursor
          value:
            expr: "(await fetchJson(`${env.mock.baseUrl}/debug/request-cursor`)).cursor"
        - sendInbound:
            conversation:
              id:
                expr: config.normalConversationId
              kind: direct
              title: QA Normal Metadata Route
            senderId: qa-normal-sender
            senderName: QA Normal Sender
            text:
              expr: "`${config.normalPromptNeedle}. Reply exactly: ${config.normalMarker}`"
        - call: waitForCondition
          saveAs: normalRequest
          args:
            - lambda:
                expr: "(async () => (await fetchJson(`${env.mock.baseUrl}/debug/requests?after=${normalRequestCursor}`)).find((request) => String(request.allInputText ?? '').includes(config.normalPromptNeedle)))()"
            - expr: "liveTurnTimeoutMs(env, 60000)"
            - 100
        - assert:
            expr: "String(normalRequest.allInputText ?? '').includes('Conversation info:') && String(normalRequest.allInputText ?? '').includes(config.normalRoute)"
            message:
              expr: "`ordinary inbound lost routing metadata: ${JSON.stringify({ prompt: normalRequest.prompt, allInputText: normalRequest.allInputText })}`"
        - set: normalRuntimeContextInput
          value:
            expr: "(Array.isArray(normalRequest.body?.input) ? normalRequest.body.input : []).find((item) => ['developer', 'system'].includes(String(item?.role ?? '')) && Array.isArray(item?.content) && item.content.some((part) => String(part?.text ?? '').startsWith('OpenClaw runtime context:\\n') && String(part?.text ?? '').includes(config.normalRoute)))"
        - assert:
            expr: "Boolean(normalRuntimeContextInput) && !String(normalRequest.raw ?? '').includes('<<<BEGIN_OPENCLAW_INTERNAL_CONTEXT>>>') && !String(normalRequest.raw ?? '').includes('<<<END_OPENCLAW_INTERNAL_CONTEXT>>>')"
            message:
              expr: "`ordinary inbound did not use delimiter-free application context: ${JSON.stringify({ input: normalRequest.body?.input, raw: String(normalRequest.raw ?? '').slice(0, 2000) })}`"
        - call: waitForOutboundMessage
          saveAs: normalOutbound
          args:
            - ref: state
            - lambda:
                params: [candidate]
                expr: "candidate.direction === 'outbound' && candidate.conversation.kind === 'direct' && candidate.conversation.id === config.normalConversationId && String(candidate.text ?? '').trim() === config.normalMarker"
            - expr: "liveTurnTimeoutMs(env, 60000)"
      detailsExpr: "JSON.stringify({ verdict: 'PASS', normalConversationInfoPresent: String(normalRequest.allInputText ?? '').includes('Conversation info:'), normalRawRoutePresent: String(normalRequest.allInputText ?? '').includes(config.normalRoute), runtimeContextRole: normalRuntimeContextInput.role, legacyDelimiterPresent: String(normalRequest.raw ?? '').includes('<<<BEGIN_OPENCLAW_INTERNAL_CONTEXT>>>'), deliveredTo: `${normalOutbound.conversation.kind}:${normalOutbound.conversation.id}`, deliveredText: normalOutbound.text })"
